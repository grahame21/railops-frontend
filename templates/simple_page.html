<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="panel-body">
  <div class="bg-photo"></div>
  <div class="bg-overlay"></div>
  <main class="panel-shell narrow">
    <section class="glass card centered-card">
      <div class="brand-pill">RailOps</div>
      <h1>{{ title }}</h1>
      <p class="muted">{{ message }}</p>
      <div class="topbar-actions center">
        <a class="btn btn-secondary" href="{{ url_for('dashboard_page') }}">Back to dashboard</a>
        {% if session.get('role') == 'admin' %}
          <a class="btn btn-ghost" href="{{ url_for('admin_page') }}">Admin panel</a>
        {% endif %}
      </div>
    </section>
  </main>
</body>
</html>
