<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RailOps Admin</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;margin:0;padding:24px;background:#0b0f17;color:#e7ecf3}
    h1{font-size:20px;margin:0 0 16px}
    .card{background:#121826;border:1px solid #1e2636;border-radius:12px;padding:16px;max-width:720px}
    label{display:block;margin:8px 0 4px;color:#a8b3c7}
    input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #233047;background:#0f1420;color:#e7ecf3}
    .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .actions{display:flex;gap:12px;margin-top:16px}
    a.button,button{appearance:none;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:#2f6fed;color:#fff;font-weight:600}
    a.button.secondary,button.secondary{background:#22304a}
    small{color:#8996ad}
    .mt8{margin-top:8px}
  </style>
</head>
<body>
  <h1>RailOps Admin</h1>
  <div class="card">
    <p>Choose where the dashboard map should open.</p>

    <div class="row">
      <div>
        <label for="lat">Latitude</label>
        <input id="lat" type="text" inputmode="decimal" placeholder="-33.86" value="-33.86" />
      </div>
      <div>
        <label for="lng">Longitude</label>
        <input id="lng" type="text" inputmode="decimal" placeholder="151.21" value="151.21" />
      </div>
      <div>
        <label for="zm">Zoom (3–18)</label>
        <input id="zm" type="number" min="3" max="18" step="1" value="12" />
      </div>
    </div>

    <div class="mt8">
      <label for="bbox">Optional BBOX (south,west,north,east)</label>
      <input id="bbox" type="text" placeholder="-35.8,138.4,-34.6,139.0" />
      <small>Leave blank to let the dashboard derive it from the map view.</small>
    </div>

    <div class="actions">
      <a id="viewMapBtn" class="button" href="dashboard.html">View map</a>
      <button id="viewRenderBtn" class="secondary">Open map on Render</button>
    </div>

    <small class="mt8">Netlify uses clean URLs, so <code>dashboard.html</code> is served at <code>/dashboard</code>.</small>
  </div>

  <script>
    // If you want to target Render instead, set this:
    const RENDER_DASH = 'https://railops-json.onrender.com/dashboard';

    function buildURL(baseHref){
      const lat = (document.getElementById('lat').value || '').trim();
      const lng = (document.getElementById('lng').value || '').trim();
      const zm  = (document.getElementById('zm').value  || '').trim();
      const bbox = (document.getElementById('bbox').value || '').trim();

      const url = new URL(baseHref, location.origin);
      if (lat)  url.searchParams.set('lat', lat);
      if (lng)  url.searchParams.set('lng', lng);
      if (zm)   url.searchParams.set('zm',  zm);
      if (bbox) url.searchParams.set('bbox', bbox);
      return url.toString();
    }

    // Netlify dashboard (relative)
    document.getElementById('viewMapBtn').addEventListener('click', (e) => {
      e.preventDefault();
      location.href = buildURL('dashboard.html');
    });

    // Render dashboard (absolute)
    document.getElementById('viewRenderBtn').addEventListener('click', () => {
      location.href = buildURL(RENDER_DASH);
    });
  </script>
</body>
</html>
