<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Grahame’s RailOps Admin</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="admin-page">
  <header class="topbar">
    <h1>🚂 Grahame’s RailOps Admin</h1>

    <div class="topbar-right">
      <span data-user-label>Checking...</span>
      <button onclick="railopsLogout()">Logout</button>
    </div>
  </header>

  <main class="admin-grid">
    <section class="panel">
      <h2>Admin Console</h2>

      <p>
        This page is admin-only.
      </p>

      <div class="button-row">
        <a class="button-link" href="/dashboard.html">Open Train Dashboard</a>
        <a class="button-link" href="/flight.html">Open Flight Tracker</a>
        <a class="button-link" href="/database.html">Open Database</a>
      </div>
    </section>

    <section class="panel">
      <h2>Create Guest Token</h2>

      <p class="small-note">
        This creates a guest access link like
        <strong>/access?token=...</strong>
      </p>

      <label for="tokenLabel">Guest label</label>
      <input id="tokenLabel" value="guest" />

      <label for="tokenDays">Expires in days</label>
      <input id="tokenDays" type="number" value="7" min="1" max="3650" />

      <label style="display:flex;align-items:center;gap:10px;margin-top:14px;">
        <input id="tokenUnlimited" type="checkbox" style="width:auto;" />
        Unlimited token
      </label>

      <button onclick="makeToken()">Generate Guest Link</button>

      <textarea id="tokenOutput" readonly placeholder="Guest link will appear here"></textarea>
    </section>
  </main>

  <script src="app-auth.js"></script>

  <script>
    railopsCheckSession("admin");

    const tokenUnlimited = document.getElementById("tokenUnlimited");
    const tokenDays = document.getElementById("tokenDays");

    tokenUnlimited.addEventListener("change", () => {
      tokenDays.disabled = tokenUnlimited.checked;

      if (tokenUnlimited.checked) {
        tokenDays.style.opacity = "0.45";
      } else {
        tokenDays.style.opacity = "1";
      }
    });

    async function makeToken() {
      const labelInput = document.getElementById("tokenLabel");
      const output = document.getElementById("tokenOutput");

      const label = labelInput.value.trim() || "guest";
      const days = Number(tokenDays.value || 7);
      const unlimited = tokenUnlimited.checked;

      output.value = "Generating guest link...";

      try {
        const res = await fetch("/api/make-token", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          cache: "no-store",
          body: JSON.stringify({
            label,
            days,
            unlimited,
          }),
        });

        let data = null;

        try {
          data = await res.json();
        } catch (jsonErr) {
          output.value = "Failed to read server response.";
          return;
        }

        if (!res.ok || !data.ok) {
          output.value = data.error || "Failed to create guest token.";
          return;
        }

        const fullUrl = `${window.location.origin}${data.accessUrl}`;

        if (data.unlimited) {
          output.value = `${fullUrl}\n\nExpires: Unlimited`;
        } else {
          const expiryDate = data.expires
            ? new Date(data.expires * 1000).toLocaleString("en-AU")
            : "Unknown";

          output.value = `${fullUrl}\n\nExpires in: ${data.days} day(s)\nExpiry date: ${expiryDate}`;
        }
      } catch (err) {
        output.value = "Failed to create guest token.";
      }
    }
  </script>
</body>
</html>
