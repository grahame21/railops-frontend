<script>
  /*
    ===== RailOps Admin Links =====
    This version uses GitHub database links, not Railway database links.
  */

  const TRAIN_DASHBOARD_URL = "dashboard.html";
  const FLIGHT_TRACKER_URL = "flight.html";
  const LOCO_STATS_URL = "loco-stats.html";
  const LOGIN_URL = "admin-login.html";
  const ACCESS_URL_PREFIX = "access.html?token=";

  const GITHUB_REPO_URL = "https://github.com/grahame21/railops-backend";
  const GITHUB_DB_FILES_URL = "https://github.com/grahame21/railops-backend/tree/main/static/downloads";

  const GITHUB_BLOB_BASE = "https://github.com/grahame21/railops-backend/blob/main/";
  const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/grahame21/railops-backend/main/";

  const LINKS = {
    trains: GITHUB_BLOB_BASE + "trains.json",
    locos: GITHUB_BLOB_BASE + "locos.json",
    history: GITHUB_BLOB_BASE + "loco_history.json",
    summary: GITHUB_BLOB_BASE + "loco_summary.txt",
    exportCsv: GITHUB_BLOB_BASE + "loco_export.csv",

    databaseHtml: GITHUB_BLOB_BASE + "static/downloads/loco_database.html",
    recentlyAdded: GITHUB_BLOB_BASE + "static/downloads/recently_added.html",
    numbersOnly: GITHUB_BLOB_BASE + "static/downloads/loco_numbers_only.html",

    databaseWorkbook: GITHUB_BLOB_BASE + "static/downloads/loco_database.xlsx",
    numbersWorkbook: GITHUB_BLOB_BASE + "static/downloads/loco_numbers_only.xlsx"
  };

  const STORAGE_KEYS = {
    tokens: "railops_admin_tokens",
    guests: "railops_guest_accounts"
  };

  function uid(prefix){
    const part = Math.random().toString(36).slice(2, 10);
    const time = Date.now().toString(36);
    return `${prefix}_${time}_${part}`;
  }

  function isoNow(){
    return new Date().toISOString();
  }

  function addDays(days){
    const d = new Date();
    d.setDate(d.getDate() + Number(days || 0));
    return d.toISOString();
  }

  function formatDate(value){
    if(!value) return "Unlimited";
    const d = new Date(value);
    if(Number.isNaN(d.getTime())) return value;

    return new Intl.DateTimeFormat(navigator.language || "en-AU", {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"numeric",
      minute:"2-digit",
      hour12:true,
      timeZoneName:"short"
    }).format(d);
  }

  function isExpired(value){
    if(!value) return false;
    const d = new Date(value);
    if(Number.isNaN(d.getTime())) return false;
    return d.getTime() < Date.now();
  }

  function loadArray(key){
    try{
      const raw = localStorage.getItem(key);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    }catch(err){
      return [];
    }
  }

  function saveArray(key, value){
    localStorage.setItem(key, JSON.stringify(value, null, 2));
  }

  function openLink(url){
    window.location.href = url;
  }

  function openNewTab(url){
    window.open(url, "_blank", "noopener,noreferrer");
  }

  function getStoredValue(keys, fallback){
    for(const key of keys){
      const value = localStorage.getItem(key);
      if(value && String(value).trim() !== "") return value;
    }
    return fallback;
  }

  function setupUserInfo(){
    const displayName = getStoredValue(
      ["display_name", "railops_display_name", "admin_display_name", "name"],
      "Grahame"
    );

    const role = getStoredValue(
      ["role", "railops_role", "admin_role"],
      "admin"
    );

    const username = getStoredValue(
      ["username", "railops_username", "admin_username"],
      "admin"
    );

    document.getElementById("userDisplay").textContent =
      `${displayName} (${role} / ${username})`;

    document.getElementById("displayNameStat").textContent = displayName;
    document.getElementById("roleStat").textContent = role;
    document.getElementById("usernameStat").textContent = username;
  }

  function logout(){
    [
      "display_name",
      "railops_display_name",
      "admin_display_name",
      "name",
      "role",
      "railops_role",
      "admin_role",
      "username",
      "railops_username",
      "admin_username",
      "session",
      "railops_session",
      "logged_in",
      "railops_logged_in",
      "token",
      "guest_token"
    ].forEach(k => localStorage.removeItem(k));

    window.location.href = LOGIN_URL;
  }

  function generateToken(){
    const label = document.getElementById("tokenLabel").value.trim() || "guest-token";
    const days = document.getElementById("tokenDays").value.trim();
    const unlimited = document.getElementById("tokenUnlimited").checked;
    const deviceOnly = document.getElementById("tokenDeviceOnly").checked;

    const token = uid("guest");
    const expiresAt = unlimited ? null : addDays(days || 7);

    const tokens = loadArray(STORAGE_KEYS.tokens);

    const item = {
      id: uid("tokenrow"),
      label,
      token,
      createdAt: isoNow(),
      expiresAt,
      disabled: false,
      deviceOnly
    };

    tokens.unshift(item);
    saveArray(STORAGE_KEYS.tokens, tokens);

    const fullLink = `${location.origin}/${ACCESS_URL_PREFIX}${encodeURIComponent(token)}`;

    const box = document.getElementById("latestTokenBox");
    box.style.display = "block";
    box.textContent = fullLink;

    navigator.clipboard?.writeText(fullLink).catch(() => {});
    renderTokens();
  }

  function createGuest(){
    const username = document.getElementById("guestUsername").value.trim();
    const password = document.getElementById("guestPassword").value.trim();
    const displayName = document.getElementById("guestDisplay").value.trim() || username || "Guest User";
    const days = document.getElementById("guestDays").value.trim();
    const unlimited = document.getElementById("guestUnlimited").checked;
    const deviceOnly = document.getElementById("guestDeviceOnly").checked;

    if(!username || !password){
      alert("Guest username and password are required.");
      return;
    }

    const guests = loadArray(STORAGE_KEYS.guests);

    if(guests.some(g => String(g.username).toLowerCase() === username.toLowerCase())){
      alert("That guest username already exists.");
      return;
    }

    guests.unshift({
      id: uid("guestrow"),
      username,
      password,
      displayName,
      createdAt: isoNow(),
      expiresAt: unlimited ? null : addDays(days || 7),
      disabled: false,
      deviceOnly
    });

    saveArray(STORAGE_KEYS.guests, guests);

    document.getElementById("guestUsername").value = "";
    document.getElementById("guestPassword").value = "";
    document.getElementById("guestDisplay").value = "";

    renderGuests();
  }

  function toggleToken(id){
    const tokens = loadArray(STORAGE_KEYS.tokens);
    const item = tokens.find(t => t.id === id);
    if(item) item.disabled = !item.disabled;
    saveArray(STORAGE_KEYS.tokens, tokens);
    renderTokens();
  }

  function deleteToken(id){
    const tokens = loadArray(STORAGE_KEYS.tokens).filter(t => t.id !== id);
    saveArray(STORAGE_KEYS.tokens, tokens);
    renderTokens();
  }

  function copyToken(token){
    const fullLink = `${location.origin}/${ACCESS_URL_PREFIX}${encodeURIComponent(token)}`;
    navigator.clipboard?.writeText(fullLink).then(
      () => alert("Token link copied."),
      () => alert(fullLink)
    );
  }

  function toggleGuest(id){
    const guests = loadArray(STORAGE_KEYS.guests);
    const item = guests.find(g => g.id === id);
    if(item) item.disabled = !item.disabled;
    saveArray(STORAGE_KEYS.guests, guests);
    renderGuests();
  }

  function deleteGuest(id){
    const guests = loadArray(STORAGE_KEYS.guests).filter(g => g.id !== id);
    saveArray(STORAGE_KEYS.guests, guests);
    renderGuests();
  }

  function renderTokens(){
    const tbody = document.getElementById("tokensTable");
    const tokens = loadArray(STORAGE_KEYS.tokens);

    if(tokens.length === 0){
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="muted">No tokens created yet.</td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = tokens.map(item => {
      const expired = isExpired(item.expiresAt);
      const status = item.disabled
        ? `<span class="pill red">Disabled</span>`
        : expired
          ? `<span class="pill amber">Expired</span>`
          : `<span class="pill green">Active</span>`;

      const tokenLink = `${ACCESS_URL_PREFIX}${encodeURIComponent(item.token)}`;

      return `
        <tr>
          <td>${escapeHtml(item.label)}</td>
          <td class="mono">${escapeHtml(tokenLink)}</td>
          <td>${status}</td>
          <td>${escapeHtml(formatDate(item.createdAt))}</td>
          <td>${escapeHtml(formatDate(item.expiresAt))}</td>
          <td>${item.deviceOnly ? "One device" : "Any device"}</td>
          <td>
            <div class="button-row" style="margin-top:0;">
              <button class="btn secondary" type="button" onclick="copyToken('${item.token}')">Copy</button>
              <button class="btn amber" type="button" onclick="toggleToken('${item.id}')">${item.disabled ? "Enable" : "Disable"}</button>
              <button class="btn red" type="button" onclick="deleteToken('${item.id}')">Delete</button>
            </div>
          </td>
        </tr>
      `;
    }).join("");
  }

  function renderGuests(){
    const tbody = document.getElementById("guestsTable");
    const guests = loadArray(STORAGE_KEYS.guests);

    if(guests.length === 0){
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="muted">No guest accounts created yet.</td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = guests.map(item => {
      const expired = isExpired(item.expiresAt);
      const status = item.disabled
        ? `<span class="pill red">Blocked</span>`
        : expired
          ? `<span class="pill amber">Expired</span>`
          : `<span class="pill green">Active</span>`;

      return `
        <tr>
          <td class="mono">${escapeHtml(item.username)}</td>
          <td class="mono">${escapeHtml(item.password)}</td>
          <td>${escapeHtml(item.displayName)}</td>
          <td>${status}</td>
          <td>${escapeHtml(formatDate(item.expiresAt))}</td>
          <td>${item.deviceOnly ? "One device" : "Any device"}</td>
          <td>
            <div class="button-row" style="margin-top:0;">
              <button class="btn amber" type="button" onclick="toggleGuest('${item.id}')">${item.disabled ? "Unblock" : "Block"}</button>
              <button class="btn red" type="button" onclick="deleteGuest('${item.id}')">Delete</button>
            </div>
          </td>
        </tr>
      `;
    }).join("");
  }

  function escapeHtml(value){
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function bindUnlimitedCheckbox(checkId, inputId){
    const check = document.getElementById(checkId);
    const input = document.getElementById(inputId);

    check.addEventListener("change", () => {
      if(check.checked){
        input.value = "";
        input.disabled = true;
      }else{
        input.disabled = false;
        input.value = input.value || "7";
      }
    });
  }

  document.getElementById("logoutBtn").addEventListener("click", logout);

  document.getElementById("openDashboardBtn").addEventListener("click", () => openLink(TRAIN_DASHBOARD_URL));
  document.getElementById("openFlightBtn").addEventListener("click", () => openLink(FLIGHT_TRACKER_URL));
  document.getElementById("openGitHubDbBtn").addEventListener("click", () => openNewTab(GITHUB_DB_FILES_URL));
  document.getElementById("openGitHubRepoBtn").addEventListener("click", () => openNewTab(GITHUB_REPO_URL));
  document.getElementById("openStatsBtn").addEventListener("click", () => openLink(LOCO_STATS_URL));

  document.getElementById("linkTrainsJson").addEventListener("click", () => openNewTab(LINKS.trains));
  document.getElementById("linkLocosJson").addEventListener("click", () => openNewTab(LINKS.locos));
  document.getElementById("linkLocoHistory").addEventListener("click", () => openNewTab(LINKS.history));
  document.getElementById("linkLocoSummary").addEventListener("click", () => openNewTab(LINKS.summary));
  document.getElementById("linkLocoDbHtml").addEventListener("click", () => openNewTab(LINKS.databaseHtml));
  document.getElementById("linkRecentlyAdded").addEventListener("click", () => openNewTab(LINKS.recentlyAdded));
  document.getElementById("linkNumbersOnly").addEventListener("click", () => openNewTab(LINKS.numbersOnly));

  document.getElementById("generateTokenBtn").addEventListener("click", generateToken);
  document.getElementById("createGuestBtn").addEventListener("click", createGuest);

  document.getElementById("clearTokensBtn").addEventListener("click", () => {
    if(confirm("Clear all locally saved tokens?")){
      localStorage.removeItem(STORAGE_KEYS.tokens);
      renderTokens();
    }
  });

  document.getElementById("clearGuestsBtn").addEventListener("click", () => {
    if(confirm("Clear all locally saved guests?")){
      localStorage.removeItem(STORAGE_KEYS.guests);
      renderGuests();
    }
  });

  bindUnlimitedCheckbox("tokenUnlimited", "tokenDays");
  bindUnlimitedCheckbox("guestUnlimited", "guestDays");

  setupUserInfo();
  renderTokens();
  renderGuests();
</script>
