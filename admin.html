<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Grahame’s RailOps Admin</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="admin-page">
  <header class="topbar">
    <h1>🚂 Grahame’s RailOps Admin</h1>
    <div>
      <span data-user-label>Checking...</span>
      <button onclick="railopsLogout()">Logout</button>
    </div>
  </header>

  <main class="admin-grid">
    <section class="panel">
      <h2>Admin Console</h2>
      <p>Status: protected admin area</p>

      <div class="button-row">
        <a href="/dashboard.html">Open Train Dashboard</a>
        <a href="/flight.html">Open Flight Tracker</a>
        <a href="/database.html">Open Database</a>
      </div>
    </section>

    <section class="panel">
      <h2>Create Guest Token</h2>

      <label>Guest label</label>
      <input id="tokenLabel" value="guest" />

      <label>Expires in hours</label>
      <input id="tokenHours" type="number" value="24" min="1" max="720" />

      <button onclick="makeToken()">Generate Guest Link</button>

      <textarea id="tokenOutput" readonly placeholder="Guest link will appear here"></textarea>
    </section>
  </main>

  <script src="app-auth.js"></script>

  <script>
    railopsCheckSession("admin");

    async function makeToken() {
      const label = document.getElementById("tokenLabel").value.trim() || "guest";
      const hours = Number(document.getElementById("tokenHours").value || 24);
      const output = document.getElementById("tokenOutput");

      output.value = "Generating...";

      try {
        const res = await fetch("/api/make-token", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ label, hours }),
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          output.value = data.error || "Failed to create token.";
          return;
        }

        const fullUrl = `${window.location.origin}${data.accessUrl}`;
        output.value = fullUrl;
      } catch (err) {
        output.value = "Failed to create token.";
      }
    }
  </script>
</body>
</html>
