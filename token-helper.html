<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RailOps — Token Helper</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e8eefc;font:14px system-ui}
    .box{background:#121a2b;border:1px solid rgba(255,255,255,.1);padding:20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:680px;width:92%}
    textarea{width:100%;min-height:160px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#0b1220;color:#e8eefc;padding:10px}
    button{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#e8eefc;cursor:pointer}
    .hint{color:#8fa3bf;margin-top:10px;font-size:12px;white-space:pre-line}
    a{color:#7bd88f}
  </style>
</head>
<body>
  <div class="box">
    <h1>Paste your invite/reset email or link</h1>
    <p>On iPad: open the email → <b>Copy</b> (the whole email or link) → paste below → Continue.</p>
    <textarea id="blob" placeholder="Paste the entire email text or the link here…"></textarea>
    <button id="go">Continue</button>
    <div id="msg" class="hint"></div>
  </div>

  <script>
    // Utility: extract first URL from arbitrary text
    function firstUrlIn(text){
      const urlRe = /https?:\/\/[^\s"'<>]+/ig;
      const m = urlRe.exec(text);
      return m ? m[0] : null;
    }
    // Parse tokens from a URL (hash or query)
    function tokensFromUrl(raw){
      try{
        const u = new URL(raw);
        const h = new URLSearchParams((u.hash || "").replace(/^#/, ""));
        const q = u.searchParams;
        const get = (k)=> h.get(k) || q.get(k);
        return {
          confirmation: get('confirmation_token') || get('signup_token') || get('invite_token'),
          recovery:     get('recovery_token')     || get('reset_token')
        };
      }catch{ return {confirmation:null, recovery:null}; }
    }
    // Fallback: scrape tokens directly from arbitrary text
    function tokensFromText(text){
      const grab = (names)=> {
        for (const n of names){
          const re = new RegExp(`${n}\\s*[=:]\\s*([A-Za-z0-9._~-]+)`, 'i');
          const m = text.match(re);
          if (m && m[1]) return m[1];
        }
        return null;
      };
      const confirmation = grab(['confirmation_token','signup_token','invite_token']);
      const recovery     = grab(['recovery_token','reset_token']);
      return { confirmation, recovery };
    }
    function goToLoginWith({confirmation, recovery}){
      if (confirmation){
        location.href = '/login.html#confirmation_token=' + encodeURIComponent(confirmation);
        return true;
      }
      if (recovery){
        location.href = '/login.html#recovery_token=' + encodeURIComponent(recovery);
        return true;
      }
      return false;
    }

    const msg = document.getElementById('msg');
    function show(m){ msg.textContent = m; }

    document.getElementById('go').onclick = function(){
      const text = document.getElementById('blob').value.trim();
      if (!text){ show('Nothing pasted yet. Copy your email or link and paste it above.'); return; }

      // 1) Prefer a URL if present
      const url = firstUrlIn(text);
      if (url){
        const t = tokensFromUrl(url);
        if (goToLoginWith(t)) return;
      }
      // 2) Otherwise try scraping the raw text for token=VALUE
      const t2 = tokensFromText(text);
      if (goToLoginWith(t2)) return;

      show('Could not find a confirmation or recovery token. Make sure you pasted the full email or the full link (including everything after "=").');
    };

    // Quality of life: auto-parse on paste if single line
    document.getElementById('blob').addEventListener('paste', (e)=>{
      setTimeout(()=>{
        const v = (e.target.value || '').trim();
        if (v && v.indexOf('\n') === -1){
          // One-liner: try immediately
          document.getElementById('go').click();
        }
      }, 0);
    });
  </script>
</body>
</html>
