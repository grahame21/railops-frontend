<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RailOps — Token Helper</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e8eefc;font:14px system-ui}
    .box{background:#121a2b;border:1px solid rgba(255,255,255,.1);padding:20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:560px;width:92%}
    textarea{width:100%;min-height:120px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#0b1220;color:#e8eefc;padding:10px}
    button{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#e8eefc;cursor:pointer}
    .hint{color:#8fa3bf;margin-top:10px;font-size:12px}
    a{color:#7bd88f}
  </style>
</head>
<body>
  <div class="box">
    <h1>Paste the link from your email</h1>
    <p>In your invite or password-reset email: long-press the link → <b>Copy Link</b> → paste it here, then click Continue.</p>
    <textarea id="link" placeholder="https://traintracker2-0.netlify.app/#confirmation_token=..."></textarea>
    <button id="go">Continue</button>
    <div id="msg" class="hint"></div>
  </div>
  <script>
    function pickToken(url) {
      try {
        const u = new URL(url.trim());
        const h = new URLSearchParams(u.hash.replace(/^#/, ''));
        const q = u.searchParams;
        const get = k => h.get(k) || q.get(k);
        return {
          confirmation: get('confirmation_token') || get('signup_token') || get('invite_token'),
          recovery:     get('recovery_token')     || get('reset_token')
        };
      } catch { return { confirmation:null, recovery:null }; }
    }
    document.getElementById('go').onclick = function(){
      const { confirmation, recovery } = pickToken(document.getElementById('link').value);
      const msg = document.getElementById('msg');
      if (confirmation) {
        location.href = '/login.html#confirmation_token=' + encodeURIComponent(confirmation);
      } else if (recovery) {
        location.href = '/login.html#recovery_token=' + encodeURIComponent(recovery);
      } else {
        msg.innerHTML = "Couldn’t find a token in that link. Make sure you pasted the entire URL from the email.";
      }
    };
  </script>
</body>
</html>
