<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{margin:0;height:100%;font:16px system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b1220;color:#e8eefc}
    .box{max-width:360px;margin:10vh auto;background:#121a2b;border:1px solid #31405e;border-radius:12px;padding:24px}
    h1{margin:0 0 16px;font-size:20px}
    label{display:block;font-size:13px;margin-top:10px;margin-bottom:4px;opacity:.9}
    input{width:100%;margin:0 0 10px;padding:10px;border-radius:8px;border:1px solid #2a3b5a;background:#0e1526;color:#e8eefc}
    button{width:100%;padding:12px;border-radius:8px;border:1px solid #2a3b5a;background:#1d2a44;color:#e8eefc;cursor:pointer}
    .err{margin-top:10px;color:#ffb3b3;min-height:1.2em}
    .hint{opacity:.8;font-size:13px;margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <h1>RailOps Login</h1>
    <form id="login-form" novalidate>
      <label for="u">Username</label>
      <input id="u" name="u" placeholder="admin or guest" autocomplete="username" inputmode="email" />
      <label for="p">Password</label>
      <input id="p" name="p" placeholder="Password" type="password" autocomplete="current-password" />
      <button type="submit">Login</button>
      <div class="err" id="e"></div>
    </form>
    <div class="hint">Demo creds — <code>admin / railops</code> or <code>guest / guestpass</code></div>
  </div>

  <script>
    // If already logged in, skip
    (function(){
      try {
        const sess = JSON.parse(localStorage.getItem('railops_session') || "null");
        if (sess?.role === 'admin') location.replace('/admin.html');
        if (sess?.role === 'guest') location.replace('/dashboard.html');
      } catch {}
    })();

    const form = document.getElementById('login-form');
    const err  = document.getElementById('e');

    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      err.textContent = '';

      // Normalize: trim spaces; username case-insensitive
      const u = (document.getElementById('u').value || '').trim().toLowerCase();
      const p = (document.getElementById('p').value || '').trim();

      // Accept only the two demo accounts
      if (u === 'admin' && p === 'railops') {
        localStorage.setItem('railops_session', JSON.stringify({ role: 'admin', ts: Date.now() }));
        location.href = '/admin.html';
        return;
      }
      if (u === 'guest' && p === 'guestpass') {
        localStorage.setItem('railops_session', JSON.stringify({ role: 'guest', ts: Date.now() }));
        location.href = '/dashboard.html';
        return;
      }

      // Helpful error (and show what we got)
      err.textContent = 'Invalid username or password. Tip: username is not case-sensitive; password is.';
    });
  </script>
</body>
</html>
