<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Grahame’s RailOps Login</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="login-page">
  <main class="login-card">
    <div class="logo">🚂</div>

    <h1>Grahame’s RailOps</h1>

    <p class="subtitle">
      Private train, flight and database tracker
    </p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      />

      <button type="submit">Login</button>
    </form>

    <p id="message" class="message"></p>
  </main>

  <script src="app-auth.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Logging in...";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        message.textContent = "Enter username and password.";
        return;
      }

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          cache: "no-store",
          body: JSON.stringify({
            username,
            password,
            deviceId: railopsGetDeviceId(),
          }),
        });

        let data = null;

        try {
          data = await res.json();
        } catch {
          message.textContent = "Login failed. Server did not return JSON.";
          return;
        }

        if (!res.ok || !data.ok) {
          message.textContent = data.error || "Invalid login.";
          return;
        }

        window.location.href = data.redirect || "/dashboard.html";
      } catch (err) {
        message.textContent = "Login failed. Check your Netlify functions.";
      }
    });
  </script>
</body>
</html>
