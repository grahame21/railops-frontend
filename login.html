<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign in — RailOps</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body{font:14px system-ui;margin:0;display:grid;place-items:center;height:100vh;background:#0b1220;color:#e8eefc}
    .box{background:#121a2b;border:1px solid rgba(255,255,255,.1);padding:20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-width:300px}
    button{padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#e8eefc;cursor:pointer}
    .hint{color:#8fa3bf;margin-top:8px;font-size:12px}
  </style>
</head>
<body>
  <div class="box">
    <h1>RailOps — Sign in</h1>
    <p><button id="btn" style="display:none" onclick="window.netlifyIdentity.open()">Open Identity Widget</button></p>
    <p class="hint" id="status">Loading Identity…</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const s = document.getElementById('status');
      const btn = document.getElementById('btn');
      if (!window.netlifyIdentity) { s.textContent = '❌ Identity script blocked (CSP) or failed to load.'; return; }
      s.textContent = '✅ Identity ready.'; btn.style.display = 'inline-block';
      netlifyIdentity.on('login', user => {
        const roles = (user && user.app_metadata && user.app_metadata.roles) || [];
        location.href = roles.includes('admin') ? '/admin/' : '/dashboard.html';
      });
      netlifyIdentity.init();
    });
  </script>
</body>
</html>
