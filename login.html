<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Grahame’s RailOps Login</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="login-page">
  <main class="login-card">
    <div class="logo">🚂</div>

    <h1>Grahame’s RailOps</h1>

    <p class="subtitle">
      Private train, flight and database tracker
    </p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      />

      <button type="submit">Login</button>
    </form>

    <p id="message" class="message"></p>

    <pre
      id="debugBox"
      style="display:none;white-space:pre-wrap;background:#02101f;border:1px solid #2a4a7a;border-radius:12px;padding:12px;margin-top:16px;color:#cfe2ff;font-size:12px;text-align:left;overflow:auto;"
    ></pre>
  </main>

  <script src="app-auth.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const debugBox = document.getElementById("debugBox");

    function showDebug(data) {
      debugBox.style.display = "block";
      debugBox.textContent = JSON.stringify(data, null, 2);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Logging in...";
      debugBox.style.display = "none";
      debugBox.textContent = "";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        message.textContent = "Enter username and password.";
        return;
      }

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          cache: "no-store",
          body: JSON.stringify({
            username,
            password,
            deviceId: railopsGetDeviceId(),
          }),
        });

        let data = null;

        try {
          data = await res.json();
        } catch {
          message.textContent = "Login failed. Server did not return JSON.";
          showDebug({
            status: res.status,
            statusText: res.statusText,
            problem: "The function did not return JSON. Check Netlify deploy/function logs."
          });
          return;
        }

        if (!res.ok || !data.ok) {
          message.textContent = data.error || "Invalid login.";
          showDebug(data);
          return;
        }

        message.textContent = "Login successful. Redirecting...";
        window.location.href = data.redirect || "/dashboard.html";
      } catch (err) {
        message.textContent = "Login failed. Check your Netlify functions.";
        showDebug({
          error: String(err.message || err)
        });
      }
    });
  </script>
</body>
</html>
