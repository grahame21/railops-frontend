<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in — RailOps</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body { font:14px system-ui;margin:0;display:grid;place-items:center;height:100vh;background:#0b1220;color:#e8eefc }
    .box { background:#121a2b;border:1px solid rgba(255,255,255,.1);padding:20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);min-width:300px;text-align:center }
    button, a.btn { padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#e8eefc;cursor:pointer;display:inline-block;margin-top:8px }
    .hint { color:#8fa3bf;margin-top:12px;font-size:12px }
    a { color:#7bd88f;text-decoration:none }
  </style>
</head>
<body>
  <div class="box">
    <h1>RailOps — Sign in</h1>
    <p><button onclick="window.netlifyIdentity && window.netlifyIdentity.open()">Open Identity Widget</button></p>
    <p><a href="#" class="btn" onclick="window.netlifyIdentity && window.netlifyIdentity.open('forgot')">Forgot your password?</a></p>
    <p id="status" class="hint">Loading Identity…</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const s = document.getElementById('status');
      if (!window.netlifyIdentity) { s.textContent = '❌ Identity widget failed to load'; return; }
      s.textContent = '✅ Identity ready';
      netlifyIdentity.on('login', (user) => {
        const roles = (user && user.app_metadata && user.app_metadata.roles) || [];
        location.href = roles.includes('admin') ? '/admin/' : '/dashboard.html';
      });
      netlifyIdentity.init();
    });
  </script>
</body>
</html>
