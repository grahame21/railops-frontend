<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — RailOps</title>
<script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head><body>
<button onclick="window.netlifyIdentity && window.netlifyIdentity.open()">Sign in</button>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    if (!window.netlifyIdentity) return;
    window.netlifyIdentity.on('login', () => location.href = '/dashboard.html');
    window.netlifyIdentity.on('init', user => { /* optional: handle already-logged-in */ });
    window.netlifyIdentity.init();
  });
</script>
</body></html>
