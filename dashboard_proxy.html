<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps — Dashboard (Proxy Rails)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="https://unpkg.com/ol@9.1.0/ol.css" />
  <style>
    html,body{margin:0;height:100%;background:#0b1220}
    #map{position:fixed;inset:0}
    .hud{position:fixed;top:10px;left:10px;z-index:1001;background:rgba(18,26,43,.9);color:#e8eefc;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;font:13px system-ui}
    .hud label{display:flex;align-items:center;gap:6px}
    #logout{position:fixed;top:10px;right:10px;z-index:1001;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#e8eefc}
    #badge{position:fixed;right:10px;bottom:10px;z-index:1001;background:rgba(18,26,43,.9);color:#e8eefc;border:1px solid rgba(255,255,255,.15);padding:6px 8px;border-radius:10px;font:12px system-ui}
    .ok{color:#7bd88f}.bad{color:#ffb3b3}
    #err{position:fixed;left:10px;right:10px;bottom:10px;z-index:2000;display:none;background:#3b0d0d;color:#ffe9e9;border:2px solid #ff8c8c;border-radius:10px;padding:10px 12px;font:13px/1.3 ui-monospace,Consolas,Menlo,monospace;white-space:pre-wrap}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="hud"><label><input type="checkbox" id="rails" checked> Rails (proxied)</label></div>
  <button id="logout" title="Sign out">Logout</button>
  <div id="badge">Loading…</div>
  <div id="err"></div>

  <script src="https://unpkg.com/ol@9.1.0/dist/ol.js" defer></script>
  <script>
    window.addEventListener('error', e=>{
      const box=document.getElementById('err'); box.style.display='block';
      box.textContent='JavaScript error: '+(e?.error?.stack||e.message||String(e));
    });

    (function(){
      const badge=document.getElementById('badge');
      const say=(t,cls)=>{ badge.textContent=t; badge.className=(cls?cls:''); };

      document.getElementById('logout').onclick=async()=>{ try{await fetch('/api/logout');}catch{} location.href='/login.html'; };

      let tries=0;
      const w=setInterval(()=>{
        if(window.ol&&ol.Map){ clearInterval(w); boot(); }
        else if(++tries>200){ clearInterval(w); say('OpenLayers failed to load (CSP/script-src)','bad'); }
      },30);

      function boot(){
        try{
          const base=new ol.layer.Tile({ source:new ol.source.OSM({crossOrigin:'anonymous'}), zIndex:0 });

          const rails=new ol.layer.Tile({
            source:new ol.source.XYZ({
              url:'/api/orm/standard/{z}/{x}/{y}.png', // SAME-ORIGIN PROXY
              maxZoom:19
            }),
            opacity:0.9, visible:true, zIndex:10
          });

          const map=new ol.Map({
            target:'map',
            layers:[base, rails],
            view:new ol.View({
              center:ol.proj.fromLonLat([133.7751,-25.2744]), zoom:4.8, constrainRotation:0
            })
          });

          document.getElementById('rails').onchange=e=> rails.setVisible(e.target.checked);

          map.once('rendercomplete',()=> say('Base tiles rendered ✔︎','ok'));
          rails.getSource().on('tileloadend',()=> say('Rails tiles loaded ✔︎','ok'));
          rails.getSource().on('tileloaderror',()=> say('Rails PROXY tile failed — check Functions → orm logs','bad'));
        }catch(e){
          const box=document.getElementById('err'); box.style.display='block';
          box.textContent='Boot error: '+(e?.stack||e?.message||String(e));
        }
      }
    })();
  </script>
</body>
</html>
