<!doctype html>
<meta charset="utf-8" />
<title>Tile Test</title>
<style>body{font:14px system-ui;margin:20px}</style>
<p>Trying to load <code>https://tile.openrailwaymap.org/standard/5/27/19.png</code>…</p>
<img id="img" src="https://tile.openrailwaymap.org/standard/5/27/19.png" alt="tile" />
<p id="status">Status: starting…</p>
<script>
const img = document.getElementById('img');
const status = document.getElementById('status');
img.onload = () => status.textContent = 'Status: ✅ loaded OK (host allowed by CSP)';
img.onerror = () => status.textContent = 'Status: ❌ blocked (likely CSP img-src/connect-src missing tile.openrailwaymap.org)';
</script>
