<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RailOps — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body{margin:0;background:#0b1220;color:#e8eefc;font:15px system-ui,-apple-system,Segoe UI,Roboto,Arial}
  .wrap{max-width:860px;margin:20px auto;padding:0 16px}
  .card{background:#121a2b;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.35);margin-top:14px}
  h1,h2{margin:0 0 12px}
  label{display:block;margin:8px 0}
  input[type="text"],input[type="number"],input[type="url"],input[type="password"]{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#0b1220;color:#e8eefc}
  .row{display:grid;gap:10px}
  .row-2{grid-template-columns:1fr 1fr}
  .btn{padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#e8eefc;cursor:pointer}
  .btn.accent{border-color:rgba(123,216,143,.35);background:rgba(123,216,143,.12)}
  .hint{font-size:12px;color:#8fa3bf}
  a{color:#7bd88f;text-decoration:none}
  nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
</style>
</head>
<body>
  <div class="wrap">
    <nav>
      <div><a href="/dashboard.html">↩ Dashboard</a></div>
      <button class="btn" onclick="logout()">Logout</button>
    </nav>

    <h1>RailOps — Admin</h1>

    <!-- Layers/settings (optional, keep if you use localStorage options) -->
    <div class="card">
      <h2>Map Layers</h2>
      <label><input type="checkbox" id="opt-rail"> Railway lines</label>
      <label><input type="checkbox" id="opt-km"> KM2ME markers</label>
      <label><input type="checkbox" id="opt-locate"> Current location</label>
      <label><input type="checkbox" id="opt-coverage"> Coverage (All)</label>
      <label><input type="checkbox" id="opt-covTel"> Telstra</label>
      <label><input type="checkbox" id="opt-covOpt"> Optus</label>
      <label><input type="checkbox" id="opt-covVod"> Vodafone/TPG</label>

      <div class="row row-2" style="margin-top:10px">
        <div>
          <div class="hint">Rail colour</div>
          <input type="color" id="rail-color" value="#000000">
        </div>
        <div>
          <div class="hint">Rail width (px)</div>
          <input type="number" id="rail-width" min="1" max="10" value="3">
        </div>
      </div>

      <div style="margin-top:10px">
        <div class="hint">KM2ME GeoJSON URL (optional)</div>
        <input type="url" id="km2me-url" placeholder="https://example.com/km2me.geojson">
      </div>
      <div style="margin-top:10px">
        <div class="hint">Overpass API endpoint</div>
        <input type="url" id="overpass-url" value="https://overpass-api.de/api/interpreter">
      </div>

      <div style="margin-top:14px">
        <button class="btn accent" id="save">Save options</button>
        <button class="btn" id="reset">Reset defaults</button>
        <span id="msg" class="hint" style="margin-left:8px"></span>
      </div>
    </div>

    <!-- Guests manager -->
    <div class="card">
      <h2>Guests</h2>
      <div class="row row-2">
        <input type="text" id="guest-username" placeholder="guest username (e.g., worksite1)">
        <input type="number" id="guest-days" min="1" max="90" value="7" title="Expires in N days">
      </div>
      <div style="margin-top:10px">
        <button class="btn accent" id="guest-create">Create guest</button>
        <span class="hint" id="guest-msg"></span>
      </div>
      <div style="margin-top:14px">
        <h3 style="margin:0 0 8px">Active guests</h3>
        <div id="guest-list" class="hint">—</div>
      </div>
    </div>
  </div>

<script>
  // ---- Logout helper ----
  async function logout(){ try{ await fetch('/api/logout'); }catch{} location.href='/login.html'; }

  // ---- Options persisted in localStorage (used by dashboard.html) ----
  const defaultOptions = {
    layers:{ rail:true, km:false, locate:true, coverage:false, covTel:false, covOpt:false, covVod:false },
    railStyle:{ color:'#000000', width:3 },
    sources:{ km2me:'', overpass:'https://overpass-api.de/api/interpreter' }
  };
  const LSKEY = 'railops.options';
  const LS = {
    get(){ try{ return JSON.parse(localStorage.getItem(LSKEY) || 'null') || defaultOptions; }catch{ return defaultOptions; } },
    set(v){ localStorage.setItem(LSKEY, JSON.stringify(v)); }
  };
  const $ = id => document.getElementById(id);

  function loadUI(){
    const o = LS.get();
    $('opt-rail').checked = !!o.layers.rail;
    $('opt-km').checked = !!o.layers.km;
    $('opt-locate').checked = !!o.layers.locate;
    $('opt-coverage').checked = !!o.layers.coverage;
    $('opt-covTel').checked = !!o.layers.covTel;
    $('opt-covOpt').checked = !!o.layers.covOpt;
    $('opt-covVod').checked = !!o.layers.covVod;
    $('rail-color').value = o.railStyle.color || '#000000';
    $('rail-width').value = o.railStyle.width || 3;
    $('km2me-url').value = o.sources.km2me || '';
    $('overpass-url').value = o.sources.overpass || defaultOptions.sources.overpass;
  }
  function saveUI(){
    const o = LS.get();
    o.layers.rail = $('opt-rail').checked;
    o.layers.km = $('opt-km').checked;
    o.layers.locate = $('opt-locate').checked;
    o.layers.coverage = $('opt-coverage').checked;
    o.layers.covTel = $('opt-covTel').checked;
    o.layers.covOpt = $('opt-covOpt').checked;
    o.layers.covVod = $('opt-covVod').checked;
    o.railStyle.color = $('rail-color').value || '#000000';
    o.railStyle.width = Math.max(1, Math.min(10, parseInt($('rail-width').value||'3',10)));
    o.sources.km2me = ($('km2me-url').value || '').trim();
    o.sources.overpass = ($('overpass-url').value || '').trim() || defaultOptions.sources.overpass;
    LS.set(o);
    $('msg').textContent = 'Saved. Open/refresh the Dashboard to see changes.';
    setTimeout(()=> $('msg').textContent = '', 2500);
  }
  function resetDefaults(){ LS.set(defaultOptions); loadUI(); $('msg').textContent = 'Defaults restored.'; setTimeout(()=> $('msg').textContent='', 1500); }

  document.addEventListener('DOMContentLoaded', ()=>{
    loadUI();
    $('save').onclick = saveUI;
    $('reset').onclick = resetDefaults;
    fetchGuests();
  });

  // ---- Guests manager (talks to unified /api/guests) ----
  async function fetchGuests(){
    const box = $('guest-list');
    box.textContent = 'Loading…';
    try{
      const res = await fetch('/api/guests?action=list');
      if (!res.ok) { box.textContent = 'Failed to load.'; return; }
      const data = await res.json();
      if (!data.ok) { box.textContent = 'Failed to load.'; return; }
      if (!data.guests.length) { box.textContent = 'No guests yet.'; return; }
      box.innerHTML = '';
      data.guests.forEach(g=>{
        const d = document.createElement('div');
        const exp = g.expires ? new Date(g.expires).toLocaleString() : '—';
        d.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px;margin:6px 0">
          <div><strong>${g.username}</strong> <span class="hint">expires: ${exp}${g.disabled?' (revoked)':''}</span></div>
          <button class="btn" data-user="${g.username}" ${g.disabled?'disabled':''}>Revoke</button>
        </div>`;
        box.appendChild(d);
      });
      box.querySelectorAll('button[data-user]').forEach(btn=>{
        btn.onclick = async ()=>{
          const u = btn.getAttribute('data-user');
          if (!confirm(`Revoke guest "${u}"?`)) return;
          const r = await fetch('/api/guests', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ action:'revoke', username: u })
          });
          if (r.ok) fetchGuests();
        };
      });
    }catch{ box.textContent = 'Failed to load.'; }
  }

  $('guest-create').onclick = async ()=>{
    const u = $('guest-username').value.trim();
    const d = parseInt($('guest-days').value||'7',10);
    const msg = $('guest-msg'); msg.textContent = '';
    if (!u) { msg.textContent = 'Enter a username.'; return; }
    try{
      const res = await fetch('/api/guests', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'create', username: u, expiresDays: d })
      });
      const data = await res.json();
      if (!res.ok || !data.ok) { msg.textContent = 'Failed to create.'; return; }
      msg.textContent = `Created: ${data.username} / ${data.password} — expires ${new Date(data.expires).toLocaleString()}. Copy now!`;
      $('guest-username').value = '';
      fetchGuests();
    }catch{ msg.textContent = 'Failed to create.'; }
  };
</script>
</body>
</html>
