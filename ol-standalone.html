<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OL Standalone — Smoke Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- OpenLayers from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.1.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@9.1.0/dist/ol.js"></script>

  <style>
    html,body {height:100%;margin:0;background:#0f1a24;color:#e6eef7;font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial}
    #map{height:100%;width:100%}
    .badge{position:fixed;right:.75rem;bottom:.75rem;background:#132;border:1px solid #254;padding:.35rem .55rem;border-radius:.6rem;font-size:.85rem}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="badge" id="status">Booting…</div>

  <script>
    const s = document.getElementById('status');
    const ok = m => (s.textContent=m);
    const warn = m => (s.textContent='⚠ '+m);

    if (!window.ol || !ol.Map) { warn('OpenLayers failed to load (CSP/CDN)'); }
    else {
      const map = new ol.Map({
        target: 'map',
        layers: [ new ol.layer.Tile({ source: new ol.source.OSM({crossOrigin:'anonymous'}) }) ],
        view: new ol.View({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 4.8 }),
        interactions: ol.interaction.defaults({ altShiftDragRotate:false, pinchRotate:false })
      });
      map.once('rendercomplete', ()=> ok('OpenLayers + base map rendered ✓'));
    }
  </script>
</body>
</html>
