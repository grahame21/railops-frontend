<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RailOps Guest Access</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="login-page">
  <main class="login-card">
    <div class="logo">🔐</div>
    <h1>RailOps Guest Access</h1>
    <p id="message" class="subtitle">Checking guest token...</p>
  </main>

  <script src="app-auth.js"></script>

  <script>
    function getToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get("token") || "";
    }

    async function loginWithToken() {
      const token = getToken();
      const message = document.getElementById("message");

      if (!token) {
        message.textContent = "Missing token.";
        return;
      }

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          cache: "no-store",
          body: JSON.stringify({
            username: "__token__",
            password: token,
            deviceId: railopsGetDeviceId(),
          }),
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          message.textContent = data.error || "Invalid or expired token.";
          return;
        }

        window.location.href = data.redirect || "/dashboard.html";
      } catch {
        message.textContent = "Token access failed.";
      }
    }

    loginWithToken();
  </script>
</body>
</html>
