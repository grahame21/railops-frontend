<script>
    (function() {
      const debug = document.getElementById('debug-panel');
      
      function log(msg) {
        console.log(msg);
        debug.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + debug.innerHTML;
      }

      log('🚂 Test mode starting...');

      // Create map with Australia view
      const map = new ol.Map({
        target: 'map',
        layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
        view: new ol.View({
          center: ol.proj.fromLonLat([133.7751, -25.2744]),
          zoom: 4
        })
      });

      // Simple train layer with big red dots for testing
      const trainSource = new ol.source.Vector();
      const trainLayer = new ol.layer.Vector({ 
        source: trainSource,
        style: new ol.style.Style({
          image: new ol.style.Circle({
            radius: 8,
            fill: new ol.style.Fill({ color: 'red' }),
            stroke: new ol.style.Stroke({ color: 'white', width: 2 })
          })
        })
      });
      map.addLayer(trainLayer);

      // Fetch and display trains
      async function loadTrains() {
        try {
          const url = 'https://grahame21.github.io/railops-backend/trains.json?t=' + Date.now();
          log(`Fetching: ${url}`);
          
          const response = await fetch(url);
          log(`Status: ${response.status}`);
          
          const data = await response.json();
          log(`Found ${data.trains?.length || 0} trains in data`);
          
          trainSource.clear();
          
          if (data.trains && data.trains.length > 0) {
            // Show first train as sample
            const first = data.trains[0];
            log(`Sample: ${first.id} at ${first.lat}, ${first.lon}`);
            
            // Add all trains
            data.trains.forEach(t => {
              if (t.lat && t.lon) {
                const feature = new ol.Feature({
                  geometry: new ol.geom.Point(ol.proj.fromLonLat([t.lon, t.lat]))
                });
                feature.set('id', t.id);
                trainSource.addFeature(feature);
              }
            });
            
            log(`Added ${trainSource.getFeatures().length} features to map`);
            
            // Zoom to first train to verify
            if (trainSource.getFeatures().length > 0) {
              const firstTrain = trainSource.getFeatures()[0];
              map.getView().animate({
                center: firstTrain.getGeometry().getCoordinates(),
                zoom: 8
              });
            }
          }
        } catch (e) {
          log(`Error: ${e.message}`);
        }
      }

      loadTrains();
    })();
</script>
