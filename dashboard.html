<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RailOps — Live Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- OpenLayers v6 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/openlayers-dist@6.12.0/ol.css">
  <style>
    html, body { height:100%; margin:0; background:#0b0c10; font:14px system-ui, sans-serif }
    #map { height:100vh; width:100%; position:relative }
    .status{
      position:absolute; z-index:1000; left:10px; top:10px;
      background:#fff; border:1px solid #ddd; border-radius:10px; padding:6px 10px;
      box-shadow:0 8px 24px rgba(0,0,0,.08); font-size:12px
    }
    .status small{ color:#666 }
  </style>
</head>
<body>
  <div id="map"><div class="status"><span id="msg">Loading…</span> <small id="detail"></small></div></div>

  <script src="https://cdn.jsdelivr.net/npm/openlayers-dist@6.12.0/ol.js"></script>
  <script>
  (function(){
    const DATA_URL   = 'https://railops-json.onrender.com/trains.json';
    const REFRESH_MS = 60000;
    const START      = { lon: 138.6, lat: -34.93, z: 6 };
    const BBOX       = { minLon:112, maxLon:154, minLat:-44, maxLat:-9 };

    const Q = new URLSearchParams(location.search);
    const $msg = document.getElementById('msg');
    const $detail = document.getElementById('detail');

    if (!window.ol){ $msg.textContent = 'OpenLayers failed to load'; return; }

    // Map + railway overlay
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({ source: new ol.source.OSM() }),
        new ol.layer.Tile({
          source: new ol.source.XYZ({
            url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',
            attributions: '© OpenRailwayMap contributors'
          }),
          opacity: 0.75
        })
      ],
      view: new ol.View({ center: ol.proj.fromLonLat([START.lon, START.lat]), zoom: START.z })
    });
    const source = new ol.source.Vector();
    const layer  = new ol.layer.Vector({ source, zIndex: 20 });
    map.addLayer(layer);

    // ---------- helpers ----------
    const num = v => (v==null ? null : Number.isFinite(+v) ? +v : null);
    const has = (o,k) => !!(o && typeof o==='object' && k in o);
    const get = (o, ks) => ks.find(k => has(o,k)) && o[ks.find(k => has(o,k))];
    const inBBox = (la,lo) => (lo>=BBOX.minLon && lo<=BBOX.maxLon && la>=BBOX.minLat && la<=BBOX.maxLat);

    const F = {
      id:      [Q.get('id'),'ServiceNumber','Headcode','HeadCode','TrainId','trainId','Number','Name','Unit','LocoId','LocomotiveId','id','ID','Id'].filter(Boolean),
      label:   [Q.get('label'),'ServiceNumber','Headcode','Name','Train','label','Label','title','Title','Unit'].filter(Boolean),
      operator:[Q.get('operator'),'operator','Operator','company','Company','owner','Owner'].filter(Boolean),
      lat:     [Q.get('lat'),'lat','Lat','latitude','Latitude','LatDD','LatitudeDD','y','Y'].filter(Boolean),
      lon:     [Q.get('lon'),'lon','Lon','lng','Lng','longitude','Longitude','LonDD','LongitudeDD','long','Long','x','X'].filter(Boolean),
      heading: [Q.get('heading'),'heading','Heading','bearing','Bearing','course','Course','Direction','dir'].filter(Boolean),
      speed:   [Q.get('speed'),'speed','Speed','velocity','Velocity','kmh','KMH','kph','KPH'].filter(Boolean),
      time:    [Q.get('time'),'timestamp','Timestamp','time','Time','LastSeen','lastSeen','updated','Updated'].filter(Boolean)
    };

    function latLonFromAny(obj){
      if (!obj || typeof obj!=='object') return [null,null];

      let lat = get(obj, F.lat);
      let lon = get(obj, F.lon);
      lat = num(lat); lon = num(lon);
      if (lat!=null && lon!=null){
        if (!inBBox(lat,lon) && inBBox(lon,lat)) return [lon,lat];
        return [lat,lon];
      }

      for (const k of ['position','pos','coords','coord','location','geo','Geo','geometry']){
        const v = obj[k]; if (!v || typeof v!=='object') continue;

        let nlat = get(v, F.lat);
        let nlon = get(v, F.lon);
        nlat = num(nlat); nlon = num(nlon);
        if (nlat!=null && nlon!=null){
          if (!inBBox(nlat,nlon) && inBBox(nlon,nlat)) return [nlon,nlat];
          return [nlat,nlon];
        }

        if (Array.isArray(v) && v.length>=2){
          const a=num(v[0]), b=num(v[1]);
          if (a!=null && b!=null){
            const looksLon = Math.abs(a)>=60 && Math.abs(a)<=180;
            const la = looksLon ? b : a;
            const lo = looksLon ? a : b;
            if (!inBBox(la,lo) && inBBox(lo,la)) return [lo,la];
            return [la,lo];
          }
        }

        if (v.type==='Point' && Array.isArray(v.coordinates)){
          const [lo,la]=v.coordinates; const L=[num(la),num(lo)];
          if (L[0]!=null && L[1]!=null){
            if (!inBBox(L[0],L[1]) && inBBox(L[1],L[0])) return [L[1],L[0]];
            return L;
          }
        }
      }

      if (obj.type==='Feature' && obj.geometry?.type==='Point' && Array.isArray(obj.geometry.coordinates)){
        const [lo,la]=obj.geometry.coordinates; const L=[num(la),num(lo)];
        if (L[0]!=null && L[1]!=null){
          if (!inBBox(L[0],L[1]) && inBBox(L[1],L[0])) return [L[1],L[0]];
          return L;
        }
      }
      return [null,null];
    }

    // Parse payload text -> object/array
    async function fetchAnyJson(url){
      const res = await fetch(`${url}?t=${Date.now()}`, { cache:'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();

      // try JSON first
      try { return JSON.parse(text); } catch(_){}

      // NDJSON fallback
      const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      if (lines.length>1){
        const arr = [];
        for (const ln of lines){ try{ arr.push(JSON.parse(ln)); }catch{} }
        if (arr.length) return arr;
      }

      // Some backends embed JSON as string in { data: "..." }
      try {
        const outer = JSON.parse(text);
        for (const v of Object.values(outer||{})){
          if (typeof v === 'string'){
            try { const inner = JSON.parse(v); return inner; } catch(_){}
          }
        }
      } catch(_){}

      throw new Error('Unparseable payload');
    }

    // Find trains in many shapes
    function arraysDeep(root, path='$', out=[]){
      if (Array.isArray(root)) { out.push({path, arr:root}); return out; }
      if (root && typeof root==='object'){
        for (const [k,v] of Object.entries(root)) arraysDeep(v, `${path}.${k}`, out);
      }
      return out;
    }

    function objectOfObjectsToArray(obj){
      if (!obj || typeof obj!=='object' || Array.isArray(obj)) return null;
      const vals = Object.values(obj);
      if (vals.length<2) return null;
      let withLL=0; for (const r of vals){ const [la,lo]=latLonFromAny(r); if (la!=null && lo!=null) withLL++; }
      return withLL>=3 ? vals : null;
    }

    function selectRecords(payload){
      // 0) If user gave an explicit path
      const hint = Q.get('path');
      if (hint && hint.startsWith('$.')){
        try{
          const parts = hint.split('.').slice(1);
          let cur = payload; for (const p of parts){ cur = (cur||{})[p]; }
          if (Array.isArray(cur)) return cur;
          if (cur && typeof cur==='object'){ const arr = objectOfObjectsToArray(cur); if (arr) return arr; }
        }catch(_){}
      }

      // 1) Obvious keys
      if (Array.isArray(payload)) return payload;
      if (payload && typeof payload==='object'){
        for (const key of ['trains','positions','vehicles','features']){
          if (Array.isArray(payload[key])) return payload[key];
          const arr = objectOfObjectsToArray(payload[key]);
          if (arr) return arr;
        }
      }

      // 2) GeoJSON FeatureCollection
      if (payload && payload.type==='FeatureCollection' && Array.isArray(payload.features))
        return payload.features;

      // 3) Any arrays deep inside
      const cands = arraysDeep(payload);
      // score: how many have lat/lon
      let best = null;
      for (const c of cands){
        const smp = c.arr.slice(0,40);
        let withLL=0; for (const r of smp){ const [la,lo]=latLonFromAny(r||{}); if (la!=null && lo!=null) withLL++; }
        // prefer non-massive arrays, but still accept if they have LLs
        const penalty = c.arr.length>20000 ? 5 : c.arr.length>5000 ? 2 : 0;
        const score = withLL - penalty;
        if (withLL>=3 && (!best || score > best.score)) best = {arr:c.arr, score};
      }
      if (best) return best.arr;

      // 4) Object-of-objects at root
      const objArr = objectOfObjectsToArray(payload);
      if (objArr) return objArr;

      return null;
    }

    // heading + normalize
    const lastPosById = new Map();
    const deg2rad = d => d*Math.PI/180, rad2deg = r => r*180/Math.PI;
    function bearing(lon1, lat1, lon2, lat2){
      const φ1=deg2rad(lat1), φ2=deg2rad(lat2), Δλ=deg2rad(lon2-lon1);
      const y = Math.sin(Δλ)*Math.cos(φ2);
      const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      return ((rad2deg(Math.atan2(y,x)) + 360) % 360);
    }

    const idOf    = (r,i) => get(r, F.id) ?? `train_${i}`;
    const labelOf =  r    => get(r, F.label) ?? '';
    const opOf    =  r    => get(r, F.operator) ?? '';
    const headOf  =  r    => num(get(r, F.heading));
    const speedOf =  r    => num(get(r, F.speed));
    const timeOf  =  r    => get(r, F.time);

    function normalize(rec,i){
      const [lat,lon] = latLonFromAny(rec);
      if (lat==null || lon==null) return null;
      if (!inBBox(lat,lon)) return null;

      let id = idOf(rec, i);
      if (!id || String(id).trim()==='') id = `train_${i}`;

      let hd = headOf(rec);
      if ((hd==null || !isFinite(hd))){
        const last = lastPosById.get(id);
        if (last) hd = bearing(last.lon,last.lat,lon,lat);
      }

      return {
        id,
        lat, lon,
        heading: (hd!=null && isFinite(hd)) ? hd : 0,
        speed: speedOf(rec),
        label: labelOf(rec),
        operator: opOf(rec),
        ts: timeOf(rec)
      };
    }

    // icons
    const styleCache = new Map();
    function svgTrain(t){
      const label = (t.label || t.id || '').toString().slice(0, 8);
      const bg = '#ffcc00', fg='#1a1a1a', op = (t.operator||'').toString().slice(0,6);
      return `
        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="26" viewBox="0 0 44 26">
          <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.4)"/></filter></defs>
          <g filter="url(#s)">
            <rect x="1" y="1" rx="5" ry="5" width="42" height="20" fill="${bg}" stroke="${fg}" stroke-width="1.2"/>
            <rect x="6" y="16" width="12" height="4" fill="${fg}" />
            <rect x="26" y="16" width="12" height="4" fill="${fg}" />
            <circle cx="12" cy="20" r="2.2" fill="#333"/>
            <circle cx="32" cy="20" r="2.2" fill="#333"/>
            <text x="22" y="10.5" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="${fg}">${label}</text>
            <text x="22" y="18" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle" fill="${fg}">${op}</text>
          </g>
        </svg>`;
    }
    function styleFor(t){
      const key = `${t.id}|${t.label}|${t.operator}`;
      let s = styleCache.get(key);
      if (!s){
        const uri = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgTrain(t));
        s = new ol.style.Style({
          image: new ol.style.Icon({
            src: uri,
            rotation: ((t.heading ?? 0) - 90) * Math.PI/180,
            rotateWithView: true,
            anchor: [0.5, 0.8],
            anchorXUnits: 'fraction',
            anchorYUnits: 'fraction'
          })
        });
        styleCache.set(key, s);
      }else{
        s.getImage().setRotation(((t.heading ?? 0) - 90) * Math.PI/180);
      }
      return s;
    }

    let firstFitDone = false;
    function draw(trains){
      source.clear();
      const byId = new Map();
      for (const t of trains){
        if (!t) continue;
        const prev = byId.get(t.id);
        if (!prev || (t.ts && prev.ts && t.ts > prev.ts)) byId.set(t.id, t);
        else if (!prev) byId.set(t.id, t);
      }

      const feats = [];
      for (const t of byId.values()){
        lastPosById.set(t.id, { lat:t.lat, lon:t.lon });
        const f = new ol.Feature({
          geometry: new ol.geom.Point(ol.proj.fromLonLat([t.lon, t.lat])),
          id:t.id, label:t.label||t.id, operator:t.operator||'',
          speed:t.speed??null, heading:t.heading??0, lon:t.lon, lat:t.lat
        });
        f.setStyle(styleFor(t));
        feats.push(f);
      }
      source.addFeatures(feats);

      if (!firstFitDone && feats.length){
        firstFitDone = true;
        map.getView().fit(source.getExtent(), { padding:[40,40,40,40], maxZoom: 11, duration: 500 });
      }
      $msg.textContent = feats.length ? `Trains: ${feats.length}` : 'No trains found';
      $detail.textContent = '';
    }

    async function tick(){
      try{
        const payload = await fetchAnyJson(DATA_URL);
        const records = selectRecords(payload);
        if (!records || !records.length){ $msg.textContent = 'No trains found'; $detail.textContent=''; source.clear(); return; }
        const trains = records.map(normalize).filter(Boolean);
        draw(trains);
      }catch(err){
        console.error(err);
        $msg.textContent = `Fetch error: ${err.message}`;
        $detail.textContent = '';
      }
    }

    // popup
    const popupEl = document.createElement('div');
    popupEl.style.cssText = 'background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:180px;';
    const popup = new ol.Overlay({ element: popupEl, autoPan:{animation:{duration:250}}, offset:[0,-12], positioning:'bottom-center' });
    map.addOverlay(popup);
    map.on('singleclick', (evt)=>{
      let f=null; map.forEachFeatureAtPixel(evt.pixel,(feat,lyr)=>{ if(lyr===layer) f=feat; });
      if(!f){ popup.setPosition(undefined); return; }
      const p=f.getProperties();
      popupEl.innerHTML = `<strong>${p.label||p.id||'Train'}</strong><br/>
        ${p.operator? `${p.operator}<br/>`:''}
        ${p.speed!=null? `Speed: ${p.speed} km/h<br/>`:''}
        Heading: ${Math.round(p.heading||0)}°<br/>
        ${p.lat?.toFixed?.(5)}, ${p.lon?.toFixed?.(5)}`;
      popup.setPosition(f.getGeometry().getCoordinates());
    });

    tick();
    setInterval(tick, REFRESH_MS);
  })();
  </script>
</body>
</html>
