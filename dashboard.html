<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps Train Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.1.0/ol.css" />
  <style>
    html, body { height: 100%; width: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }

    /* Popup */
    .ol-popup {
      position: absolute;
      background: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      min-width: 220px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      transform: translate(-50%, -100%);
      pointer-events: auto;
      font: 13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    .ol-popup h3 {
      margin: 0 0 6px;
      font-size: 14px;
      line-height: 1.2;
    }
    .ol-popup .meta {
      color: #555;
      margin: 0 0 6px;
    }
    .ol-popup table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .ol-popup td {
      padding: 2px 0;
      vertical-align: top;
    }
    .ol-popup td:first-child {
      width: 32%;
      color: #666;
      padding-right: 6px;
    }
    .ol-popup .close {
      position: absolute; top: 6px; right: 8px;
      border: 0; background: transparent; font-size: 18px; line-height: 1;
      cursor: pointer; color: #999;
    }
    .ol-popup .close:hover { color: #333; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Popup overlay -->
  <div id="popup" class="ol-popup" style="display:none;">
    <button class="close" id="popup-close" title="Close">×</button>
    <div id="popup-content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
