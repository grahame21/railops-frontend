<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RailOps — AU Live Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
#map { height: 100%; width: 100%; background: #0a1a2a; }

:root{
  --panel-bg: #0b1522;
  --panel-border: #2a4a7a;
  --panel-btn: #1e3a5f;
  --panel-btn-border: #3a6a9a;
  --accent: #ffaa00;
  --blue: #0b57cf;
}

.toolbar {
  position: absolute; top: 12px; left: 12px; z-index: 1000;
  background: var(--panel-bg);
  color: white; padding: 10px 16px; border-radius: 40px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.55);
  display: flex; gap: 12px; align-items: center;
  border: 1px solid var(--panel-border);
  font-size: 14px; font-weight: 700;
}
.toolbar button, .toolbar select {
  background: var(--panel-btn); color: white;
  border: 1px solid var(--panel-btn-border); border-radius: 30px;
  padding: 6px 16px; font-size: 13px; font-weight: 800;
  cursor: pointer; transition: all 0.2s;
}
.toolbar button:hover { background: #2a4a7a; border-color: #5a8aca; }

.search-container {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  z-index: 1000; width: 440px;
}
.search-box {
  background: var(--panel-bg);
  border-radius: 40px; border: 1px solid var(--panel-border);
  display: flex; box-shadow: 0 4px 20px rgba(0,0,0,0.55);
}
.search-box input {
  flex: 1; background: #15283f; border: 1px solid var(--panel-btn-border);
  border-radius: 40px 0 0 40px; padding: 10px 18px;
  color: white; font-size: 14px; outline: none;
}
.search-box input::placeholder { color: #9ab0d0; }
.search-box button {
  background: var(--blue); border: none; border-radius: 0 40px 40px 0;
  padding: 10px 22px; color: white; font-weight: 900;
  cursor: pointer; transition: 0.2s;
}
.search-box button:hover { filter: brightness(1.08); }

.autocomplete-items {
  position: absolute; top: calc(100% + 2px); left: 0; right: 0;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 16px; max-height: 320px;
  overflow-y: auto; z-index: 1001;
}
.autocomplete-item {
  padding: 12px 16px; color: white; cursor: pointer;
  border-bottom: 1px solid #1e3a5f; font-size: 13px;
  display: flex; justify-content: space-between; gap: 12px;
}
.autocomplete-item:hover { background: #13243a; }
.autocomplete-item .train-id { font-weight: 900; color: #cfe2ff; }
.autocomplete-item .train-loc { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.status-bar {
  position: absolute; top: 12px; right: 12px; z-index: 1000;
  background: var(--panel-bg);
  color: white; padding: 8px 16px; border-radius: 40px;
  font-size: 13px; border: 1px solid var(--panel-border);
  display: flex; gap: 10px; align-items: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.55);
}
.train-count {
  background: var(--blue); padding: 2px 12px;
  border-radius: 30px; font-weight: 900;
}
.note-pill {
  background: #15283f; border: 1px solid #2b4f80;
  padding: 2px 10px; border-radius: 999px; font-weight: 800; color: #cfe2ff;
}

.layers-panel {
  position: absolute; left: 12px; bottom: 12px; z-index: 1000;
  background: var(--panel-bg);
  color: white; border-radius: 20px; padding: 16px;
  border: 1px solid var(--panel-border); width: 280px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.55);
}
.layer-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid #1e3a5f;
  font-size: 13px;
}
.layer-row:last-child { border-bottom: none; }
.section-title { color: #9ab0d0; font-size: 12px; margin: 12px 0 4px 0; }

.train-popup {
  position: absolute;
  background: #0b1522;
  color: white;
  padding: 14px;
  border-radius: 14px;
  border: 2px solid var(--panel-border);
  box-shadow: 0 8px 30px rgba(0,0,0,0.85);
  pointer-events: none;
  transform: translate(-50%, -100%);
  min-width: 340px;
  z-index: 10000;
}
.train-popup::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border-width: 10px;
  border-style: solid;
  border-color: var(--panel-border) transparent transparent transparent;
}
.popup-header {
  font-size: 16px;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 6px;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 4px;
}
.popup-subheader {
  font-size: 13px;
  color: #9ab0d0;
  margin-bottom: 10px;
  font-style: italic;
}
.popup-grid {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 6px;
  font-size: 13px;
  margin: 6px 0;
}
.popup-label { color: #9ab0d0; font-weight: 800; }
.popup-value { color: white; }
.popup-badge {
  background: #15283f;
  border: 1px solid #2b4f80;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  display: inline-block;
  margin-right: 6px;
  margin-top: 6px;
  color: #cfe2ff;
}
.popup-footer { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
</style>
</head>

<body>
<div class="toolbar">
  <span style="font-weight:900; color:var(--accent)">🚂 RailOps</span>
  <select id="stateSelect">
    <option value="au">🇦🇺 Australia</option>
    <option value="nsw">📍 NSW</option>
    <option value="vic">📍 VIC</option>
    <option value="qld">📍 QLD</option>
    <option value="sa">📍 SA</option>
    <option value="wa">📍 WA</option>
    <option value="tas">📍 TAS</option>
    <option value="nt">📍 NT</option>
  </select>
  <button id="locateBtn">📍 My Location</button>
  <button id="layersToggleBtn">🗺️ Layers</button>
</div>

<div class="search-container">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search train number, loco, origin, destination...">
    <button id="searchBtn">🔍 Search</button>
  </div>
  <div id="autocompleteList" class="autocomplete-items" style="display:none;"></div>
</div>

<div class="status-bar">
  <span id="lastUpdate">Loading...</span>
  <span class="note-pill" id="statusNote">…</span>
  <span class="train-count" id="trainCount">0</span>
</div>

<div class="layers-panel" id="layersPanel" style="display:none;">
  <h3 style="margin-bottom:8px;">🗺️ MAP LAYERS</h3>
  <div class="layer-row"><label><input type="checkbox" id="trainLayerChk" checked> 🚆 Live Trains</label></div>
  <div class="layer-row"><label><input type="checkbox" id="railLayerChk" checked> 🛤️ Rail Lines (Blue)</label></div>
  <div class="layer-row"><label><input type="checkbox" id="stationsLayerChk" checked> 🏢 Stations</label></div>

  <div class="section-title">📱 MOBILE COVERAGE</div>
  <div class="layer-row"><label><input type="checkbox" id="covTelstraChk"> 📶 Telstra</label></div>
  <div class="layer-row"><label><input type="checkbox" id="covOptusChk"> 📶 Optus</label></div>
  <div class="layer-row"><label><input type="checkbox" id="covTPGChk"> 📶 Vodafone/TPG</label></div>
  <div class="layer-row"><label><input type="checkbox" id="covAllChk"> 📶 All Networks</label></div>
</div>

<div id="map"></div>

<script>
const TRAINS_URL_BASE = "https://railops-live-au.fly.dev/trains.json";

/** junk ids from extraction sources (we NEVER display these as labels) */
function isJunkId(s){
  if (!s) return true;
  const v = String(s).toLowerCase();
  return v.startsWith("arrowmarkerssource_")
      || v.startsWith("markersource_")
      || v.startsWith("regtrainssource_")
      || v.startsWith("unregtrainssource_")
      || v.startsWith("trainsource_")
      || v.includes("arrowmarkerssource");
}

/** Pick best IDs from a train object */
function getLoco(train){
  const candidates = [train.trKey, train.loco, train.train_name, train.trainName];
  for (const c of candidates){
    if (!c) continue;
    const s = String(c).trim();
    if (s && !isJunkId(s)) return s;
  }
  return "";
}
function getTrainId(train){
  const candidates = [train.train_number, train.trainNumber, train.id, train.ID];
  for (const c of candidates){
    if (!c) continue;
    const s = String(c).trim();
    if (s && !isJunkId(s)) return s;
  }
  return "";
}

/** Build the ONE-LINE label you want: "LOCO • TRAIN" */
function buildLabel(train){
  const loco = getLoco(train);
  const tid = getTrainId(train);

  // If the "train id" is junk (arrowMarkersSource...), ignore it.
  // If both missing, no label at all.
  if (!loco && !tid) return "";

  // If both exist and different, show both on ONE line
  if (loco && tid && loco !== tid) return `${loco} • ${tid}`;

  // Otherwise show whichever exists
  return loco || tid;
}

/** Map setup */
const map = new ol.Map({
  target: 'map',
  layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
  view: new ol.View({
    center: ol.proj.fromLonLat([133.7751, -25.2744]),
    zoom: 4,
    maxZoom: 18
  })
});
map.getView().on('change:rotation', () => map.getView().setRotation(0));

/** Rail layers */
const railLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png' }),
  visible: true, zIndex: 1
});
railLayer.on('prerender', (e)=>{ e.context.filter='hue-rotate(200deg) brightness(0.95) saturate(1.6)'; });
railLayer.on('postrender', (e)=>{ e.context.filter='none'; });

const stationsLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/stations/{z}/{x}/{y}.png' }),
  visible: true, zIndex: 2
});

map.addLayer(railLayer);
map.addLayer(stationsLayer);

/** ACCC coverage */
const ACCC_URL = 'https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer';
function createAcccLayer(id) {
  return new ol.layer.Tile({
    source: new ol.source.TileArcGISRest({
      url: ACCC_URL,
      params: { layers: `show:${id}`, dpi: 96, transparent: true, format: 'png32' }
    }),
    opacity: 0.45, visible: false, zIndex: 3
  });
}
const covTelstra = createAcccLayer(25);
const covOptus   = createAcccLayer(15);
const covTPG     = createAcccLayer(33);
const covAll     = createAcccLayer(4);
[covTelstra, covOptus, covTPG, covAll].forEach(l => map.addLayer(l));

/** Train layer */
const trainSource = new ol.source.Vector();
const trainLayer = new ol.layer.Vector({
  source: trainSource,
  visible: true,
  zIndex: 10,
  style: function(feature){
    const train = feature.get('train_data') || {};
    const label = buildLabel(train);

    // If label is empty OR label is junk => do not draw text at all
    const speed = Number(train.speed || 0);

    let dotColor = '#ffaa00';
    if (speed > 80) dotColor = '#ff4444';
    else if (speed > 30) dotColor = '#00cc00';
    else if (speed > 0) dotColor = '#44ff44';

    const styles = [
      new ol.style.Style({
        image: new ol.style.Circle({
          radius: 7,
          fill: new ol.style.Fill({ color: dotColor }),
          stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
        })
      })
    ];

    if (label && !isJunkId(label)) {
      styles.push(new ol.style.Style({
        text: new ol.style.Text({
          text: label,
          font: 'bold 11px monospace',
          fill: new ol.style.Fill({ color: '#ffaa00' }),
          stroke: new ol.style.Stroke({ color: '#000000', width: 3 }),
          offsetY: -18,
          backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.92)' }),
          padding: [2, 8, 2, 8]
        })
      }));
    }

    return styles;
  }
});
map.addLayer(trainLayer);

let allTrains = [];

/** Load trains */
async function loadRealTrains() {
  const url = `${TRAINS_URL_BASE}?ts=${Date.now()}`;
  try {
    document.getElementById('lastUpdate').textContent = 'Loading...';

    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    const trains = data.trains || [];
    allTrains = trains;

    document.getElementById('trainCount').textContent = trains.length;
    document.getElementById('statusNote').textContent = (data.note || 'ok').toString();
    const ts = data.lastUpdated ? new Date(data.lastUpdated) : new Date();
    document.getElementById('lastUpdate').textContent = `Last: ${ts.toLocaleTimeString()}`;

    trainSource.clear();

    trains.forEach(train => {
      // HARD skip pure arrow-marker items (these are what caused your screenshot)
      const maybeId = train.id || train.train_number || train.trainNumber || train.trKey || "";
      const maybeName = train.train_name || train.loco || "";
      if (isJunkId(maybeId) && isJunkId(maybeName)) return;

      const lat = Number(train.lat);
      const lon = Number(train.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

      const feature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat]))
      });
      feature.set('train_data', train);
      trainSource.addFeature(feature);
    });

  } catch (err) {
    console.error('❌ Failed to load trains:', err);
    document.getElementById('lastUpdate').textContent = '⚠️ Update failed';
    document.getElementById('statusNote').textContent = 'error';
  }
}

/** Hover popup (skips junk marker features automatically) */
let popupOverlay = null;
function removePopup() {
  if (popupOverlay) { map.removeOverlay(popupOverlay); popupOverlay = null; }
}

map.on('pointermove', function(evt){
  const feature = map.forEachFeatureAtPixel(evt.pixel, function(f, layer){
    return layer === trainLayer ? f : null;
  });

  removePopup();
  if (!feature) return;

  const train = feature.get('train_data') || {};
  const label = buildLabel(train);

  // If it’s junk, no popup
  if (!label || isJunkId(label)) return;

  const coords = feature.getGeometry().getCoordinates();
  const lonLat = ol.proj.toLonLat(coords);

  const origin = train.origin || train.serviceFrom || '';
  const dest   = train.destination || train.serviceTo || '';
  const speed  = Number(train.speed || 0);
  const desc   = train.description || train.serviceDesc || '';
  const heading= train.heading || 0;

  const popupDiv = document.createElement('div');
  popupDiv.className = 'train-popup';
  popupDiv.innerHTML = `
    <div class="popup-header">${label} — ${speed} km/h</div>
    ${desc ? `<div class="popup-subheader">${desc}</div>` : ''}
    <div class="popup-grid">
      <span class="popup-label">Origin:</span><span class="popup-value">${origin || 'Unknown'}</span>
      <span class="popup-label">Destination:</span><span class="popup-value">${dest || 'Unknown'}</span>
      <span class="popup-label">Heading:</span><span class="popup-value">${heading}°</span>
      <span class="popup-label">Coords:</span><span class="popup-value">${lonLat[1].toFixed(4)}, ${lonLat[0].toFixed(4)}</span>
    </div>
    <div class="popup-footer">
      ${getLoco(train) ? `<span class="popup-badge">Loco: ${getLoco(train)}</span>` : ''}
      ${getTrainId(train) ? `<span class="popup-badge">Train: ${getTrainId(train)}</span>` : ''}
    </div>
  `;

  popupOverlay = new ol.Overlay({
    element: popupDiv,
    position: coords,
    positioning: 'bottom-center',
    offset: [0, -12]
  });
  map.addOverlay(popupOverlay);
});

/** Search + autocomplete (also ignores junk ids) */
const searchInput = document.getElementById('searchInput');
const autocompleteList = document.getElementById('autocompleteList');
let debounceTimer;

function displayId(train){
  return buildLabel(train);
}

function updateAutocomplete(){
  const query = searchInput.value.trim().toLowerCase();
  if (query.length < 2) { autocompleteList.style.display = 'none'; return; }

  const matches = [];
  const seen = new Set();

  for (const train of allTrains){
    const id = displayId(train);
    if (!id || isJunkId(id)) continue;

    const searchable = [
      displayId(train),
      train.train_number, train.trainNumber,
      train.trKey, train.loco, train.train_name, train.trainName,
      train.origin, train.destination, train.serviceFrom, train.serviceTo,
      train.description, train.serviceDesc
    ].filter(Boolean).map(s => String(s).toLowerCase());

    if (searchable.some(s => s.includes(query)) && !seen.has(id)){
      seen.add(id);
      matches.push({
        id,
        full: train,
        lat: Number(train.lat),
        lon: Number(train.lon)
      });
    }
  }

  if (matches.length === 0) { autocompleteList.style.display = 'none'; return; }

  autocompleteList.innerHTML = '';
  matches.slice(0, 10).forEach(match => {
    const item = document.createElement('div');
    item.className = 'autocomplete-item';
    const o = match.full.origin || match.full.serviceFrom || '';
    const d = match.full.destination || match.full.serviceTo || '';
    item.innerHTML = `<span class="train-id">${match.id}</span><span class="train-loc">${o} → ${d}</span>`;
    item.addEventListener('click', () => {
      searchInput.value = match.id;
      autocompleteList.style.display = 'none';
      flyToTrain(match.lat, match.lon);
    });
    autocompleteList.appendChild(item);
  });
  autocompleteList.style.display = 'block';
}

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updateAutocomplete, 180);
});

function flyToTrain(lat, lon){
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
  map.getView().animate({ center: ol.proj.fromLonLat([lon, lat]), zoom: 12, duration: 850 });
}

function searchTrains(){
  const query = searchInput.value.trim().toLowerCase();
  if (!query) return;

  for (const train of allTrains){
    const id = displayId(train);
    if (!id || isJunkId(id)) continue;

    const searchable = [
      id,
      train.train_number, train.trainNumber,
      train.trKey, train.loco, train.train_name, train.trainName
    ].filter(Boolean).map(s => String(s).toLowerCase());

    if (searchable.some(s => s.includes(query))){
      flyToTrain(Number(train.lat), Number(train.lon));
      autocompleteList.style.display = 'none';
      return;
    }
  }
  alert('No trains found matching: ' + query);
}

/** Zoom helpers */
const stateBounds = {
  au: [112, -44, 154, -10],
  nsw: [141, -38, 154, -28],
  vic: [141, -40, 150, -34],
  qld: [138, -30, 154, -9],
  sa: [129, -40, 141, -25],
  wa: [112, -36, 129, -13],
  tas: [143, -44, 149, -39],
  nt: [129, -27, 138, -10]
};
function zoomTo(region){
  const bounds = stateBounds[region] || stateBounds.au;
  const extent = ol.proj.transformExtent(bounds, 'EPSG:4326', 'EPSG:3857');
  map.getView().fit(extent, { duration: 900, maxZoom: 10 });
}
function zoomToCurrent(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const center = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]);
    map.getView().animate({ center, zoom: 12, duration: 850 });
  });
}

/** UI events */
document.getElementById('stateSelect').addEventListener('change', e => zoomTo(e.target.value));
document.getElementById('locateBtn').addEventListener('click', zoomToCurrent);
document.getElementById('layersToggleBtn').addEventListener('click', () => {
  const panel = document.getElementById('layersPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('searchBtn').addEventListener('click', searchTrains);
searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchTrains(); });

document.getElementById('trainLayerChk').addEventListener('change', e => trainLayer.setVisible(e.target.checked));
document.getElementById('railLayerChk').addEventListener('change', e => railLayer.setVisible(e.target.checked));
document.getElementById('stationsLayerChk').addEventListener('change', e => stationsLayer.setVisible(e.target.checked));
document.getElementById('covTelstraChk').addEventListener('change', e => covTelstra.setVisible(e.target.checked));
document.getElementById('covOptusChk').addEventListener('change', e => covOptus.setVisible(e.target.checked));
document.getElementById('covTPGChk').addEventListener('change', e => covTPG.setVisible(e.target.checked));
document.getElementById('covAllChk').addEventListener('change', e => covAll.setVisible(e.target.checked));

/** Start */
loadRealTrains();
setInterval(loadRealTrains, 30000);
zoomTo('au');
</script>
</body>
</html>
