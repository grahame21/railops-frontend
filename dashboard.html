<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="https://unpkg.com/ol@9.1.0/ol.css?v=1" />
  <style>
    html, body { margin:0; height:100%; background:#0b1220; }
    #map { position:fixed; inset:0; }
    .hud{
      position:fixed; top:10px; left:10px; z-index:1001;
      background:rgba(18,26,43,.92); color:#e8eefc;
      border:1px solid rgba(255,255,255,.15); border-radius:12px;
      padding:10px 12px; font:13px system-ui,-apple-system,Segoe UI,Roboto,Arial;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      display:grid; gap:6px;
    }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    label{display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none}
    .chip{display:inline-flex; align-items:center; gap:6px; padding:6px 8px; border-radius:10px; border:1px solid rgba(255,255,255,.18); background:rgba(0,0,0,.25)}
    .chip i{display:inline-block; width:12px; height:12px; border-radius:2px}
    .telstra { background:#1f6feb }
    .mvno   { background:#7d8590 }
    .optus  { background:#ffd33d }
    .voda   { background:#ff7b72 }
    #logout{
      position:fixed; top:10px; right:10px; z-index:1002;
      padding:8px 12px; border-radius:10px; cursor:pointer;
      border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.5); color:#e8eefc;
    }
    #badge{
      position:fixed; right:10px; bottom:10px; z-index:1003;
      background:rgba(18,26,43,.92); color:#e8eefc;
      border:1px solid rgba(255,255,255,.15); border-radius:10px;
      padding:6px 8px; font:12px system-ui; max-width:70vw; word-wrap:break-word;
    }
    .ok{color:#7bd88f} .bad{color:#ffb3b3}
    #err{
      position:fixed; left:10px; right:10px; bottom:10px; z-index:2000; display:none;
      background:#3b0d0d; color:#ffe9e9;
      border:2px solid #ff8c8c; border-radius:10px;
      padding:10px 12px; font:13px/1.3 ui-monospace,Consolas,Menlo,monospace; white-space:pre-wrap;
    }
    .btn { padding:6px 10px; border-radius:10px; cursor:pointer; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.35); color:#e8eefc; }
  </style>
</head>
<body>
  <!-- Auth guard (allow admin or guest) -->
  <script>
    (function(){
      let ok=false;
      try { const r = JSON.parse(localStorage.getItem('railops_session')||'null')?.role; ok = (r==='admin'||r==='guest'); } catch {}
      if (!ok) location.replace('/login.html');
    })();
  </script>

  <div id="map"></div>

  <div class="hud">
    <div class="row">
      <button class="btn" id="locBtn" title="Center on my location">📍 My location</button>
      <span id="locStatus" style="opacity:.8"></span>
    </div>
    <div class="row">
      <span class="chip"><i class="telstra"></i><label><input type="checkbox" id="telstraToggle" checked>Telstra</label></span>
      <span class="chip"><i class="mvno"></i><label><input type="checkbox" id="mvnoToggle" checked>Telstra MVNO</label></span>
    </div>
    <div class="row">
      <span class="chip"><i class="optus"></i><label><input type="checkbox" id="optusToggle" checked>Optus</label></span>
      <span class="chip"><i class="voda"></i><label><input type="checkbox" id="vodaToggle" checked>Vodafone/TPG (roams on Optus)</label></span>
    </div>
    <div class="row">
      <label><input type="checkbox" id="railsToggle" checked> Rails (OpenRailwayMap)</label>
    </div>
  </div>

  <button id="logout" onclick="localStorage.removeItem('railops_session');location.href='/login.html'">Logout</button>

  <div id="badge">Booting…</div>
  <div id="err"></div>

  <script src="https://unpkg.com/ol@9.1.0/dist/ol.js?v=1" defer></script>
  <script>
    // On-screen error box
    window.addEventListener('error', e=>{
      const box=document.getElementById('err'); box.style.display='block';
      box.textContent='JavaScript error: '+(e?.error?.stack||e.message||String(e));
    });

    window.addEventListener('load', () => {
      const badge=document.getElementById('badge');
      const say=(t,cls)=>{ badge.textContent=t; badge.className=''; if(cls) badge.classList.add(cls); };

      if(!(window.ol && ol.Map)){
        say('OpenLayers failed to load (CSP/content blocker)', 'bad');
        return;
      }

      // ---------- Base + Rails via built-in Netlify Functions ----------
      const base = new ol.layer.Tile({
        source: new ol.source.XYZ({ url: '/.netlify/functions/osm/{z}/{x}/{y}.png', maxZoom: 19 }),
        zIndex: 0
      });

      const rails = new ol.layer.Tile({
        source: new ol.source.XYZ({ url: '/.netlify/functions/orm/standard/{z}/{x}/{y}.png', maxZoom: 19 }),
        opacity: 0.9, visible: true, zIndex: 10
      });

      // ---------- Demo carrier overlays (vector placeholders) ----------
      const poly = (minLon,minLat,maxLon,maxLat) => ol.geom.Polygon.fromExtent(
        ol.proj.transformExtent([minLon,minLat,maxLon,maxLat], 'EPSG:4326', 'EPSG:3857')
      );
      const rgba = (hex, a) => {
        const c = hex.replace('#','');
        const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
        return `rgba(${r},${g},${b},${a})`;
      };
      const makeCarrierLayer = (features, strokeHex, fillA, z) => new ol.layer.Vector({
        source: new ol.source.Vector({ features }),
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({ color: strokeHex, width: 1.5 }),
          fill: new ol.style.Fill({ color: rgba(strokeHex, fillA) })
        }),
        zIndex: z
      });

      const telstraLayer = makeCarrierLayer([
        new ol.Feature(poly(144.5,-38.5,145.5,-37.5)),
        new ol.Feature(poly(150.5,-34.2,151.5,-33.5)),
        new ol.Feature(poly(138.3,-35.2,138.9,-34.7))
      ], '#3aa0ff', 0.20, 6);

      const mvnoLayer = makeCarrierLayer([
        new ol.Feature(poly(144.6,-38.4,145.4,-37.6)),
        new ol.Feature(poly(150.6,-34.15,151.45,-33.6))
      ], '#9aa3ad', 0.18, 5);

      const optusLayer = makeCarrierLayer([
        new ol.Feature(poly(144.7,-38.45,145.6,-37.55)),
        new ol.Feature(poly(150.4,-34.25,151.6,-33.45))
      ], '#ffd33d', 0.20, 7);

      const vodaLayer = makeCarrierLayer([
        new ol.Feature(poly(144.8,-38.42,145.55,-37.58)),
        new ol.Feature(poly(150.55,-34.2,151.55,-33.55))
      ], '#ff7b72', 0.18, 8);

      const map = new ol.Map({
        target: 'map',
        layers: [base, rails, telstraLayer, mvnoLayer, optusLayer, vodaLayer],
        view: new ol.View({
          center: ol.proj.fromLonLat([133.7751, -25.2744]),
          zoom: 4.8,
          constrainRotation: 0
        })
      });

      // UI toggles
      document.getElementById('railsToggle').onchange   = e => rails.setVisible(e.target.checked);
      document.getElementById('telstraToggle').onchange = e => telstraLayer.setVisible(e.target.checked);
      document.getElementById('mvnoToggle').onchange    = e => mvnoLayer.setVisible(e.target.checked);
      document.getElementById('optusToggle').onchange   = e => optusLayer.setVisible(e.target.checked);
      document.getElementById('vodaToggle').onchange    = e => vodaLayer.setVisible(e.target.checked);

      // My location (live)
      const locStatus = document.getElementById('locStatus');
      const locLayer = new ol.layer.Vector({ source: new ol.source.Vector(), zIndex: 20 });
      map.addLayer(locLayer);
      const locFeature = new ol.Feature();
      locFeature.setStyle(new ol.style.Style({
        image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color: '#00e6a8' }), stroke: new ol.style.Stroke({ color:'#003b2f', width:2 }) })
      }));
      const accFeature = new ol.Feature();
      accFeature.setStyle(new ol.style.Style({
        stroke: new ol.style.Stroke({ color: '#00e6a8', width: 1 }),
        fill: new ol.style.Fill({ color: 'rgba(0,230,168,0.10)' })
      }));
      locLayer.getSource().addFeatures([accFeature, locFeature]);

      function startLocation(){
        if (!navigator.geolocation){ locStatus.textContent='Geolocation not supported'; return; }
        locStatus.textContent='Locating…';
        navigator.geolocation.watchPosition((pos)=>{
          const { latitude, longitude, accuracy } = pos.coords;
          const coord = ol.proj.fromLonLat([longitude, latitude]);
          locFeature.setGeometry(new ol.geom.Point(coord));
          const meters = Math.max(accuracy, 25);
          const circle = ol.geom.Polygon.circular(ol.proj.get('EPSG:3857'), coord, meters, 64);
          accFeature.setGeometry(circle);
          map.getView().animate({ center: coord, duration: 250 });
          locStatus.textContent = `Lat ${latitude.toFixed(5)}, Lon ${longitude.toFixed(5)} (±${Math.round(accuracy)} m)`;
        }, (err)=>{ locStatus.textContent='Location error: '+(err?.message||err); }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
      }
      document.getElementById('locBtn').onclick = startLocation;

      // Status + iOS size nudges
      map.once('rendercomplete', ()=> say('Canvas rendered ✔︎','ok'));
      base.getSource().on('tileloadend',  ()=> say('Base tiles loaded ✔︎','ok'));
      base.getSource().on('tileloaderror',()=> say('OSM proxy tile failed — check osm.js logs','bad'));
      rails.getSource().on('tileloadend', ()=> say('Rails tiles loaded ✔︎','ok'));
      rails.getSource().on('tileloaderror',()=> say('Rails proxy tile failed — check orm.js logs','bad'));
      setTimeout(()=> map.updateSize(), 60);
      setTimeout(()=> map.updateSize(), 800);
    });
  </script>
</body>
</html>
