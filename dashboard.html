<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>RailOps — Live Map</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #06101d;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .top-ui {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      width: min(410px, calc(100vw - 24px));
      z-index: 2000;
      background: rgba(6, 16, 29, 0.90);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(86, 142, 255, 0.45);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
      color: #fff;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #f6a623;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .control {
      flex: 1;
      min-width: 0;
      background: #1f4578;
      color: #fff;
      border: 2px solid #4f7fcb;
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      outline: none;
    }

    select.control,
    button.control {
      appearance: none;
      -webkit-appearance: none;
    }

    .big-btn {
      cursor: pointer;
      text-align: center;
    }

    .panel-btn {
      width: 100%;
      background: #244a7e;
      color: #fff;
      border: 2px solid #4f7fcb;
      border-radius: 18px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .search-row {
      display: flex;
      gap: 0;
      margin-bottom: 10px;
    }

    #searchInput {
      flex: 1;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      font-weight: 500;
    }

    #searchBtn {
      width: 62px;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      background: #1559d6;
      cursor: pointer;
      font-size: 24px;
      border-left: none;
    }

    .status-line {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .pill-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      background: #14345d;
      border: 2px solid #4f7fcb;
      color: #fff;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 800;
    }

    .pill.primary {
      background: #1559d6;
      min-width: 90px;
      text-align: center;
    }

    .dropdown-panel {
      display: none;
      margin-top: -2px;
      margin-bottom: 10px;
      background: rgba(14, 32, 57, 0.96);
      border: 1px solid rgba(86, 142, 255, 0.45);
      border-radius: 18px;
      padding: 10px;
      max-height: 260px;
      overflow-y: auto;
    }

    .dropdown-panel.show {
      display: block;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #173a67;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      color: #fff;
      font-weight: 700;
    }

    .menu-item:last-child {
      margin-bottom: 0;
    }

    .menu-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .menu-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #4f7fcb;
      background: #1d4ed8;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .menu-actions button.secondary {
      background: #213858;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #173a67;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .layer-item input[type="checkbox"] {
      transform: scale(1.2);
    }

    .popup {
      position: absolute;
      background: rgba(0,0,0,0.92);
      color: #f6a623;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      min-width: 220px;
      font-size: 13px;
      font-weight: 700;
      z-index: 3000;
      pointer-events: none;
      white-space: normal;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .popup .small {
      color: #fff;
      font-weight: 600;
      display: block;
      margin-top: 4px;
      line-height: 1.35;
    }

    .ol-zoom {
      top: auto !important;
      bottom: 18px !important;
      right: 12px !important;
      left: auto !important;
    }

    @media (max-width: 600px) {
      .top-ui {
        width: calc(100vw - 16px);
        left: 8px;
        top: max(8px, env(safe-area-inset-top));
        padding: 10px;
      }

      .brand {
        font-size: 16px;
      }

      .control,
      .panel-btn {
        font-size: 15px;
        padding: 12px 13px;
      }

      .pill {
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="top-ui">
    <div class="brand">🚂 RailOps</div>

    <div class="row">
      <select id="stateSelect" class="control">
        <option value="AU">🇦🇺 Australia</option>
        <option value="NSW">NSW</option>
        <option value="VIC">VIC</option>
        <option value="QLD">QLD</option>
        <option value="SA">SA</option>
        <option value="WA">WA</option>
        <option value="TAS">TAS</option>
        <option value="NT">NT</option>
        <option value="ACT">ACT</option>
      </select>

      <button id="locBtn" class="control big-btn">📍 My Location</button>
    </div>

    <button id="layersBtn" class="panel-btn">🗺️ Layers</button>
    <div id="layersPanel" class="dropdown-panel">
      <div class="layer-item">
        <span>Live Trains</span>
        <input type="checkbox" id="toggleTrains" checked />
      </div>
      <div class="layer-item">
        <span>Rail Lines</span>
        <input type="checkbox" id="toggleRail" checked />
      </div>
      <div class="layer-item">
        <span>Stations</span>
        <input type="checkbox" id="toggleStations" />
      </div>
      <div class="layer-item">
        <span>Telstra</span>
        <input type="checkbox" id="toggleTelstra" />
      </div>
      <div class="layer-item">
        <span>Optus</span>
        <input type="checkbox" id="toggleOptus" />
      </div>
      <div class="layer-item">
        <span>Vodafone / TPG</span>
        <input type="checkbox" id="toggleVodafone" />
      </div>
      <div class="layer-item">
        <span>All Networks</span>
        <input type="checkbox" id="toggleAllCoverage" />
      </div>
    </div>

    <button id="hideOperatorsBtn" class="panel-btn">🚫 Hide Operators (0)</button>
    <div id="operatorMenu" class="dropdown-panel"></div>

    <div class="search-row">
      <input
        id="searchInput"
        class="control"
        type="text"
        placeholder="Search train, loco, operator, town, origin, destination"
      />
      <button id="searchBtn" class="control">🔎</button>
    </div>

    <div id="lastUpdated" class="status-line">Last: --</div>

    <div class="pill-row">
      <div id="statusNote" class="pill">loading...</div>
      <div id="trainCount" class="pill primary">0</div>
    </div>
  </div>

  <div id="popup" class="popup" style="display:none;"></div>

  <script>
    const TRAINS_URL = "https://raw.githubusercontent.com/grahame21/railops-backend/main/trains.json";

    const stateViews = {
      AU: { center: [134.5, -25.5], zoom: 4.4 },
      NSW: { center: [147.0, -32.3], zoom: 6.2 },
      VIC: { center: [144.8, -37.0], zoom: 6.5 },
      QLD: { center: [145.5, -21.0], zoom: 5.3 },
      SA: { center: [135.8, -30.0], zoom: 5.8 },
      WA: { center: [121.0, -26.0], zoom: 5.0 },
      TAS: { center: [146.7, -42.0], zoom: 7.0 },
      NT: { center: [133.0, -19.5], zoom: 5.2 },
      ACT: { center: [149.13, -35.28], zoom: 9.0 }
    };

    let map;
    let popupOverlay;
    let trainSource;
    let trainLayer;
    let railLayer;
    let stationLayer;
    let telstraLayer;
    let optusLayer;
    let vodafoneLayer;
    let allCoverageLayer;

    let allTrains = [];
    let lastGoodTrains = [];
    let hiddenOperators = new Set();

    function norm(v) {
      return String(v || "").trim().toUpperCase();
    }

    function formatLocalTime(iso) {
      if (!iso) return "--";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString("en-AU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
    }

    function getLat(train) {
      return Number(
        train.lat ?? train.latitude ?? train.Latitude ?? train.y ?? null
      );
    }

    function getLon(train) {
      return Number(
        train.lon ?? train.lng ?? train.longitude ?? train.Longitude ?? train.x ?? null
      );
    }

    function getTrainLabel(train) {
      const loco =
        train.loco ||
        train.loco_number ||
        train.locoNumber ||
        train.unit ||
        train.unit_number ||
        train.unitNumber ||
        train.name ||
        train.label ||
        "";

      const trainId =
        train.train_id ||
        train.trainId ||
        train.train_number ||
        train.trainNumber ||
        train.service ||
        train.service_number ||
        train.serviceNumber ||
        train.id ||
        train.train_name ||
        "";

      const a = String(loco || "").trim();
      const b = String(trainId || "").trim();

      if (a && b && a !== b) return `${a} • ${b}`;
      return a || b || "Unknown";
    }

    function getOperatorName(train) {
      const direct =
        train.operator ||
        train.Operator ||
        train.company ||
        train.owner ||
        train.network ||
        train.brand ||
        train.region ||
        "";

      let op = norm(direct);

      if (op) {
        if (op.includes("TNSW")) return "TNSW";
        if (op === "PN" || op.includes("PACIFIC NATIONAL")) return "PACIFIC NATIONAL";
        if (op.includes("AURIZON")) return "AURIZON";
        if (op.includes("SCT")) return "SCT";
        if (op.includes("SSR")) return "SSR";
        if (op.includes("QUBE")) return "QUBE";
        if (op.includes("FREIGHTLINER")) return "FREIGHTLINER";
        return op;
      }

      const text = [
        getTrainLabel(train),
        train.description || "",
        train.origin || "",
        train.destination || "",
        train.current_location || "",
        train.location || "",
        train.town || ""
      ].join(" ").toUpperCase();

      if (text.includes("TNSW")) return "TNSW";
      if (text.includes("PACIFIC NATIONAL") || text.includes(" PN ")) return "PACIFIC NATIONAL";
      if (text.includes("AURIZON")) return "AURIZON";
      if (text.includes("SCT")) return "SCT";
      if (text.includes("SSR")) return "SSR";
      if (text.includes("QUBE")) return "QUBE";
      if (text.includes("FREIGHTLINER")) return "FREIGHTLINER";

      const first = getTrainLabel(train).toUpperCase().split(/[\s•-]+/).find(Boolean) || "";
      if (first && first.length <= 14) return first;

      return "UNKNOWN";
    }

    function isHiddenByOperator(train) {
      return hiddenOperators.has(getOperatorName(train));
    }

    function getOperatorList(trains) {
      const set = new Set();
      for (const t of trains) {
        const op = getOperatorName(t);
        if (op && op !== "UNKNOWN") set.add(op);
      }
      return Array.from(set).sort((a, b) => a.localeCompare(b));
    }

    function updateHideButtonCount() {
      document.getElementById("hideOperatorsBtn").textContent =
        `🚫 Hide Operators (${hiddenOperators.size})`;
    }

    function renderOperatorMenu() {
      const menu = document.getElementById("operatorMenu");
      const operators = getOperatorList(allTrains);

      menu.innerHTML = "";

      if (!operators.length) {
        menu.innerHTML = `<div class="menu-item">No operators found</div>`;
        return;
      }

      const actions = document.createElement("div");
      actions.className = "menu-actions";

      const hideSelected = document.createElement("button");
      hideSelected.textContent = "Apply";
      hideSelected.onclick = () => {
        refreshTrainLayer();
        updateHideButtonCount();
      };

      const showAll = document.createElement("button");
      showAll.textContent = "Show all";
      showAll.className = "secondary";
      showAll.onclick = () => {
        hiddenOperators.clear();
        renderOperatorMenu();
        refreshTrainLayer();
        updateHideButtonCount();
      };

      actions.appendChild(hideSelected);
      actions.appendChild(showAll);
      menu.appendChild(actions);

      for (const op of operators) {
        const row = document.createElement("label");
        row.className = "menu-item";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = hiddenOperators.has(op);
        cb.onchange = () => {
          if (cb.checked) hiddenOperators.add(op);
          else hiddenOperators.delete(op);
          updateHideButtonCount();
          refreshTrainLayer();
        };

        const text = document.createElement("span");
        text.textContent = op;

        row.appendChild(cb);
        row.appendChild(text);
        menu.appendChild(row);
      }
    }

    function buildTrainStyle(feature) {
      const train = feature.get("trainData");
      const label = feature.get("labelText");
      const zoom = map.getView().getZoom() || 0;

      let showText = true;
      if (zoom < 7.2 && allTrains.length > 500) showText = false;
      if (zoom < 8.0 && allTrains.length > 900) showText = false;

      return new ol.style.Style({
        image: new ol.style.Circle({
          radius: 5,
          fill: new ol.style.Fill({ color: "#f6a623" }),
          stroke: new ol.style.Stroke({ color: "#ffffff", width: 1.5 })
        }),
        text: showText ? new ol.style.Text({
          text: label,
          offsetY: -18,
          font: "bold 12px Arial",
          fill: new ol.style.Fill({ color: "#f6a623" }),
          backgroundFill: new ol.style.Fill({ color: "rgba(0,0,0,0.92)" }),
          padding: [5, 8, 5, 8]
        }) : null
      });
    }

    function createTrainFeature(train) {
      const lat = getLat(train);
      const lon = getLon(train);

      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;

      const feature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
        trainData: train,
        labelText: getTrainLabel(train),
        operatorName: getOperatorName(train)
      });

      feature.setStyle(buildTrainStyle(feature));
      return feature;
    }

    function refreshTrainLayer() {
      if (!trainSource) return;

      trainSource.clear();

      const visible = allTrains.filter(t => !isHiddenByOperator(t));
      for (const train of visible) {
        const f = createTrainFeature(train);
        if (f) trainSource.addFeature(f);
      }

      document.getElementById("trainCount").textContent = String(visible.length);
    }

    function zoomToState(code) {
      const viewDef = stateViews[code] || stateViews.AU;
      map.getView().animate({
        center: ol.proj.fromLonLat(viewDef.center),
        zoom: viewDef.zoom,
        duration: 500
      });
    }

    async function searchLocation(query) {
      const q = String(query || "").trim();
      if (!q) return null;

      const matches = allTrains.filter(t => {
        const hay = [
          getTrainLabel(t),
          getOperatorName(t),
          t.origin || "",
          t.destination || "",
          t.current_location || "",
          t.location || "",
          t.town || "",
          t.suburb || "",
          t.state || ""
        ].join(" ").toUpperCase();

        return hay.includes(q.toUpperCase());
      });

      if (matches.length) {
        const first = matches[0];
        const lat = getLat(first);
        const lon = getLon(first);
        if (Number.isFinite(lat) && Number.isFinite(lon)) {
          map.getView().animate({
            center: ol.proj.fromLonLat([lon, lat]),
            zoom: 10,
            duration: 600
          });
          return true;
        }
      }

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(q + ", Australia")}`;
        const res = await fetch(url, {
          headers: {
            "Accept": "application/json"
          }
        });
        const data = await res.json();
        if (Array.isArray(data) && data.length) {
          const place = data[0];
          map.getView().animate({
            center: ol.proj.fromLonLat([Number(place.lon), Number(place.lat)]),
            zoom: 11,
            duration: 700
          });
          return true;
        }
      } catch (e) {}

      return false;
    }

    function showPopup(feature, coordinate) {
      const train = feature.get("trainData");
      const label = getTrainLabel(train);
      const operator = getOperatorName(train);

      const speed = train.speed || train.Speed || "--";
      const origin = train.origin || train.from || "--";
      const destination = train.destination || train.to || "--";
      const location = train.current_location || train.location || train.town || train.suburb || "--";
      const updated = train.last_updated || train.lastUpdated || train.updated || "--";

      const el = document.getElementById("popup");
      el.innerHTML = `
        <div>${label}</div>
        <span class="small">Operator: ${operator}</span>
        <span class="small">Speed: ${speed}</span>
        <span class="small">Origin: ${origin}</span>
        <span class="small">Destination: ${destination}</span>
        <span class="small">Location: ${location}</span>
        <span class="small">Updated: ${updated}</span>
      `;
      el.style.display = "block";
      popupOverlay.setPosition(coordinate);
    }

    function hidePopup() {
      document.getElementById("popup").style.display = "none";
      popupOverlay.setPosition(undefined);
    }

    async function loadTrains() {
      try {
        const res = await fetch(`${TRAINS_URL}?t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();

        const trains = Array.isArray(data) ? data : (data.trains || []);
        const updated = data.lastUpdated || data.last_updated || new Date().toISOString();

        allTrains = trains;
        lastGoodTrains = trains;

        document.getElementById("lastUpdated").textContent = `Last: ${formatLocalTime(updated)}`;
        document.getElementById("statusNote").textContent = `ok - ${trains.length} trains`;

        renderOperatorMenu();
        updateHideButtonCount();
        refreshTrainLayer();
      } catch (err) {
        if (lastGoodTrains.length) {
          allTrains = lastGoodTrains;
          document.getElementById("statusNote").textContent = `error - using last good data`;
          renderOperatorMenu();
          updateHideButtonCount();
          refreshTrainLayer();
        } else {
          document.getElementById("statusNote").textContent = "failed to load";
          document.getElementById("trainCount").textContent = "0";
        }
      }
    }

    function makeArcGISTileLayer(showId) {
      return new ol.layer.Tile({
        visible: false,
        source: new ol.source.TileArcGISRest({
          url: "https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer",
          params: {
            LAYERS: `show:${showId}`,
            FORMAT: "png32",
            TRANSPARENT: true
          }
        }),
        opacity: 0.55
      });
    }

    function initMap() {
      const osm = new ol.layer.Tile({
        source: new ol.source.OSM()
      });

      railLayer = new ol.layer.Tile({
        visible: true,
        source: new ol.source.XYZ({
          url: "https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png"
        }),
        opacity: 0.85
      });

      stationLayer = new ol.layer.Tile({
        visible: false,
        source: new ol.source.XYZ({
          url: "https://{a-c}.tiles.openrailwaymap.org/stations/{z}/{x}/{y}.png"
        }),
        opacity: 0.95
      });

      telstraLayer = makeArcGISTileLayer(25);
      optusLayer = makeArcGISTileLayer(15);
      vodafoneLayer = makeArcGISTileLayer(33);
      allCoverageLayer = makeArcGISTileLayer(4);

      trainSource = new ol.source.Vector();

      trainLayer = new ol.layer.Vector({
        source: trainSource,
        visible: true,
        updateWhileAnimating: true,
        updateWhileInteracting: true
      });

      popupOverlay = new ol.Overlay({
        element: document.getElementById("popup"),
        offset: [14, 0],
        positioning: "bottom-left",
        stopEvent: false
      });

      map = new ol.Map({
        target: "map",
        layers: [
          osm,
          railLayer,
          stationLayer,
          telstraLayer,
          optusLayer,
          vodafoneLayer,
          allCoverageLayer,
          trainLayer
        ],
        overlays: [popupOverlay],
        view: new ol.View({
          center: ol.proj.fromLonLat(stateViews.AU.center),
          zoom: stateViews.AU.zoom,
          minZoom: 3,
          maxZoom: 18
        }),
        controls: ol.control.defaults()
      });

      map.on("pointermove", function(evt) {
        const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
        if (feature && feature.get("trainData")) {
          showPopup(feature, evt.coordinate);
          map.getTargetElement().style.cursor = "pointer";
        } else {
          hidePopup();
          map.getTargetElement().style.cursor = "";
        }
      });

      map.on("click", function(evt) {
        const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
        if (feature && feature.get("trainData")) {
          showPopup(feature, evt.coordinate);
        } else {
          hidePopup();
        }
      });

      map.getView().on("change:resolution", () => {
        trainSource.getFeatures().forEach(f => f.setStyle(buildTrainStyle(f)));
      });
    }

    function setupUI() {
      const layersBtn = document.getElementById("layersBtn");
      const layersPanel = document.getElementById("layersPanel");
      const hideOperatorsBtn = document.getElementById("hideOperatorsBtn");
      const operatorMenu = document.getElementById("operatorMenu");

      layersBtn.addEventListener("click", () => {
        layersPanel.classList.toggle("show");
        operatorMenu.classList.remove("show");
      });

      hideOperatorsBtn.addEventListener("click", () => {
        operatorMenu.classList.toggle("show");
        layersPanel.classList.remove("show");
        renderOperatorMenu();
      });

      document.getElementById("toggleTrains").addEventListener("change", e => {
        trainLayer.setVisible(e.target.checked);
      });

      document.getElementById("toggleRail").addEventListener("change", e => {
        railLayer.setVisible(e.target.checked);
      });

      document.getElementById("toggleStations").addEventListener("change", e => {
        stationLayer.setVisible(e.target.checked);
      });

      document.getElementById("toggleTelstra").addEventListener("change", e => {
        telstraLayer.setVisible(e.target.checked);
      });

      document.getElementById("toggleOptus").addEventListener("change", e => {
        optusLayer.setVisible(e.target.checked);
      });

      document.getElementById("toggleVodafone").addEventListener("change", e => {
        vodafoneLayer.setVisible(e.target.checked);
      });

      document.getElementById("toggleAllCoverage").addEventListener("change", e => {
        allCoverageLayer.setVisible(e.target.checked);
      });

      document.getElementById("stateSelect").addEventListener("change", e => {
        zoomToState(e.target.value);
      });

      document.getElementById("locBtn").addEventListener("click", () => {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(
          pos => {
            const lon = pos.coords.longitude;
            const lat = pos.coords.latitude;
            map.getView().animate({
              center: ol.proj.fromLonLat([lon, lat]),
              zoom: 11,
              duration: 700
            });
          },
          () => {}
        );
      });

      document.getElementById("searchBtn").addEventListener("click", async () => {
        const q = document.getElementById("searchInput").value;
        await searchLocation(q);
      });

      document.getElementById("searchInput").addEventListener("keydown", async (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          await searchLocation(e.target.value);
        }
      });
    }

    initMap();
    setupUI();
    loadTrains();
    setInterval(loadTrains, 30000);
  </script>
</body>
</html>
