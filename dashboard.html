<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Train Tracker 2.0 — Path Picker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <style>
    html,body{height:100%;margin:0;background:#f6f7fb;font:14px system-ui,sans-serif}
    #panel{position:absolute;z-index:9999;left:10px;top:10px;background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.08);max-width:720px}
    #panel *{font:14px system-ui,sans-serif}
    #map{width:100%;height:100vh}
    .tt-popup{user-select:text;background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);border:1px solid rgba(0,0,0,.1);min-width:180px;position:relative}
    .tt-popup:after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-width:8px 8px 0 8px;border-style:solid;border-color:#fff transparent transparent transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.1))}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  </style>
</head>
<body>
  <div id="panel">
    <div><b>Data source</b>:
      <span class="mono" id="dataUrl">https://brilliant-crepe-a70c64.netlify.app/trains.json</span>
      <button id="refreshBtn">Refresh</button>
    </div>
    <div style="margin-top:8px">
      <b>Pick array:</b>
      <select id="pathSelect" style="min-width:420px"></select>
      <button id="useBtn">Use</button>
      <span id="summary" class="mono" style="margin-left:8px;color:#444"></span>
    </div>
    <div id="sample" class="mono" style="margin-top:6px;color:#666;white-space:pre-wrap"></div>
  </div>

  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  <script>
    // ===== Config =====
    const DATA_URL = "https://brilliant-crepe-a70c64.netlify.app/trains.json";
    const REFRESH_MS = 30000;

    // ===== Map =====
    const map = new ol.Map({
      target: 'map',
      layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
      view: new ol.View({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 5 })
    });
    const source = new ol.source.Vector();
    const layer  = new ol.layer.Vector({ source, zIndex:20 });
    map.addLayer(layer);

    // Popup
    const popupEl = document.createElement("div");
    popupEl.className = "tt-popup";
    const popup = new ol.Overlay({ element: popupEl, autoPan:{animation:{duration:250}}, offset:[0,-12], positioning:"bottom-center" });
    map.addOverlay(popup);
    map.on("singleclick",(evt)=>{
      let f=null; map.forEachFeatureAtPixel(evt.pixel,(feat,lyr)=>{ if(lyr===layer) f=feat; });
      if(!f){ popup.setPosition(undefined); return; }
      const p=f.getProperties();
      popupEl.innerHTML = `<div style="font-weight:700">${p.label||p.id||"Unknown"}</div>
        <div>${p.operator||""}</div>
        <div>Speed: ${p.speed??"?"} | Heading: ${Math.round(p.heading??0)}°</div>
        <div>${p.lat?.toFixed?.(5)??"?"}, ${p.lon?.toFixed?.(5)??"?"}</div>`;
      popup.setPosition(f.getGeometry().getCoordinates());
    });

    // ===== UI =====
    const $url = document.getElementById('dataUrl');
    const $sel = document.getElementById('pathSelect');
    const $summary = document.getElementById('summary');
    const $sample = document.getElementById('sample');
    document.getElementById('refreshBtn').onclick = () => loadAndList();
    document.getElementById('useBtn').onclick = () => renderSelected();
    $url.textContent = DATA_URL;

    // ===== JSON exploration =====
    const has = (o,k)=> !!(o && typeof o==="object" && k in o);
    const num = v => (v==null?null : Number.isFinite(+v)? +v : null);
    const get = (o,...ks)=> ks.find(k=>has(o,k)) && o[ks.find(k=>has(o,k))];

    function deepArrays(obj, path="$", out=[]){
      if (Array.isArray(obj)) { out.push({path, arr:obj}); return out; }
      if (obj && typeof obj === "object") {
        for (const [k,v] of Object.entries(obj)) deepArrays(v, `${path}.${k}`, out);
      }
      return out;
    }

    function prettySample(item){
      if (!item || typeof item!=="object") return String(item);
      const keys = Object.keys(item).slice(0,12).join(", ");
      return `keys: ${keys}`;
    }

    // ===== Lat/Lon extraction (handles lots of shapes) =====
    function latLonFromAny(obj){
      if (!obj || typeof obj!=="object") return [null,null];
      // direct
      let lat = get(obj,"lat","Lat","latitude","Latitude","LatDD","LatitudeDD");
      let lon = get(obj,"lon","Lon","lng","Lng","longitude","Longitude","LonDD","LongitudeDD","Long","LONG");
      lat = num(lat); lon = num(lon); if (lat!=null && lon!=null) return [lat,lon];
      // nested
      for (const k of ["position","pos","coords","coord","location","geo","Geo","geometry"]){
        const v = obj[k];
        if (!v || typeof v!=="object") continue;
        let nlat = get(v,"lat","Lat","latitude","Latitude","LatDD","LatitudeDD");
        let nlon = get(v,"lon","Lon","lng","Lng","longitude","Longitude","LonDD","LongitudeDD","Long","LONG");
        nlat = num(nlat); nlon = num(nlon); if (nlat!=null && nlon!=null) return [nlat,nlon];
        if (Array.isArray(v) && v.length>=2){
          const a=num(v[0]), b=num(v[1]); if (a!=null && b!=null){ const looksLon=Math.abs(a)>=60&&Math.abs(a)<=180; return looksLon?[b,a]:[a,b]; }
        }
        if (v.type==="Point" && Array.isArray(v.coordinates)){ const [lo,la]=v.coordinates; return [num(la),num(lo)]; }
      }
      if (obj.type==="Feature" && obj.geometry?.type==="Point" && Array.isArray(obj.geometry.coordinates)){
        const [lo,la]=obj.geometry.coordinates; return [num(la),num(lo)];
      }
      return [null,null];
    }

    const headOf = r => num(get(r,"heading","Heading","bearing","Bearing","course","Course","Direction","dir")) ?? 0;
    const speedOf= r => num(get(r,"speed","Speed","velocity","Velocity","kmh","KMH","kph","KPH"));
    const idOf   = (r,i)=> get(r,"id","ID","Id","locoId","LocoId","LocomotiveId","Unit","Name","ServiceNumber") ?? `train_${i}`;
    const labelOf= r => get(r,"label","Label","title","Title","loco","Loco","Locomotive","Service","ServiceNumber","Operator","operator") ?? "";
    const opOf   = r => get(r,"operator","Operator","company","Company","Owner","owner") ?? "";

    function normalize(rec,i){
      const [la,lo] = latLonFromAny(rec);
      return { id:idOf(rec,i), lat:la, lon:lo, heading:headOf(rec), speed:speedOf(rec), label:labelOf(rec), operator:opOf(rec) };
    }

    function styleFor(hd){
      return new ol.style.Style({
        image:new ol.style.RegularShape({
          points:3, radius:10, rotation:(hd*Math.PI)/180,
          fill:new ol.style.Fill({color:[0,120,255,0.9]}),
          stroke:new ol.style.Stroke({color:[0,0,0,0.6], width:1})
        })
      });
    }

    function draw(trains){
      source.clear();
      trains.forEach(t=>{
        if (t.lat==null || t.lon==null) return;
        const f=new ol.Feature({
          geometry:new ol.geom.Point(ol.proj.fromLonLat([t.lon,t.lat])),
          id:t.id, label:t.label||t.id, operator:t.operator||"", speed:t.speed??null, heading:t.heading??0,
          lon:t.lon, lat:t.lat
        });
        f.setStyle(styleFor(t.heading??0));
        source.addFeature(f);
      });
      $summary.textContent = `✅ Rendering ${trains.length} trains`;
    }

    let lastPayload = null;

    async function loadAndList(){
      $summary.textContent = "Fetching…";
      $sample.textContent = "";
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`, {cache:"no-store"});
      if (!res.ok) { $summary.textContent = `HTTP ${res.status}`; return; }
      const json = await res.json();
      lastPayload = json;

      // Build array list
      const arrays = deepArrays(json);
      // Score arrays: prefer those with lat/lon-looking records
      const scored = arrays.map(c=>{
        let s=0; const sample=c.arr.slice(0,8);
        for(const rec of sample){
          const [la,lo]=latLonFromAny(rec||{});
          if (la!=null && lo!=null) s+=5;
          if (rec && (("heading" in rec)||("Heading" in rec)||("bearing" in rec)||("Bearing" in rec))) s+=2;
          if (rec && (("speed" in rec)||("Speed" in rec)||("velocity" in rec)||("Velocity" in rec))) s+=1;
        }
        return { path:c.path, len:c.arr.length, score:s, sample: sample[0] };
      }).sort((a,b)=> b.score-a.score || b.len-a.len);

      // Fill dropdown
      $sel.innerHTML = "";
      scored.forEach((c,i)=>{
        const opt = document.createElement("option");
        opt.value = c.path;
        const sk = c.sample && typeof c.sample==="object" ? Object.keys(c.sample).slice(0,8).join(", ") : String(c.sample);
        opt.textContent = `${c.path}  (len=${c.len}, score=${c.score})  sample: { ${sk} }`;
        $sel.appendChild(opt);
      });

      if (scored.length) {
        $sel.selectedIndex = 0;
        $summary.textContent = `Found ${scored.length} arrays. Pick one above (top is best guess).`;
        $sample.textContent = "";
      } else {
        $summary.textContent = "No arrays found in JSON.";
        $sample.textContent = "";
      }
    }

    function getByPath(root, path){
      if (!path || !path.startsWith("$")) return undefined;
      const parts = path.split(".").slice(1); // drop $
      let cur = root;
      for (const p of parts){
        if (p==="" || p===" ") continue;
        if (!cur || typeof cur!=="object") return undefined;
        cur = cur[p];
      }
      return cur;
    }

    function renderSelected(){
      const path = $sel.value;
      const arr = getByPath(lastPayload, path) || [];
      const trains = arr.map(normalize).filter(r=>r.lat!=null && r.lon!=null);
      draw(trains);
      $sample.textContent = `Using ${path}\nRecords: ${arr.length}\nAfter normalize: ${trains.length}\nFirst record:\n` +
        (arr[0] ? JSON.stringify(arr[0], null, 2).slice(0, 1200) : "(none)");
    }

    // Kick off
    loadAndList();
    setInterval(async ()=>{
      // periodic refresh if we already picked something
      if (!lastPayload) return;
      if (!$sel.value) return;
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`, {cache:"no-store"});
      if (!res.ok) return;
      lastPayload = await res.json();
      renderSelected();
    }, REFRESH_MS);
  </script>
</body>
</html>
