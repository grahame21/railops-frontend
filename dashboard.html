<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RailOps — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- OpenLayers CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #0b0e12;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
    }
    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(20,20,25,0.9);
      padding: 6px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    #toolbar button, #toolbar label {
      background: #1c1f26;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    #status {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(20,20,25,0.9);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="logout">Logout</button>
    <label><input type="checkbox" id="tog-rails" checked> Rails (OpenRailwayMap)</label>
    <label><input type="checkbox" id="tog-telstra" checked> Telstra</label>
    <label><input type="checkbox" id="tog-telstra-mvno" checked> Telstra MVNO</label>
    <label><input type="checkbox" id="tog-optus" checked> Optus</label>
    <label><input type="checkbox" id="tog-voda" checked> Vodafone/TPG</label>
    <button id="btn-au">Recenter AU</button>
    <button id="btn-locate">📍 My location</button>
    <span id="zoomInfo"></span>
  </div>

  <div id="map"></div>
  <div id="status">Booting…</div>

  <!-- OpenLayers JS -->
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>

  <!-- Main JS -->
  <script src="/main.js"></script>
</body>
</html>
