<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Train Tracker 2.0 (Auto-detect v2)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <style>
    html,body{height:100%;margin:0;background:#f6f7fb;font:14px system-ui,sans-serif}
    #status{position:absolute;z-index:9999;left:10px;top:10px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.08);max-width:640px;white-space:pre-wrap}
    #map{width:100%;height:100vh}
    .tt-popup{user-select:text;background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);border:1px solid rgba(0,0,0,.1);min-width:180px;position:relative}
    .tt-popup:after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-width:8px 8px 0 8px;border-style:solid;border-color:#fff transparent transparent transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.1))}
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  <script>
    // ---- CONFIG ----
    const DATA_URL = "https://brilliant-crepe-a70c64.netlify.app/trains.json";
    const REFRESH_MS = 30000;

    // ---- UI helpers ----
    const $status = document.getElementById('status');
    const say = (msg) => { $status.textContent = msg; };

    // ---- Base map ----
    const map = new ol.Map({
      target: 'map',
      layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
      view: new ol.View({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 5 })
    });

    // ---- Train layer ----
    const source = new ol.source.Vector();
    const layer  = new ol.layer.Vector({ source, zIndex:20 });
    map.addLayer(layer);

    // Popup
    const popupEl = document.createElement("div");
    popupEl.className = "tt-popup";
    const popup = new ol.Overlay({ element: popupEl, autoPan:{animation:{duration:250}}, offset:[0,-12], positioning:"bottom-center" });
    map.addOverlay(popup);
    map.on("singleclick",(evt)=>{
      let f=null; map.forEachFeatureAtPixel(evt.pixel,(feat,lyr)=>{ if(lyr===layer) f=feat; });
      if(!f){ popup.setPosition(undefined); return; }
      const p=f.getProperties();
      popupEl.innerHTML = `<div style="font-weight:700">${p.label||p.id||"Unknown"}</div>
        <div>${p.operator||""}</div>
        <div>Speed: ${p.speed??"?"} | Heading: ${Math.round(p.heading??0)}°</div>
        <div>${p.lat?.toFixed?.(5)??"?"}, ${p.lon?.toFixed?.(5)??"?"}</div>`;
      popup.setPosition(f.getGeometry().getCoordinates());
    });

    // ---- Extract + normalize (improved) ----
    const num = v => (v==null?null : Number.isFinite(+v)? +v : null);
    const has = (o,k)=> !!(o && typeof o==="object" && k in o);
    const get = (o,...ks)=> ks.find(k=>has(o,k)) && o[ks.find(k=>has(o,k))];

    // Nested lat/lon detection (handles many shapes)
    function latLonFromAny(obj){
      if (!obj || typeof obj!=="object") return [null,null];

      // 1) Direct fields
      let lat = get(obj,"lat","Lat","latitude","Latitude","LatDD","LatitudeDD");
      let lon = get(obj,"lon","Lon","lng","Lng","longitude","Longitude","LonDD","LongitudeDD","Long","LONG");
      lat = num(lat); lon = num(lon);
      if (lat!=null && lon!=null) return [lat,lon];

      // 2) Nested objects like position/coords/location
      const nestedKeys = ["position","pos","coords","coord","location","geo","Geo","geometry"];
      for (const k of nestedKeys){
        const v = obj[k];
        if (!v || typeof v!=="object") continue;

        // 2a) Nested direct fields
        let nlat = get(v,"lat","Lat","latitude","Latitude","LatDD","LatitudeDD");
        let nlon = get(v,"lon","Lon","lng","Lng","longitude","Longitude","LonDD","LongitudeDD","Long","LONG");
        nlat = num(nlat); nlon = num(nlon);
        if (nlat!=null && nlon!=null) return [nlat,nlon];

        // 2b) Arrays: [lon,lat] or [lat,lon]
        if (Array.isArray(v)) {
          if (v.length>=2){
            // Guess order by magnitude (Australia lon ~ 110..155, lat ~ -45..-10)
            const a = num(v[0]), b = num(v[1]);
            if (a!=null && b!=null){
              // if first looks like lon range, assume [lon,lat], else [lat,lon]
              const looksLon = Math.abs(a) >= 60 && Math.abs(a) <= 180;
              return looksLon ? [b,a] : [a,b];
            }
          }
        }

        // 2c) GeoJSON Point
        if (has(v,"type") && v.type==="Point" && Array.isArray(v.coordinates)) {
          const [lo,la] = v.coordinates;
          return [num(la), num(lo)];
        }
      }

      // 3) GeoJSON Feature
      if (obj.type==="Feature" && obj.geometry?.type==="Point" && Array.isArray(obj.geometry.coordinates)) {
        const [lo,la] = obj.geometry.coordinates;
        return [num(la), num(lo)];
      }

      return [null,null];
    }

    const headOf = r => num(get(r,"heading","Heading","bearing","Bearing","course","Course","Direction","dir")) ?? 0;
    const speedOf= r => num(get(r,"speed","Speed","velocity","Velocity","kmh","KMH","kph","KPH"));
    const idOf   = (r,i)=> get(r,"id","ID","Id","locoId","LocoId","LocomotiveId","Unit","Name","ServiceNumber") ?? `train_${i}`;
    const labelOf= r => get(r,"label","Label","title","Title","loco","Loco","Locomotive","Service","ServiceNumber","Operator","operator") ?? "";
    const opOf   = r => get(r,"operator","Operator","company","Company","Owner","owner") ?? "";

    // Array picking with preferred paths + shallow scan (avoids $.favs)
    const PREFERRED_PATHS = [
      ["ViewPortData","Trains"], ["ViewPortData","Markers"], ["ViewPortData","Items"],
      ["Trains"], ["Markers"], ["Items"], ["Results"], ["data","Trains"], ["data","Markers"]
    ];
    function pickArray(obj){
      // Preferred
      for (const path of PREFERRED_PATHS){
        let cur=obj; let ok=true;
        for(const k of path){ if(!has(cur,k)){ ok=false; break; } cur=cur[k]; }
        if (ok && Array.isArray(cur) && cur.length){ return {arr:cur, path:"$."+path.join(".")}; }
      }
      // Top-level common keys
      for (const k of ["trains","Trains","markers","Markers","items","Items","results","Results","features"]){
        if (Array.isArray(obj?.[k]) && obj[k].length) return {arr:obj[k], path:"$."+k};
      }
      // Wrappers
      if (obj?.type==="FeatureCollection" && Array.isArray(obj.features)) return {arr:obj.features, path:"$.features"};
      if (obj?.data){ const r=pickArray(obj.data); if (r.arr.length) return {arr:r.arr, path:"$.data"+r.path.slice(1)}; }
      if (obj?.payload){ const r=pickArray(obj.payload); if (r.arr.length) return {arr:r.arr, path:"$.payload"+r.path.slice(1)}; }

      // Shallow arrays only (avoid deep side arrays)
      const arrays = Object.entries(obj||{}).filter(([k,v])=>Array.isArray(v));
      let best=null, bestScore=-1, bestName="";
      for (const [name,arr] of arrays){
        let s=0; const sample=arr.slice(0,8);
        for(const rec of sample){
          if (rec && typeof rec==="object"){
            const [la,lo]=latLonFromAny(rec);
            if (la!=null && lo!=null) s+=5;
            if (("heading" in rec)||("Heading" in rec)||("bearing" in rec)||("Bearing" in rec)) s+=2;
            if (("speed" in rec)||("Speed" in rec)||("velocity" in rec)||("Velocity" in rec)) s+=1;
          }
        }
        if (s>bestScore){ bestScore=s; best=arr; bestName=name; }
      }
      return {arr:best||[], path: best? "$."+bestName : "$"};
    }

    function normalize(rec,i){
      const [la,lo] = latLonFromAny(rec);
      return {
        id: idOf(rec,i), lat: la, lon: lo,
        heading: headOf(rec), speed: speedOf(rec),
        label: labelOf(rec), operator: opOf(rec)
      };
    }

    function styleFor(hd){
      return new ol.style.Style({
        image:new ol.style.RegularShape({
          points:3, radius:10, rotation:(hd*Math.PI)/180,
          fill:new ol.style.Fill({color:[0,120,255,0.9]}),
          stroke:new ol.style.Stroke({color:[0,0,0,0.6], width:1})
        })
      });
    }

    function draw(trains){
      source.clear();
      trains.forEach(t=>{
        if (t.lat==null || t.lon==null) return;
        const f=new ol.Feature({
          geometry:new ol.geom.Point(ol.proj.fromLonLat([t.lon,t.lat])),
          id:t.id, label:t.label||t.id, operator:t.operator||"", speed:t.speed??null, heading:t.heading??0,
          lon:t.lon, lat:t.lat
        });
        f.setStyle(styleFor(t.heading??0));
        source.addFeature(f);
      });
      say(`✅ Loaded ${trains.length} trains`);
    }

    async function refresh(){
      try{
        say("Fetching data…");
        const res = await fetch(`${DATA_URL}?t=${Date.now()}`, {cache:"no-store"});
        if(!res.ok){ say(`❌ HTTP ${res.status}`); return; }
        const raw = await res.json();

        const picked = pickArray(raw);
        const arr = picked.arr.map(normalize).filter(r=>r.lat!=null && r.lon!=null);

        // show helpful debug for you
        let sampleKeys = "";
        if (picked.arr.length && typeof picked.arr[0]==="object") {
          sampleKeys = Object.keys(picked.arr[0]).slice(0,12).join(", ");
        }
        say(`Using: ${picked.path}\nRecords: ${picked.arr.length}\nAfter lat/lon normalize: ${arr.length}\nSample keys: ${sampleKeys}`);

        draw(arr);
      }catch(e){
        say(`❌ Error: ${e}`);
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
