<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="https://unpkg.com/ol@9.1.0/ol.css?v=1" />
  <style>
    html, body { margin:0; height:100%; background:#0b1220; }
    #map { position:fixed; inset:0; }
    .hud{
      position:fixed; top:10px; left:10px; z-index:1001;
      background:rgba(18,26,43,.9); color:#e8eefc;
      border:1px solid rgba(255,255,255,.15); border-radius:12px;
      padding:10px 12px; font:13px system-ui,-apple-system,Segoe UI,Roboto,Arial;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    .hud label{display:flex; align-items:center; gap:6px;}
    #logout{
      position:fixed; top:10px; right:10px; z-index:1002;
      padding:8px 12px; border-radius:10px; cursor:pointer;
      border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.5); color:#e8eefc;
    }
    #badge{
      position:fixed; right:10px; bottom:10px; z-index:1003;
      background:rgba(18,26,43,.9); color:#e8eefc;
      border:1px solid rgba(255,255,255,.15); border-radius:10px;
      padding:6px 8px; font:12px system-ui; max-width:70vw; word-wrap:break-word;
    }
    .ok{color:#7bd88f} .bad{color:#ffb3b3}
    #err{
      position:fixed; left:10px; right:10px; bottom:10px; z-index:2000; display:none;
      background:#3b0d0d; color:#ffe9e9;
      border:2px solid #ff8c8c; border-radius:10px;
      padding:10px 12px; font:13px/1.3 ui-monospace,Consolas,Menlo,monospace;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <!-- Auth guard -->
  <script>
    (function(){
      let ok=false;
      try {
        const sess = JSON.parse(localStorage.getItem('railops_session')||'null');
        const r = sess?.role;
        ok = (r==='admin'||r==='guest');
      } catch {}
      if(!ok) location.replace('/login.html');
    })();
  </script>

  <div id="map"></div>

  <div class="hud">
    <label><input type="checkbox" id="rails-toggle" checked> Rails (proxied)</label>
  </div>
  <button id="logout" onclick="localStorage.removeItem('railops_session');location.href='/login.html'">Logout</button>

  <div id="badge">Booting…</div>
  <div id="err"></div>

  <script src="https://unpkg.com/ol@9.1.0/dist/ol.js?v=1" defer></script>
  <script>
    // Show JS errors on-screen
    window.addEventListener('error', e=>{
      const box=document.getElementById('err'); box.style.display='block';
      box.textContent='JavaScript error: '+(e?.error?.stack||e.message||String(e));
    });

    window.addEventListener('load', () => {
      const badge=document.getElementById('badge');
      const say=(t,cls)=>{ badge.textContent=t; badge.className=''; if(cls) badge.classList.add(cls); };

      if(!(window.ol && ol.Map)){
        say('OpenLayers failed to load (CSP/content blocker)', 'bad');
        return;
      }

      try{
        // Base via Netlify function
        const base = new ol.layer.Tile({
          source: new ol.source.XYZ({
            url: '/.netlify/functions/osm/{z}/{x}/{y}.png',
            maxZoom: 19
          }),
          zIndex: 0
        });

        // Rails via Netlify function
        const rails = new ol.layer.Tile({
          source: new ol.source.XYZ({
            url: '/.netlify/functions/orm/standard/{z}/{x}/{y}.png',
            maxZoom: 19
          }),
          opacity: 0.9,
          visible: true,
          zIndex: 10
        });

        const map = new ol.Map({
          target: 'map',
          layers: [base, rails],
          view: new ol.View({
            center: ol.proj.fromLonLat([133.7751, -25.2744]), // Australia
            zoom: 4.8,
            constrainRotation: 0 // keep north-up
          })
        });

        // Toggle rails
        document.getElementById('rails-toggle').onchange = e => rails.setVisible(e.target.checked);

        // Status hooks
        map.once('rendercomplete', ()=> say('Canvas rendered ✔︎','ok'));
        base.getSource().on('tileloadend',  ()=> say('Base tiles loaded ✔︎','ok'));
        base.getSource().on('tileloaderror',()=> say('OSM proxy tile failed — check osm.js logs','bad'));
        rails.getSource().on('tileloadend', ()=> say('Rails tiles loaded ✔︎','ok'));
        rails.getSource().on('tileloaderror',()=> say('Rails proxy tile failed — check orm.js logs','bad'));

        // Safari/iOS reflow nudges
        setTimeout(()=> map.updateSize(), 60);
        setTimeout(()=> map.updateSize(), 800);

      }catch(e){
        const box=document.getElementById('err'); box.style.display='block';
        box.textContent='Boot error: '+(e?.stack||e?.message||String(e));
      }
    });
  </script>
</body>
</html>
