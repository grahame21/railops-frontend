<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps — Dashboard (minimal)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- OpenLayers (locked to a stable v9) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.1.0/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@9.1.0/dist/ol.js"></script>

  <style>
    :root { color-scheme: dark; }
    html, body { height:100%; margin:0; background:#0d1117; color:#c9d1d9; font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    #bar { display:flex; gap:.5rem; align-items:center; padding:.5rem .75rem; background:#161b22; position:sticky; top:0; z-index:2; }
    #map { height: calc(100% - 44px); } /* fill below the bar */
    .badge { padding:.25rem .5rem; border-radius:.5rem; background:#30363d; }
    .ok { background:#238636; color:#fff; }
    .warn { background:#da3633; color:#fff; }
    label { display:inline-flex; gap:.4rem; align-items:center; background:#21262d; padding:.35rem .6rem; border-radius:.6rem; }
    button { background:#30363d; color:#c9d1d9; border:1px solid #3d444d; border-radius:.6rem; padding:.35rem .65rem; }
    button:hover { filter:brightness(1.1); }
    .spacer { flex:1; }
  </style>
</head>
<body>
  <div id="bar">
    <label><input type="checkbox" id="tog-rails" checked /> Rails (OpenRailwayMap)</label>
    <button id="btn-au">Recenter AU</button>
    <span class="spacer"></span>
    <span id="zoomInfo" class="badge">z=… · DPR=…</span>
    <span id="status" class="badge">Booting…</span>
  </div>
  <div id="map"></div>

  <!-- Minimal app code -->
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
