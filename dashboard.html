<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps Train Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- OpenLayers from unpkg -->
  <link rel="stylesheet" href="https://unpkg.com/ol@9.1.0/ol.css" />
  <style>
    html, body { margin:0; height:100%; background:#0b1220; }
    #map { position: fixed; inset: 0; }

    /* HUD */
    .hud {
      position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; z-index: 1001;
      background: rgba(18,26,43,.9); color: #e8eefc; border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px; padding: 10px 12px; font: 13px system-ui, -apple-system, Segoe UI, Roboto, Arial;
      box-shadow: 0 10px 30px rgba(0,0,0,.35); min-width: 270px; backdrop-filter: saturate(1.1) blur(4px);
    }
    .hud h3 { margin:0 0 6px; font-size:14px; }
    .hud .row { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; }
    .hud label { display:flex; align-items:center; gap:6px; line-height:1.2; }
    .hud .clock { margin-top:8px; font-weight:600; text-align:center; }
    .hud .tz { font-size:11px; color:#9fb2cf; text-align:center; margin-top:2px; }

    /* Logout */
    #logout-btn{
      position:fixed; top:10px; right:10px; z-index:1002; padding:8px 12px; border-radius:10px; cursor:pointer;
      border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.5); color:#e8eefc; backdrop-filter: saturate(1.1) blur(3px);
    }

    /* Debug badge */
    .badge{
      position:fixed;right:10px;bottom:10px;background:rgba(18,26,43,.9);color:#e8eefc;
      border:1px solid rgba(255,255,255,.15);padding:6px 8px;border-radius:10px;font:12px system-ui;z-index:999
    }
    .bad{color:#ffb3b3}.ok{color:#7bd88f}
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- HUD -->
  <div class="hud" id="hud" role="region" aria-label="Map controls">
    <h3>Layers</h3>
    <div class="row">
      <label><input type="checkbox" id="t-rail"> Rails</label>
      <label><input type="checkbox" id="t-km"> KM2ME</label>
      <label><input type="checkbox" id="t-locate"> My location</label>

      <!-- Coverage toggles -->
      <label><input type="checkbox" id="t-cov-all"> Coverage (All)</label>
      <label><input type="checkbox" id="t-cov-tel"> Telstra</label>
      <label style="grid-column: span 2;"><input type="checkbox" id="t-cov-ov"> Optus + Vodafone/TPG (roaming)</label>
      <label><input type="checkbox" id="t-cov-tw"> Telstra MVNO (proxy)</label>
    </div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="tz" id="tz">—</div>
  </div>

  <!-- Logout -->
  <button id="logout-btn" title="Sign out">Logout</button>

  <!-- Debug badge -->
  <div class="badge" id="badge">Loading…</div>

  <script src="https://unpkg.com/ol@9.1.0/dist/ol.js" defer></script>
  <script>
  (function(){
    const badge = document.getElementById('badge');
    const set = (t, cls)=>{ badge.textContent=t; badge.className='badge '+(cls||''); };

    // Logout
    document.getElementById('logout-btn').onclick = async () => {
      try { await fetch('/api/logout'); } catch {}
      location.href = '/login.html';
    };

    // Options (persisted in localStorage)
    const _opts = JSON.parse(localStorage.getItem('railops.options') || '{}');
    const OPT = {
      layers: Object.assign(
        {
          rail:true, km:false, locate:true,
          coverage:false,    // combined "All"
          covTel:false,      // Telstra (retail)
          covOV:false,       // Optus + Vodafone/TPG
          covTw:false        // Telstra MVNO (proxy)
        },
        (function(x){
          const l=(x.layers||{});
          // backward-compat: roll old covOpt/covVod into covOV
          if ((l.covOpt || l.covVod) && typeof l.covOV === 'undefined') l.covOV = !!(l.covOpt || l.covVod);
          return l;
        })(_opts) || {}
      ),
      railStyle: Object.assign({ color:'#000000', width:3 }, _opts.railStyle || {}),
      sources: Object.assign(
        { km2me:'', overpass:'https://overpass-api.de/api/interpreter' },
        _opts.sources || {}
      )
    };
    function saveOpts(){ localStorage.setItem('railops.options', JSON.stringify(OPT)); }

    // Wait for OpenLayers
    let ticks = 0;
    const wait = setInterval(()=>{
      if (window.ol && ol.Map) { clearInterval(wait); boot(); }
      else if (++ticks > 200) { clearInterval(wait); set('OpenLayers failed to load. Check CSP/script-src.', 'bad'); }
    }, 30);

    function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

    function boot(){
      set('OpenLayers OK', 'ok');

      // Base map (north-up)
      let map;
      try {
        map = new ol.Map({
          target: 'map',
          layers: [ new ol.layer.Tile({ source: new ol.source.OSM({ crossOrigin: 'anonymous' }) }) ],
          view: new ol.View({
            center: ol.proj.fromLonLat([133.7751, -25.2744]),
            zoom: 4.8,
            constrainRotation: 0
          })
        });
        map.once('rendercomplete', ()=> set('Base tiles rendered ✔︎', 'ok'));
      } catch(e){
        console.error(e); set('Failed to construct map: ' + (e && e.message ? e.message : e), 'bad'); return;
      }

      /* ===========================
         RAILS (Overpass, mirrors, cache, zoom gate)
         =========================== */
      const OVERPASS = [
        'https://overpass-api.de/api/interpreter',
        'https://overpass.kumi.systems/api/interpreter',
        'https://overpass.openstreetmap.fr/api/interpreter',
      ];
      let overpassIndex = 0;

      const railSrc = new ol.source.Vector();
      const railLayer = new ol.layer.Vector({
        source: railSrc,
        visible: !!OPT.layers.rail,
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({ color: OPT.railStyle.color || '#000', width: Math.max(1, OPT.railStyle.width || 3) })
        })
      });
      map.addLayer(railLayer);

      const cache = new Map(); // key -> features
      let inflight = null;

      function viewKey() {
        const v = map.getView();
        const z = Math.floor(v.getZoom() || 0);
        const c = ol.proj.toLonLat(v.getCenter());
        const lon = Math.round(c[0] * 4) / 4;
        const lat = Math.round(c[1] * 4) / 4;
        return `${z}:${lon}:${lat}`;
      }

      const refreshRails = debounce(fetchRailsForView, 500);
      map.once('postrender', refreshRails);
      map.getView().on('change:center', refreshRails);
      map.getView().on('change:resolution', refreshRails);

      async function fetchRailsForView(){
        if (!OPT.layers.rail) return;

        const v = map.getView();
        const z = v.getZoom() || 0;
        if (z < 8) { // encourage zoom-in to reduce rate limits & data
          railSrc.clear(true);
          set('Zoom in (≥8) to load rails', 'bad');
          return;
        }

        const key = viewKey();
        if (cache.has(key)) {
          railSrc.clear(true);
          railSrc.addFeatures(cache.get(key));
          set('Rails loaded (cache)', 'ok');
          return;
        }

        if (inflight) return;
        inflight = doOverpassFetch().finally(()=> inflight = null);

        async function doOverpassFetch(retries = OVERPASS.length) {
          try {
            const extent = v.calculateExtent(map.getSize());
            const world = ol.proj.transformExtent(extent,'EPSG:3857','EPSG:4326');
            const [minX,minY,maxX,maxY] = world;

            const pad = 0.02; // small padding to avoid cutting
            const q = `
              [out:json][timeout:25];
              (
                way["railway"~"^(rail|light_rail|subway)$"]["service"!~".*"](${Math.max(-90,minY-pad)},${Math.max(-180,minX-pad)},${Math.min(90,maxY+pad)},${Math.min(180,maxX+pad)});
              );
              out geom;`;

            const url = OVERPASS[overpassIndex % OVERPASS.length];
            const resp = await fetch(url, {
              method:'POST',
              headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' },
              body: 'data=' + encodeURIComponent(q)
            });

            if (!resp.ok) {
              if (([429,502,503,504].includes(resp.status)) && retries > 1) {
                overpassIndex++;
                set(`Overpass ${resp.status}; trying mirror…`, 'bad');
                await new Promise(r => setTimeout(r, 600));
                return doOverpassFetch(retries - 1);
              }
              throw new Error(resp.status+' '+resp.statusText);
            }

            const data = await resp.json();
            const feats = (data.elements||[])
              .filter(el => el.type==='way' && Array.isArray(el.geometry))
              .map(el => new ol.Feature({
                geometry: new ol.geom.LineString(el.geometry.map(p=>ol.proj.fromLonLat([p.lon,p.lat])))
              }));

            railSrc.clear(true);
            railSrc.addFeatures(feats);
            cache.set(key, feats);
            set('Rails loaded: ' + feats.length, 'ok');
          } catch (e) {
            console.warn(e);
            set('Rail fetch error. Zoom in further or try again.', 'bad');
          }
        }
      }

      /* ===========================
         KM2ME (optional)
         =========================== */
      let kmLayer;
      function ensureKmLayer() {
        if (!(OPT.layers.km && OPT.sources.km2me)) return removeKmLayer();
        if (kmLayer) return;
        kmLayer = new ol.layer.Vector({
          source: new ol.source.Vector({ url: OPT.sources.km2me, format: new ol.format.GeoJSON() }),
          style: new ol.style.Style({
            image:new ol.style.Circle({ radius:3, fill:new ol.style.Fill({color:'#e67e22'}), stroke:new ol.style.Stroke({color:'#8e4b0a', width:1}) })
          })
        });
        map.addLayer(kmLayer);
      }
      function removeKmLayer(){ if (!kmLayer) return; map.removeLayer(kmLayer); kmLayer=null; }
      ensureKmLayer();

      /* ===========================
         Current location
         =========================== */
      let geoloc, posFeature, accFeature, locLayer;
      function ensureLocate() {
        if (!OPT.layers.locate || !('geolocation' in navigator)) return removeLocate();
        if (geoloc) return;
        geoloc = new ol.Geolocation({ tracking: true, projection: map.getView().getProjection() });
        posFeature = new ol.Feature();
        posFeature.setStyle(new ol.style.Style({
          image: new ol.style.Icon({
            src: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><circle cx="18" cy="18" r="6" fill="#2dd4bf"/><circle cx="18" cy="18" r="12" fill="none" stroke="#2dd4bf" stroke-width="2" opacity=".35"/></svg>'),
            anchor:[0.5,0.5], anchorXUnits:'fraction', anchorYUnits:'fraction'
          })
        }));
        accFeature = new ol.Feature();
        const locSrc = new ol.source.Vector({ features:[accFeature,posFeature] });
        locLayer = new ol.layer.Vector({ source: locSrc });
        map.addLayer(locLayer);
        geoloc.on('change:position', ()=>{ const p=geoloc.getPosition(); if(p) posFeature.setGeometry(new ol.geom.Point(p)); });
        geoloc.on('change:accuracyGeometry', ()=>{ accFeature.setGeometry(geoloc.getAccuracyGeometry()); });
      }
      function removeLocate(){ if(!geoloc) return; geoloc.setTracking(false); geoloc=null; map.removeLayer(locLayer); locLayer=null; }
      ensureLocate();

      /* ===========================
         ACCC Mobile Coverage Layers
         =========================== */
      const ACCC2 = 'https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer';

      // Combined "All" coverage
      const covAll = new ol.layer.Tile({
        source: new ol.source.TileArcGISRest({ url: ACCC2, params: { layers: 'show:0', format: 'png32', transparent: true }}),
        opacity: 0.55, visible: !!OPT.layers.coverage
      });
      map.addLayer(covAll);

      // Per-provider “All Outdoor” layer IDs from ACCC
      const LAYER_OPTUS_ALL_OUTDOOR   = 15;
      const LAYER_TELSTRA_ALL_OUTDOOR = 25; // also used as MVNO proxy
      const LAYER_TPG_ALL_OUTDOOR     = 33;

      function makeTile(id){ return new ol.layer.Tile({
        source: new ol.source.TileArcGISRest({ url: ACCC2, params: { layers: `show:${id}`, format: 'png32', transparent: true }}),
        opacity: 0.55, visible: false
      });}

      const covTel = makeTile(LAYER_TELSTRA_ALL_OUTDOOR); // Telstra retail
      const covOpt = makeTile(LAYER_OPTUS_ALL_OUTDOOR);
      const covVod = makeTile(LAYER_TPG_ALL_OUTDOOR);
      const covTw  = makeTile(LAYER_TELSTRA_ALL_OUTDOOR); // Telstra MVNO proxy (lighter)
      covTw.setOpacity(0.35);

      map.addLayer(covTel);
      map.addLayer(covOpt);
      map.addLayer(covVod);
      map.addLayer(covTw);

      // Initial visibility
      covTel.setVisible(!!OPT.layers.covTel);
      const ovVisible = !!OPT.layers.covOV;
      covOpt.setVisible(ovVisible);
      covVod.setVisible(ovVisible);
      covTw.setVisible(!!OPT.layers.covTw);

      // HUD wiring
      const hud = {
        rail:  document.getElementById('t-rail'),
        km:    document.getElementById('t-km'),
        locate:document.getElementById('t-locate'),
        covAll:document.getElementById('t-cov-all'),
        covTel:document.getElementById('t-cov-tel'),
        covOV: document.getElementById('t-cov-ov'),
        covTw: document.getElementById('t-cov-tw'),
        clock: document.getElementById('clock'),
        tz:    document.getElementById('tz')
      };
      hud.rail.checked   = !!OPT.layers.rail;
      hud.km.checked     = !!OPT.layers.km;
      hud.locate.checked = !!OPT.layers.locate;
      hud.covAll.checked = !!OPT.layers.coverage;
      hud.covTel.checked = !!OPT.layers.covTel;
      hud.covOV.checked  = !!OPT.layers.covOV;
      hud.covTw.checked  = !!OPT.layers.covTw;

      // Rails toggle
      hud.rail.onchange   = ()=>{ OPT.layers.rail   = hud.rail.checked;   saveOpts(); railLayer.setVisible(OPT.layers.rail); if (OPT.layers.rail) fetchRailsForView(); };

      // KM2ME toggle (layer is created only when needed)
      hud.km.onchange     = ()=>{ OPT.layers.km     = hud.km.checked;     saveOpts(); (OPT.layers.km? ensureKmLayer(): removeKmLayer()); };

      // Locate toggle
      hud.locate.onchange = ()=>{ OPT.layers.locate = hud.locate.checked; saveOpts(); (OPT.layers.locate? ensureLocate(): removeLocate()); };

      // Coverage: combined "All"
      hud.covAll.onchange = ()=>{
        OPT.layers.coverage = hud.covAll.checked; covAll.setVisible(hud.covAll.checked); saveOpts();
        if (hud.covAll.checked) {
          // turn off granular layers to avoid stacking
          hud.covTel.checked = hud.covOV.checked = hud.covTw.checked = false;
          OPT.layers.covTel = OPT.layers.covOV = OPT.layers.covTw = false;
          covTel.setVisible(false); covOpt.setVisible(false); covVod.setVisible(false); covTw.setVisible(false);
          saveOpts();
        }
      };

      // Telstra (retail)
      hud.covTel.onchange = ()=>{
        const on = hud.covTel.checked;
        OPT.layers.covTel = on; covTel.setVisible(on);
        if (on && hud.covAll.checked) { hud.covAll.checked=false; OPT.layers.coverage=false; covAll.setVisible(false); }
        saveOpts();
      };

      // Optus + Vodafone/TPG (roaming)
      hud.covOV.onchange = ()=>{
        const on = hud.covOV.checked;
        OPT.layers.covOV = on; covOpt.setVisible(on); covVod.setVisible(on);
        if (on && hud.covAll.checked) { hud.covAll.checked=false; OPT.layers.coverage=false; covAll.setVisible(false); }
        saveOpts();
      };

      // Telstra MVNO (proxy)
      hud.covTw.onchange = ()=>{
        const on = hud.covTw.checked;
        OPT.layers.covTw = on; covTw.setVisible(on);
        if (on && hud.covAll.checked) { hud.covAll.checked=false; OPT.layers.coverage=false; covAll.setVisible(false); }
        saveOpts();
      };

      // Clock
      const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
      hud.tz.textContent = `Time zone: ${tzName}`;
      function tick(){ const d=new Date(); hud.clock.textContent =
        String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }
      tick(); setInterval(tick,1000);
    }
  })();
  </script>
</body>
</html>
