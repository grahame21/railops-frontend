<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RailOps — Live Trains</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <style>
    html,body{height:100%;margin:0;background:#f6f7fb;font:14px system-ui,sans-serif}
    #map{width:100%;height:100%}
    .badge{
      position:absolute;left:10px;top:10px;z-index:9999;
      background:#fff;border:1px solid #ddd;border-radius:10px;padding:6px 10px;
      box-shadow:0 8px 24px rgba(0,0,0,.08)
    }
    .ol-control button{background:#fff;border-radius:6px}
  </style>
</head>
<body>
  <div class="badge" id="badge">Loading…</div>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  <script>
  // ======= config =======
  const DATA_URL = "https://railops-json.onrender.com/trains.json"; // point to your Render service
  const REFRESH_MS = 30000;

  // ======= map base =======
  const map = new ol.Map({
    target: 'map',
    layers: [
      new ol.layer.Tile({ source: new ol.source.OSM() }),
      new ol.layer.Tile({
        opacity: 0.65,
        source: new ol.source.XYZ({
          url: "https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png",
          attributions: '© OpenRailwayMap contributors'
        })
      })
    ],
    view: new ol.View({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 4 })
  });

  // vectors
  const source = new ol.source.Vector();
  const layer  = new ol.layer.Vector({ source, zIndex: 20 });
  map.addLayer(layer);

  // popup
  const popupEl = document.createElement("div");
  popupEl.style.cssText = "user-select:text;background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);border:1px solid rgba(0,0,0,.1);min-width:180px";
  const popup = new ol.Overlay({ element: popupEl, autoPan:{animation:{duration:250}}, offset:[0,-14], positioning:"bottom-center" });
  map.addOverlay(popup);
  map.on("singleclick", (evt)=>{
    let f=null; map.forEachFeatureAtPixel(evt.pixel,(feat,lyr)=>{ if(lyr===layer) f=feat; });
    if(!f){ popup.setPosition(undefined); return; }
    const p=f.getProperties();
    popupEl.innerHTML = `
      <div style="font-weight:700;margin-bottom:4px">${p.label||p.id||"Train"}</div>
      <div>${p.operator||""}</div>
      <div>Speed: ${p.speed??"?"}  Heading: ${Math.round(p.heading??0)}°</div>
      <div>${p.lat?.toFixed?.(5)??"?"}, ${p.lon?.toFixed?.(5)??"?"}</div>
      <div style="color:#666;font-size:12px;margin-top:4px">${p.ts? new Date(p.ts).toLocaleString(): ""}</div>`;
    popup.setPosition(f.getGeometry().getCoordinates());
  });

  // style
  function styleFor(feature){
    const hd = feature.get("heading") || 0;
    const label = feature.get("label") || feature.get("id") || "";
    return [
      new ol.style.Style({
        image:new ol.style.RegularShape({
          points:3, radius:8, rotation:(hd*Math.PI)/180,
          fill:new ol.style.Fill({color:[0,120,255,0.95]}),
          stroke:new ol.style.Stroke({color:[0,0,0,0.7], width:1})
        })
      }),
      new ol.style.Style({
        text: new ol.style.Text({
          text: String(label),
          font: "bold 11px system-ui, sans-serif",
          offsetY: -16,
          placement: "point",
          backgroundFill: new ol.style.Fill({color: "rgba(255,210,0,0.95)"}),
          backgroundStroke: new ol.style.Stroke({color: "rgba(0,0,0,0.6)", width: 1}),
          padding: [3,5,3,5]
        })
      })
    ];
  }

  // draw
  function draw(trains){
    source.clear();
    const feats = [];
    for (const t of trains){
      if (t.lat==null || t.lon==null) continue;
      const f=new ol.Feature({
        geometry:new ol.geom.Point(ol.proj.fromLonLat([t.lon,t.lat])),
        id:t.id, label:t.label||t.id, operator:t.operator||"", speed:t.speed??null, heading:t.heading??0,
        lon:t.lon, lat:t.lat, ts:t.ts||null
      });
      f.setStyle(styleFor(f));
      feats.push(f);
    }
    source.addFeatures(feats);
    document.getElementById("badge").textContent = `Trains: ${feats.length}`;
    if (feats.length){
      const ext = source.getExtent();
      map.getView().fit(ext, { padding:[50,50,50,50], maxZoom: 10, duration: 250 });
    }
  }

  async function tick(){
    try {
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`, {cache:"no-store"});
      if (!res.ok) throw new Error("HTTP "+res.status);
      const json = await res.json();
      const trains = Array.isArray(json.trains) ? json.trains : [];
      draw(trains);
    } catch(e){
      document.getElementById("badge").textContent = "No train array found";
      console.error(e);
    }
  }

  tick();
  setInterval(tick, REFRESH_MS);
  </script>
</body>
</html>
