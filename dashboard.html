<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>RailOps — AU Live Map</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">

  <style>
    :root {
      --bg: #050b14;
      --panel: rgba(5, 12, 24, 0.92);
      --panel2: rgba(8, 20, 38, 0.96);
      --border: rgba(80, 160, 255, 0.35);
      --blue: #4db5ff;
      --blue2: #8cc8ff;
      --text: #e8f2ff;
      --muted: #a8bfd9;
      --danger: #ff7070;
      --good: #62e59f;
      --warn: #ffd66b;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #07111f;
    }

    .topbar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: stretch;
      pointer-events: none;
    }

    .brand-card {
      min-width: 230px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      pointer-events: auto;
    }

    .brand-card h1 {
      font-size: 18px;
      line-height: 1.1;
      margin: 0;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .brand-card .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-card {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      pointer-events: auto;
      display: flex;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .status-pill {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(77, 181, 255, 0.12);
      border: 1px solid rgba(77, 181, 255, 0.28);
      color: var(--blue2);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-text {
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .left-panel {
      position: absolute;
      left: 12px;
      top: 104px;
      z-index: 18;
      width: 340px;
      max-width: calc(100vw - 24px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .railops-panel {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      pointer-events: auto;
      backdrop-filter: blur(10px);
    }

    .railops-panel h3,
    .railops-panel h4 {
      margin: 0 0 8px 0;
    }

    .railops-panel h3 {
      font-size: 15px;
    }

    .railops-panel h4 {
      font-size: 13px;
      color: var(--blue2);
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(140, 200, 255, 0.3);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 11px;
      outline: none;
    }

    #searchInput::placeholder {
      color: rgba(232,242,255,0.55);
    }

    button {
      border: 1px solid rgba(140, 200, 255, 0.35);
      background: rgba(77, 181, 255, 0.16);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 650;
    }

    button:hover {
      background: rgba(77, 181, 255, 0.28);
    }

    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toggle-row label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }

    .artc-status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .artc-section {
      margin-top: 12px;
    }

    .artc-item {
      padding: 6px 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.88rem;
      line-height: 1.3;
    }

    .artc-item a {
      color: var(--blue2);
      text-decoration: none;
    }

    .artc-item a:hover {
      text-decoration: underline;
    }

    .popup {
      position: absolute;
      min-width: 260px;
      max-width: 330px;
      background: rgba(4, 12, 24, 0.97);
      color: var(--text);
      border: 1px solid rgba(140, 200, 255, 0.45);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.55);
      padding: 0;
      overflow: hidden;
      transform: translate(-50%, calc(-100% - 18px));
      pointer-events: auto;
    }

    .popup::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9px;
      width: 16px;
      height: 16px;
      transform: translateX(-50%) rotate(45deg);
      background: rgba(4, 12, 24, 0.97);
      border-right: 1px solid rgba(140, 200, 255, 0.45);
      border-bottom: 1px solid rgba(140, 200, 255, 0.45);
    }

    .popup-header {
      padding: 12px 14px;
      background: linear-gradient(135deg, rgba(77,181,255,0.22), rgba(20,80,140,0.18));
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .popup-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }

    .popup-sub {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .popup-body {
      padding: 12px 14px 14px;
      font-size: 13px;
      line-height: 1.45;
    }

    .popup-grid {
      display: grid;
      grid-template-columns: 94px 1fr;
      gap: 6px 10px;
    }

    .popup-label {
      color: var(--muted);
    }

    .popup-value {
      color: var(--text);
      font-weight: 600;
      word-break: break-word;
    }

    .popup-close {
      position: absolute;
      top: 7px;
      right: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      width: 26px;
      height: 26px;
      padding: 0;
      line-height: 24px;
      text-align: center;
      color: #fff;
      cursor: pointer;
      z-index: 2;
    }

    .ol-control button {
      background-color: rgba(5, 12, 24, 0.9) !important;
      color: #e8f2ff !important;
      border-radius: 8px !important;
    }

    .ol-zoom {
      top: auto;
      left: auto;
      right: 14px;
      bottom: 22px;
    }

    @media (max-width: 760px) {
      .topbar {
        flex-direction: column;
      }

      .brand-card {
        min-width: 0;
      }

      .status-card {
        flex-wrap: wrap;
      }

      .left-panel {
        top: 174px;
        width: calc(100vw - 24px);
      }

      .railops-panel {
        padding: 12px;
      }

      #artcPanel {
        max-height: 260px;
        overflow: auto;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="brand-card">
      <h1>RailOps — AU Live Map</h1>
      <div class="sub">Live trains, rail layers and ARTC context</div>
    </div>

    <div class="status-card">
      <div id="trainCount" class="status-pill">0 trains</div>
      <div id="lastUpdated" class="status-text">Loading train data...</div>
    </div>
  </div>

  <div class="left-panel">
    <div class="railops-panel">
      <h3>Search</h3>
      <div class="search-row">
        <input id="searchInput" type="search" placeholder="Search train, loco, operator, location..." />
        <button id="searchBtn">Go</button>
      </div>
    </div>

    <div class="railops-panel">
      <h3>Layers</h3>
      <div class="toggle-row">
        <label>
          <input type="checkbox" id="railwayLayerToggle" checked>
          OpenRailwayMap
        </label>
        <label>
          <input type="checkbox" id="trainLayerToggle" checked>
          Trains
        </label>
        <label>
          <input type="checkbox" id="labelsToggle" checked>
          Labels
        </label>
      </div>
    </div>

    <div id="artcPanel" class="railops-panel">
      <h3>ARTC Data</h3>
      <div id="artcStatus" class="artc-status">Loading ARTC data...</div>
      <div id="artcContent"></div>
    </div>
  </div>

  <div id="popup" class="popup" style="display:none;">
    <button id="popupClose" class="popup-close" title="Close">×</button>
    <div id="popupContent"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <script>
    /************************************************************
     * RailOps Dashboard
     * Full dashboard script with:
     * - live trains.json loading
     * - ARTC artc_data.json loading
     * - hover popup on train marker
     * - click popup for touch/mobile
     ************************************************************/

    const TRAIN_DATA_URL = "https://raw.githubusercontent.com/grahame21/railops-backend/main/trains.json";
    const ARTC_DATA_URL = "https://raw.githubusercontent.com/grahame21/railops-backend/main/artc_data.json";

    const AUSTRALIA_CENTER = ol.proj.fromLonLat([133.7751, -25.2744]);

    let trainFeatures = [];
    let lastGoodTrains = [];
    let lastGoodUpdatedISO = null;
    let lastHoveredFeature = null;
    let hoverHideTimer = null;
    let labelsEnabled = true;

    const popupEl = document.getElementById("popup");
    const popupContentEl = document.getElementById("popupContent");
    const popupCloseEl = document.getElementById("popupClose");

    /************************************************************
     * Base layers
     ************************************************************/

    const osmLayer = new ol.layer.Tile({
      title: "OpenStreetMap",
      source: new ol.source.OSM(),
      visible: true
    });

    const openRailwayMapLayer = new ol.layer.Tile({
      title: "OpenRailwayMap",
      source: new ol.source.XYZ({
        url: "https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png",
        crossOrigin: "anonymous"
      }),
      opacity: 0.85,
      visible: true
    });

    const trainSource = new ol.source.Vector();

    const trainLayer = new ol.layer.Vector({
      title: "Live Trains",
      source: trainSource,
      visible: true,
      style: function(feature, resolution) {
        return buildTrainStyle(feature, resolution);
      }
    });

    /************************************************************
     * Map
     ************************************************************/

    const map = new ol.Map({
      target: "map",
      layers: [
        osmLayer,
        openRailwayMapLayer,
        trainLayer
      ],
      view: new ol.View({
        center: AUSTRALIA_CENTER,
        zoom: 4,
        minZoom: 3,
        maxZoom: 18,
        rotation: 0
      }),
      controls: ol.control.defaults.defaults({
        attribution: true,
        rotate: false
      }).extend([
        new ol.control.ScaleLine()
      ])
    });

    const popupOverlay = new ol.Overlay({
      element: popupEl,
      positioning: "bottom-center",
      stopEvent: true,
      offset: [0, -12]
    });

    map.addOverlay(popupOverlay);

    /************************************************************
     * Helpers
     ************************************************************/

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function firstValue(obj, keys, fallback = "") {
      for (const key of keys) {
        if (obj && obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== "") {
          return obj[key];
        }
      }
      return fallback;
    }

    function toNumber(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num : null;
    }

    function formatDateTime(value) {
      if (!value) return "Unknown";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString();
    }

    function getTrainName(train) {
      return firstValue(train, [
        "train",
        "train_name",
        "trainName",
        "train_number",
        "trainNumber",
        "trKey",
        "id",
        "ID",
        "name",
        "service"
      ], "Unknown train");
    }

    function getLocoName(train) {
      return firstValue(train, [
        "loco",
        "locomotive",
        "loco_number",
        "locoNumber",
        "lead_loco",
        "leadLoco",
        "unit",
        "vehicle"
      ], "");
    }

    function getOperator(train) {
      return firstValue(train, [
        "operator",
        "company",
        "owner",
        "rail_operator",
        "railOperator"
      ], "Unknown");
    }

    function getLocationText(train) {
      return firstValue(train, [
        "location",
        "current_location",
        "currentLocation",
        "nearestTown",
        "town",
        "suburb",
        "place",
        "region"
      ], "");
    }

    function getOrigin(train) {
      return firstValue(train, [
        "origin",
        "from",
        "start",
        "start_location",
        "origin_name"
      ], "");
    }

    function getDestination(train) {
      return firstValue(train, [
        "destination",
        "dest",
        "to",
        "end",
        "end_location",
        "destination_name"
      ], "");
    }

    function getHeading(train) {
      const heading = firstValue(train, [
        "heading",
        "bearing",
        "direction_degrees",
        "course"
      ], null);

      const num = toNumber(heading);
      return num === null ? 0 : num;
    }

    function getSpeed(train) {
      return firstValue(train, [
        "speed",
        "speed_kmh",
        "speedKmh",
        "velocity"
      ], "");
    }

    function getKm(train) {
      return firstValue(train, [
        "km",
        "kilometre",
        "kilometer",
        "track_km",
        "trackKm"
      ], "");
    }

    function normaliseTrain(raw) {
      const lon = toNumber(firstValue(raw, ["lon", "lng", "longitude", "x"], null));
      const lat = toNumber(firstValue(raw, ["lat", "latitude", "y"], null));

      if (lat === null || lon === null) return null;
      if (lat < -45 || lat > -5 || lon < 105 || lon > 160) return null;

      return {
        ...raw,
        lat,
        lon,
        trainName: getTrainName(raw),
        locoName: getLocoName(raw),
        operatorName: getOperator(raw),
        locationText: getLocationText(raw),
        originText: getOrigin(raw),
        destinationText: getDestination(raw),
        headingValue: getHeading(raw)
      };
    }

    /************************************************************
     * Train marker style
     ************************************************************/

    function buildTrainStyle(feature, resolution) {
      const train = feature.get("train") || {};
      const heading = train.headingValue || 0;

      const labelText = labelsEnabled ? buildTrainLabel(train, resolution) : "";

      const iconStyle = new ol.style.Style({
        image: new ol.style.RegularShape({
          points: 3,
          radius: 12,
          rotation: (heading * Math.PI / 180),
          rotateWithView: true,
          fill: new ol.style.Fill({
            color: "rgba(77, 181, 255, 0.95)"
          }),
          stroke: new ol.style.Stroke({
            color: "rgba(255,255,255,0.95)",
            width: 2
          })
        }),
        text: labelText ? new ol.style.Text({
          text: labelText,
          offsetY: -24,
          font: "700 12px system-ui, -apple-system, Segoe UI, sans-serif",
          fill: new ol.style.Fill({
            color: "#ffffff"
          }),
          stroke: new ol.style.Stroke({
            color: "rgba(0,0,0,0.85)",
            width: 4
          }),
          overflow: true
        }) : null
      });

      return iconStyle;
    }

    function buildTrainLabel(train, resolution) {
      const zoom = map.getView().getZoom() || 4;
      const trainName = train.trainName || "Train";
      const locoName = train.locoName || "";

      if (zoom < 5) {
        return trainName;
      }

      if (zoom < 8) {
        return locoName && locoName !== trainName
          ? `${locoName} • ${trainName}`
          : trainName;
      }

      const location = train.locationText || "";
      if (location) {
        return locoName && locoName !== trainName
          ? `${locoName} • ${trainName}\n${location}`
          : `${trainName}\n${location}`;
      }

      return locoName && locoName !== trainName
        ? `${locoName} • ${trainName}`
        : trainName;
    }

    /************************************************************
     * Train loading
     ************************************************************/

    async function loadTrainData() {
      const trainCountEl = document.getElementById("trainCount");
      const lastUpdatedEl = document.getElementById("lastUpdated");

      try {
        const response = await fetch(TRAIN_DATA_URL + "?t=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const payload = await response.json();

        let rawTrains = [];

        if (Array.isArray(payload)) {
          rawTrains = payload;
        } else if (Array.isArray(payload.trains)) {
          rawTrains = payload.trains;
        } else if (Array.isArray(payload.data)) {
          rawTrains = payload.data;
        }

        const trains = rawTrains
          .map(normaliseTrain)
          .filter(Boolean);

        if (trains.length > 0) {
          lastGoodTrains = trains;
          lastGoodUpdatedISO = payload.lastUpdated || payload.updated || payload.generated_at || new Date().toISOString();
          renderTrains(trains);

          trainCountEl.textContent = `${trains.length} trains`;
          lastUpdatedEl.textContent = `Last updated: ${formatDateTime(lastGoodUpdatedISO)}`;
        } else if (lastGoodTrains.length > 0) {
          renderTrains(lastGoodTrains);

          trainCountEl.textContent = `${lastGoodTrains.length} trains`;
          lastUpdatedEl.textContent = `No fresh train payload — showing last good data from ${formatDateTime(lastGoodUpdatedISO)}`;
        } else {
          trainSource.clear();
          trainCountEl.textContent = "0 trains";
          lastUpdatedEl.textContent = "No train data available yet.";
        }

      } catch (err) {
        if (lastGoodTrains.length > 0) {
          renderTrains(lastGoodTrains);
          trainCountEl.textContent = `${lastGoodTrains.length} trains`;
          lastUpdatedEl.textContent = `Train data error: ${err.message} — showing last good data from ${formatDateTime(lastGoodUpdatedISO)}`;
        } else {
          trainCountEl.textContent = "0 trains";
          lastUpdatedEl.textContent = "Could not load train data: " + err.message;
        }
      }
    }

    function renderTrains(trains) {
      trainSource.clear();
      trainFeatures = [];

      for (const train of trains) {
        const feature = new ol.Feature({
          geometry: new ol.geom.Point(ol.proj.fromLonLat([train.lon, train.lat])),
          train
        });

        feature.setId(train.trainName + "_" + train.lat + "_" + train.lon);
        trainSource.addFeature(feature);
        trainFeatures.push(feature);
      }
    }

    /************************************************************
     * Popup handling
     ************************************************************/

    function buildPopupHtml(train) {
      const trainName = train.trainName || "Unknown train";
      const locoName = train.locoName || "";
      const operator = train.operatorName || "Unknown";
      const location = train.locationText || "Unknown";
      const origin = train.originText || "";
      const destination = train.destinationText || "";
      const speed = getSpeed(train);
      const km = getKm(train);
      const heading = train.headingValue ?? "";
      const updated = firstValue(train, [
        "lastUpdated",
        "updated",
        "timestamp",
        "time",
        "seen"
      ], lastGoodUpdatedISO);

      const subtitle = locoName && locoName !== trainName
        ? `${escapeHtml(locoName)} • ${escapeHtml(trainName)}`
        : escapeHtml(trainName);

      return `
        <div class="popup-header">
          <div class="popup-title">${escapeHtml(trainName)}</div>
          <div class="popup-sub">${subtitle}</div>
        </div>

        <div class="popup-body">
          <div class="popup-grid">
            <div class="popup-label">Operator</div>
            <div class="popup-value">${escapeHtml(operator)}</div>

            <div class="popup-label">Location</div>
            <div class="popup-value">${escapeHtml(location)}</div>

            <div class="popup-label">Origin</div>
            <div class="popup-value">${escapeHtml(origin || "Unknown")}</div>

            <div class="popup-label">Destination</div>
            <div class="popup-value">${escapeHtml(destination || "Unknown")}</div>

            <div class="popup-label">Speed</div>
            <div class="popup-value">${escapeHtml(speed ? speed + " km/h" : "Unknown")}</div>

            <div class="popup-label">Track km</div>
            <div class="popup-value">${escapeHtml(km || "Unknown")}</div>

            <div class="popup-label">Heading</div>
            <div class="popup-value">${escapeHtml(heading !== "" ? heading + "°" : "Unknown")}</div>

            <div class="popup-label">Updated</div>
            <div class="popup-value">${escapeHtml(formatDateTime(updated))}</div>
          </div>
        </div>
      `;
    }

    function showPopupForFeature(feature) {
      if (!feature) return;

      const train = feature.get("train");
      if (!train) return;

      const geometry = feature.getGeometry();
      const coordinate = geometry.getCoordinates();

      popupContentEl.innerHTML = buildPopupHtml(train);
      popupOverlay.setPosition(coordinate);
      popupEl.style.display = "block";
      lastHoveredFeature = feature;
    }

    function hidePopupSoon(delay = 180) {
      clearTimeout(hoverHideTimer);
      hoverHideTimer = setTimeout(() => {
        popupEl.style.display = "none";
        popupOverlay.setPosition(undefined);
        lastHoveredFeature = null;
      }, delay);
    }

    function keepPopupOpen() {
      clearTimeout(hoverHideTimer);
    }

    popupEl.addEventListener("mouseenter", keepPopupOpen);
    popupEl.addEventListener("mouseleave", () => hidePopupSoon(120));

    popupCloseEl.addEventListener("click", () => {
      clearTimeout(hoverHideTimer);
      popupEl.style.display = "none";
      popupOverlay.setPosition(undefined);
      lastHoveredFeature = null;
    });

    /************************************************************
     * Mouse hover popup
     ************************************************************/

    map.on("pointermove", function(evt) {
      if (evt.dragging) return;

      const pixel = map.getEventPixel(evt.originalEvent);

      const feature = map.forEachFeatureAtPixel(pixel, function(foundFeature, layer) {
        if (layer === trainLayer) {
          return foundFeature;
        }
        return null;
      }, {
        hitTolerance: 8
      });

      const mapTarget = map.getTargetElement();

      if (feature) {
        mapTarget.style.cursor = "pointer";

        if (feature !== lastHoveredFeature) {
          clearTimeout(hoverHideTimer);
          showPopupForFeature(feature);
        }
      } else {
        mapTarget.style.cursor = "";
        hidePopupSoon(180);
      }
    });

    /************************************************************
     * Click/tap popup for mobile
     ************************************************************/

    map.on("singleclick", function(evt) {
      const feature = map.forEachFeatureAtPixel(evt.pixel, function(foundFeature, layer) {
        if (layer === trainLayer) {
          return foundFeature;
        }
        return null;
      }, {
        hitTolerance: 12
      });

      if (feature) {
        clearTimeout(hoverHideTimer);
        showPopupForFeature(feature);
      }
    });

    /************************************************************
     * Search
     ************************************************************/

    function runSearch() {
      const input = document.getElementById("searchInput");
      const query = (input.value || "").trim().toLowerCase();

      if (!query) return;

      const match = trainFeatures.find(feature => {
        const train = feature.get("train") || {};
        const searchable = [
          train.trainName,
          train.locoName,
          train.operatorName,
          train.locationText,
          train.originText,
          train.destinationText,
          JSON.stringify(train)
        ].join(" ").toLowerCase();

        return searchable.includes(query);
      });

      if (!match) {
        alert("No matching train found.");
        return;
      }

      const coordinate = match.getGeometry().getCoordinates();

      map.getView().animate({
        center: coordinate,
        zoom: Math.max(map.getView().getZoom() || 4, 8),
        duration: 700
      });

      setTimeout(() => {
        showPopupForFeature(match);
      }, 720);
    }

    document.getElementById("searchBtn").addEventListener("click", runSearch);

    document.getElementById("searchInput").addEventListener("keydown", function(evt) {
      if (evt.key === "Enter") {
        runSearch();
      }
    });

    /************************************************************
     * Layer toggles
     ************************************************************/

    document.getElementById("railwayLayerToggle").addEventListener("change", function(evt) {
      openRailwayMapLayer.setVisible(evt.target.checked);
    });

    document.getElementById("trainLayerToggle").addEventListener("change", function(evt) {
      trainLayer.setVisible(evt.target.checked);
    });

    document.getElementById("labelsToggle").addEventListener("change", function(evt) {
      labelsEnabled = evt.target.checked;
      trainLayer.changed();
    });

    /************************************************************
     * ARTC Data Panel
     ************************************************************/

    async function loadARTCData() {
      const statusEl = document.getElementById("artcStatus");
      const contentEl = document.getElementById("artcContent");

      if (!statusEl || !contentEl) return;

      try {
        const response = await fetch(ARTC_DATA_URL + "?t=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!data.ok) {
          statusEl.textContent = "ARTC data error: " + (data.error || "Unknown error");
          return;
        }

        const generated = data.generated_at
          ? new Date(data.generated_at).toLocaleString()
          : "Unknown";

        const mtp = data.sources?.mtp || {};
        const taa = data.sources?.taa || {};
        const national = data.sources?.national_notices || {};
        const notices = data.sources?.notices_waivers_alerts || {};

        statusEl.innerHTML = `
          <strong>Last checked:</strong> ${escapeHtml(generated)}<br>
          <strong>MTP versions:</strong> ${escapeHtml(mtp.count_versions || 0)}<br>
          <strong>MTP PDFs:</strong> ${escapeHtml(mtp.count_pdfs || 0)}<br>
          <strong>TAA items:</strong> ${escapeHtml(taa.count || 0)}<br>
          <strong>National notices:</strong> ${escapeHtml(national.count || 0)}<br>
          <strong>Other notices:</strong> ${escapeHtml(notices.count || 0)}
        `;

        const mtpVersions = Array.isArray(mtp.versions) ? mtp.versions : [];
        const taaItems = Array.isArray(taa.items) ? taa.items.slice(0, 8) : [];

        contentEl.innerHTML = `
          <div class="artc-section">
            <h4>Master Train Plan</h4>
            ${
              mtpVersions.length
                ? mtpVersions.map(item => `
                    <div class="artc-item">
                      <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">
                        ${escapeHtml(item.title)}
                      </a>
                    </div>
                  `).join("")
                : "<p>No MTP versions found yet.</p>"
            }
          </div>

          <div class="artc-section">
            <h4>Latest Train Alteration Advice</h4>
            ${
              taaItems.length
                ? taaItems.map(item => `
                    <div class="artc-item">
                      <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">
                        ${escapeHtml(item.title || item.filename || "ARTC notice")}
                      </a>
                    </div>
                  `).join("")
                : "<p>No TAA items found yet.</p>"
            }
          </div>
        `;

      } catch (err) {
        statusEl.textContent = "Could not load ARTC data: " + err.message;
        contentEl.innerHTML = "";
      }
    }

    /************************************************************
     * Startup
     ************************************************************/

    loadTrainData();
    loadARTCData();

    setInterval(loadTrainData, 30000);
    setInterval(loadARTCData, 15 * 60 * 1000);

    window.addEventListener("resize", () => {
      map.updateSize();
    });
  </script>
</body>
</html>
