<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Train Tracker 2.0</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <style>
    html, body { height:100%; margin:0; }
    #map { width:100%; height:100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/ol@latest/ol.js"></script>

  <script>
    const map = new ol.Map({
      target: 'map',
      layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
      view: new ol.View({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 5 })
    });
  </script>

  <script src="/trains.js"></script>
  <script> TrainLayer.init(map); </script>
</body>
</html>
