<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RailOps — AU Live Map</title>

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #map { height: 100%; width: 100%; position: absolute; top: 0; left: 0; }
    #debug-panel {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 2000; background: rgba(0,0,0,0.9); color: #0f0;
      padding: 15px; border-radius: 8px; font-family: monospace;
      font-size: 12px; max-width: 80%; max-height: 200px; overflow: auto;
      pointer-events: none; border: 1px solid #0f0;
    }
    .toolbar {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: #0b57cf; color: white; padding: 8px 12px; border-radius: 12px;
      display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px;
    }
    .toolbar button, .toolbar select, .toolbar input {
      border: 0; border-radius: 8px; padding: 6px 10px; font-size: 13px;
    }
    .toolbar button { background: white; color: #0b57cf; cursor: pointer; }
    .toolbar input { min-width: 200px; }
    .clockbox {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(0,0,0,0.8); color: #00ff9c; padding: 8px 14px;
      border-radius: 12px; font-family: monospace; font-weight: 600;
    }
    .panel {
      position: absolute; left: 10px; bottom: 10px; z-index: 1000;
      background: rgba(0,0,0,0.85); color: white; border-radius: 12px;
      padding: 12px 16px; min-width: 260px;
    }
    .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.15); }
    .row:first-child { border-top: 0; }
    .floating {
      position: absolute; right: 10px; bottom: 10px; z-index: 1000;
      display: flex; flex-direction: column; gap: 10px;
    }
    .floating button {
      width: 48px; height: 48px; border-radius: 50%; border: 0;
      background: white; color: #0b57cf; font-size: 18px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    .tt-popup {
      background: white; padding: 12px 16px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2); min-width: 250px; font-size: 13px;
    }
    .error-banner {
      position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: #ff4444; color: white; padding: 10px 20px; border-radius: 20px;
      z-index: 2000; font-weight: bold; display: none;
    }
  </style>
</head>
<body>
  <div id="debug-panel">🚂 Initializing...</div>
  <div id="error-banner" class="error-banner">⚠️ Error loading data</div>
  <div id="map"></div>

  <div class="toolbar">
    <span>🚂 RailOps — AU</span>
    <select id="zoomSelect">
      <option value="australia">Australia</option>
      <option value="current">My location</option>
    </select>
    <input id="searchBox" type="search" placeholder="Search train ID...">
    <button id="searchBtn">🔍 Search</button>
    <button id="resetBtn">🔄 Reset</button>
    <button id="layersBtn">📊 Layers</button>
  </div>

  <div class="clockbox">
    <div id="clock"></div>
    <div id="lastUpdated">Loading...</div>
  </div>

  <div id="layersPanel" class="panel" style="display:none;">
    <div class="row"><label><input id="railChk" type="checkbox" checked> Rail lines</label></div>
    <div class="row"><label><input id="stationsChk" type="checkbox" checked> Stations</label></div>
    <div class="row"><label><input id="covTelstra" type="checkbox"> Telstra</label></div>
    <div class="row"><label><input id="covOptus" type="checkbox"> Optus</label></div>
    <div class="row"><label><input id="covTPG" type="checkbox"> Vodafone/TPG</label></div>
    <div class="row"><label><input id="covAll" type="checkbox"> Combined</label></div>
  </div>

  <div class="floating">
    <button id="zoomInBtn">➕</button>
    <button id="zoomOutBtn">➖</button>
    <button id="locBtn">📍</button>
  </div>

  <script>
    (function() {
      // ========== SAFE INITIALIZATION ==========
      const debug = document.getElementById('debug-panel');
      const errorBanner = document.getElementById('error-banner');
      
      function log(msg) {
        console.log(msg);
        const timestamp = new Date().toLocaleTimeString();
        debug.innerHTML = `[${timestamp}] ${msg}<br>` + debug.innerHTML;
        // Keep only last 8 lines
        const lines = debug.innerHTML.split('<br>');
        if (lines.length > 8) {
          debug.innerHTML = lines.slice(0, 8).join('<br>');
        }
      }

      function showError(msg) {
        log(`❌ ${msg}`);
        errorBanner.style.display = 'block';
        errorBanner.textContent = `⚠️ ${msg}`;
        setTimeout(() => { errorBanner.style.display = 'none'; }, 5000);
      }

      log('🚂 RailOps starting...');

      // ========== CREATE MAP SAFELY ==========
      let map;
      try {
        map = new ol.Map({
          target: 'map',
          layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
          view: new ol.View({
            center: ol.proj.fromLonLat([133.7751, -25.2744]),
            zoom: 5
          })
        });
        log('✅ Map created');
      } catch (e) {
        showError('Failed to create map: ' + e.message);
        return;
      }

      // ========== ADD LAYERS SAFELY ==========
      try {
        // Railway layers
        const railLayer = new ol.layer.Tile({
          source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png' }),
          visible: true
        });
        const stationsLayer = new ol.layer.Tile({
          source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/stations/{z}/{x}/{y}.png' }),
          visible: true
        });
        map.addLayer(railLayer);
        map.addLayer(stationsLayer);
        log('✅ Railway layers added');

        // Coverage layers
        const ACCC_URL = 'https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer';
        function covLayer(id) {
          return new ol.layer.Tile({
            source: new ol.source.TileArcGISRest({ 
              url: ACCC_URL, 
              params: { layers: `show:${id}`, transparent: true, format: 'png32' } 
            }),
            opacity: 0.45,
            visible: false
          });
        }
        const covTelstra = covLayer(25);
        const covOptus = covLayer(15);
        const covTPG = covLayer(33);
        const covAll = covLayer(4);
        map.addLayer(covTelstra);
        map.addLayer(covOptus);
        map.addLayer(covTPG);
        map.addLayer(covAll);
        log('✅ Coverage layers added');

        // ========== TRAIN LAYER ==========
        const trainSource = new ol.source.Vector();
        const trainLayer = new ol.layer.Vector({ 
          source: trainSource, 
          zIndex: 20,
          style: function(feature) {
            const props = feature.getProperties();
            const heading = Number(props.heading) || 0;
            const speed = Number(props.speed) || 0;
            
            // Color based on speed
            let color;
            if (speed > 80) color = [255, 0, 0, 0.9];      // Fast - Red
            else if (speed > 40) color = [255, 165, 0, 0.9]; // Medium - Orange
            else if (speed > 0) color = [255, 255, 0, 0.9];  // Slow - Yellow
            else color = [0, 255, 0, 0.9];                   // Stationary - Green
            
            return new ol.style.Style({
              image: new ol.style.RegularShape({
                points: 3,
                radius: 14,
                rotation: (heading * Math.PI) / 180,
                fill: new ol.style.Fill({ color }),
                stroke: new ol.style.Stroke({ color: [0,0,0,0.8], width: 2 })
              }),
              text: new ol.style.Text({
                text: String(props.id || props.train_id || '?').substring(0, 6),
                offsetY: -22,
                font: 'bold 10px Arial',
                fill: new ol.style.Fill({ color: '#000' }),
                stroke: new ol.style.Stroke({ color: '#fff', width: 3 })
              })
            });
          }
        });
        map.addLayer(trainLayer);
        log('✅ Train layer created');

        // ========== POPUP ==========
        const popupEl = document.createElement('div');
        popupEl.className = 'tt-popup';
        const popup = new ol.Overlay({ 
          element: popupEl, 
          positioning: 'bottom-center', 
          offset: [0, -15] 
        });
        map.addOverlay(popup);

        map.on('singleclick', (evt) => {
          const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
          if (feature) {
            const props = feature.getProperties();
            
            // Build popup HTML safely
            let html = '<div style="font-weight:700; font-size:16px;">🚂 Train Details</div>';
            
            // Helper to add field if it exists
            const addField = (label, value) => {
              if (value && value !== 'undefined' && value !== 'null' && value !== '') {
                html += `<div><strong>${label}:</strong> ${value}</div>`;
              }
            };
            
            addField('ID', props.id);
            addField('Train ID', props.train_id);
            addField('Operator', props.operator);
            addField('Speed', props.speed ? props.speed + ' km/h' : null);
            addField('Heading', props.heading ? props.heading + '°' : null);
            addField('Destination', props.destination);
            addField('Last Updated', props.timestamp);
            
            // Always show coordinates
            html += `<div style="color:#666; font-size:11px; margin-top:8px;">
              📍 ${props.lat?.toFixed?.(5) || '?'}, ${props.lon?.toFixed?.(5) || '?'}
            </div>`;
            
            popupEl.innerHTML = html;
            popup.setPosition(evt.coordinate);
          } else {
            popup.setPosition(undefined);
          }
        });

        // ========== LOAD TRAINS ==========
        async function loadTrains() {
          try {
            const url = 'https://grahame21.github.io/railops-backend/trains.json?t=' + Date.now();
            log(`📡 Fetching: ${url}`);
            
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            
            const data = await res.json();
            log(`📦 Received data with ${data.trains?.length || 0} trains`);
            
            // Clear existing features
            trainSource.clear();
            
            if (!data.trains || data.trains.length === 0) {
              log('⚠️ No trains in data');
              document.getElementById('lastUpdated').innerHTML = '⚠️ No trains';
              return;
            }
            
            let added = 0;
            let invalid = 0;
            
            data.trains.forEach((t, i) => {
              try {
                // Validate required fields
                if (!t || typeof t.lat !== 'number' || typeof t.lon !== 'number') {
                  invalid++;
                  return;
                }
                
                // Create feature with ALL properties
                const feature = new ol.Feature({
                  geometry: new ol.geom.Point(ol.proj.fromLonLat([t.lon, t.lat]))
                });
                
                // Copy all properties to feature
                Object.keys(t).forEach(key => {
                  feature.set(key, t[key]);
                });
                
                trainSource.addFeature(feature);
                added++;
                
              } catch (e) {
                console.warn('Error adding train:', e);
                invalid++;
              }
            });
            
            log(`✅ Added ${added} trains (${invalid} invalid skipped)`);
            document.getElementById('lastUpdated').innerHTML = 
              `${added} trains • ${new Date().toLocaleTimeString()}`;
            
          } catch (e) {
            showError(e.message);
            document.getElementById('lastUpdated').innerHTML = '❌ Failed';
          }
        }

        // Load immediately and every 30 seconds
        loadTrains();
        setInterval(loadTrains, 30000);

        // ========== CONTROLS ==========
        document.getElementById('zoomSelect').addEventListener('change', (e) => {
          if (e.target.value === 'current') {
            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(pos => {
                map.getView().animate({
                  center: ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]),
                  zoom: 12
                });
              });
            }
          } else {
            map.getView().animate({ center: ol.proj.fromLonLat([133.7751, -25.2744]), zoom: 5 });
          }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
          map.getView().animate({ center: ol.proj.fromLonLat([133.7751, -25.2744]), zoom: 5 });
        });

        document.getElementById('layersBtn').addEventListener('click', () => {
          const p = document.getElementById('layersPanel');
          p.style.display = p.style.display === 'none' ? 'block' : 'none';
        });

        document.getElementById('covTelstra').addEventListener('change', e => covTelstra.setVisible(e.target.checked));
        document.getElementById('covOptus').addEventListener('change', e => covOptus.setVisible(e.target.checked));
        document.getElementById('covTPG').addEventListener('change', e => covTPG.setVisible(e.target.checked));
        document.getElementById('covAll').addEventListener('change', e => covAll.setVisible(e.target.checked));
        document.getElementById('railChk').addEventListener('change', e => railLayer.setVisible(e.target.checked));
        document.getElementById('stationsChk').addEventListener('change', e => stationsLayer.setVisible(e.target.checked));

        document.getElementById('zoomInBtn').addEventListener('click', () => {
          map.getView().animate({ zoom: map.getView().getZoom() + 1 });
        });
        document.getElementById('zoomOutBtn').addEventListener('click', () => {
          map.getView().animate({ zoom: map.getView().getZoom() - 1 });
        });
        document.getElementById('locBtn').addEventListener('click', () => {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
              map.getView().animate({
                center: ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]),
                zoom: 12
              });
            });
          }
        });

        // Search
        document.getElementById('searchBtn').addEventListener('click', () => {
          const query = document.getElementById('searchBox').value.trim().toLowerCase();
          if (!query) return;
          
          let found = false;
          trainSource.forEachFeature(f => {
            const props = f.getProperties();
            const id = String(props.id || props.train_id || '').toLowerCase();
            if (id.includes(query)) {
              map.getView().animate({
                center: f.getGeometry().getCoordinates(),
                zoom: 14
              });
              log(`✅ Found: ${props.id || props.train_id}`);
              found = true;
            }
          });
          
          if (!found) log(`❌ No train matching: ${query}`);
        });

        // Clock
        function updateClock() {
          document.getElementById('clock').textContent = new Date().toLocaleTimeString();
        }
        updateClock();
        setInterval(updateClock, 1000);

        log('✅ RailOps ready');

      } catch (e) {
        showError('Setup error: ' + e.message);
      }
    })();
  </script>
</body>
</html>
