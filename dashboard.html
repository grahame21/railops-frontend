<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps — Minimal Map Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- (Optional) page-level CSP that often fixes iPad issues; server headers win if set -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org;
                 script-src 'self' https://cdn.jsdelivr.net https://unpkg.com;
                 style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
                 connect-src 'self' https://tile.openstreetmap.org https://*.tile.openstreetmap.org;
                 worker-src 'self' blob:;">

  <style>
    html, body { margin: 0; height: 100%; }
    #map { height: 100vh; width: 100%; border: 3px dashed #27ae60; box-sizing: border-box; }

    /* Simple banner for clear errors */
    .error-banner{
      position: fixed; inset: 0 0 auto 0; background:#c0392b; color:#fff;
      padding:10px 14px; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial; z-index: 9999;
    }

    /* Basic popup styles (not strictly needed, but future-proof) */
    .ol-popup {
      position: absolute; background: #fff; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc;
      min-width: 220px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); transform: translate(-50%, -100%); pointer-events: auto;
      font: 13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Primary OL script (jsDelivr) -->
  <script id="ol-primary" src="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js"></script>

  <script>
  (function initWithFallback(){
    function showError(msg){
      const b = document.createElement('div');
      b.className = 'error-banner';
      b.textContent = msg + ' — If this is your site, your CSP headers may be blocking external scripts.';
      document.body.prepend(b);
    }

    function loadFallback(){
      // Try unpkg if jsDelivr fails or OL not present
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/ol@9.1.0/dist/ol.js';
      s.onload = tryStart;
      s.onerror = function(){ showError('Could not load OpenLayers from either CDN'); };
      document.body.appendChild(s);
    }

    function tryStart(){
      if (typeof ol === 'undefined') { loadFallback(); return; }

      // === MAP STARTS HERE ===
      const map = new ol.Map({
        target: 'map',
        layers: [
          new ol.layer.Tile({
            source: new ol.source.OSM({ crossOrigin: 'anonymous' })
          })
        ],
        view: new ol.View({
          center: ol.proj.fromLonLat([133.7751, -25.2744]),
          zoom: 4.5,
          minZoom: 2,
          maxZoom: 19
        })
      });

      // (Optional) small sanity check: recenter button for testing
      const btn = document.createElement('button');
      btn.textContent = '↺ Reset AU view';
      btn.style.cssText = 'position:fixed;right:12px;top:12px;z-index:1000;padding:8px 10px;border-radius:10px;border:1px solid #ddd;background:#fff;cursor:pointer;';
      btn.onclick = () => map.getView().animate({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 4.5, duration: 500 });
      document.body.appendChild(btn);
    }

    // Run after DOM is ready; if primary script hasn’t attached OL, try fallback
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(tryStart, 0);
    } else {
      document.addEventListener('DOMContentLoaded', tryStart);
    }
  })();
  </script>
</body>
</html>
