<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RailOps — AU Live Map</title>

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <style>
    html,body{height:100%;margin:0}
    #map{height:100%}
    .toolbar{
      position:absolute;top:10px;left:10px;z-index:10;
      background:#0b57cf;color:#fff;padding:8px 10px;border-radius:8px;
      font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial
    }
    .toolbar select,.toolbar button,.toolbar input{margin-left:6px}
    .panel{
      position:absolute;left:10px;bottom:10px;z-index:10;
      background:rgba(0,0,0,.78);color:#fff;border-radius:10px;padding:10px 12px;
      font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial; max-width:92vw;
    }
    .row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(255,255,255,.15)}
    .row:first-child{border-top:0}
    .hint{font-size:12px;color:#cfd8ff;opacity:.85;margin-top:6px}
  </style>
</head>
<body>
  <div class="toolbar">
    RailOps — AU Live Map
    <span style="opacity:.85;margin-left:6px">Zoom:</span>
    <select id="zoomSelect">
      <option value="australia">Australia</option>
      <option value="current">Current location</option>
    </select>
    <input id="searchBox" type="search" placeholder="Search train ID / loco…" style="padding:6px 10px;border-radius:8px;border:0;outline:0;width:220px">
    <button id="searchBtn">Search</button>
    <button id="resetBtn">Reset</button>
    <button id="layersBtn">Layers ▾</button>
  </div>

  <div id="map"></div>

  <div id="layersPanel" class="panel" style="display:none">
    <div class="row"><label><input id="railChk" type="checkbox" checked> Rail lines (OpenRailwayMap)</label></div>
    <div class="row"><label><input id="stationsChk" type="checkbox" checked> Stations (OpenRailwayMap)</label></div>
    <div class="row"><label><input id="covTelstra" type="checkbox"> Telstra — outdoor</label></div>
    <div class="row"><label><input id="covOptus" type="checkbox"> Optus — outdoor</label></div>
    <div class="row"><label><input id="covTPG" type="checkbox"> Vodafone/TPG — outdoor</label></div>
    <div class="row"><label><input id="covAll" type="checkbox"> Combined — all MNOs</label></div>
    <div class="hint">Coverage maps are predictive and may differ from on-ground experience. Sources: ACCC datasets.</div>
  </div>

  <script>
    // --- Base map ---
    const map = new ol.Map({
      target: 'map',
      layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
      view: new ol.View({
        center: ol.proj.fromLonLat([133.7751, -25.2744]),
        zoom: 4
      })
    });
    map.getView().on('change:rotation', () => map.getView().setRotation(0));

    // Rail + stations
    const railLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',
        attributions: '© OpenRailwayMap, © OpenStreetMap', maxZoom: 19
      }), visible: true
    });
    const stationsLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://{a-c}.tiles.openrailwaymap.org/stations/{z}/{x}/{y}.png',
        attributions: '© OpenRailwayMap, © OpenStreetMap', maxZoom: 19
      }), visible: true
    });
    map.addLayer(railLayer); map.addLayer(stationsLayer);

    // ACCC overlays
    const ACCC_URL='https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer';
    function acccLayer(id){return new ol.layer.Tile({
      source:new ol.source.TileArcGISRest({ url:ACCC_URL, params:{layers:`show:${id}`,dpi:96,transparent:true,format:'png32'} }),
      opacity:0.45,visible:false
    });}
    const covTelstra=acccLayer(25), covOptus=acccLayer(15), covTPG=acccLayer(33), covAll=acccLayer(4);
    [covTelstra,covOptus,covTPG,covAll].forEach(l=>map.addLayer(l));

    // UI controls
    function zoomAustralia(){ map.getView().animate({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom:4, duration:500 }); }
    function zoomCurrent(){
      if(!navigator.geolocation){ zoomAustralia(); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        const c=ol.proj.fromLonLat([pos.coords.longitude,pos.coords.latitude]);
        map.getView().animate({ center:c, zoom:12, duration:600 });
      },()=>zoomAustralia());
    }
    document.getElementById('zoomSelect').addEventListener('change',e=>{
      (e.target.value==='current'?zoomCurrent:zoomAustralia)();
    });
    document.getElementById('resetBtn').addEventListener('click',()=>{
      zoomAustralia();
      [covTelstra,covOptus,covTPG,covAll].forEach(l=>l.setVisible(false));
      document.querySelectorAll('#layersPanel input[type=checkbox]').forEach(c=>c.checked=false);
      railLayer.setVisible(true); stationsLayer.setVisible(true);
      document.getElementById('railChk').checked=true;
      document.getElementById('stationsChk').checked=true;
    });
    document.getElementById('layersBtn').addEventListener('click',()=>{
      const panel=document.getElementById('layersPanel');
      panel.style.display=panel.style.display==='none'?'block':'none';
    });
    document.getElementById('covTelstra').addEventListener('change',e=>covTelstra.setVisible(e.target.checked));
    document.getElementById('covOptus').addEventListener('change',e=>covOptus.setVisible(e.target.checked));
    document.getElementById('covTPG').addEventListener('change',e=>covTPG.setVisible(e.target.checked));
    document.getElementById('covAll').addEventListener('change',e=>covAll.setVisible(e.target.checked));
    map.on('singleclick',()=>{ document.getElementById('layersPanel').style.display='none'; });

    // --- Inline TrainLayer (no external trains.js needed) ---
    const TrainLayer = (() => {
      const DATA_URL = "https://grahame21.github.io/railops-backend/trains.json"; // <- your GitHub Pages JSON
      const REFRESH_MS = 30000, MAX_AGE_MIN = 120, ENABLE_POPUPS = true, SHOW_HUD = true, DEMO_IF_EMPTY = false;

      let map, source, layer, popupOverlay, popupEl, hud;
      const idIndex = new Map();
      const to3857 = (lon, lat) => ol.proj.fromLonLat([lon, lat]);
      const pf = v => Number.isFinite(+v) ? +v : null;
      const heading = r => pf(r.heading ?? r.Heading ?? r.bearing ?? r.Bearing ?? r.course ?? r.Course) ?? 0;
      const speed = r => pf(r.speed ?? r.Speed ?? r.velocity ?? r.Velocity);
      const id = (r,i) => r.id||r.ID||r.Id||r.locoId||r.LocoId||r.LocomotiveId||r.Unit||r.Name||`train_${i}`;
      const lat = r => pf(r.lat ?? r.Lat ?? r.latitude ?? r.Latitude ?? r.y ?? r.Y);
      const lon = r => pf(r.lon ?? r.Lon ?? r.longitude ?? r.Longitude ?? r.x ?? r.X);
      const label = r => r.label||r.Label||r.title||r.Title||r.loco||r.Loco||r.Locomotive||r.Service||r.ServiceNumber||r.Operator||r.operator||"";
      const operator = r => r.operator||r.Operator||r.company||r.Company||"";
      const upd = r => { const c=r.timestamp||r.Timestamp||r.updated||r.Updated||r.LastSeen||r.lastSeen; const t=Date.parse(c||""); return Number.isNaN(t)?null:t; };
      const minsAgo = t => t==null?null:((Date.now()-t)/60000);

      function ensureHud(){
        if (!SHOW_HUD || hud) return;
        hud = document.createElement("div");
        Object.assign(hud.style,{position:"absolute",right:"10px",top:"10px",zIndex:15,background:"rgba(0,0,0,.7)",color:"#fff",padding:"8px 10px",borderRadius:"8px",font:"600 12px system-ui,-apple-system,Segoe UI,Roboto,Arial",whiteSpace:"nowrap"});
        hud.textContent="Live trains: init…"; document.body.appendChild(hud);
      }
      function setHud(msg){ if(SHOW_HUD){ ensureHud(); hud.textContent=msg; } }

      function extract(d){
        if(!d) return [];
        if(Array.isArray(d)) return d;
        for(const k of ["trains","Trains","markers","Markers","items","Items","results","Results","features"]){
          if(Array.isArray(d[k])) return d[k];
        }
        if(d.type==="FeatureCollection" && Array.isArray(d.features)) return d.features;
        if(d.data) return extract(d.data);
        if(d.payload) return extract(d.payload);
        for(const v of Object.values(d)){ if(Array.isArray(v) && v.length && typeof v[0]==="object") return v; }
        return [];
      }
      function norm(r,i){
        if(r && r.type==="Feature" && r.geometry?.type==="Point"){
          const [lo,la]=r.geometry.coordinates||[]; const p=r.properties||{};
          return {id:id(p,i), lon:pf(lo), lat:pf(la), heading:heading(p), speed:speed(p), label:label(p), operator:operator(p), updatedAt:upd(p), raw:r};
        }
        return {id:id(r,i), lon:lon(r), lat:lat(r), heading:heading(r), speed:speed(r), label:label(r), operator:operator(r), updatedAt:upd(r), raw:r};
      }
      function style(f){
        const age=f.get("ageMin"); const hd=f.get("heading")??0;
        let col=[0,120,255,0.9]; if(age!=null){ if(age>MAX_AGE_MIN) col=[130,130,130,0.7]; else if(age>30) col=[255,165,0,0.9]; }
        return new ol.style.Style({
          image:new ol.style.RegularShape({points:3,radius:10,rotation:(hd*Math.PI)/180,fill:new ol.style.Fill({color:col}),stroke:new ol.style.Stroke({color:[0,0,0,0.6],width:1})}),
          text:new ol.style.Text({text:f.get("label")||"",offsetY:-18,font:"600 12px system-ui, sans-serif",fill:new ol.style.Fill({color:"#111"}),stroke:new ol.style.Stroke({color:"rgba(255,255,255,0.9)",width:3})})
        });
      }
      function ensurePopup(){
        if(!ENABLE_POPUPS || popupOverlay) return;
        popupEl=document.createElement("div"); popupEl.className="tt-popup";
        Object.assign(popupEl.style,{background:"white",padding:"8px 10px",borderRadius:"10px",boxShadow:"0 8px 24px rgba(0,0,0,0.2)",border:"1px solid rgba(0,0,0,0.1)",minWidth:"180px"});
        popupOverlay=new ol.Overlay({element:popupEl,autoPan:{animation:{duration:250}},offset:[0,-12],positioning:"bottom-center"}); map.addOverlay(popupOverlay);
        map.on("singleclick",(evt)=>{let found=null; map.forEachFeatureAtPixel(evt.pixel,(f,l)=>{ if(l===layer) found=f; });
          if(!found){popupOverlay.setPosition(undefined);return;}
          const p=found.getProperties(); const ut=p.updatedAt?new Date(p.updatedAt).toLocaleString():"unknown";
          popupEl.innerHTML=`<div style="font-weight:700">${p.label||p.id||"Unknown"}</div><div>${p.operator||""}</div>
          <div>Speed: ${p.speed??"?"} | Heading: ${Math.round(p.heading??0)}°</div><div>Updated: ${ut}</div>
          <div style="color:#666">(${p.lat?.toFixed?.(5)??"?"}, ${p.lon?.toFixed?.(5)??"?"})</div>`;
          popupOverlay.setPosition(found.getGeometry().getCoordinates());
        });
      }
      function upsert(n){
        if(n.lat==null||n.lon==null) return;
        const key=String(n.id), coord=to3857(n.lon,n.lat), age=minsAgo(n.updatedAt);
        let f=idIndex.get(key);
        if(!f){ f=new ol.Feature({geometry:new ol.geom.Point(coord),id:key}); idIndex.set(key,f); source.addFeature(f); }
        else { f.getGeometry().setCoordinates(coord); }
        f.setProperties({label:n.label||key,operator:n.operator||"",speed:n.speed??null,heading:n.heading??0,updatedAt:n.updatedAt??null,lon:n.lon,lat:n.lat,ageMin:age??null},true);
        f.setStyle(style(f));
      }
      async function refresh(){
        ensureHud(); const t0=Date.now();
        try{
          const url = `${DATA_URL}${DATA_URL.includes("?")?"&":"?"}t=${t0}`;
          const res = await fetch(url,{cache:"no-store"}); const http=res.status;
          if(!res.ok){ setHud(`Live trains: HTTP ${http} — fetch failed`); return; }
          const text=await res.text(); let raw;
          try{ raw=JSON.parse(text); }catch(e){ setHud(`Live trains: not JSON`); return; }
          const list=extract(raw).map(norm).filter(r=>r.lat!=null&&r.lon!=null);
          const seen=new Set(); for(const n of list){ upsert(n); seen.add(String(n.id)); }
          source.getFeatures().forEach(f=>f.setStyle(style(f)));
          setHud(`Live trains: ${list.length} • updated ${new Date().toLocaleTimeString()}`);
        }catch(e){ setHud(`Live trains: error`); }
      }
      function ensureCssOnce(){
        if(document.getElementById("tt-css")) return;
        const s=document.createElement("style"); s.id="tt-css"; s.textContent=`.tt-popup{user-select:text}.tt-popup:after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-width:8px 8px 0 8px;border-style:solid;border-color:white transparent transparent transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.1));}`;
        document.head.appendChild(s);
      }
      return {
        init(olMap){
          map=olMap; ensureCssOnce(); ensureHud();
          source=new ol.source.Vector(); layer=new ol.layer.Vector({source,zIndex:20,renderBuffer:512}); map.addLayer(layer);
          ensurePopup(); refresh(); setInterval(refresh, REFRESH_MS);
          console.log("[TrainLayer] started. Source:", DATA_URL);
        }
      };
    })();

    // kick off trains overlay
    TrainLayer.init(map);
  </script>
</body>
</html>
