<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RailOps — AU Live Map</title>

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #map { height: 100%; width: 100%; background: #0a1a2a; }
    
    .toolbar {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: rgba(10, 26, 42, 0.95); backdrop-filter: blur(8px);
      color: white; padding: 10px 16px; border-radius: 40px;
      border: 1px solid #2a4a7a; display: flex; gap: 12px;
    }
    .toolbar button, .toolbar select {
      background: #1e3a5f; color: white;
      border: 1px solid #3a6a9a; border-radius: 30px;
      padding: 6px 16px; cursor: pointer;
    }
    
    .search-container {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 1000; width: 400px;
    }
    .search-box {
      background: rgba(10, 26, 42, 0.95); backdrop-filter: blur(8px);
      border-radius: 40px; border: 1px solid #2a4a7a;
      display: flex;
    }
    .search-box input {
      flex: 1; background: #1e3a5f; border: 1px solid #3a6a9a;
      border-radius: 40px 0 0 40px; padding: 10px 20px;
      color: white; outline: none;
    }
    .search-box button {
      background: #0b57cf; border: none; border-radius: 0 40px 40px 0;
      padding: 10px 24px; color: white; cursor: pointer;
    }
    
    .autocomplete-items {
      position: absolute; background: rgba(10, 26, 42, 0.95);
      border: 1px solid #2a4a7a; border-radius: 0 0 20px 20px;
      width: 100%; max-height: 300px; overflow-y: auto;
    }
    .autocomplete-item {
      padding: 12px; color: white; cursor: pointer;
      border-bottom: 1px solid #1e3a5f;
    }
    .autocomplete-item:hover { background: #1e3a5f; }
    
    .status-bar {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: rgba(10, 26, 42, 0.95); backdrop-filter: blur(8px);
      color: white; padding: 8px 20px; border-radius: 40px;
      border: 1px solid #2a4a7a;
    }
    
    .train-popup {
      position: absolute;
      background: rgba(10, 26, 42, 0.98);
      backdrop-filter: blur(8px);
      color: white;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #2a4a7a;
      transform: translate(-50%, -100%);
      min-width: 300px;
      z-index: 10000;
    }
    .train-popup::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px;
      border-style: solid;
      border-color: #2a4a7a transparent transparent transparent;
    }
    .popup-header {
      font-size: 16px;
      font-weight: bold;
      color: #ffaa00;
      border-bottom: 1px solid #2a4a7a;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }
    .popup-grid {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 4px;
      font-size: 12px;
    }
    .popup-label { color: #9ab0d0; }
    .popup-badge {
      background: #1e3a5f;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      display: inline-block;
      margin: 2px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span style="color:#ffaa00">🚂 RailOps</span>
    <select id="stateSelect">
      <option value="au">Australia</option>
      <option value="nsw">NSW</option>
      <option value="vic">VIC</option>
      <option value="qld">QLD</option>
      <option value="sa">SA</option>
      <option value="wa">WA</option>
    </select>
    <button id="locateBtn">📍 My Location</button>
    <button id="locoSearchBtn">🔍 Search Locos</button>
  </div>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search train or loco...">
      <button id="searchBtn">Search</button>
    </div>
    <div id="autocompleteList" class="autocomplete-items" style="display: none;"></div>
  </div>

  <div class="status-bar">
    <span id="lastUpdate">Loading...</span>
    <span id="trainCount">0</span>
  </div>

  <div id="map"></div>

  <script>
    const map = new ol.Map({
      target: 'map',
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      view: new ol.View({ center: ol.proj.fromLonLat([133.7751, -25.2744]), zoom: 4 })
    });

    // Train layer with two-line labels
    const trainSource = new ol.source.Vector();
    const trainLayer = new ol.layer.Vector({
      source: trainSource,
      style: function(feature) {
        const t = feature.get('train_data') || {};
        const num = t.train_number || '';
        const name = t.train_name || '';
        const speed = t.speed || 0;
        
        let color = '#ffaa00';
        if (speed > 80) color = '#ff4444';
        else if (speed > 30) color = '#00cc00';
        
        let styles = [new ol.style.Style({
          image: new ol.style.Circle({ radius: 8, fill: new ol.style.Fill({ color }), stroke: new ol.style.Stroke({ color: '#fff', width: 2 }) })
        })];
        
        if (name && num && name !== num) {
          styles.push(new ol.style.Style({ text: new ol.style.Text({ text: num, font: 'bold 11px monospace', fill: new ol.style.Fill({ color: '#ffaa00' }), stroke: new ol.style.Stroke({ color: '#000', width: 3 }), offsetY: -26, backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.9)' }), padding: [2, 6] }) }));
          styles.push(new ol.style.Style({ text: new ol.style.Text({ text: name, font: '10px monospace', fill: new ol.style.Fill({ color: '#fff' }), stroke: new ol.style.Stroke({ color: '#000', width: 2 }), offsetY: -10, backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.9)' }), padding: [2, 6] }) }));
        } else {
          styles.push(new ol.style.Style({ text: new ol.style.Text({ text: name || num, font: 'bold 11px monospace', fill: new ol.style.Fill({ color: '#ffaa00' }), stroke: new ol.style.Stroke({ color: '#000', width: 3 }), offsetY: -18, backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.9)' }), padding: [2, 6] }) }));
        }
        return styles;
      }
    });
    map.addLayer(trainLayer);

    let allTrains = [], allLocos = [];
    
    async function loadData() {
      try {
        // Load trains
        const trainRes = await fetch('https://raw.githubusercontent.com/grahame21/railops-backend/main/trains.json');
        const trainData = await trainRes.json();
        allTrains = trainData.trains || [];
        
        // Load loco database
        const locoRes = await fetch('https://raw.githubusercontent.com/grahame21/railops-backend/main/locos.json');
        if (locoRes.ok) allLocos = await locoRes.json();
        
        document.getElementById('trainCount').innerHTML = allTrains.length;
        document.getElementById('lastUpdate').innerHTML = `Last: ${new Date(trainData.lastUpdated).toLocaleTimeString()}`;
        
        trainSource.clear();
        allTrains.forEach(t => {
          if (t.lat && t.lon) {
            let f = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([t.lon, t.lat])) });
            f.set('train_data', t);
            trainSource.addFeature(f);
          }
        });
      } catch (e) { console.error(e); }
    }

    // Popup
    let popup = null;
    map.on('pointermove', e => {
      let f = map.forEachFeatureAtPixel(e.pixel, f => f);
      if (popup) { map.removeOverlay(popup); popup = null; }
      if (!f) return;
      
      let t = f.get('train_data') || {};
      let coords = f.getGeometry().getCoordinates();
      let ll = ol.proj.toLonLat(coords);
      
      let div = document.createElement('div');
      div.className = 'train-popup';
      div.innerHTML = `
        <div class="popup-header">${t.train_name || t.train_number || t.id} - ${t.speed || 0}km/h</div>
        <div class="popup-grid">
          <span class="popup-label">Origin:</span><span>${t.origin || '?'}</span>
          <span class="popup-label">Dest:</span><span>${t.destination || '?'}</span>
          ${t.time ? `<span class="popup-label">Time:</span><span>${t.time}</span>` : ''}
          ${t.km ? `<span class="popup-label">Dist:</span><span>${t.km}</span>` : ''}
        </div>
        <div>
          ${t.train_number ? `<span class="popup-badge">Train: ${t.train_number}</span>` : ''}
          ${t.train_name ? `<span class="popup-badge">Loco: ${t.train_name}</span>` : ''}
          <span class="popup-badge">📍 ${ll[1].toFixed(2)}°, ${ll[0].toFixed(2)}°</span>
        </div>
      `;
      
      popup = new ol.Overlay({ element: div, position: coords, positioning: 'bottom-center', offset: [0, -15] });
      map.addOverlay(popup);
    });

    // Search
    let searchInput = document.getElementById('searchInput');
    let autoList = document.getElementById('autocompleteList');
    
    searchInput.addEventListener('input', () => {
      let q = searchInput.value.toLowerCase();
      if (q.length < 2) { autoList.style.display = 'none'; return; }
      
      let matches = [];
      allTrains.forEach(t => {
        let id = (t.train_name || t.train_number || '').toLowerCase();
        if (id.includes(q) && !matches.some(m => m.id === id)) {
          matches.push({ id: t.train_name || t.train_number, lat: t.lat, lon: t.lon });
        }
      });
      
      if (matches.length) {
        autoList.innerHTML = matches.slice(0, 8).map(m => 
          `<div class="autocomplete-item" onclick="flyTo(${m.lat}, ${m.lon}, '${m.id}')">${m.id}</div>`
        ).join('');
        autoList.style.display = 'block';
      } else autoList.style.display = 'none';
    });

    window.flyTo = (lat, lon, id) => {
      map.getView().animate({ center: ol.proj.fromLonLat([lon, lat]), zoom: 12 });
      autoList.style.display = 'none';
      searchInput.value = id;
    };

    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
