<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071326" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RailOps" />
<meta name="mobile-web-app-capable" content="yes" />
<title>RailOps — AU Live Map</title>

<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<link rel="stylesheet" href="./ol/ol.css" />

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root{
  --panel-bg: rgba(8, 20, 38, 0.96);
  --panel-border: #2a4a7a;
  --panel-btn: #1e3a5f;
  --panel-btn-border: #3a6a9a;
  --accent: #ffaa00;
  --blue: #0b57cf;
  --text: #ffffff;
  --muted: #b8c9e8;
  --shadow: 0 8px 28px rgba(0,0,0,0.55);

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: #071326;
}

body {
  overscroll-behavior: none;
}

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  background: #0a1a2a;
}

.top-card,
.toolbar,
.status-bar,
.search-box,
.autocomplete-items,
.layers-panel {
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.top-card {
  position: absolute;
  top: calc(var(--safe-top) + 8px);
  left: calc(var(--safe-left) + 10px);
  right: calc(var(--safe-right) + 10px);
  z-index: 1000;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 8px;
  display: none;
}

.mobile-brand {
  color: var(--accent);
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 8px;
  line-height: 1.1;
}

.mobile-controls-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.mobile-controls-grid button,
.mobile-controls-grid select {
  width: 100%;
  min-width: 0;
  height: 40px;
  min-height: 40px;
  border-radius: 14px;
  border: 1px solid var(--panel-btn-border);
  background: var(--panel-btn);
  color: white;
  font-size: 13px;
  font-weight: 800;
  padding: 6px 10px;
  outline: none;
}

#mobileLayersBtn {
  grid-column: 1 / -1;
}

.mobile-search-wrap {
  margin-bottom: 8px;
}

.search-box {
  background: var(--panel-bg);
  border-radius: 16px;
  border: 1px solid var(--panel-border);
  display: flex;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.search-box input {
  flex: 1;
  min-width: 0;
  background: #15283f;
  border: 0;
  padding: 8px 12px;
  color: white;
  font-size: 15px;
  outline: none;
  height: 42px;
}

.search-box input::placeholder {
  color: #9ab0d0;
}

.search-box button {
  background: var(--blue);
  border: 0;
  padding: 8px 12px;
  color: white;
  font-weight: 900;
  cursor: pointer;
  min-width: 88px;
  font-size: 14px;
  height: 42px;
}

.mobile-status-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  align-items: center;
}

.mobile-last {
  min-width: 0;
  color: white;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
}

.mobile-status-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.mobile-note,
.mobile-count {
  white-space: nowrap;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 900;
}

.mobile-note {
  background: #15283f;
  border: 1px solid #2b4f80;
  color: #cfe2ff;
}

.mobile-count {
  background: var(--blue);
  color: white;
  min-width: 58px;
  text-align: center;
}

.toolbar {
  position: absolute;
  top: calc(var(--safe-top) + 12px);
  left: calc(var(--safe-left) + 12px);
  z-index: 1000;
  background: var(--panel-bg);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 26px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 12px;
  align-items: center;
  border: 1px solid var(--panel-border);
  font-size: 14px;
  font-weight: 700;
}

.toolbar button,
.toolbar select {
  background: var(--panel-btn);
  color: white;
  border: 1px solid var(--panel-btn-border);
  border-radius: 18px;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  outline: none;
  min-height: 44px;
}

.toolbar select option {
  background: #0b1522;
  color: #ffffff;
}

.search-container {
  position: absolute;
  top: calc(var(--safe-top) + 12px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  width: min(520px, calc(100vw - 390px));
}

.autocomplete-items {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  max-height: 280px;
  overflow-y: auto;
  z-index: 1001;
  box-shadow: var(--shadow);
}

.autocomplete-item {
  padding: 12px 14px;
  color: white;
  cursor: pointer;
  border-bottom: 1px solid #1e3a5f;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.autocomplete-item:last-child {
  border-bottom: none;
}

.autocomplete-item:hover {
  background: #13243a;
}

.autocomplete-item .train-id {
  font-weight: 900;
  color: #cfe2ff;
}

.autocomplete-item .train-loc {
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-bar {
  position: absolute;
  top: calc(var(--safe-top) + 12px);
  right: calc(var(--safe-right) + 12px);
  z-index: 1000;
  background: var(--panel-bg);
  color: white;
  padding: 10px 14px;
  border-radius: 24px;
  font-size: 13px;
  border: 1px solid var(--panel-border);
  display: flex;
  gap: 10px;
  align-items: center;
  box-shadow: var(--shadow);
}

.train-count {
  background: var(--blue);
  padding: 6px 12px;
  border-radius: 999px;
  font-weight: 900;
  min-width: 56px;
  text-align: center;
}

.note-pill {
  background: #15283f;
  border: 1px solid #2b4f80;
  padding: 6px 10px;
  border-radius: 999px;
  font-weight: 800;
  color: #cfe2ff;
}

.layers-panel {
  position: absolute;
  left: calc(var(--safe-left) + 12px);
  bottom: calc(var(--safe-bottom) + 12px);
  z-index: 1000;
  background: var(--panel-bg);
  color: white;
  border-radius: 18px;
  padding: 14px;
  border: 1px solid var(--panel-border);
  width: 280px;
  box-shadow: var(--shadow);
  max-height: 60dvh;
  overflow-y: auto;
}

.layer-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #1e3a5f;
  font-size: 13px;
}

.layer-row:last-child {
  border-bottom: none;
}

.section-title {
  color: #9ab0d0;
  font-size: 12px;
  margin: 12px 0 4px 0;
}

.train-popup {
  position: absolute;
  background: rgba(9, 20, 38, 0.98);
  color: white;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--panel-border);
  box-shadow: 0 10px 36px rgba(0,0,0,0.85);
  pointer-events: auto;
  transform: translate(-50%, -100%);
  min-width: 280px;
  max-width: min(360px, calc(100vw - 24px));
  z-index: 10000;
}

.train-popup::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border-width: 9px;
  border-style: solid;
  border-color: var(--panel-border) transparent transparent transparent;
}

.popup-header {
  font-size: 15px;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 6px;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 4px;
}

.popup-subheader {
  font-size: 12px;
  color: #9ab0d0;
  margin-bottom: 8px;
  font-style: italic;
}

.popup-grid {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 6px;
  font-size: 12px;
  margin: 6px 0;
}

.popup-label {
  color: #9ab0d0;
  font-weight: 800;
}

.popup-value {
  color: white;
  word-break: break-word;
}

.popup-badge {
  background: #15283f;
  border: 1px solid #2b4f80;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  display: inline-block;
  margin-right: 6px;
  margin-top: 6px;
  color: #cfe2ff;
}

.popup-footer {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px;
}

.popup-close {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #163456;
  border: 1px solid #2b4f80;
  color: white;
  border-radius: 10px;
  width: 28px;
  height: 28px;
  font-weight: 900;
  cursor: pointer;
}

@media (max-width: 900px) {
  .top-card {
    display: block;
  }

  .toolbar,
  .search-container,
  .status-bar {
    display: none !important;
  }

  .layers-panel {
    left: calc(var(--safe-left) + 10px);
    right: calc(var(--safe-right) + 10px);
    width: auto;
    bottom: calc(var(--safe-bottom) + 10px);
    max-height: 45dvh;
  }

  .popup-grid {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .train-popup {
    min-width: 260px;
    max-width: calc(100vw - 20px);
  }
}

@media (min-width: 901px) {
  .top-card {
    display: none !important;
  }
}
</style>
</head>

<body>

<div class="top-card" id="topCard">
  <div class="mobile-brand">🚂 RailOps</div>

  <div class="mobile-controls-grid">
    <select id="mobileStateSelect">
      <option value="au">🇦🇺 Australia</option>
      <option value="nsw">📍 NSW</option>
      <option value="vic">📍 VIC</option>
      <option value="qld">📍 QLD</option>
      <option value="sa">📍 SA</option>
      <option value="wa">📍 WA</option>
      <option value="tas">📍 TAS</option>
      <option value="nt">📍 NT</option>
    </select>

    <button id="mobileLocateBtn">📍 My Location</button>
    <button id="mobileLayersBtn">🗺️ Layers</button>
  </div>

  <div class="mobile-search-wrap">
    <div class="search-box">
      <input type="text" id="mobileSearchInput" placeholder="Search train, loco, origin, destination...">
      <button id="mobileSearchBtn">🔍 Search</button>

    <div id="mobileAutocompleteList" class="autocomplete-items" style="display:none;"></div>

  <div class="mobile-status-row">
    <div class="mobile-last" id="mobileLastUpdate">Loading...</div>

      <div class="mobile-note" id="mobileStatusNote">…</div>

    </div>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <span style="font-weight:900; color:var(--accent)">🚂 RailOps</span>
  <select id="stateSelect">
    <option value="au">🇦🇺 Australia</option>
    <option value="nsw">📍 NSW</option>
    <option value="vic">📍 VIC</option>
    <option value="qld">📍 QLD</option>
    <option value="sa">📍 SA</option>
    <option value="wa">📍 WA</option>
    <option value="tas">📍 TAS</option>
    <option value="nt">📍 NT</option>
  </select>
  <button id="locateBtn">📍 My Location</button>
  <button id="layersToggleBtn">🗺️ Layers</button>
</div>

<div class="search-container" id="searchContainer">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search train number, loco, origin, destination...">
    <button id="searchBtn">🔍 Search</button>
  </div>
  <div id="autocompleteList" class="autocomplete-items" style="display:none;"></div>
</div>

<div class="status-bar" id="statusBar">
  <span id="lastUpdate">Loading...</span>
  <span class="note-pill" id="statusNote">…</span>
  <span class="train-count" id="trainCount">0</span>
</div>

<div class="layers-panel" id="layersPanel" style="display:none;">
  <h3 style="margin-bottom:8px;">🗺️ MAP LAYERS</h3>
  <div class="layer-row"><label><input type="checkbox" id="trainLayerChk" checked> 🚆 Live Trains</label></div>
  <div class="layer-row"><label><input type="checkbox" id="railLayerChk" checked> 🛤️ Rail Lines (Blue)</label></div>
  <div class="layer-row"><label><input type="checkbox" id="stationsLayerChk" checked> 🏢 Stations</label></div>

  <div class="section-title">📱 MOBILE COVERAGE</div>
  <div class="layer-row"><label><input type="checkbox" id="covTelstraChk"> 📶 Telstra</label></div>
  <div class="layer-row"><label><input type="checkbox" id="covOptusChk"> 📶 Optus</label></div>
  <div class="layer-row"><label><input type="checkbox" id="covTPGChk"> 📶 Vodafone/TPG</label></div>
  <div class="layer-row"><label><input type="checkbox" id="covAllChk"> 📶 All Networks</label></div>
</div>

<div id="map"></div>

<script src="./ol/ol.js"></script>
<script>
if (typeof window.ol === "undefined") {
  document.write('<script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"><\/script>');
}
</script>

<script>
const TRAINS_URL_BASE = "https://raw.githubusercontent.com/grahame21/railops-backend/main/trains.json";
const REVERSE_GEOCODE_ENABLED = true;

const reverseGeoCache = new Map();
let popupOverlay = null;
let popupRequestId = 0;
let allTrains = [];
let lastGoodTrains = [];
let lastGoodUpdatedISO = null;
let consecutiveEmpty = 0;
let desktopDebounceTimer;
let mobileDebounceTimer;

function isMobileLayout() {
  return window.matchMedia("(max-width: 900px)").matches;
}

function isJunkId(s){
  if (!s) return true;
  const v = String(s).toLowerCase();
  return v.startsWith("arrowmarkerssource_")
      || v.startsWith("markersource_")
      || v.startsWith("regtrainssource_")
      || v.startsWith("unregtrainssource_")
      || v.startsWith("trainsource_")
      || v.includes("arrowmarkerssource");
}

function getLoco(train){
  const candidates = [train.trKey, train.loco, train.train_name, train.trainName];
  for (const c of candidates){
    if (!c) continue;
    const s = String(c).trim();
    if (s && !isJunkId(s)) return s;
  }
  return "";
}

function getTrainId(train){
  const candidates = [train.train_number, train.trainNumber, train.id, train.ID];
  for (const c of candidates){
    if (!c) continue;
    const s = String(c).trim();
    if (s && !isJunkId(s)) return s;
  }
  return "";
}

function buildLabel(train){
  const loco = getLoco(train);
  const tid = getTrainId(train);
  if (!loco && !tid) return "";
  if (loco && tid && loco !== tid) return `${loco} • ${tid}`;
  return loco || tid;
}

function formatLocal(dt){
  try {
    if (!dt) return "";
    const d = (dt instanceof Date) ? dt : new Date(dt);
    if (!isFinite(d.getTime())) return "";
    return d.toLocaleString("en-AU", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
  } catch {
    return "";
  }
}

function esc(v){
  return String(v ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function getCurrentPlaceFromTrain(train){
  const candidates = [
    train.current_location,
    train.currentLocation,
    train.location,
    train.place,
    train.town,
    train.suburb,
    train.city,
    train.locality,
    train.closest_town,
    train.closestTown,
    train.nearest_town,
    train.nearestTown,
    train.place_name,
    train.placeName,
    train.area
  ];

  for (const c of candidates){
    const s = String(c || "").trim();
    if (s) return s;
  }
  return "";
}

function getSpeed(train){
  const n = Number(train.speed || 0);
  return Number.isFinite(n) ? n : 0;
}

function getDescription(train){
  return String(
    train.vehicle_description ||
    train.vehicleDescription ||
    train.description ||
    train.serviceDesc ||
    ""
  ).trim();
}

function getOperator(train){
  return String(
    train.current_operator ||
    train.currentOperator ||
    train.operator ||
    ""
  ).trim();
}

function setStatusUI(lastText, noteText, countText) {
  document.getElementById('lastUpdate').textContent = lastText;
  document.getElementById('statusNote').textContent = noteText;
  document.getElementById('trainCount').textContent = countText;

  document.getElementById('mobileLastUpdate').textContent = lastText;
  document.getElementById('mobileStatusNote').textContent = noteText;
  document.getElementById('mobileTrainCount').textContent = countText;
}

async function reverseGeocodeTown(lat, lon){
  const key = `${Number(lat).toFixed(4)},${Number(lon).toFixed(4)}`;
  if (reverseGeoCache.has(key)) return reverseGeoCache.get(key);

  if (!REVERSE_GEOCODE_ENABLED || !Number.isFinite(Number(lat)) || !Number.isFinite(Number(lon))) {
    return "";
  }

  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=12&addressdetails=1`;
    const res = await fetch(url, {
      headers: { "Accept": "application/json" },
      cache: "force-cache"
    });

    if (!res.ok) throw new Error(`Reverse geocode HTTP ${res.status}`);

    const data = await res.json();
    const a = data.address || {};
    const place =
      a.city ||
      a.town ||
      a.village ||
      a.suburb ||
      a.hamlet ||
      a.municipality ||
      a.county ||
      a.state_district ||
      data.name ||
      "";

    reverseGeoCache.set(key, place || "");
    return place || "";
  } catch (err) {
    console.warn("Reverse geocode failed:", err);
    reverseGeoCache.set(key, "");
    return "";
  }
}

if (typeof window.ol === "undefined") {
  alert("OpenLayers failed to load. Upload ./ol/ol.js and ./ol/ol.css to your site.");
  throw new Error("OpenLayers still missing");
}

const map = new ol.Map({
  target: 'map',
  layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
  view: new ol.View({
    center: ol.proj.fromLonLat([133.7751, -25.2744]),
    zoom: 4,
    maxZoom: 18
  })
});

map.getView().on('change:rotation', () => map.getView().setRotation(0));

const railLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png' }),
  visible: true,
  zIndex: 1
});

railLayer.on('prerender', (e)=>{ if (e.context) e.context.filter='hue-rotate(200deg) brightness(0.95) saturate(1.6)'; });
railLayer.on('postrender', (e)=>{ if (e.context) e.context.filter='none'; });

const stationsLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/stations/{z}/{x}/{y}.png' }),
  visible: true,
  zIndex: 2
});

map.addLayer(railLayer);
map.addLayer(stationsLayer);

const ACCC_URL = 'https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer';

function createAcccLayer(id) {
  return new ol.layer.Tile({
    source: new ol.source.TileArcGISRest({
      url: ACCC_URL,
      params: { layers: `show:${id}`, dpi: 96, transparent: true, format: 'png32' }
    }),
    opacity: 0.45,
    visible: false,
    zIndex: 3
  });
}

const covTelstra = createAcccLayer(25);
const covOptus   = createAcccLayer(15);
const covTPG     = createAcccLayer(33);
const covAll     = createAcccLayer(4);
[covTelstra, covOptus, covTPG, covAll].forEach(l => map.addLayer(l));

const trainSource = new ol.source.Vector();
const trainLayer = new ol.layer.Vector({
  source: trainSource,
  visible: true,
  zIndex: 10,
  style: function(feature){
    const train = feature.get('train_data') || {};
    const label = buildLabel(train);
    const speed = getSpeed(train);
    const zoom = map.getView().getZoom() || 4;

    let dotColor = '#ffaa00';
    if (speed > 80) dotColor = '#ff4444';
    else if (speed > 30) dotColor = '#00cc00';
    else if (speed > 0) dotColor = '#44ff44';

    let radius = 7;
    if (zoom <= 5) radius = 5;
    else if (zoom <= 7) radius = 6;

    const styles = [
      new ol.style.Style({
        image: new ol.style.Circle({
          radius: isMobileLayout() ? Math.max(4, radius - 1) : radius,
          fill: new ol.style.Fill({ color: dotColor }),
          stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
        })
      })
    ];

    if (label && !isJunkId(label) && zoom >= 5) {
      let fontSize = 11;
      let offsetY = -18;
      let padding = [2, 8, 2, 8];

      if (zoom <= 5.5) {
        fontSize = 9;
        offsetY = -14;
        padding = [1, 5, 1, 5];
      } else if (zoom <= 7) {
        fontSize = 10;
        offsetY = -16;
        padding = [2, 6, 2, 6];
      }

      styles.push(new ol.style.Style({
        text: new ol.style.Text({
          text: label,
          font: `bold ${fontSize}px monospace`,
          fill: new ol.style.Fill({ color: '#ffaa00' }),
          stroke: new ol.style.Stroke({ color: '#000000', width: 3 }),
          offsetY: offsetY,
          backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.92)' }),
          padding: padding
        })
      }));
    }

    return styles;
  }
});

map.addLayer(trainLayer);

async function loadRealTrains() {
  const url = `${TRAINS_URL_BASE}?ts=${Date.now()}`;
  setStatusUI('Loading...', '…', '0');

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 12000);

  try {
    const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    const trains = Array.isArray(data.trains) ? data.trains : [];
    const updatedISO = data.lastUpdated || null;

    const localTs = updatedISO ? formatLocal(updatedISO) : formatLocal(new Date());
    const statusText = (data.note || 'ok').toString();

    if (trains.length === 0) {
      consecutiveEmpty += 1;
      if (lastGoodTrains.length > 0 && consecutiveEmpty < 3) {
        setStatusUI(
          localTs ? `Last: ${localTs}` : 'Last: (unknown)',
          `empty payload (${consecutiveEmpty})`,
          String(lastGoodTrains.length)
        );
        return;
      }
    } else {
      consecutiveEmpty = 0;
    }

    allTrains = trains;
    if (trains.length > 0) {
      lastGoodTrains = trains.slice();
      lastGoodUpdatedISO = updatedISO;
    }

    setStatusUI(
      localTs ? `Last: ${localTs}` : 'Last: (unknown)',
      statusText,
      String(trains.length)
    );

    trainSource.clear();

    trains.forEach(train => {
      const maybeId = train.id || train.train_number || train.trainNumber || train.trKey || "";
      const maybeName = train.train_name || train.loco || "";
      if (isJunkId(maybeId) && isJunkId(maybeName)) return;

      const lat = Number(train.lat);
      const lon = Number(train.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

      const feature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat]))
      });
      feature.set('train_data', train);
      trainSource.addFeature(feature);
    });

    trainLayer.changed();

  } catch (err) {
    console.error('Failed to load trains:', err);
    if (lastGoodUpdatedISO) {
      setStatusUI(
        `Last: ${formatLocal(lastGoodUpdatedISO)} (stale)`,
        'error',
        String(lastGoodTrains.length)
      );
    } else {
      setStatusUI('Update failed', 'error', '0');
    }
  } finally {
    clearTimeout(timeoutId);
  }
}

function removePopup() {
  if (popupOverlay) {
    map.removeOverlay(popupOverlay);
    popupOverlay = null;
  }
}

function renderPopupHTML(train, placeText, popupUpdated) {
  const label = buildLabel(train);
  const origin = train.origin || train.serviceFrom || '';
  const dest = train.destination || train.serviceTo || '';
  const speed = getSpeed(train);
  const desc = getDescription(train);
  const operator = getOperator(train);
  const km = train.km || train.trainKM || train.km_post || train.kmPost || 'Unknown';
  const lat = Number(train.lat);
  const lon = Number(train.lon);
  const locationText = placeText || "Looking up…";

  return `
    <button class="popup-close" id="popupCloseBtn" type="button">×</button>
    <div class="popup-header">${esc(label || "Train")} — ${esc(speed)} km/h</div>
    <div class="popup-subheader">Updated: ${esc(popupUpdated || 'Unknown')}</div>
    ${desc ? `<div class="popup-subheader">${esc(desc)}</div>` : ''}

    <div class="popup-grid">
      <div class="popup-label">Current place</div><div class="popup-value" id="popupCurrentPlace">${esc(locationText)}</div>
      <div class="popup-label">Origin</div><div class="popup-value">${esc(origin || 'Unknown')}</div>
      <div class="popup-label">Destination</div><div class="popup-value">${esc(dest || 'Unknown')}</div>
      <div class="popup-label">Current operator</div><div class="popup-value">${esc(operator || 'Unknown')}</div>
      <div class="popup-label">Vehicle description</div><div class="popup-value">${esc(desc || 'Unknown')}</div>
      <div class="popup-label">KM / post</div><div class="popup-value">${esc(km || 'Unknown')}</div>
      <div class="popup-label">Latitude</div><div class="popup-value">${Number.isFinite(lat) ? esc(lat.toFixed(5)) : 'Unknown'}</div>
      <div class="popup-label">Longitude</div><div class="popup-value">${Number.isFinite(lon) ? esc(lon.toFixed(5)) : 'Unknown'}</div>
    </div>

    <div class="popup-footer">
      ${getLoco(train) ? `<span class="popup-badge">Loco: ${esc(getLoco(train))}</span>` : ''}
      ${getTrainId(train) ? `<span class="popup-badge">Train: ${esc(getTrainId(train))}</span>` : ''}
      ${operator ? `<span class="popup-badge">${esc(operator)}</span>` : ''}
    </div>
  `;
}

async function showTrainPopup(feature) {
  removePopup();
  if (!feature) return;

  const train = feature.get('train_data') || {};
  const label = buildLabel(train);
  if (!label || isJunkId(label)) return;

  const coords = feature.getGeometry().getCoordinates();
  const popupUpdated = lastGoodUpdatedISO
    ? formatLocal(lastGoodUpdatedISO)
    : formatLocal(new Date());

  const directPlace = getCurrentPlaceFromTrain(train);
  const lat = Number(train.lat);
  const lon = Number(train.lon);

  const popupDiv = document.createElement('div');
  popupDiv.className = 'train-popup';
  popupDiv.innerHTML = renderPopupHTML(train, directPlace || (REVERSE_GEOCODE_ENABLED ? "Looking up…" : "Unknown"), popupUpdated);

  popupOverlay = new ol.Overlay({
    element: popupDiv,
    position: coords,
    positioning: 'bottom-center',
    offset: [0, -12]
  });

  map.addOverlay(popupOverlay);

  const closeBtn = popupDiv.querySelector('#popupCloseBtn');
  if (closeBtn) closeBtn.addEventListener('click', removePopup);

  if (!directPlace && REVERSE_GEOCODE_ENABLED && Number.isFinite(lat) && Number.isFinite(lon)) {
    const reqId = ++popupRequestId;
    const reversePlace = await reverseGeocodeTown(lat, lon);
    if (!popupOverlay || reqId !== popupRequestId) return;

    const placeEl = popupDiv.querySelector('#popupCurrentPlace');
    if (placeEl) {
      placeEl.textContent = reversePlace || 'Unknown';
    }
  }
}

map.on('singleclick', function(evt){
  const feature = map.forEachFeatureAtPixel(evt.pixel, function(f, layer){
    return layer === trainLayer ? f : null;
  });

  if (feature) showTrainPopup(feature);
  else removePopup();
});

map.on('pointermove', function(evt){
  if ('ontouchstart' in window) return;

  const feature = map.forEachFeatureAtPixel(evt.pixel, function(f, layer){
    return layer === trainLayer ? f : null;
  });

  if (feature) showTrainPopup(feature);
  else removePopup();
});

function displayId(train){
  return buildLabel(train);
}

function hideAutocomplete(){
  document.getElementById('autocompleteList').style.display = 'none';
  document.getElementById('mobileAutocompleteList').style.display = 'none';
}

function updateAutocompleteFor(inputEl, listEl){
  const query = inputEl.value.trim().toLowerCase();
  if (query.length < 2) {
    listEl.style.display = 'none';
    return;
  }

  const matches = [];
  const seen = new Set();

  for (const train of allTrains){
    const id = displayId(train);
    if (!id || isJunkId(id)) continue;

    const searchable = [
      displayId(train),
      train.train_number, train.trainNumber,
      train.trKey, train.loco, train.train_name, train.trainName,
      train.origin, train.destination, train.serviceFrom, train.serviceTo,
      train.description, train.serviceDesc,
      train.location, train.place, train.town, train.suburb, train.city
    ].filter(Boolean).map(s => String(s).toLowerCase());

    if (searchable.some(s => s.includes(query)) && !seen.has(id)){
      seen.add(id);
      matches.push({
        id,
        full: train,
        lat: Number(train.lat),
        lon: Number(train.lon)
      });
    }
  }

  if (matches.length === 0) {
    listEl.style.display = 'none';
    return;
  }

  listEl.innerHTML = '';
  matches.slice(0, 10).forEach(match => {
    const item = document.createElement('div');
    item.className = 'autocomplete-item';
    const o = match.full.origin || match.full.serviceFrom || '';
    const d = match.full.destination || match.full.serviceTo || '';
    item.innerHTML = `<span class="train-id">${esc(match.id)}</span><span class="train-loc">${esc(o)} → ${esc(d)}</span>`;
    item.addEventListener('click', () => {
      inputEl.value = match.id;
      listEl.style.display = 'none';
      flyToTrain(match.lat, match.lon);
    });
    listEl.appendChild(item);
  });

  listEl.style.display = 'block';
}

function wireSearchBox(inputId, buttonId, listId, isMobile) {
  const input = document.getElementById(inputId);
  const button = document.getElementById(buttonId);
  const list = document.getElementById(listId);

  input.addEventListener('input', () => {
    clearTimeout(isMobile ? mobileDebounceTimer : desktopDebounceTimer);
    const timer = setTimeout(() => updateAutocompleteFor(input, list), 180);
    if (isMobile) mobileDebounceTimer = timer;
    else desktopDebounceTimer = timer;
  });

  input.addEventListener('keypress', e => {
    if (e.key === 'Enter') searchTrainsFromInput(input);
  });

  button.addEventListener('click', () => searchTrainsFromInput(input));
}

function flyToTrain(lat, lon){
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
  map.getView().animate({ center: ol.proj.fromLonLat([lon, lat]), zoom: 12, duration: 850 });
}

function searchTrainsFromInput(inputEl){
  const query = inputEl.value.trim().toLowerCase();
  if (!query) return;

  for (const train of allTrains){
    const id = displayId(train);
    if (!id || isJunkId(id)) continue;

    const searchable = [
      id,
      train.train_number, train.trainNumber,
      train.trKey, train.loco, train.train_name, train.trainName,
      train.origin, train.destination,
      train.location, train.place, train.town, train.suburb, train.city
    ].filter(Boolean).map(s => String(s).toLowerCase());

    if (searchable.some(s => s.includes(query))){
      flyToTrain(Number(train.lat), Number(train.lon));
      hideAutocomplete();
      return;
    }
  }

  alert('No trains found matching: ' + query);
}

const stateBounds = {
  au: [112, -44, 154, -10],
  nsw: [141, -38, 154, -28],
  vic: [141, -40, 150, -34],
  qld: [138, -30, 154, -9],
  sa: [129, -40, 141, -25],
  wa: [112, -36, 129, -13],
  tas: [143, -44, 149, -39],
  nt: [129, -27, 138, -10]
};

function zoomTo(region){
  const bounds = stateBounds[region] || stateBounds.au;
  const extent = ol.proj.transformExtent(bounds, 'EPSG:4326', 'EPSG:3857');
  map.getView().fit(extent, { duration: 900, maxZoom: 10 });
}

function zoomToCurrent(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const center = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]);
    map.getView().animate({ center, zoom: 12, duration: 850 });
  });
}

function syncStateSelect(value) {
  document.getElementById('stateSelect').value = value;
  document.getElementById('mobileStateSelect').value = value;
}

document.getElementById('stateSelect').addEventListener('change', e => {
  syncStateSelect(e.target.value);
  zoomTo(e.target.value);
});

document.getElementById('mobileStateSelect').addEventListener('change', e => {
  syncStateSelect(e.target.value);
  zoomTo(e.target.value);
});

document.getElementById('locateBtn').addEventListener('click', zoomToCurrent);
document.getElementById('mobileLocateBtn').addEventListener('click', zoomToCurrent);

function toggleLayersPanel(){
  const panel = document.getElementById('layersPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

function hideLayersPanel(){
  document.getElementById('layersPanel').style.display = 'none';
}

document.getElementById('layersToggleBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleLayersPanel();
});

document.getElementById('mobileLayersBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleLayersPanel();
});

document.getElementById('trainLayerChk').addEventListener('change', e => trainLayer.setVisible(e.target.checked));
document.getElementById('railLayerChk').addEventListener('change', e => railLayer.setVisible(e.target.checked));
document.getElementById('stationsLayerChk').addEventListener('change', e => stationsLayer.setVisible(e.target.checked));
document.getElementById('covTelstraChk').addEventListener('change', e => covTelstra.setVisible(e.target.checked));
document.getElementById('covOptusChk').addEventListener('change', e => covOptus.setVisible(e.target.checked));
document.getElementById('covTPGChk').addEventListener('change', e => covTPG.setVisible(e.target.checked));
document.getElementById('covAllChk').addEventListener('change', e => covAll.setVisible(e.target.checked));

document.addEventListener('click', (e) => {
  const layersPanel = document.getElementById('layersPanel');
  const layersBtn = document.getElementById('layersToggleBtn');
  const mobileLayersBtn = document.getElementById('mobileLayersBtn');
  const searchContainer = document.getElementById('searchContainer');
  const topCard = document.getElementById('topCard');

  if (layersPanel.style.display !== 'none') {
    const clickedInsidePanel = layersPanel.contains(e.target);
    const clickedDesktopBtn = layersBtn.contains(e.target);
    const clickedMobileBtn = mobileLayersBtn.contains(e.target);
    if (!clickedInsidePanel && !clickedDesktopBtn && !clickedMobileBtn) hideLayersPanel();
  }

  if (document.getElementById('autocompleteList').style.display !== 'none') {
    const clickedInsideDesktopSearch = searchContainer.contains(e.target);
    if (!clickedInsideDesktopSearch) document.getElementById('autocompleteList').style.display = 'none';
  }

  if (document.getElementById('mobileAutocompleteList').style.display !== 'none') {
    const clickedInsideMobileSearch = topCard.contains(e.target);
    if (!clickedInsideMobileSearch) document.getElementById('mobileAutocompleteList').style.display = 'none';
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    hideAutocomplete();
    hideLayersPanel();
    removePopup();
  }
});

wireSearchBox('searchInput', 'searchBtn', 'autocompleteList', false);
wireSearchBox('mobileSearchInput', 'mobileSearchBtn', 'mobileAutocompleteList', true);

window.addEventListener('resize', () => {
  trainLayer.changed();
  hideAutocomplete();
  removePopup();
});

loadRealTrains();
setInterval(loadRealTrains, 30000);
zoomTo('au');
</script>
