<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps Train Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.1.0/ol.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { height: 100vh; width: 100%; }

    .panel{ position:absolute; top:16px; left:16px; z-index:1000;
      background:#121a2b; color:#e8eefc; border-radius:12px; padding:10px 12px;
      font:14px system-ui; }
    .btn{ border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06);
      color:#e8eefc; padding:6px 10px; border-radius:10px; cursor:pointer; margin:2px 0; }
    .btn[disabled]{ opacity:.6; cursor:wait; }
    .status{ font-size:12px; color:#b0c8ff; margin-top:6px }
    .error{ color:#ffb3b3 }
    .pulse{ width:14px; height:14px; border-radius:999px; background:#00e5ff;
      box-shadow:0 0 0 0 rgba(0,229,255,.7); border:2px solid #fff; animation:pulse 2s infinite; }
    @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(0,229,255,.7)}
      70%{box-shadow:0 0 0 14px rgba(0,229,255,0)} 100%{box-shadow:0 0 0 0 rgba(0,229,255,0)} }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <button class="btn" id="btn-load-rail">🚆 Load Railways (in view)</button>
    <button class="btn" id="btn-au">🇦🇺 Australia</button>
    <button class="btn" id="btn-locate">📍 My location</button>
    <div id="rail-status" class="status">Rail features: 0</div>
    <div id="cov-status" class="status">Coverage features: T=0, M=0, O=0</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js"></script>
  <script>
    // --- Base map ---
    const map = new ol.Map({
      target:'map',
      layers:[ new ol.layer.Tile({ source:new ol.source.OSM({ crossOrigin:'anonymous' }) }) ],
      view:new ol.View({ center:ol.proj.fromLonLat([133.7751,-25.2744]), zoom:4.5, minZoom:2, maxZoom:19 })
    });

    // --- Rail vector layer (dark styling) ---
    const railSource = new ol.source.Vector();
    const railLayer  = new ol.layer.Vector({
      source: railSource,
      style: f => new ol.style.Style({
        stroke: new ol.style.Stroke({
          color: (f.get('usage') === 'main' || f.get('class') === 'main') ? '#cc8800' : '#003366',
          width: (f.get('usage') === 'main' || f.get('class') === 'main') ? 5 : 4
        })
      }),
      visible: true
    });
    railLayer.setZIndex(10);
    map.addLayer(railLayer);

    // --- Coverage layers (semi-transparent fill + black outline) ---
    function tryCoverageLayer(fill, file){
      const src = new ol.source.Vector();
      return fetch(file,{cache:'no-store'}).then(r => {
        if(r.ok) return r.json(); throw 0;
      }).then(json => {
        const feats = new ol.format.GeoJSON().readFeatures(json,{featureProjection:'EPSG:3857'});
        src.addFeatures(feats);
        return new ol.layer.Vector({
          source: src,
          style: new ol.style.Style({
            fill:  new ol.style.Fill({ color: fill }),
            stroke:new ol.style.Stroke({ color:'#000000', width:2 })
          }),
          visible: true
        });
      }).catch(() => null);
    }

    let telstraLayer, mvnoLayer, optvLayer;
    Promise.all([
      tryCoverageLayer('rgba(0,176,255,0.35)','data/coverage/telstra_full.geojson'),
      tryCoverageLayer('rgba(102,187,106,0.35)','data/coverage/telstra_mvno.geojson'),
      tryCoverageLayer('rgba(244,67,54,0.35)','data/coverage/optus_vodafone.geojson')
    ]).then(([t,m,o])=>{
      telstraLayer=t; mvnoLayer=m; optvLayer=o;
      if (t) { t.setZIndex(4); map.addLayer(t); }
      if (m) { m.setZIndex(3); map.addLayer(m); }
      if (o) { o.setZIndex(2); map.addLayer(o); }
      updateCoverageStatus();
      [t?.getSource(), m?.getSource(), o?.getSource()].forEach(src=>{
        src && src.on('addfeature', updateCoverageStatus);
      });
    });

    // --- Buttons ---
    document.getElementById('btn-au').onclick=()=>map.getView().animate({center:ol.proj.fromLonLat([133.7751,-25.2744]), zoom:4.5, duration:600});
    document.getElementById('btn-locate').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{
      const xy=ol.proj.fromLonLat([p.coords.longitude,p.coords.latitude]);
      map.getView().animate({center:xy, zoom:12, duration:700});
    });

    // --- Overpass loader for railways ---
    const railStatus=document.getElementById('rail-status');
    async function loadRailFromOverpass(){
      try{
        railStatus.textContent='Loading railways in view…';
        const extent=ol.proj.transformExtent(map.getView().calculateExtent(map.getSize()),'EPSG:3857','EPSG:4326');
        const [minX,minY,maxX,maxY]=extent;
        const w=Math.abs(maxX-minX), h=Math.abs(maxY-minY);
        if(w>10||h>10){ railStatus.textContent='Zoom in more and try again (view too large)'; return; }

        const query=`[out:json][timeout:25];
          (way["railway"="rail"](${minY},${minX},${maxY},${maxX});
           way["railway"="light_rail"](${minY},${minX},${maxY},${maxX});
           way["railway"="subway"](${minY},${minX},${maxY},${maxX});); out geom;`;
        const res=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(query));
        if(!res.ok) throw new Error('Overpass error');
        const data=await res.json();
        const features=(data.elements||[])
          .filter(el=>el.type==='way'&&Array.isArray(el.geometry))
          .map(el=>({type:'Feature',
            properties:{name:(el.tags&&(el.tags.name||el.tags.ref))||'Rail',class:el.tags&&el.tags.usage,usage:el.tags&&el.tags.usage,railway:el.tags&&el.tags.railway},
            geometry:{type:'LineString',coordinates:el.geometry.map(pt=>[pt.lon,pt.lat])}}));
        railSource.clear();
        railSource.addFeatures(new ol.format.GeoJSON().readFeatures({type:'FeatureCollection',features},{featureProjection:'EPSG:3857'}));
        railStatus.textContent='Rail features: '+railSource.getFeatures().length;
      }catch(e){
        railStatus.textContent='Error loading rails. Try zooming in and trying again.';
        console.error(e);
      }
    }
    document.getElementById('btn-load-rail').onclick=loadRailFromOverpass;

    // --- Coverage status updater ---
    function updateCoverageStatus(){
      const t = telstraLayer?.getSource()?.getFeatures().length || 0;
      const m = mvnoLayer?.getSource()?.getFeatures().length || 0;
      const o = optvLayer?.getSource()?.getFeatures().length || 0;
      document.getElementById('cov-status').textContent = `Coverage features: T=${t}, M=${m}, O=${o}`;
    }
  </script>
</body>
</html>
