<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071326" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root{
  --panel-bg: rgba(8, 20, 38, 0.96);
  --panel-border: #2a4a7a;
  --panel-btn: #1e3a5f;
  --panel-btn-border: #3a6a9a;
  --accent: #ffaa00;
  --blue: #0b57cf;
  --text: #ffffff;
  --muted: #b8c9e8;
  --shadow: 0 8px 28px rgba(0,0,0,0.55);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: #071326;
}

body { overscroll-behavior: none; }

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  background: #0a1a2a;
}

.top-card, .toolbar, .status-bar, .search-box, .autocomplete-items, .layers-panel, .operator-panel {
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.top-card {
  position: absolute;
  top: calc(var(--safe-top) + 8px);
  left: calc(var(--safe-left) + 10px);
  right: calc(var(--safe-right) + 10px);
  z-index: 1000;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 8px;
  display: none;
}

.mobile-brand {
  color: var(--accent);
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 8px;
  line-height: 1.1;
}

.mobile-controls-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.mobile-controls-grid button,
.mobile-controls-grid select {
  width: 100%;
  min-width: 0;
  height: 40px;
  min-height: 40px;
  border-radius: 14px;
  border: 1px solid var(--panel-btn-border);
  background: var(--panel-btn);
  color: white;
  font-size: 13px;
  font-weight: 800;
  padding: 6px 10px;
  outline: none;
}

#mobileLayersBtn { grid-column: 1 / -1; }
#mobileOperatorBtn { grid-column: 1 / -1; }

.mobile-search-wrap { margin-bottom: 8px; }

.search-box {
  background: var(--panel-bg);
  border-radius: 16px;
  border: 1px solid var(--panel-border);
  display: flex;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.search-box input {
  flex: 1;
  min-width: 0;
  background: #15283f;
  border: 0;
  padding: 8px 11px;
  color: white;
  font-size: 13px;
  outline: none;
  height: 38px;
}

.search-box input::placeholder { color: #9ab0d0; }

.search-box button {
  background: var(--blue);
  border: 0;
  padding: 8px 12px;
  color: white;
  font-weight: 900;
  cursor: pointer;
  min-width: 78px;
  font-size: 13px;
  height: 38px;
}

.mobile-status-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  align-items: center;
}

.mobile-last {
  min-width: 0;
  color: white;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
}

.mobile-status-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.mobile-note,
.mobile-count {
  white-space: nowrap;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 900;
}

.mobile-note {
  background: #15283f;
  border: 1px solid #2b4f80;
  color: #cfe2ff;
}

.mobile-count {
  background: var(--blue);
  color: white;
  min-width: 58px;
  text-align: center;
}

.toolbar {
  position: absolute;
  top: calc(var(--safe-top) + 10px);
  left: calc(var(--safe-left) + 10px);
  z-index: 1000;
  background: var(--panel-bg);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 20px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 8px;
  align-items: center;
  border: 1px solid var(--panel-border);
  font-size: 13px;
  font-weight: 700;
}

.toolbar button,
.toolbar select {
  background: var(--panel-btn);
  color: white;
  border: 1px solid var(--panel-btn-border);
  border-radius: 14px;
  padding: 8px 11px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  outline: none;
}

.toolbar select option {
  background: #0b1522;
  color: #ffffff;
}

.search-container {
  position: absolute;
  top: calc(var(--safe-top) + 10px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  width: min(460px, calc(100vw - 430px));
}

.autocomplete-items {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  max-height: 320px;
  overflow-y: auto;
  z-index: 1001;
  box-shadow: var(--shadow);
}

.autocomplete-item {
  padding: 12px 14px;
  color: white;
  cursor: pointer;
  border-bottom: 1px solid #1e3a5f;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover { background: #13243a; }
.autocomplete-item .train-id { font-weight: 900; color: #cfe2ff; }
.autocomplete-item .train-loc {
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-bar {
  position: absolute;
  top: calc(var(--safe-top) + 10px);
  right: calc(var(--safe-right) + 10px);
  z-index: 1000;
  background: var(--panel-bg);
  color: white;
  padding: 8px 11px;
  border-radius: 20px;
  font-size: 12px;
  border: 1px solid var(--panel-border);
  display: flex;
  gap: 8px;
  align-items: center;
  box-shadow: var(--shadow);
}

.train-count {
  background: var(--blue);
  padding: 5px 10px;
  border-radius: 999px;
  font-weight: 900;
  min-width: 48px;
  text-align: center;
}

.note-pill {
  background: #15283f;
  border: 1px solid #2b4f80;
  padding: 5px 8px;
  border-radius: 999px;
  font-weight: 800;
  color: #cfe2ff;
}

.layers-panel,
.operator-panel {
  position: absolute;
  left: calc(var(--safe-left) + 12px);
  z-index: 1000;
  background: var(--panel-bg);
  color: white;
  border-radius: 18px;
  padding: 14px;
  border: 1px solid var(--panel-border);
  width: 300px;
  box-shadow: var(--shadow);
  max-height: 60dvh;
  overflow-y: auto;
}

.layers-panel { bottom: calc(var(--safe-bottom) + 12px); }
.operator-panel { top: calc(var(--safe-top) + 64px); display: none; }

.layer-row,
.operator-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #1e3a5f;
  font-size: 13px;
}

.layer-row:last-child,
.operator-row:last-child { border-bottom: none; }

.section-title {
  color: #9ab0d0;
  font-size: 12px;
  margin: 12px 0 4px 0;
}

.operator-actions {
  display: flex;
  gap: 8px;
  margin: 8px 0 10px 0;
  flex-wrap: wrap;
}

.operator-actions button {
  background: #163456;
  color: white;
  border: 1px solid #2b4f80;
  border-radius: 12px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.operator-search {
  width: 100%;
  border: 1px solid #2b4f80;
  background: #15283f;
  color: white;
  border-radius: 12px;
  padding: 8px 10px;
  font-size: 13px;
  outline: none;
  margin-bottom: 8px;
}

.train-popup {
  position: absolute;
  background: rgba(9, 20, 38, 0.98);
  color: white;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--panel-border);
  box-shadow: 0 10px 36px rgba(0,0,0,0.85);
  pointer-events: auto;
  transform: translate(-50%, -100%);
  min-width: 300px;
  max-width: min(390px, calc(100vw - 24px));
  z-index: 10000;
}

.train-popup::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border-width: 9px;
  border-style: solid;
  border-color: var(--panel-border) transparent transparent transparent;
}

.popup-header {
  font-size: 15px;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 6px;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 4px;
}

.popup-subheader {
  font-size: 12px;
  color: #9ab0d0;
  margin-bottom: 8px;
  font-style: italic;
}

.popup-grid {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 6px;
  font-size: 12px;
  margin: 6px 0;
}

.popup-label { color: #9ab0d0; font-weight: 800; }
.popup-value { color: white; word-break: break-word; }

.popup-badge {
  background: #15283f;
  border: 1px solid #2b4f80;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  display: inline-block;
  margin-right: 6px;
  margin-top: 6px;
  color: #cfe2ff;
}

.popup-footer {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px;
}

.popup-close {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #163456;
  border: 1px solid #2b4f80;
  color: white;
  border-radius: 10px;
  width: 28px;
  height: 28px;
  font-weight: 900;
  cursor: pointer;
}

@media (max-width: 900px) {
  .top-card { display: block; }
  .toolbar, .search-container, .status-bar { display: none !important; }

  .layers-panel,
  .operator-panel {
    left: calc(var(--safe-left) + 10px);
    right: calc(var(--safe-right) + 10px);
    width: auto;
    max-height: 45dvh;
  }

  .layers-panel { bottom: calc(var(--safe-bottom) + 10px); }
  .operator-panel { top: calc(var(--safe-top) + 250px); }

  .popup-grid {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .train-popup {
    min-width: 260px;
    max-width: calc(100vw - 20px);
  }
}

@media (min-width: 901px) {
  .top-card { display: none !important; }
}
</style>
</head>

<script>
const TRAINS_URL_BASE = "https://raw.githubusercontent.com/grahame21/railops-backend/main/trains.json";

const FALLBACK_OPERATORS = [
  "707 Operations","Adelaide Metro","ALARC","ARHS ACT","ARTC","Aurizon","B Rail Pty Ltd","Brimble Rail",
  "Byron Bay Railroad","Capital Region Heritage Rail","CBH Group","Chumrail","CMET","Crawfords","CRL",
  "DERMPAV","East Coast Heritage Rail","GemCo","Glencore","Goodwin Alco","GrainCorp",
  "Hunter Valley Railway Trust","John Holland Rail","Junee Railway Workshops","Knox Kershaw",
  "Lachlan Alco Locomotive Group","Lachlan Valley Railway","Laing O'Rourke","Linfox",
  "Lithgow State Mine Railway","Loram","Manildra Group","Metro Trains Melbourne","Mineral Resources",
  "Newcastle Transport","NSW TrainLink","NSW TrainLink Intercity","One Rail Australia","Pacific National",
  "Privately Owned","QUBE Logistics","Queensland Rail","Rail Motor Society Paterson","RailCorp",
  "RailFirst Asset Management","RailPower","Regional Connect","Retired Aus Locos","Rhomberg Rail",
  "Rollingstock","SCT Logistics","SETS","Seymour Railway Heritage Centre","Simoco Group",
  "Southern Shorthaul Railroad","Speno Rail Maintenance","Steamrail Victoria","Swietelski",
  "Swift Transport","Sydney Metro","Sydney Rail Services","Sydney Trains","Sydney Trains DMUs",
  "Sydney Trains Interurban","TasRail","Transdev Sydney","TransLink","Transport for NSW",
  "Transport Heritage NSW","Transport Sydney Trains","Transwa","UGL","V/Line","V/Line SG",
  "VicTrack","Watco Australia","Whitehaven","Yarra Trams"
];

const reverseGeoCache = new Map();
let popupOverlay = null;
let popupRequestId = 0;
let allTrains = [];
let lastGoodTrains = [];
let lastGoodUpdatedISO = null;
let consecutiveEmpty = 0;
let desktopDebounceTimer;
let mobileDebounceTimer;
let hiddenOperators = new Set();
let operatorList = [];
let selectedFeatureRef = null;

function isMobileLayout() {
  return window.matchMedia("(max-width: 900px)").matches;
}

function normalizeSearchText(v) {
  return String(v || "")
    .toLowerCase()
    .replace(/&/g, " and ")
    .replace(/[^a-z0-9]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function isJunkId(s){
  if (!s) return true;
  const v = String(s).toLowerCase();
  return v.startsWith("arrowmarkerssource_")
      || v.startsWith("markersource_")
      || v.startsWith("regtrainssource_")
      || v.startsWith("unregtrainssource_")
      || v.startsWith("trainsource_")
      || v.includes("arrowmarkerssource");
}

function getLoco(train){
  const candidates = [
    train.trKey, train.loco, train.loco_number, train.locoNumber,
    train.train_name, train.trainName, train.vehicle_number, train.vehicleNumber,
    train.name
  ];
  for (const c of candidates){
    if (!c) continue;
    const s = String(c).trim();
    if (s && !isJunkId(s)) return s;
  }
  return "";
}

function getTrainId(train){
  const candidates = [
    train.train_number, train.trainNumber, train.train_id, train.trainId,
    train.service_number, train.serviceNumber, train.id, train.ID
  ];
  for (const c of candidates){
    if (!c) continue;
    const s = String(c).trim();
    if (s && !isJunkId(s)) return s;
  }
  return "";
}

function buildLabel(train){
  const loco = getLoco(train);
  const tid = getTrainId(train);
  if (!loco && !tid) return "";
  if (loco && tid && loco !== tid) return `${loco} • ${tid}`;
  return loco || tid;
}

function formatLocal(dt){
  try {
    if (!dt) return "";
    const d = (dt instanceof Date) ? dt : new Date(dt);
    if (!isFinite(d.getTime())) return "";
    return d.toLocaleString("en-AU", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
  } catch {
    return "";
  }
}

function esc(v){
  return String(v ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function getCurrentPlaceFromTrain(train){
  const candidates = [
    train.current_location, train.currentLocation, train.location, train.place,
    train.town, train.suburb, train.city, train.locality,
    train.closest_town, train.closestTown, train.nearest_town, train.nearestTown,
    train.place_name, train.placeName, train.area, train.region, train.state
  ];
  for (const c of candidates){
    const s = String(c || "").trim();
    if (s) return s;
  }
  return "";
}

function getSpeed(train){
  const n = Number(train.speed || train.kph || train.kmh || 0);
  return Number.isFinite(n) ? n : 0;
}

function getDescription(train){
  return String(
    train.vehicle_description ||
    train.vehicleDescription ||
    train.description ||
    train.serviceDesc ||
    train.service_description ||
    train.serviceDescription ||
    ""
  ).trim();
}

function getOrigin(train){
  return String(
    train.origin ||
    train.serviceFrom ||
    train.from ||
    train.departure ||
    ""
  ).trim();
}

function getDestination(train){
  return String(
    train.destination ||
    train.serviceTo ||
    train.to ||
    train.arrival ||
    ""
  ).trim();
}

function getOperator(train){
  const candidates = [
    train.current_operator, train.currentOperator, train.current_operator_name, train.currentOperatorName,
    train.operator, train.Operator, train.operator_name, train.operatorName,
    train.company, train.Company, train.owner, train.Owner, train.railway, train.Railway,
    train.network, train.Network, train.line_operator, train.lineOperator,
    train.service_operator, train.serviceOperator
  ];
  for (const c of candidates) {
    const s = String(c || "").trim();
    if (s) return s;
  }
  return "";
}

function getHiddenCount() {
  return hiddenOperators.size;
}

function updateOperatorButtonLabels() {
  const text = `🚫 Hide Operators (${getHiddenCount()})`;
  document.getElementById("operatorBtn").textContent = text;
  document.getElementById("mobileOperatorBtn").textContent = text;
}

function trainPassesOperatorFilter(train) {
  const op = getOperator(train);
  if (!op) return true;
  return !hiddenOperators.has(op.toLowerCase());
}

function getVisibleTrains() {
  return allTrains.filter(trainPassesOperatorFilter);
}

function setStatusUI(lastText, noteText, countText) {
  document.getElementById('lastUpdate').textContent = lastText;
  document.getElementById('statusNote').textContent = noteText;
  document.getElementById('trainCount').textContent = countText;

async function reverseGeocodeTown(lat, lon){
  const key = `${Number(lat).toFixed(4)},${Number(lon).toFixed(4)}`;
  if (reverseGeoCache.has(key)) return reverseGeoCache.get(key);

  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=12&addressdetails=1`;
    const res = await fetch(url, { headers: { "Accept": "application/json" }, cache: "force-cache" });
    if (!res.ok) throw new Error(`Reverse geocode HTTP ${res.status}`);

    const data = await res.json();
    const a = data.address || {};
    const place =
      a.city || a.town || a.village || a.suburb || a.hamlet ||
      a.municipality || a.county || a.state_district || data.name || "";

    reverseGeoCache.set(key, place || "");
    return place || "";
  } catch {
    reverseGeoCache.set(key, "");
    return "";
  }
}

async function loadRealTrains() {
  const url = `${TRAINS_URL_BASE}?ts=${Date.now()}`;
  setStatusUI("Loading...", "…", "0");

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 12000);

  try {
    const response = await fetch(url, { cache: "no-store", signal: controller.signal });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const data = await response.json();
    const trains = Array.isArray(data.trains) ? data.trains : [];
    const updatedISO = data.lastUpdated || null;

    const localTs = updatedISO ? formatLocal(updatedISO) : formatLocal(new Date());
    const statusText = String(data.note || "ok");

    if (trains.length === 0) {
      consecutiveEmpty += 1;
      if (lastGoodTrains.length > 0 && consecutiveEmpty < 3) {
        setStatusUI(
          localTs ? `Last: ${localTs}` : "Last: (unknown)",
          `empty payload (${consecutiveEmpty})`,
          String(lastGoodTrains.filter(trainPassesOperatorFilter).length)
        );
        return;
      }
    } else {
      consecutiveEmpty = 0;
    }

    allTrains = trains;
    if (trains.length > 0) {
      lastGoodTrains = trains.slice();
      lastGoodUpdatedISO = updatedISO;
    }

    buildOperatorList(allTrains);
    renderOperatorChecklist(document.getElementById("operatorSearchInput").value || "");
    updateOperatorButtonLabels();

    const visibleTrains = getVisibleTrains();

    setStatusUI(
      localTs ? `Last: ${localTs}` : "Last: (unknown)",
      statusText,
      String(visibleTrains.length)
    );

    trainSource.clear();

    visibleTrains.forEach(train => {
      const maybeId = train.id || train.train_number || train.trainNumber || train.trKey || "";
      const maybeName = train.train_name || train.loco || "";
      if (isJunkId(maybeId) && isJunkId(maybeName)) return;

      const lat = Number(train.lat);
      const lon = Number(train.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

      const feature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat]))
      });
      feature.set("train_data", train);
      trainSource.addFeature(feature);
    });

    trainLayer.changed();

  } catch (err) {
    console.error("Failed to load trains:", err);
    if (lastGoodUpdatedISO) {
      setStatusUI(
        `Last: ${formatLocal(lastGoodUpdatedISO)} (stale)`,
        "error",
        String(lastGoodTrains.filter(trainPassesOperatorFilter).length)
      );
    } else {
      setStatusUI("Update failed", "error", "0");
    }
  } finally {
    clearTimeout(timeoutId);
  }
}

      <div class="popup-label">Latitude</div><div class="popup-value">${Number.isFinite(lat) ? esc(lat.toFixed(5)) : "Unknown"}</div>
      <div class="popup-label">Longitude</div><div class="popup-value">${Number.isFinite(lon) ? esc(lon.toFixed(5)) : "Unknown"}</div>

async function showTrainPopup(feature) {
  if (!feature) return;

  removePopup();
  selectedFeatureRef = feature;
  trainLayer.changed();

  const train = feature.get("train_data") || {};
  const label = buildLabel(train);
  if (!label || isJunkId(label)) return;

  const coords = feature.getGeometry().getCoordinates();
  const popupUpdated = lastGoodUpdatedISO ? formatLocal(lastGoodUpdatedISO) : formatLocal(new Date());
  const directPlace = getCurrentPlaceFromTrain(train);
  const lat = Number(train.lat);
  const lon = Number(train.lon);

  const popupDiv = document.createElement("div");
  popupDiv.className = "train-popup";
  popupDiv.innerHTML = renderPopupHTML(train, directPlace || "Looking up…", popupUpdated);

  popupOverlay = new ol.Overlay({
    element: popupDiv,
    position: coords,
    positioning: "bottom-center",
    offset: [0, -12]
  });

  map.addOverlay(popupOverlay);

  const closeBtn = popupDiv.querySelector("#popupCloseBtn");
  if (closeBtn) closeBtn.addEventListener("click", removePopup);

  if (!directPlace && Number.isFinite(lat) && Number.isFinite(lon)) {
    const reqId = ++popupRequestId;
    const reversePlace = await reverseGeocodeTown(lat, lon);
    if (!popupOverlay || reqId !== popupRequestId) return;

    const placeEl = popupDiv.querySelector("#popupCurrentPlace");
    if (placeEl) placeEl.textContent = reversePlace || "Unknown";
  }
}

function hideAutocomplete(){
  document.getElementById("autocompleteList").style.display = "none";
  document.getElementById("mobileAutocompleteList").style.display = "none";
}

function updateAutocompleteFor(inputEl, listEl){
  const query = normalizeSearchText(inputEl.value);
  if (query.length < 2) {
    listEl.style.display = "none";
    return;
  }

  const matches = [];
  const seen = new Set();

  for (const train of getVisibleTrains()){
    const id = displayId(train);
    if (!id || isJunkId(id)) continue;

    const searchable = getSearchFields(train);
    if (searchable.some(s => s.includes(query)) && !seen.has(id)){
      seen.add(id);
      matches.push({
        id,
        full: train,
        lat: Number(train.lat),
        lon: Number(train.lon)
      });
    }
  }

  if (matches.length === 0) {
    listEl.style.display = "none";
    return;
  }

  listEl.innerHTML = "";
  matches.slice(0, 15).forEach(match => {
    const place = getCurrentPlaceFromTrain(match.full);
    const o = getOrigin(match.full);
    const d = getDestination(match.full);
    const operator = getOperator(match.full);
    const rightText = place || (o || d ? `${o || "?"} → ${d || "?"}` : "") || operator || "";

    const item = document.createElement("div");
    item.className = "autocomplete-item";
    item.innerHTML = `
      <span class="train-id">${esc(match.id)}</span>
      <span class="train-loc">${esc(rightText)}</span>
    `;

    item.addEventListener("click", () => {
      inputEl.value = match.id;
      listEl.style.display = "none";
      flyToMatches([match.full]);
    });

    listEl.appendChild(item);
  });

  listEl.style.display = "block";
}

function wireSearchBox(inputId, buttonId, listId, isMobile) {
  const input = document.getElementById(inputId);
  const button = document.getElementById(buttonId);
  const list = document.getElementById(listId);

  input.addEventListener("input", () => {
    clearTimeout(isMobile ? mobileDebounceTimer : desktopDebounceTimer);
    const timer = setTimeout(() => updateAutocompleteFor(input, list), 180);
    if (isMobile) mobileDebounceTimer = timer;
    else desktopDebounceTimer = timer;
  });

  input.addEventListener("keypress", e => {
    if (e.key === "Enter") searchTrainsFromInput(input);
  });

  button.addEventListener("click", () => searchTrainsFromInput(input));
}

function flyToMatches(trains){
  const valid = trains.filter(t => Number.isFinite(Number(t.lat)) && Number.isFinite(Number(t.lon)));
  if (valid.length === 0) return;

  if (valid.length === 1) {
    const train = valid[0];
    const center = ol.proj.fromLonLat([Number(train.lon), Number(train.lat)]);
    map.getView().animate({
      center,
      zoom: 11,
      duration: 850
    });

    setTimeout(() => {
      const target = trainSource.getFeatures().find(f => {
        const td = f.get("train_data") || {};
        return buildLabel(td) === buildLabel(train);
      });
      if (target) showTrainPopup(target);
    }, 900);
    return;
  }

  let extent = ol.extent.createEmpty();
  valid.forEach(train => {
    const coord = ol.proj.fromLonLat([Number(train.lon), Number(train.lat)]);
    ol.extent.extend(extent, [coord[0], coord[1], coord[0], coord[1]]);
  });

  map.getView().fit(extent, {
    duration: 850,
    padding: [90, 90, 90, 90],
    maxZoom: 9
  });
}

function searchTrainsFromInput(inputEl){
  const query = normalizeSearchText(inputEl.value);
  if (!query) return;

  const matches = [];

  for (const train of getVisibleTrains()){
    const id = displayId(train);
    if (!id || isJunkId(id)) continue;

    const searchable = getSearchFields(train);
    if (searchable.some(s => s.includes(query))) {
      matches.push(train);
    }
  }

  if (matches.length === 0) {
    alert("No trains or locations found matching: " + inputEl.value);
    return;
  }

  hideAutocomplete();
  flyToMatches(matches);
}

function zoomTo(region){
  const bounds = stateBounds[region] || stateBounds.au;
  const extent = ol.proj.transformExtent(bounds, "EPSG:4326", "EPSG:3857");
  map.getView().fit(extent, { duration: 900, maxZoom: 10 });
}

function zoomToCurrent(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const center = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]);
    map.getView().animate({ center, zoom: 12, duration: 850 });
  });
}
