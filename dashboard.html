<!-- RAILS overlay (OpenRailwayMap standard style) -->
<script>
  // Remove or comment out the GA rails code you had:
  // const gaUrl = OPT.sources.gaRails;
  // const gaRails = new ol.layer.Tile({ ... });
  // map.addLayer(gaRails);
  // ...

  // Add this instead:
  const ormRails = new ol.layer.Tile({
    source: new ol.source.XYZ({
      url: 'https://tile.openrailwaymap.org/standard/{z}/{x}/{y}.png',
      crossOrigin: 'anonymous',
      maxZoom: 19
    }),
    visible: !!OPT.layers.rail,
    opacity: 0.85
  });
  map.addLayer(ormRails);

  // Hook into your existing HUD toggle
  hud.rail.onchange = ()=>{
    OPT.layers.rail = hud.rail.checked;
    ormRails.setVisible(OPT.layers.rail);
    saveOpts();
  };
</script>
