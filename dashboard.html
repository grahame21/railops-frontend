<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailOps Dashboard</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0b1a2a;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #d8e8f3;
    }

    .topbar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .topbar-left {
      flex: 1 1 auto;
      min-width: 0;
    }

    .topbar-right {
      flex: 0 0 auto;
    }

    .brand,
    .top-control,
    .search-wrap,
    .status-pill,
    .count-pill,
    .logout-btn {
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 6px 16px rgba(0,0,0,0.22);
    }

    .brand {
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: rgba(5, 16, 37, 0.96);
      color: #ffb11a;
      font-weight: 800;
      font-size: 24px;
      white-space: nowrap;
    }

    .top-control {
      padding: 0 14px;
      background: rgba(14, 46, 96, 0.94);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      min-width: 90px;
    }

    select.top-control,
    button.top-control,
    .logout-btn,
    .search-btn {
      cursor: pointer;
    }

    .search-wrap {
      display: flex;
      align-items: stretch;
      overflow: hidden;
      background: rgba(14, 46, 96, 0.94);
      min-width: 320px;
      max-width: 520px;
      flex: 1 1 420px;
    }

    .search-input {
      flex: 1;
      min-width: 120px;
      border: 0;
      outline: none;
      background: transparent;
      color: #fff;
      font-size: 14px;
      padding: 0 14px;
    }

    .search-input::placeholder {
      color: rgba(255,255,255,0.72);
    }

    .search-btn {
      border: 0;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, #2581ff, #0c5bdd);
    }

    .status-pill,
    .count-pill,
    .logout-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      background: rgba(5, 16, 37, 0.96);
    }

    .count-pill {
      min-width: 56px;
      background: linear-gradient(180deg, #2581ff, #0c5bdd);
    }

    .logout-btn {
      border: 0;
      background: linear-gradient(180deg, #23395f, #152743);
    }

    .panel {
      position: absolute;
      top: 64px;
      left: 14px;
      z-index: 1001;
      width: 280px;
      max-width: calc(100vw - 28px);
      background: rgba(9, 19, 35, 0.96);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
      display: none;
    }

    .panel h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #8ec5ff;
    }

    .layer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      font-size: 14px;
      font-weight: 600;
    }

    .layer-item input {
      transform: scale(1.05);
    }

    #popup {
      position: absolute;
      min-width: 280px;
      max-width: 420px;
      background: rgba(18, 22, 29, 0.98);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
      font-size: 13px;
    }

    .popup-header {
      background: #0d67ad;
      padding: 10px 12px;
      font-weight: 800;
      line-height: 1.25;
    }

    .popup-header .main {
      font-size: 17px;
    }

    .popup-header .sub {
      margin-top: 2px;
      font-size: 13px;
    }

    .popup-body {
      display: grid;
      grid-template-columns: 90px 1fr;
      min-height: 180px;
    }

    .popup-left {
      background: #20242a;
      padding: 10px 8px;
      border-right: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }

    .status-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      margin: 0 auto 8px auto;
      background: #666;
    }

    .status-dot.green { background: #24c85b; }
    .status-dot.orange { background: #ff9a1f; }
    .status-dot.red { background: #ef4747; }
    .status-dot.gray { background: #777; }

    .popup-left .big {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .popup-left .label {
      font-size: 10px;
      font-weight: 800;
      margin-top: 10px;
      opacity: 0.95;
    }

    .popup-left .value {
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
    }

    .popup-right {
      background: #1a1a1c;
    }

    .row {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 7px 10px;
    }

    .row .label {
      font-size: 10px;
      font-weight: 800;
      opacity: 0.95;
    }

    .row .value {
      font-size: 15px;
      margin-top: 2px;
      line-height: 1.25;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .cell {
      padding: 7px 10px;
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .cell:last-child {
      border-right: 0;
    }

    @media (max-width: 1200px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .search-wrap {
        max-width: 100%;
      }
    }

    @media (max-width: 800px) {
      .brand { font-size: 20px; }
      .top-control,
      .search-input,
      .search-btn,
      .status-pill,
      .count-pill,
      .logout-btn { font-size: 13px; }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="topbar">
    <div class="topbar-left">
      <div class="brand">🚂 RailOps</div>

      <select id="stateSelect" class="top-control">

      <button id="layersBtn" class="top-control">🗺️ Layers</button>

      <select id="operatorExclude" class="top-control">
        <option value="NONE" selected>Hide No Operator</option>
        <option>707 Operations</option>
        <option>Adelaide Metro</option>
        <option>ALARC</option>
        <option>ARHS ACT</option>

        <option>Capital Region Heritage Rail</option>
        <option>CBH Group</option>
        <option>Chumrail</option>
        <option>CMET</option>
        <option>Crawfords</option>
        <option>CRL</option>
        <option>DERMPAV</option>
        <option>East Coast Heritage Rail</option>
        <option>GemCo</option>
        <option>Glencore</option>
        <option>Goodwin Alco</option>
        <option>GrainCorp</option>
        <option>Hunter Valley Railway Trust</option>
        <option>John Holland Rail</option>

        <option>Linfox</option>
        <option>Lithgow State Mine Railway</option>

      </select>

      <div class="search-wrap">
        <input id="searchInput" class="search-input" type="text" placeholder="Search train number, loco, origin, destination..." />
        <button id="searchBtn" class="search-btn">🔎 Search</button>
      </div>
    </div>

    <div class="topbar-right">
      <div id="lastUpdatedPill" class="status-pill">Last: --</div>
      <div id="statusPill" class="status-pill">ok - 0 trains</div>
      <div id="trainCountPill" class="count-pill">0</div>

  </div>

  <div id="layersPanel" class="panel">
    <h3>Layers</h3>

    <label class="layer-item"><input type="checkbox" id="toggleTrains" checked> <span>Live Trains</span></label>
    <label class="layer-item"><input type="checkbox" id="toggleRailLines"> <span>Rail Lines</span></label>
    <label class="layer-item"><input type="checkbox" id="toggleStations"> <span>Stations</span></label>
    <label class="layer-item"><input type="checkbox" id="toggleTelstra"> <span>Telstra Coverage</span></label>
    <label class="layer-item"><input type="checkbox" id="toggleOptus"> <span>Optus Coverage</span></label>
    <label class="layer-item"><input type="checkbox" id="toggleVodafone"> <span>Vodafone / TPG Coverage</span></label>
    <label class="layer-item"><input type="checkbox" id="toggleAllCoverage"> <span>All Networks</span></label>
  </div>

  <div id="popup"></div>

  <script>
    const TRAINS_URL = "./trains.json";
    const RAIL_LINES_URL = "./railways.geojson";
    const STATIONS_URL = "./stations.geojson";

    const stateSelect = document.getElementById("stateSelect");
    const myLocationBtn = document.getElementById("myLocationBtn");
    const layersBtn = document.getElementById("layersBtn");
    const layersPanel = document.getElementById("layersPanel");
    const operatorExclude = document.getElementById("operatorExclude");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const lastUpdatedPill = document.getElementById("lastUpdatedPill");
    const statusPill = document.getElementById("statusPill");
    const trainCountPill = document.getElementById("trainCountPill");
    const logoutBtn = document.getElementById("logoutBtn");

    const toggleTrains = document.getElementById("toggleTrains");
    const toggleRailLines = document.getElementById("toggleRailLines");
    const toggleStations = document.getElementById("toggleStations");
    const toggleTelstra = document.getElementById("toggleTelstra");
    const toggleOptus = document.getElementById("toggleOptus");
    const toggleVodafone = document.getElementById("toggleVodafone");
    const toggleAllCoverage = document.getElementById("toggleAllCoverage");

    let allTrains = [];
    let visibleTrains = [];
    let selectedTrainFeature = null;
    let lastGoodTrains = [];
    let lastGoodUpdatedISO = null;

    function normalise(v) {
      return String(v ?? "").trim().toLowerCase();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatLocalTime(iso) {
      if (!iso) return "--";
      try {
        return new Date(iso).toLocaleString("en-AU", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      } catch {
        return iso;
      }
    }

    function getValue(obj, keys) {
      for (const key of keys) {
        if (obj && obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== "") {
          return obj[key];
        }
      }
      return "";
    }

    function getLat(train) {
      const n = Number(getValue(train, ["lat", "latitude", "y"]));
      return Number.isFinite(n) ? n : null;
    }

    function getLon(train) {
      const n = Number(getValue(train, ["lon", "lng", "longitude", "x"]));
      return Number.isFinite(n) ? n : null;
    }

    function getLoco(train) {
      return getValue(train, ["loco", "loco_number", "locoNumber", "vehicle_number", "vehicleNumber", "unit", "vehicle", "name"]) || "Unknown";
    }

    function getTrainNumber(train) {
      return getValue(train, ["train_number", "trainNumber", "train_id", "trainId", "service_number", "serviceNumber", "id", "ID"]);
    }

    function getVehicleDescription(train) {
      return getValue(train, ["vehicle_description", "vehicleDescription", "description", "loco_class", "class"]);
    }

    function getServiceDescription(train) {
      return getValue(train, ["service_description", "serviceDescription", "service_name", "serviceName", "service"]);
    }

    function getCurrentOperator(train) {
      return getValue(train, ["current_operator", "currentOperator", "operator", "Operator", "company", "Company", "owner", "Owner", "railway", "Railway", "network", "Network"]) || "Unknown";
    }

    function getOrigin(train) {
      return getValue(train, ["origin", "from", "start", "departure", "origin_name"]);
    }

    function getDestination(train) {
      return getValue(train, ["destination", "to", "end", "arrival", "destination_name"]);
    }

    function getSpeed(train) {
      return getValue(train, ["speed", "speed_kmh", "kph", "kmh", "velocity"]);
    }

    function getStatus(train) {
      return getValue(train, ["status", "running_status", "movement_status"]) || "Unknown";
    }

    function getTimetabling(train) {
      return getValue(train, ["timetabling", "eta_text", "expected_text", "running_text"]);
    }

    function getUpdated(train) {
      return getValue(train, ["updated", "lastUpdated", "last_updated", "timestamp", "time"]);
    }

    function getKmPost(train) {
      return getValue(train, ["km_post", "kmPost", "kilometre_post", "kilometer_post"]);
    }

    function makeLabel(train) {
      const loco = getLoco(train);
      const trainNum = getTrainNumber(train);
      if (trainNum && normalise(trainNum) !== normalise(loco)) return `${loco} • ${trainNum}`;
      return loco;
    }

    function getSearchText(train) {
      return [
        getLoco(train),
        getTrainNumber(train),
        getVehicleDescription(train),
        getServiceDescription(train),
        getCurrentOperator(train),
        getOrigin(train),
        getDestination(train),
        getStatus(train)
      ].join(" ").toLowerCase();
    }

    function getDotClass(train) {
      const status = normalise(getStatus(train));
      const speed = Number(getSpeed(train));
      if (status.includes("late") || status.includes("delay")) return "red";
      if (status.includes("stop") || speed === 0) return "orange";
      if (status.includes("run") || status.includes("move") || speed > 0) return "green";
      return "gray";
    }

    function buildPopupHtml(train) {
      return `
        <div class="popup-header">
          <div class="main">${escapeHtml(getLoco(train))}${getTrainNumber(train) ? " - " + escapeHtml(getTrainNumber(train)) : ""}</div>
          <div class="sub">${escapeHtml(getServiceDescription(train) || makeLabel(train))}</div>
        </div>

        <div class="popup-body">
          <div class="popup-left">
            <div class="status-dot ${getDotClass(train)}"></div>
            <div class="big">${escapeHtml(getStatus(train))}</div>

            <div class="label">KM Post</div>
            <div class="value">${escapeHtml(getKmPost(train) || "-")}</div>

            <div class="label">Last Updated</div>
            <div class="value">${escapeHtml(formatLocalTime(getUpdated(train)))}</div>
          </div>

          <div class="popup-right">
            <div class="row">
              <div class="label">Vehicle Description</div>
              <div class="value">${escapeHtml(getVehicleDescription(train) || "-")}</div>
            </div>

            <div class="row">
              <div class="label">Timetabling</div>
              <div class="value">${escapeHtml(getTimetabling(train) || "-")}</div>
            </div>

            <div class="row">
              <div class="label">Current Operator</div>
              <div class="value">${escapeHtml(getCurrentOperator(train) || "-")}</div>
            </div>

            <div class="row">
              <div class="label">Service Description</div>
              <div class="value">${escapeHtml(getServiceDescription(train) || "-")}</div>
            </div>

            <div class="two-col">
              <div class="cell">
                <div class="label">Origin</div>
                <div class="value">${escapeHtml(getOrigin(train) || "-")}</div>
              </div>
              <div class="cell">
                <div class="label">Destination</div>
                <div class="value">${escapeHtml(getDestination(train) || "-")}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    const osmLayer = new ol.layer.Tile({
      source: new ol.source.OSM()
    });

    const railLinesLayer = new ol.layer.Vector({
      source: new ol.source.Vector(),
      visible: false,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({
          color: "#2f7cff",
          width: 2
        })
      })
    });

    const stationsLayer = new ol.layer.Vector({
      source: new ol.source.Vector(),
      visible: false,
      style: new ol.style.Style({
        image: new ol.style.Circle({
          radius: 4,
          fill: new ol.style.Fill({ color: "#ffbf00" }),
          stroke: new ol.style.Stroke({ color: "#fff", width: 1.2 })
        })
      })
    });

    const telstraLayer = new ol.layer.Tile({
      visible: false,
      source: new ol.source.TileArcGISRest({
        url: "https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer",
        params: { layers: "show:25" }
      }),
      opacity: 0.4
    });

    const optusLayer = new ol.layer.Tile({
      visible: false,
      source: new ol.source.TileArcGISRest({
        url: "https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer",
        params: { layers: "show:15" }
      }),
      opacity: 0.4
    });

    const vodafoneLayer = new ol.layer.Tile({
      visible: false,
      source: new ol.source.TileArcGISRest({
        url: "https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer",
        params: { layers: "show:33" }
      }),
      opacity: 0.4
    });

    const allCoverageLayer = new ol.layer.Tile({
      visible: false,
      source: new ol.source.TileArcGISRest({
        url: "https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer",
        params: { layers: "show:4" }
      }),
      opacity: 0.35
    });

    const trainSource = new ol.source.Vector();

    let map;

    function getTrainStyle(feature) {
      const train = feature.get("trainData") || {};
      const label = feature.get("label") || "";
      const zoom = map ? (map.getView().getZoom() || 4) : 4;
      const isSelected = feature === selectedTrainFeature;

      let radius = 4;
      let fontSize = 10;
      let offsetY = -14;

      if (zoom >= 10) {
        radius = 7;
        fontSize = 12;
        offsetY = -17;
      } else if (zoom >= 8) {
        radius = 6;
        fontSize = 11;
        offsetY = -16;
      } else if (zoom >= 6) {
        radius = 5;
        fontSize = 10;
        offsetY = -15;
      }

      let fillColor = "#33d65b";
      const status = normalise(getStatus(train));
      const speed = Number(getSpeed(train));

      if (status.includes("late") || status.includes("delay")) fillColor = "#ef4747";
      else if (status.includes("stop") || speed === 0) fillColor = "#f39b21";

      return new ol.style.Style({
        image: new ol.style.Circle({
          radius: isSelected ? radius + 2 : radius,
          fill: new ol.style.Fill({ color: fillColor }),
          stroke: new ol.style.Stroke({
            color: isSelected ? "#00d8ff" : "#fff",
            width: isSelected ? 3 : 2
          })
        }),
        text: new ol.style.Text({
          text: label,
          offsetY,
          font: `800 ${fontSize}px Segoe UI`,
          fill: new ol.style.Fill({ color: "#fff" }),
          stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.95)", width: 4 }),
          overflow: true
        })
      });
    }

    const trainLayer = new ol.layer.Vector({
      source: trainSource,
      visible: true,
      style: feature => getTrainStyle(feature)
    });

    map = new ol.Map({
      target: "map",
      layers: [
        osmLayer,
        telstraLayer,
        optusLayer,
        vodafoneLayer,
        allCoverageLayer,
        railLinesLayer,
        stationsLayer,
        trainLayer
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([134.5, -25.7]),
        zoom: 4.4,
        minZoom: 3,
        maxZoom: 18
      }),
      controls: ol.control.defaults({
        attribution: true,
        rotate: false
      })
    });

    const popupEl = document.getElementById("popup");
    const popupOverlay = new ol.Overlay({
      element: popupEl,
      positioning: "bottom-center",
      stopEvent: true,
      offset: [0, -15]
    });
    map.addOverlay(popupOverlay);

    function createTrainFeature(train) {
      const lat = getLat(train);
      const lon = getLon(train);
      if (lat === null || lon === null) return null;

      return new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
        trainData: train,
        label: makeLabel(train)
      });
    }

    function refreshOperatorListFromData(trains) {
      const existing = new Set(
        Array.from(operatorExclude.options).map(opt => normalise(opt.value))
      );

      const found = [...new Set(
        trains
          .map(t => getCurrentOperator(t))
          .filter(Boolean)
          .map(v => String(v).trim())
          .filter(v => v && normalise(v) !== "unknown")
      )].sort((a, b) => a.localeCompare(b));

      for (const op of found) {
        if (!existing.has(normalise(op))) {
          const option = document.createElement("option");
          option.value = op;
          option.textContent = op;
          operatorExclude.appendChild(option);
        }
      }
    }

    function renderTrains(trains) {
      trainSource.clear();

      const features = [];
      for (const train of trains) {
        const feature = createTrainFeature(train);
        if (feature) features.push(feature);
      }

      trainSource.addFeatures(features);
      trainCountPill.textContent = String(features.length);
      statusPill.textContent = `ok - ${features.length} trains`;

      if (selectedTrainFeature) {
        const oldLabel = makeLabel(selectedTrainFeature.get("trainData"));
        const replacement = features.find(f => makeLabel(f.get("trainData")) === oldLabel);
        if (replacement) {
          selectedTrainFeature = replacement;
          popupEl.innerHTML = buildPopupHtml(replacement.get("trainData"));
          popupOverlay.setPosition(replacement.getGeometry().getCoordinates());
        } else {
          selectedTrainFeature = null;
          popupOverlay.setPosition(undefined);
        }
      }
    }

    function applyFilters() {
      const hiddenOperator = operatorExclude.value;
      const query = normalise(searchInput.value);

      visibleTrains = allTrains.filter(train => {
        const op = getCurrentOperator(train);

        const operatorOk =
          hiddenOperator === "NONE" ||
          normalise(op) !== normalise(hiddenOperator);

        const searchOk =
          !query || getSearchText(train).includes(query);

        return operatorOk && searchOk;
      });

      renderTrains(visibleTrains);
    }

    async function loadGeoJsonToLayer(url, layer) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();

        const features = new ol.format.GeoJSON().readFeatures(data, {
          featureProjection: "EPSG:3857"
        });

        layer.getSource().clear();
        layer.getSource().addFeatures(features);
      } catch (err) {
        console.warn("Could not load", url, err);
      }
    }

    async function loadTrains() {
      try {
        const res = await fetch(`${TRAINS_URL}?_=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const trains = Array.isArray(data.trains) ? data.trains : [];

        if (trains.length > 0) {
          allTrains = trains;
          lastGoodTrains = trains;
          lastGoodUpdatedISO = data.lastUpdated || data.last_updated || new Date().toISOString();
        } else if (lastGoodTrains.length > 0) {
          allTrains = lastGoodTrains;
          statusPill.textContent = "empty payload - keeping last good";
        } else {
          allTrains = [];
        }

        refreshOperatorListFromData(allTrains);

        const updated = data.lastUpdated || data.last_updated || lastGoodUpdatedISO;
        lastUpdatedPill.textContent = `Last: ${formatLocalTime(updated)}`;

        applyFilters();
      } catch (err) {
        console.error("Train load failed:", err);

        if (lastGoodTrains.length > 0) {
          allTrains = lastGoodTrains;
          lastUpdatedPill.textContent = `Last: ${formatLocalTime(lastGoodUpdatedISO)}`;
          statusPill.textContent = "error - keeping last good";
          applyFilters();
        } else {
          statusPill.textContent = "error loading trains";
          trainCountPill.textContent = "0";
          trainSource.clear();
        }
      }
    }

    const stateExtents = {
      AU: [112.5, -44.8, 154.0, -9.0],
      NSW: [140.8, -37.7, 153.8, -28.0],
      VIC: [140.7, -39.3, 150.2, -33.8],
      QLD: [137.9, -29.5, 153.7, -10.0],
      SA: [129.0, -38.4, 141.2, -25.8],
      WA: [112.0, -35.3, 129.2, -13.6],
      TAS: [143.6, -43.9, 148.6, -39.0],
      NT: [129.0, -26.2, 138.1, -10.8],
      ACT: [148.76, -35.94, 149.40, -35.10]
    };

    function zoomToState(code) {
      const e = stateExtents[code];
      if (!e) return;
      const extent = ol.proj.transformExtent(e, "EPSG:4326", "EPSG:3857");
      map.getView().fit(extent, {
        padding: [80, 40, 40, 40],
        duration: 600
      });
    }

    stateSelect.addEventListener("change", () => zoomToState(stateSelect.value));

    myLocationBtn.addEventListener("click", () => {
      if (!navigator.geolocation) return alert("Geolocation not supported.");
      navigator.geolocation.getCurrentPosition(
        pos => {
          map.getView().animate({
            center: ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]),
            zoom: 11,
            duration: 700
          });
        },
        () => alert("Could not get your location.")
      );
    });

    layersBtn.addEventListener("click", () => {
      layersPanel.style.display = layersPanel.style.display === "block" ? "none" : "block";
    });

    document.addEventListener("click", e => {
      if (!layersPanel.contains(e.target) && !layersBtn.contains(e.target)) {
        layersPanel.style.display = "none";
      }
    });

    toggleTrains.addEventListener("change", () => trainLayer.setVisible(toggleTrains.checked));
    toggleRailLines.addEventListener("change", () => railLinesLayer.setVisible(toggleRailLines.checked));
    toggleStations.addEventListener("change", () => stationsLayer.setVisible(toggleStations.checked));
    toggleTelstra.addEventListener("change", () => telstraLayer.setVisible(toggleTelstra.checked));
    toggleOptus.addEventListener("change", () => optusLayer.setVisible(toggleOptus.checked));
    toggleVodafone.addEventListener("change", () => vodafoneLayer.setVisible(toggleVodafone.checked));
    toggleAllCoverage.addEventListener("change", () => allCoverageLayer.setVisible(toggleAllCoverage.checked));

    operatorExclude.addEventListener("change", applyFilters);
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") runSearch();
    });
    searchBtn.addEventListener("click", runSearch);

    function runSearch() {
      applyFilters();

      const q = normalise(searchInput.value);
      if (!q) return;

      const firstMatch = visibleTrains.find(t => getSearchText(t).includes(q));
      if (!firstMatch) return;

      const lon = getLon(firstMatch);
      const lat = getLat(firstMatch);
      if (lon === null || lat === null) return;

      map.getView().animate({
        center: ol.proj.fromLonLat([lon, lat]),
        zoom: Math.max(map.getView().getZoom() || 4, 8),
        duration: 700
      });

      setTimeout(() => {
        const feature = trainSource.getFeatures().find(f => makeLabel(f.get("trainData")) === makeLabel(firstMatch));
        if (feature) {
          selectedTrainFeature = feature;
          trainLayer.changed();
          popupEl.innerHTML = buildPopupHtml(feature.get("trainData"));
          popupOverlay.setPosition(feature.getGeometry().getCoordinates());
        }
      }, 750);
    }

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("railops_logged_in");
      window.location.href = "index.html";
    });

    map.on("singleclick", evt => {
      const feature = map.forEachFeatureAtPixel(evt.pixel, f => f, {
        layerFilter: layer => layer === trainLayer
      });

      if (feature) {
        selectedTrainFeature = feature;
        trainLayer.changed();
        popupEl.innerHTML = buildPopupHtml(feature.get("trainData"));
        popupOverlay.setPosition(feature.getGeometry().getCoordinates());
      } else {
        selectedTrainFeature = null;
        trainLayer.changed();
        popupOverlay.setPosition(undefined);
      }
    });

    loadGeoJsonToLayer(RAIL_LINES_URL, railLinesLayer);
    loadGeoJsonToLayer(STATIONS_URL, stationsLayer);
    loadTrains();
    setInterval(loadTrains, 60000);
  </script>
</body>
</html>
