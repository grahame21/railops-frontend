<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps Train Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <style>
    html, body { height: 100%; width: 100%; margin: 0; }
    #map { height: 100vh; width: 100%; border: 3px dashed #27ae60; box-sizing: border-box; }

    :root { --panel:#121a2b; --text:#e8eefc; --muted:#8fa3bf; --shadow:0 8px 28px rgba(0,0,0,.45); }
    .panel{
      position:absolute; top:16px; left:16px; z-index:1000;
      background:var(--panel); color:var(--text);
      border-radius:16px; box-shadow:var(--shadow);
      padding:12px; min-width:280px; border:1px solid rgba(255,255,255,.06);
      font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    .panel h3{ margin:0 0 8px; font-size:16px; font-weight:700; letter-spacing:.2px }
    .group{ margin:8px 0; padding:8px; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08) }
    .group label{ display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; user-select:none }
    .hint{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.3 }
    .legend{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px }
    .chip{ display:inline-flex; align-items:center; gap:8px; font-size:12px; padding:6px 8px; border-radius:999px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.04) }
    .swatch{ width:14px; height:14px; border-radius:3px; border:1px solid rgba(255,255,255,.2) }
    .btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px }
    .btn{ cursor:pointer; border:1px solid rgba(255,255,255,.14); background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.1)); color:var(--text); padding:8px 12px; border-radius:12px; font-size:14px; }
    .debug{ font-size:12px; color:#b0c8ff; margin-top:6px }

    .pulse{ width:14px; height:14px; border-radius:999px; background:#00e5ff; box-shadow:0 0 0 0 rgba(0,229,255,.7); border:2px solid #fff; animation:pulse 2s infinite; }
    @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(0,229,255,.7)} 70%{box-shadow:0 0 0 14px rgba(0,229,255,0)} 100%{box-shadow:0 0 0 0 rgba(0,229,255,0)} }

    .ol-popup { position:absolute; background:#fff; padding:10px 12px; border-radius:8px; border:1px solid #ccc; min-width:220px; box-shadow:0 6px 20px rgba(0,0,0,0.15); transform:translate(-50%,-100%); pointer-events:auto; font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial; }
    .ol-popup h3 { margin:0 0 6px; font-size:14px; line-height:1.2; }
    .ol-popup .close { position:absolute; top:6px; right:8px; border:0; background:transparent; font-size:18px; line-height:1; cursor:pointer; color:#999; }
    .ol-popup .close:hover { color:#333; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel" role="region" aria-label="Layer controls">
    <h3>Layers & Tools</h3>

    <div class="group">
      <label><input type="checkbox" id="toggle-rail" checked /> Railway lines</label>
      <div class="legend">
        <span class="chip"><span class="swatch" style="background:#ffd54f"></span>Mainline</span>
        <span class="chip"><span class="swatch" style="background:#81d4fa"></span>Other</span>
      </div>
      <div class="hint">Inline demos are enabled so you’ll see lines immediately.</div>
      <div id="dbg-rail" class="debug">Rail features: 0</div>
    </div>

    <div class="group">
      <label><input type="checkbox" id="toggle-telstra" checked /> Telstra (Full)</label>
      <label><input type="checkbox" id="toggle-mvno" checked /> Telstra MVNO</label>
      <label><input type="checkbox" id="toggle-optvod" checked /> Optus / Vodafone</label>
      <div class="legend">
        <span class="chip"><span class="swatch" style="background:rgba(0,176,255,.35)"></span>Telstra Full</span>
        <span class="chip"><span class="swatch" style="background:rgba(102,187,106,.35)"></span>Telstra MVNO</span>
        <span class="chip"><span class="swatch" style="background:rgba(244,67,54,.35)"></span>Optus/Vodafone</span>
      </div>
      <div id="dbg-cov" class="debug">Coverage features: T=0, M=0, O=0</div>
    </div>

    <div class="group">
      <div class="btnrow">
        <button class="btn" id="btn-locate">📍 My location</button>
        <button class="btn" id="btn-au">🇦🇺 Australia</button>
      </div>
    </div>
  </div>

  <div id="popup" class="ol-popup" style="display:none;">
    <button class="close" id="popup-close">×</button>
    <div id="popup-content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js"></script>
  <script>
    // --- Demo inline data: centered near Adelaide/Sydney/Melbourne so you’ll see it at zoom 4.5 ---
    const DEMO_RAIL = {"type":"FeatureCollection","features":[
      {"type":"Feature","properties":{"class":"main","name":"Transcontinental (demo)"},"geometry":{"type":"LineString","coordinates":[[132,-30],[138,-34],[146,-33],[151,-33.8]]}},
      {"type":"Feature","properties":{"class":"other","name":"Branch (demo)"},"geometry":{"type":"LineString","coordinates":[[140,-33],[143,-34],[146,-35]]}}
    ]};

    const DEMO_TELSTRA = {"type":"FeatureCollection","features":[
      {"type":"Feature","properties":{"provider":"Telstra Full","name":"Adelaide metro (demo)"},"geometry":{"type":"Polygon","coordinates":[[[138.35,-34.8],[138.75,-34.8],[138.75,-35.1],[138.35,-35.1],[138.35,-34.8]]]}}
    ]};

    const DEMO_MVNO = {"type":"FeatureCollection","features":[
      {"type":"Feature","properties":{"provider":"Telstra MVNO","name":"Sydney east (demo)"},"geometry":{"type":"Polygon","coordinates":[[[151.15,-33.8],[151.35,-33.8],[151.35,-34.05],[151.15,-34.05],[151.15,-33.8]]]}}
    ]};

    const DEMO_OPTVOD = {"type":"FeatureCollection","features":[
      {"type":"Feature","properties":{"provider":"Optus/Vodafone","name":"Melbourne east (demo)"},"geometry":{"type":"Polygon","coordinates":[[[145.0,-37.7],[145.35,-37.7],[145.35,-38.0],[145.0,-38.0],[145.0,-37.7]]]}}
    ]};

    // --- Map ---
    const map = new ol.Map({
      target:'map',
      layers:[ new ol.layer.Tile({ source:new ol.source.OSM({ crossOrigin:'anonymous' }) }) ],
      view:new ol.View({ center:ol.proj.fromLonLat([133.7751,-25.2744]), zoom:4.5, minZoom:2, maxZoom:19 })
    });

    const to3857 = (json) => new ol.format.GeoJSON().readFeatures(json,{featureProjection:'EPSG:3857'});

    // --- Rail layer (zIndex high so it sits on top) ---
    const railSource = new ol.source.Vector({ features: to3857(DEMO_RAIL) });
    const railLayer  = new ol.layer.Vector({
      source: railSource,
      style: f => new ol.style.Style({
        stroke: new ol.style.Stroke({
          color: f.get('class') === 'main' ? '#ffd54f' : '#81d4fa',
          width: f.get('class') === 'main' ? 4 : 3
        })
      }),
      visible: true
    });
    railLayer.setZIndex(10);
    map.addLayer(railLayer);

    // --- Coverage layers with fill + bold outline so they pop visually ---
    function covLayer(colorFill, colorStroke, json){
      return new ol.layer.Vector({
        source: new ol.source.Vector({ features: to3857(json) }),
        style: new ol.style.Style({
          fill:  new ol.style.Fill({ color: colorFill }),
          stroke:new ol.style.Stroke({ color: colorStroke, width: 2 })
        }),
        visible: true
      });
    }
    const telstraLayer = covLayer('rgba(0,176,255,0.35)', '#0aa0ff', DEMO_TELSTRA);
    const mvnoLayer    = covLayer('rgba(102,187,106,0.35)', '#2e7d32', DEMO_MVNO);
    const optVodLayer  = covLayer('rgba(244,67,54,0.35)',  '#c62828', DEMO_OPTVOD);

    telstraLayer.setZIndex(4);
    mvnoLayer.setZIndex(3);
    optVodLayer.setZIndex(2);
    map.addLayer(telstraLayer);
    map.addLayer(mvnoLayer);
    map.addLayer(optVodLayer);

    // --- Controls wiring ---
    const $ = (id)=>document.getElementById(id);
    $('toggle-rail').addEventListener('change', e=> railLayer.setVisible(e.target.checked));
    $('toggle-telstra').addEventListener('change', e=> telstraLayer.setVisible(e.target.checked));
    $('toggle-mvno').addEventListener('change', e=> mvnoLayer.setVisible(e.target.checked));
    $('toggle-optvod').addEventListener('change', e=> optVodLayer.setVisible(e.target.checked));
    $('btn-au').addEventListener('click', ()=> map.getView().animate({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 4.5, duration: 600 }));

    // --- Geolocate ---
    const markerEl = document.createElement('div'); markerEl.className = 'pulse';
    const marker = new ol.Overlay({ element: markerEl, positioning: 'center-center', stopEvent: false, zIndex: 20 });
    map.addOverlay(marker);
    $('btn-locate').addEventListener('click', ()=>{
      if(!('geolocation' in navigator)) return alert('Geolocation not available.');
      navigator.geolocation.getCurrentPosition(
        (pos)=>{ const xy = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]); marker.setPosition(xy); map.getView().animate({ center: xy, zoom: 12, duration: 700 }); },
        ()=> alert('Unable to get your location. Check permissions.'),
        { enableHighAccuracy:true, timeout:8000, maximumAge:0 }
      );
    });

    // --- Popup for feature info ---
    const popupEl = document.getElementById('popup');
    const popupContent = document.getElementById('popup-content');
    const popupClose = document.getElementById('popup-close');
    const popup = new ol.Overlay({ element: popupEl, offset: [0, -12], positioning: 'bottom-center', stopEvent: true });
    map.addOverlay(popup);
    popupClose.addEventListener('click', ()=> (popupEl.style.display='none'));
    map.on('singleclick', (evt)=>{
      const feats = map.getFeaturesAtPixel(evt.pixel);
      if(!feats || !feats.length){ popupEl.style.display='none'; return; }
      const f = feats[0];
      const props = f.getProperties();
      const shown = Object.fromEntries(Object.entries(props).filter(([k]) => k !== 'geometry'));
      const rows = Object.keys(shown).length
        ? Object.entries(shown).map(([k,v]) => `<tr><td>${k}</td><td>${String(v)}</td></tr>`).join('')
        : `<tr><td colspan="2">No attributes</td></tr>`;
      popupContent.innerHTML = `<h3>${shown.name || shown.provider || shown.operator || 'Feature'}</h3><table>${rows}</table>`;
      popup.setPosition(evt.coordinate);
      popupEl.style.display = 'block';
    });

    // --- Debug counters so you can confirm features are present ---
    const dbgRail = document.getElementById('dbg-rail');
    const dbgCov  = document.getElementById('dbg-cov');
    function updateDebug(){
      const r = railSource.getFeatures().length;
      const t = telstraLayer.getSource().getFeatures().length;
      const m = mvnoLayer.getSource().getFeatures().length;
      const o = optVodLayer.getSource().getFeatures().length;
      dbgRail.textContent = `Rail features: ${r}`;
      dbgCov.textContent  = `Coverage features: T=${t}, M=${m}, O=${o}`;
    }
    updateDebug();
    [railSource, telstraLayer.getSource(), mvnoLayer.getSource(), optVodLayer.getSource()].forEach(src=>{
      src.on('addfeature', updateDebug);
      src.on('clear', updateDebug);
      src.on('removefeature', updateDebug);
    });
  </script>
</body>
</html>
