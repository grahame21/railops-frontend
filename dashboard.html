<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RailOps Train Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- OpenLayers via CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.1.0/ol.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js"></script>

  <style>
    html, body { margin:0; height:100%; }
    #map { height:100vh; width:100%; }

    /* HUD panel */
    .hud {
      position: fixed; top: 10px; left: 10px; z-index: 9999;
      background: rgba(18,26,43,.9); color: #e8eefc;
      border: 1px solid rgba(255,255,255,.15); border-radius: 12px;
      padding: 10px 12px; font: 13px system-ui, -apple-system, Segoe UI, Roboto, Arial;
      box-shadow: 0 10px 30px rgba(0,0,0,.35); min-width: 240px;
      backdrop-filter: saturate(1.1) blur(4px);
    }
    .hud h3 { margin: 0 0 6px; font-size: 14px; }
    .hud .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    .hud label { display:flex; align-items:center; gap:6px; line-height:1.2; }
    .hud .clock { margin-top: 8px; font-weight: 600; text-align: center; }
    .hud .tz { font-size: 11px; color: #9fb2cf; text-align: center; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- On-map HUD with toggles + clock -->
  <div class="hud" id="hud" role="region" aria-label="Map controls">
    <h3>Layers</h3>
    <div class="row">
      <label><input type="checkbox" id="t-rail"> Rails</label>
      <label><input type="checkbox" id="t-km"> KM2ME</label>
      <label><input type="checkbox" id="t-locate"> My location</label>
      <label><input type="checkbox" id="t-coverage"> Coverage (ACCC)</label>
    </div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="tz" id="tz">—</div>
  </div>

  <script>
    // ---- Read Admin options from localStorage ----
    const _opts = JSON.parse(localStorage.getItem('railops.options') || '{}');
    const OPT = {
      layers: Object.assign(
        { rail:true, km:false, locate:true, coverage:false }, // coverage default off
        _opts.layers || {}
      ),
      railStyle: Object.assign({ color:'#000000', width:3 }, _opts.railStyle || {}),
      sources: Object.assign(
        { km2me:'', overpass:'https://overpass-api.de/api/interpreter' },
        _opts.sources || {}
      )
    };

    // ---- Base map ----
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM({ crossOrigin: 'anonymous' })
        })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([133.7751, -25.2744]), // Australia
        zoom: 4.8
      })
    });

    // Utility: debounce
    function debounce(fn, ms) { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

    // ---- Railway lines (Overpass) ----
    const railSrc = new ol.source.Vector();
    const railLayer = new ol.layer.Vector({
      source: railSrc,
      visible: !!OPT.layers.rail,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({
          color: OPT.railStyle.color || '#000000',
          width: Math.max(1, OPT.railStyle.width || 3)
        })
      })
    });
    map.addLayer(railLayer);

    async function fetchRailsForView() {
      if (!OPT.layers.rail) return;
      const extent = map.getView().calculateExtent(map.getSize());
      const world = ol.proj.transformExtent(extent, 'EPSG:3857', 'EPSG:4326');
      const [minX, minY, maxX, maxY] = world;
      const q = `
        [out:json][timeout:25];
        (
          way["railway"~"^(rail|light_rail|subway)$"]["service"!~".*"](${minY},${minX},${maxY},${maxX});
        );
        out geom;`;
      try {
        const resp = await fetch(OPT.sources.overpass, {
          method: 'POST',
          headers: { 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' },
          body: 'data=' + encodeURIComponent(q)
        });
        const data = await resp.json();
        const feats = (data.elements || [])
          .filter(el => el.type === 'way' && Array.isArray(el.geometry))
          .map(el => new ol.Feature({
            geometry: new ol.geom.LineString(
              el.geometry.map(p => ol.proj.fromLonLat([p.lon, p.lat]))
            )
          }));
        railSrc.clear(true);
        railSrc.addFeatures(feats);
      } catch (e) {
        console.warn('Rail fetch error:', e);
      }
    }
    const refreshRails = debounce(fetchRailsForView, 400);
    map.once('postrender', refreshRails);
    map.getView().on('change:center', refreshRails);
    map.getView().on('change:resolution', refreshRails);

    // ---- KM2ME GeoJSON (optional) ----
    let kmLayer;
    function ensureKmLayer() {
      if (!(OPT.layers.km && OPT.sources.km2me)) return removeKmLayer();
      if (kmLayer) return;
      kmLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ url: OPT.sources.km2me, format: new ol.format.GeoJSON() }),
        style: new ol.style.Style({
          image: new ol.style.Circle({ radius: 3, fill: new ol.style.Fill({ color: '#e67e22' }),
                                        stroke: new ol.style.Stroke({ color: '#8e4b0a', width: 1 }) })
        })
      });
      map.addLayer(kmLayer);
    }
    function removeKmLayer() {
      if (!kmLayer) return;
      map.removeLayer(kmLayer); kmLayer = null;
    }
    ensureKmLayer();

    // ---- Current location ----
    let geoloc, posFeature, accFeature, locLayer;
    function ensureLocate() {
      if (!OPT.layers.locate || !('geolocation' in navigator)) return removeLocate();
      if (geoloc) return;
      geoloc = new ol.Geolocation({ tracking: true, projection: map.getView().getProjection() });
      posFeature = new ol.Feature();
      posFeature.setStyle(new ol.style.Style({
        image: new ol.style.Icon({
          src: 'data:image/svg+xml;utf8,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36">
              <circle cx="18" cy="18" r="6" fill="#2dd4bf"/>
              <circle cx="18" cy="18" r="12" fill="none" stroke="#2dd4bf" stroke-width="2" opacity=".35"/>
            </svg>
          `),
          anchor: [0.5, 0.5], anchorXUnits: 'fraction', anchorYUnits: 'fraction'
        })
      }));
      accFeature = new ol.Feature();
      const locSrc = new ol.source.Vector({ features: [accFeature, posFeature] });
      locLayer = new ol.layer.Vector({ source: locSrc, visible: true });
      map.addLayer(locLayer);
      geoloc.on('change:position', () => { const p = geoloc.getPosition(); if (p) posFeature.setGeometry(new ol.geom.Point(p)); });
      geoloc.on('change:accuracyGeometry', () => { accFeature.setGeometry(geoloc.getAccuracyGeometry()); });
    }
    function removeLocate() {
      if (!geoloc) return;
      geoloc.setTracking(false); geoloc = null;
      map.removeLayer(locLayer); locLayer = null; posFeature = null; accFeature = null;
    }
    ensureLocate();

    // ---- ACCC national coverage overlay (ArcGIS REST) ----
    const acccCoverage = new ol.layer.Tile({
      source: new ol.source.TileArcGISRest({
        url: 'https://spatial.infrastructure.gov.au/server/rest/services/Communications/Mobile_Phone_Coverage/MapServer',
        params: { layers: 'show:0', format: 'png32', transparent: true }
      }),
      opacity: 0.55,
      visible: !!OPT.layers.coverage
    });
    map.addLayer(acccCoverage);

    // ---- HUD wiring (toggles ↔ localStorage) ----
    const hud = {
      rail:  document.getElementById('t-rail'),
      km:    document.getElementById('t-km'),
      locate:document.getElementById('t-locate'),
      cov:   document.getElementById('t-coverage'),
      clock: document.getElementById('clock'),
      tz:    document.getElementById('tz')
    };
    // Initialize HUD
    hud.rail.checked   = !!OPT.layers.rail;
    hud.km.checked     = !!OPT.layers.km;
    hud.locate.checked = !!OPT.layers.locate;
    hud.cov.checked    = !!OPT.layers.coverage;

    function saveOpts() { localStorage.setItem('railops.options', JSON.stringify(OPT)); }
    function applyRail() {
      railLayer.setVisible(!!OPT.layers.rail);
      railLayer.setStyle(new ol.style.Style({
        stroke: new ol.style.Stroke({ color: OPT.railStyle.color || '#000000', width: Math.max(1, OPT.railStyle.width || 3) })
      }));
      if (OPT.layers.rail) refreshRails();
    }

    hud.rail.onchange   = ()=>{ OPT.layers.rail   = hud.rail.checked;   saveOpts(); applyRail(); };
    hud.km.onchange     = ()=>{ OPT.layers.km     = hud.km.checked;     saveOpts(); (OPT.layers.km? ensureKmLayer(): removeKmLayer()); };
    hud.locate.onchange = ()=>{ OPT.layers.locate = hud.locate.checked; saveOpts(); (OPT.layers.locate? ensureLocate(): removeLocate()); };
    hud.cov.onchange    = ()=>{ OPT.layers.coverage = hud.cov.checked;  saveOpts(); acccCoverage.setVisible(OPT.layers.coverage); };

    // ---- Live clock with seconds ----
    const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
    hud.tz.textContent = `Time zone: ${tzName}`;
    function tick() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      const ss = String(now.getSeconds()).padStart(2,'0');
      hud.clock.textContent = `${hh}:${mm}:${ss}`;
    }
    tick();
    setInterval(tick, 1000);

    // ---- React to Admin changes (if Admin open in another tab) ----
    window.addEventListener('storage', (e) => {
      if (e.key !== 'railops.options') return;
      try {
        const next = JSON.parse(e.newValue || '{}');
        // layer flags
        OPT.layers = Object.assign(OPT.layers, next.layers || {});
        hud.rail.checked = !!OPT.layers.rail;
        hud.km.checked = !!OPT.layers.km;
        hud.locate.checked = !!OPT.layers.locate;
        hud.cov.checked = !!OPT.layers.coverage;
        applyRail();
        // sources
        const oldOverpass = OPT.sources.overpass;
        OPT.sources = Object.assign(OPT.sources, next.sources || {});
        if (OPT.sources.km2me) ensureKmLayer(); else removeKmLayer();
        if (OPT.sources.overpass !== oldOverpass) refreshRails();
      } catch {}
    });
  </script>
</body>
</html>
