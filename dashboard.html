<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RailOps — AU Live Map</title>

  <!-- OpenLayers (CSS first) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
  <style>
    html, body { height:100%; margin:0; background:#0b1120; } /* dark backdrop so tiles are obvious */
    #map { height:100%; }
    /* toolbar */
    .toolbar{
      position:absolute;top:10px;left:10px;z-index:20;
      background:#0b57cf;color:#fff;padding:8px 10px;border-radius:8px;
      font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial; display:flex; gap:8px; align-items:center;
      box-shadow:0 8px 24px rgba(0,0,0,.25);
    }
    .toolbar select,.toolbar button,.toolbar input{margin-left:6px}
    /* OL attributions darker */
    .ol-attribution { background:rgba(0,0,0,.55) !important; color:#fff !important; }
    .ol-attribution ul { color:#fff !important; }
    /* fatal banner */
    #fatal {position:absolute;right:10px;top:10px;z-index:30;background:#b91c1c;color:#fff;
      padding:8px 10px;border-radius:8px;font:600 12px system-ui}
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="toolbar">
    RailOps — AU Live Map
    <span>Zoom:</span>
    <select id="zoomSelect">
      <option value="australia">Australia</option>
      <option value="current">Current location</option>
    </select>
    <input id="searchBox" type="search" placeholder="Search train ID / loco…" style="min-width:220px;border-radius:8px;border:0;padding:.45rem .6rem">
    <button id="searchBtn">Search</button>
    <button id="resetBtn">Reset</button>
    <button id="layersBtn">Layers ▾</button>
  </div>

  <!-- Optional layers panel (kept minimal) -->
  <div id="layersPanel" class="panel" style="display:none;position:absolute;left:10px;bottom:10px;z-index:20;background:rgba(0,0,0,.78);color:#fff;border-radius:10px;padding:10px 12px;font:600 14px system-ui">
    <label><input id="railChk" type="checkbox" checked> Rail lines (OpenRailwayMap)</label><br>
    <label><input id="stationsChk" type="checkbox" checked> Stations (OpenRailwayMap)</label>
  </div>

  <!-- OpenLayers script (defer so it doesn’t block) -->
  <script defer src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <!-- Your trains layer (make sure trains.js is in the same folder as this file) -->
  <script defer src="trains.js"></script>

  <script>
  // Guard: show a banner if OL failed to load
  function fatal(msg){
    let el = document.getElementById('fatal');
    if(!el){ el = document.createElement('div'); el.id='fatal'; document.body.appendChild(el); }
    el.textContent = msg;
    console.error(msg);
  }

  document.addEventListener('DOMContentLoaded', () => {
    // Ensure OpenLayers actually loaded
    if (!window.ol || !ol.Map) {
      fatal('OpenLayers failed to load (network/caching issue). Hard-reload or check CDN.');
      return;
    }

    // --- Map init
    const map = new ol.Map({
      target: 'map',
      layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
      view: new ol.View({
        center: ol.proj.fromLonLat([133.7751, -25.2744]), // AU
        zoom: 4
      })
    });

    // Keep map north-up
    map.getView().on('change:rotation', () => map.getView().setRotation(0));

    // Rail overlays
    const railLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',
        attributions: '© OpenRailwayMap, © OpenStreetMap',
        maxZoom: 19
      }),
      visible: true
    });
    const stationsLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://{a-c}.tiles.openrailwaymap.org/stations/{z}/{x}/{y}.png',
        attributions: '© OpenRailwayMap, © OpenStreetMap',
        maxZoom: 19
      }),
      visible: true
    });
    map.addLayer(railLayer);
    map.addLayer(stationsLayer);

    // UI controls
    const zoomSelect = document.getElementById('zoomSelect');
    function zoomAustralia(){
      map.getView().animate({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom:4, duration:500 });
    }
    function zoomCurrent(){
      if(!navigator.geolocation){ zoomAustralia(); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        const c=ol.proj.fromLonLat([pos.coords.longitude,pos.coords.latitude]);
        map.getView().animate({ center:c, zoom:12, duration:600 });
      },()=>zoomAustralia());
    }
    zoomSelect.addEventListener('change',()=>(
      zoomSelect.value==='current'?zoomCurrent():zoomAustralia()
    ));
    document.getElementById('resetBtn').addEventListener('click',()=>{
      zoomAustralia();
      railLayer.setVisible(true); stationsLayer.setVisible(true);
      document.getElementById('railChk').checked = true;
      document.getElementById('stationsChk').checked = true;
    });
    document.getElementById('layersBtn').addEventListener('click',()=>{
      const p=document.getElementById('layersPanel');
      p.style.display = p.style.display==='none' ? 'block' : 'none';
    });
    document.getElementById('railChk').addEventListener('change',e=>railLayer.setVisible(e.target.checked));
    document.getElementById('stationsChk').addEventListener('change',e=>stationsLayer.setVisible(e.target.checked));

    // --- Hook up live trains (TrainLayer is defined in trains.js)
    if (window.TrainLayer && typeof TrainLayer.init === 'function') {
      TrainLayer.init(map);
    } else {
      fatal('trains.js did not load or TrainLayer.init() missing.');
    }
  });
  </script>
</body>
</html>
