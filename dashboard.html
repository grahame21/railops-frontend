<!-- Rails overlay via same-origin proxy -->
<script>
  // Add after the base OSM layer is created
  const orm = new ol.layer.Tile({
    source: new ol.source.XYZ({
      // Same-origin URL -> no CSP changes needed
      url: '/api/orm/standard/{z}/{x}/{y}.png',
      maxZoom: 19
    }),
    opacity: 0.9,
    visible: true
  });
  map.addLayer(orm);

  // If you have a checkbox with id="rails-toggle"
  const rt = document.getElementById('rails-toggle');
  if (rt) rt.onchange = (e)=> orm.setVisible(e.target.checked);

  // Optional: status badge hooks
  orm.getSource().on('tileloaderror', ()=> say('Rails proxy tile failed (check function logs)', 'bad'));
</script>
