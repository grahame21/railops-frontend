<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RailOps — Dashboard</title>

  <!-- Minimal styles: ensure the map actually has height -->
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; padding:0; height:100%; background:#0b1520; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #topbar {
      position: fixed; inset: 0 0 auto 0; z-index: 10; display: flex; gap: .5rem; align-items: center;
      background: rgba(8,12,18,.92); backdrop-filter: saturate(1.2) blur(6px);
      padding: .5rem .75rem; border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .chip { display:inline-flex; gap:.5rem; align-items:center; background:#111a24; border:1px solid #1f2a37; color:#dce7f5;
      padding:.4rem .6rem; border-radius:.6rem; font-size:.9rem; }
    .chip input { accent-color:#5fb3ff; }
    .chip button { all:unset; cursor:pointer; }
    #map { position: absolute; inset: 2.75rem 0 0 0; /* below the topbar */ width:100%; height: calc(100vh - 2.75rem); background:#0b1520; }
    #status { position: fixed; right:.6rem; bottom:.6rem; background:#0f1722; color:#cfe6ff; border:1px solid #234; padding:.35rem .6rem; border-radius:.5rem; font-size:.85rem; }
    #zoomInfo { position: fixed; right: .6rem; top: .55rem; opacity:.85; font-size:.85rem; color:#a8c3de; }
    .ok   { border-color:#1f5; color:#bfffd1; }
    .warn { border-color:#f66; color:#ffd3d3; }
  </style>

  <!-- Load OpenLayers from your Netlify function proxy (so CSP/CDN is not an issue) -->
  <script src="/api/cdn/ol.js"></script>
  <link rel="stylesheet" href="/api/cdn/ol.css">
</head>
<body>

  <!-- Controls -->
  <div id="topbar">
    <span class="chip">
      <input type="checkbox" id="tog-rails" checked>
      <label for="tog-rails">Rails (OpenRailwayMap)</label>
    </span>

    <span class="chip">
      <input type="checkbox" id="tog-telstra" checked>
      <label for="tog-telstra">Telstra</label>
    </span>

    <span class="chip">
      <input type="checkbox" id="tog-telstra-mvno" checked>
      <label for="tog-telstra-mvno">Telstra MVNO</label>
    </span>

    <span class="chip">
      <input type="checkbox" id="tog-optus" checked>
      <label for="tog-optus">Optus</label>
    </span>

    <span class="chip">
      <input type="checkbox" id="tog-voda" checked>
      <label for="tog-voda">Vodafone/TPG (Optus roaming)</label>
    </span>

    <span class="chip"><button id="btn-au" title="Recenter Australia">Recenter AU</button></span>
    <span class="chip"><button id="btn-locate" title="Drop pin at my location">📍 My location</button></span>
    <span id="zoomInfo"></span>

    <span style="flex:1"></span>

    <span class="chip"><button id="logout" title="Logout">Logout</button></span>
  </div>

  <!-- Map + status -->
  <div id="map" role="region" aria-label="Map"></div>
  <div id="status" class="badge">Booting…</div>

  <!-- App code -->
  <script>
    (function () {
      const $ = id => document.getElementById(id);
      const status = $('status');
      const say = (m, tone) => { status.textContent = m; status.className = tone ? tone : ''; console.log('[dashboard]', m); };

      // 1) Verify OpenLayers actually loaded
      if (!window.ol || !ol.Map) {
        say('❌ OpenLayers failed to load (CSP/CDN).', 'warn');
        return;
      }

      // 2) Sanity: make sure the map div has height
      const rect = $('map').getBoundingClientRect();
      if (rect.height < 50) {
        say('❌ Map container has no height (CSS).', 'warn');
        return;
      }

      // 3) Base OSM
      const osm = new ol.layer.Tile({
        source: new ol.source.OSM({ crossOrigin: 'anonymous' })
      });
      osm.getSource().on('tileloaderror', () => say('⚠️ OSM tile failed (CSP img-src for *.tile.openstreetmap.org).', 'warn'));

      // 4) Rails via OpenRailwayMap
      const rails = new ol.layer.Tile({
        visible: true,
        opacity: 0.9,
        source: new ol.source.XYZ({
          url: 'https://{a-c}.tile.openrailwaymap.org/standard/{z}/{x}/{y}.png',
          crossOrigin: 'anonymous',
          attributions: '© OpenRailwayMap contributors'
        })
      });
      rails.getSource().on('tileloaderror', () => say('⚠️ ORM tile failed (CSP img-src for *.tile.openrailwaymap.org).', 'warn'));

      // 5) Carrier overlays (optional; these files are expected to be present; if not, they quietly no-op)
      function carrierLayer(url, rgba) {
        return new ol.layer.Vector({
          visible: true,
          opacity: .35,
          source: new ol.source.Vector({ url, format: new ol.format.GeoJSON() }),
          style: new ol.style.Style({
            fill: new ol.style.Fill({ color: rgba }),
            stroke: new ol.style.Stroke({ color: rgba, width: 1 })
          })
        });
      }
      const telstra      = carrierLayer('/assets/coverage/telstra.geojson',      'rgba( 77,163,255,0.35)');
      const telstraMVNO  = carrierLayer('/assets/coverage/telstra-mvno.geojson', 'rgba( 77,255,219,0.35)');
      const optus        = carrierLayer('/assets/coverage/optus.geojson',        'rgba(255,206, 77,0.35)');
      const voda         = carrierLayer('/assets/coverage/vodafone-tpg.geojson', 'rgba(255,102,102,0.35)');

      // 6) North-up (no rotation)
      const interactions = ol.interaction.defaults({ altShiftDragRotate: false, pinchRotate: false });

      // 7) Map
      const view = new ol.View({ center: ol.proj.fromLonLat([133.7751, -25.2744]), zoom: 4.8 });
      const map = new ol.Map({
        target: 'map',
        view,
        interactions,
        layers: [osm, telstra, telstraMVNO, optus, voda, rails]
      });

      // 8) Toggles
      $('tog-rails').onchange        = e => rails.setVisible(e.target.checked);
      $('tog-telstra').onchange      = e => telstra.setVisible(e.target.checked);
      $('tog-telstra-mvno').onchange = e => telstraMVNO.setVisible(e.target.checked);
      $('tog-optus').onchange        = e => optus.setVisible(e.target.checked);
      $('tog-voda').onchange         = e => voda.setVisible(e.target.checked);

      // 9) Recenter AU
      $('btn-au').onclick = () =>
        view.animate({ center: ol.proj.fromLonLat([133.7751, -25.2744]), zoom: 4.8, duration: 450 });

      // 10) My location pin
      const locLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
      map.addLayer(locLayer);
      function dropPin(lon, lat) {
        locLayer.getSource().clear();
        const f = new ol.Feature(new ol.geom.Point(ol.proj.fromLonLat([lon, lat])));
        f.setStyle(new ol.style.Style({
          image: new ol.style.Icon({
            anchor: [0.5, 1],
            src: 'data:image/svg+xml;utf8,' + encodeURIComponent(
              '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 48 48"><path fill="#ff4d4d" d="M24 45s-14-14.2-14-24A14 14 0 1 1 38 21c0 9.8-14 24-14 24z"/><circle cx="24" cy="21" r="5.5" fill="#fff"/></svg>'
            )
          })
        }));
        locLayer.getSource().addFeature(f);
        view.animate({ center: ol.proj.fromLonLat([lon, lat]), zoom: Math.max(view.getZoom() || 4, 10), duration: 450 });
      }
      $('btn-locate').onclick = () => {
        if (!navigator.geolocation) return say('Geolocation not supported', 'warn');
        say('Locating…');
        navigator.geolocation.getCurrentPosition(
          p => { dropPin(p.coords.longitude, p.coords.latitude); say('Location updated', ''); },
          e => say('Location denied/unavailable: ' + (e?.message || e), 'warn'),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      };

      // 11) Zoom/DPR readout
      const zi = $('zoomInfo');
      const refresh = () => { const z = view.getZoom(); zi.textContent = `z=${z ?? '–'} · DPR=${Math.round(devicePixelRatio || 1)}`; };
      view.on('change:resolution', refresh); refresh();

      // 12) Logout
      $('logout').onclick = () => {
        try { document.cookie = 'railops_session=; Max-Age=0; path=/; SameSite=Lax'; } catch {}
        window.location.href = '/login.html';
      };

      // 13) First paint
      map.once('rendercomplete', () => say('✅ Canvas rendered'));
    })();
  </script>
</body>
</html>
