<!DOCTYPE html>
<html>
<head>
  <title>Simple Map Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.5.2/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v7.5.2/dist/ol.js"></script>
  <style>
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Create map
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM()
        })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([133.7751, -25.2744]),
        zoom: 4
      })
    });

    // Add a simple red dot
    const marker = new ol.Feature({
      geometry: new ol.geom.Point(ol.proj.fromLonLat([151.2093, -33.8688]))
    });

    marker.setStyle(new ol.style.Style({
      image: new ol.style.Circle({
        radius: 10,
        fill: new ol.style.Fill({ color: 'red' })
      })
    }));

    const source = new ol.source.Vector({
      features: [marker]
    });

    const layer = new ol.layer.Vector({
      source: source
    });

    map.addLayer(layer);

    console.log('Map created with red dot at Sydney');
  </script>
</body>
</html>
