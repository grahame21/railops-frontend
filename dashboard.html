<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RailOps – Live Train Map</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- OpenLayers CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css"
  />

  <style>
    html, body { height: 100%; margin: 0; }
    #topbar {
      position: fixed; z-index: 1000; top: 0; left: 0; right: 0;
      display: flex; gap: 12px; align-items: center; padding: 10px 14px;
      background: rgba(0,0,0,0.75); color: #fff; font: 14px/1.3 system-ui, Arial, sans-serif;
    }
    #topbar .pill {
      background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 999px;
    }
    #topbar button {
      border: 0; background: #2196f3; color: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    }
    #topbar button:hover { background: #1976d2; }
    #map { position: absolute; inset: 0; top: 48px; }
    #error {
      position: fixed; z-index: 1001; right: 12px; bottom: 12px;
      background: #ff5252; color: #fff; padding: 10px 12px; border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25); display: none; max-width: 92vw;
      font: 13px/1.35 system-ui, Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <strong>RailOps</strong>
    <span class="pill">status: <span id="status">loading…</span></span>
    <span class="pill">markers: <span id="count">0</span></span>
    <span class="pill">last update: <span id="updated">—</span></span>
    <button id="btn-reload" title="Force refresh trains">Refresh</button>
    <button id="btn-sydney" title="Go to Sydney">Sydney</button>
    <button id="btn-adelaide" title="Go to Adelaide">Adelaide</button>
  </div>

  <div id="map"></div>
  <div id="error"></div>

  <!-- OpenLayers JS -->
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>

  <!-- Your app logic -->
  <script src="dashboard.js"></script>
</body>
</html>
