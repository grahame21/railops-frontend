<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailOps — Live Dashboard</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #09111d;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #cfe3f1;
    }

    .topbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .topbar-left {
      flex: 1 1 auto;
      min-width: 0;
    }

    .topbar-right {
      flex: 0 0 auto;
    }

    .brand,
    .top-control,
    .search-wrap,
    .status-pill,
    .count-pill,
    .logout-btn {
      height: 54px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    .brand {
      display: flex;
      align-items: center;
      padding: 0 18px;
      font-weight: 800;
      font-size: 28px;
      color: #ffb11a;
      background: rgba(6,16,39,0.97);
      white-space: nowrap;
    }

    .top-control {
      padding: 0 16px;
      background: rgba(14,40,82,0.97);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      outline: none;
      min-width: 110px;
    }

    select.top-control {
      cursor: pointer;
    }

    button.top-control {
      cursor: pointer;
    }

    .search-wrap {
      display: flex;
      align-items: stretch;
      overflow: hidden;
      background: rgba(14,40,82,0.97);
      min-width: 420px;
      max-width: 700px;
      flex: 1 1 560px;
    }

    .search-input {
      flex: 1;
      min-width: 140px;
      border: 0;
      outline: none;
      background: transparent;
      color: #fff;
      font-size: 18px;
      padding: 0 18px;
    }

    .search-input::placeholder {
      color: rgba(255,255,255,0.72);
    }

    .search-btn {
      border: 0;
      padding: 0 22px;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(180deg, #1574ff, #0a55d4);
    }

    .status-pill,
    .count-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      background: rgba(6,16,39,0.97);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
    }

    .count-pill {
      min-width: 76px;
      background: linear-gradient(180deg, #1574ff, #0a55d4);
    }

    .logout-btn {
      border: 0;
      padding: 0 20px;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(180deg, #213253, #12213d);
    }

    .panel {
      position: absolute;
      top: 78px;
      left: 12px;
      z-index: 1001;
      width: 320px;
      max-width: calc(100vw - 24px);
      background: rgba(9,17,31,0.96);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
      display: none;
    }

    .panel h3 {
      margin: 0 0 12px 0;
      font-size: 18px;
      color: #8ec5ff;
    }

    .layer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 9px 0;
      font-size: 15px;
      font-weight: 600;
    }

    .layer-item input {
      transform: scale(1.15);
      cursor: pointer;
    }

    #popup {
      position: absolute;
      min-width: 320px;
      max-width: 520px;
      background: rgba(18, 22, 29, 0.98);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(0,0,0,0.42);
    }

    .tf-header {
      background: #0d67ad;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.25;
    }

    .tf-header .main {
      font-size: 17px;
      font-weight: 800;
    }

    .tf-header .sub {
      margin-top: 2px;
      font-size: 14px;
      opacity: 0.98;
    }

    .tf-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #0a5b99;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .tf-tab {
      padding: 7px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      border-right: 1px solid rgba(255,255,255,0.12);
    }

    .tf-tab:last-child {
      border-right: 0;
    }

    .tf-tab.active {
      background: #2196f3;
    }

    .tf-body {
      display: grid;
      grid-template-columns: 108px 1fr;
      min-height: 210px;
    }

    .tf-left {
      background: #1f2227;
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 12px 10px;
      text-align: center;
    }

    .status-dot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin: 0 auto 10px auto;
      background: #444;
    }

    .status-dot.green { background: #26c95b; }
    .status-dot.orange { background: #ff9b21; }
    .status-dot.red { background: #f04545; }
    .status-dot.gray { background: #666; }

    .tf-left .big {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .tf-left .small-label {
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      margin-top: 12px;
      opacity: 0.95;
    }

    .tf-left .small-value {
      font-size: 15px;
      font-weight: 700;
      margin-top: 2px;
    }

    .tf-right {
      background: #1b1b1d;
    }

    .tf-row {
      border-bottom: 1px solid rgba(255,255,255,0.10);
      padding: 8px 10px;
    }

    .tf-row .label {
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      opacity: 0.95;
    }

    .tf-row .value {
      font-size: 17px;
      line-height: 1.25;
      margin-top: 2px;
    }

    .tf-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    .tf-cell {
      padding: 8px 10px;
      border-right: 1px solid rgba(255,255,255,0.10);
    }

    .tf-cell:last-child {
      border-right: 0;
    }

    .tf-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px 10px;
    }

    .tf-btn {
      border: 1px solid rgba(255,255,255,0.20);
      background: linear-gradient(180deg, #5ba7e9, #2e6ea5);
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 13px;
      text-align: center;
    }

    .tf-alerts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 10px 10px 10px;
    }

    .tf-alert {
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, #72dc65, #3dad39);
      color: #fff;
      padding: 7px 10px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 13px;
      text-align: center;
    }

    .train-label {
      color: #ffffff;
      font-weight: 800;
      text-shadow:
        0 0 2px rgba(0,0,0,1),
        0 0 4px rgba(0,0,0,1),
        0 0 6px rgba(0,0,0,1);
    }

    .ol-popup-closer {
      display: none;
    }

    @media (max-width: 1400px) {
      .brand { font-size: 23px; }
      .top-control, .search-input, .search-btn, .status-pill, .count-pill, .logout-btn { font-size: 15px; }
      .search-wrap { min-width: 300px; }
    }

    @media (max-width: 1080px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .topbar-right {
        justify-content: flex-end;
      }

      .search-wrap {
        flex: 1 1 100%;
        min-width: 240px;
      }
    }
  </style>
</head>
<body>

      <div class="search-wrap">
        <input id="searchInput" class="search-input" type="text" placeholder="Search train number, loco, origin, destination..." />

    </div>

    <div class="topbar-right">
      <div id="lastUpdatedPill" class="status-pill">Last: --</div>
      <div id="statusPill" class="status-pill">ok - 0 trains</div>

  <div id="layersPanel" class="panel">
    <h3>Layers</h3>

    <label class="layer-item">
      <input type="checkbox" id="toggleTrains" checked />
      <span>Live Trains</span>
    </label>

    <label class="layer-item">
      <input type="checkbox" id="toggleRailLines" checked />
      <span>Rail Lines (Blue)</span>
    </label>

    <label class="layer-item">
      <input type="checkbox" id="toggleStations" />
      <span>Stations</span>
    </label>

    <label class="layer-item">
      <input type="checkbox" id="toggleTelstra" />
      <span>Telstra Coverage</span>
    </label>

    <label class="layer-item">
      <input type="checkbox" id="toggleOptus" />
      <span>Optus Coverage</span>
    </label>

    <label class="layer-item">
      <input type="checkbox" id="toggleVodafone" />
      <span>Vodafone / TPG Coverage</span>

    <label class="layer-item">
      <input type="checkbox" id="toggleAllCoverage" />

    </label>

  <div id="popup"></div>

  <script>
    // ========= CONFIG =========
    // Change this if your trains.json is hosted somewhere else
    const TRAINS_URL = "./trains.json";

    // Optional local geojson files if you have them
    const RAIL_LINES_URL = "./railways.geojson";
    const STATIONS_URL = "./stations.geojson";

    // ========= DOM =========
    const stateSelect = document.getElementById("stateSelect");
    const myLocationBtn = document.getElementById("myLocationBtn");
    const layersBtn = document.getElementById("layersBtn");
    const layersPanel = document.getElementById("layersPanel");
    const operatorFilter = document.getElementById("operatorFilter");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const lastUpdatedPill = document.getElementById("lastUpdatedPill");
    const statusPill = document.getElementById("statusPill");
    const trainCountPill = document.getElementById("trainCountPill");
    const logoutBtn = document.getElementById("logoutBtn");

    const toggleTrains = document.getElementById("toggleTrains");
    const toggleRailLines = document.getElementById("toggleRailLines");
    const toggleStations = document.getElementById("toggleStations");
    const toggleTelstra = document.getElementById("toggleTelstra");
    const toggleOptus = document.getElementById("toggleOptus");
    const toggleVodafone = document.getElementById("toggleVodafone");
    const toggleAllCoverage = document.getElementById("toggleAllCoverage");

    // ========= STATE =========
    let allTrains = [];
    let visibleTrains = [];
    let selectedTrainFeature = null;
    let lastGoodTrains = [];
    let lastGoodUpdatedISO = null;

    // ========= MAP =========
    const osmLayer = new ol.layer.Tile({
      source: new ol.source.OSM()
    });

    const railLinesLayer = new ol.layer.Vector({
      source: new ol.source.Vector(),
      visible: true,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({
          color: "#1d6fff",
          width: 2
        })
      })
    });

    const stationsLayer = new ol.layer.Vector({
      source: new ol.source.Vector(),
      visible: false,
      style: new ol.style.Style({
        image: new ol.style.Circle({
          radius: 4,
          fill: new ol.style.Fill({ color: "#ffbf00" }),
          stroke: new ol.style.Stroke({ color: "#fff", width: 1.2 })
        })
      })
    });

    const telstraLayer = new ol.layer.Tile({
      visible: false,
      source: new ol.source.TileArcGISRest({
        url: "https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer",
        params: { layers: "show:25" }
      }),
      opacity: 0.45
    });

    const optusLayer = new ol.layer.Tile({
      visible: false,
      source: new ol.source.TileArcGISRest({
        url: "https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer",
        params: { layers: "show:15" }
      }),
      opacity: 0.45
    });

    const vodafoneLayer = new ol.layer.Tile({
      visible: false,
      source: new ol.source.TileArcGISRest({
        url: "https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer",
        params: { layers: "show:33" }
      }),
      opacity: 0.45
    });

    const allCoverageLayer = new ol.layer.Tile({
      visible: false,
      source: new ol.source.TileArcGISRest({
        url: "https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer",
        params: { layers: "show:4" }
      }),
      opacity: 0.38
    });

    const trainSource = new ol.source.Vector();

    const trainLayer = new ol.layer.Vector({
      source: trainSource,
      visible: true,
      style: feature => getTrainStyle(feature)
    });

    const map = new ol.Map({
      target: "map",
      layers: [
        osmLayer,
        telstraLayer,
        optusLayer,
        vodafoneLayer,
        allCoverageLayer,
        railLinesLayer,
        stationsLayer,
        trainLayer
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([134.5, -25.7]),
        zoom: 4.4,
        minZoom: 3,
        maxZoom: 18
      }),
      controls: ol.control.defaults({
        attribution: true,
        rotate: false,
        zoom: true
      })
    });

    // ========= POPUP =========
    const popupEl = document.getElementById("popup");

    const popupOverlay = new ol.Overlay({
      element: popupEl,
      positioning: "bottom-center",
      stopEvent: true,
      offset: [0, -18]
    });

    map.addOverlay(popupOverlay);

    // ========= HELPERS =========
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatLocalTime(iso) {
      if (!iso) return "--";
      try {
        return new Date(iso).toLocaleString("en-AU", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      } catch {
        return iso;
      }
    }

    function normalise(v) {
      return String(v ?? "").trim().toLowerCase();
    }

    function getValue(obj, keys) {
      for (const key of keys) {
        if (obj && obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== "") {
          return obj[key];
        }
      }
      return "";
    }

    function getLat(train) {
      const v = getValue(train, ["lat", "latitude", "y"]);
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function getLon(train) {
      const v = getValue(train, ["lon", "lng", "longitude", "x"]);
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function getLoco(train) {
      return getValue(train, [
        "loco",
        "loco_number",
        "locoNumber",
        "vehicle_number",
        "vehicleNumber",
        "unit",
        "unit_number",
        "vehicle",
        "name"
      ]) || "Unknown";
    }

    function getTrainNumber(train) {
      return getValue(train, [
        "train_number",
        "trainNumber",
        "train_id",
        "trainId",
        "service_number",
        "serviceNumber",
        "id",
        "ID"
      ]);
    }

    function getVehicleDescription(train) {
      return getValue(train, [
        "vehicle_description",
        "vehicleDescription",
        "description",
        "loco_class",
        "class"
      ]);
    }

    function getServiceDescription(train) {
      return getValue(train, [
        "service_description",
        "serviceDescription",
        "service_name",
        "serviceName",
        "service",
        "trip_name",
        "tripName"
      ]);
    }

    function getCurrentOperator(train) {
      return getValue(train, [
        "current_operator",
        "currentOperator",
        "operator",
        "Operator",
        "company",
        "Company",
        "owner",
        "Owner",
        "railway",
        "Railway",
        "network",
        "Network"
      ]) || "Unknown";
    }

    function getOrigin(train) {
      return getValue(train, [
        "origin",
        "from",
        "start",
        "departure",
        "origin_name"
      ]);
    }

    function getDestination(train) {
      return getValue(train, [
        "destination",
        "to",
        "end",
        "arrival",
        "destination_name"
      ]);
    }

    function getSpeed(train) {
      return getValue(train, [
        "speed",
        "speed_kmh",
        "kph",
        "kmh",
        "velocity"
      ]);
    }

    function getStatus(train) {
      return getValue(train, [
        "status",
        "running_status",
        "movement_status"
      ]) || "Unknown";
    }

    function getTimetabling(train) {
      return getValue(train, [
        "timetabling",
        "eta_text",
        "expected_text",
        "running_text"
      ]);
    }

    function getUpdated(train) {
      return getValue(train, [
        "updated",
        "lastUpdated",
        "last_updated",
        "timestamp",
        "time"
      ]);
    }

    function getKmPost(train) {
      return getValue(train, [
        "km_post",
        "kmPost",
        "kilometre_post",
        "kilometer_post"
      ]);
    }

    function getHeading(train) {
      return getValue(train, [
        "heading",
        "bearing",
        "direction"
      ]);
    }

    function makeLabel(train) {
      const loco = getLoco(train);
      const trainNum = getTrainNumber(train);
      if (trainNum && normalise(trainNum) !== normalise(loco)) {
        return `${loco} • ${trainNum}`;
      }
      return loco;
    }

    function getSearchText(train) {
      return [
        getLoco(train),
        getTrainNumber(train),
        getVehicleDescription(train),
        getServiceDescription(train),
        getCurrentOperator(train),
        getOrigin(train),
        getDestination(train),
        getStatus(train)
      ].join(" ").toLowerCase();
    }

    function getDotClass(train) {
      const status = normalise(getStatus(train));
      const speed = Number(getSpeed(train));

      if (status.includes("stop") || speed === 0) return "gray";
      if (status.includes("late") || status.includes("delay")) return "red";
      if (status.includes("run") || status.includes("move") || speed > 0) return "green";
      return "orange";
    }

    // ========= POPUP HTML =========
    function buildPopupHtml(train) {
      const label = makeLabel(train);
      const serviceDesc = getServiceDescription(train) || label;
      const vehicleDesc = getVehicleDescription(train) || "-";
      const currentOperator = getCurrentOperator(train) || "-";
      const origin = getOrigin(train) || "-";
      const destination = getDestination(train) || "-";
      const status = getStatus(train) || "-";
      const timetabling = getTimetabling(train) || "-";
      const kmPost = getKmPost(train) || "-";
      const updated = formatLocalTime(getUpdated(train));
      const dotClass = getDotClass(train);

      return `
        <div class="tf-header">
          <div class="main">${escapeHtml(getLoco(train))}${getTrainNumber(train) ? " - " + escapeHtml(getTrainNumber(train)) : ""}</div>
          <div class="sub">${escapeHtml(serviceDesc)}</div>
        </div>

        <div class="tf-tabs">
          <div class="tf-tab active">Current Data</div>
          <div class="tf-tab">History</div>
          <div class="tf-tab">Timetable</div>
          <div class="tf-tab">Notes</div>
        </div>

        <div class="tf-body">
          <div class="tf-left">
            <div class="status-dot ${dotClass}"></div>
            <div class="big">${escapeHtml(status)}</div>

            <div class="small-label">KM Post</div>
            <div class="small-value">${escapeHtml(kmPost)}</div>

            <div class="small-label">Last Updated</div>
            <div class="small-value">${escapeHtml(updated)}</div>
          </div>

          <div class="tf-right">
            <div class="tf-row">
              <div class="label">Vehicle Description</div>
              <div class="value">${escapeHtml(vehicleDesc)}</div>
            </div>

            <div class="tf-row">
              <div class="label">Timetabling</div>
              <div class="value">${escapeHtml(timetabling)}</div>
            </div>

            <div class="tf-row">
              <div class="label">Current Operator</div>
              <div class="value">${escapeHtml(currentOperator)}</div>
            </div>

            <div class="tf-row">
              <div class="label">Service Description</div>
              <div class="value">${escapeHtml(serviceDesc)}</div>
            </div>

            <div class="tf-two-col">
              <div class="tf-cell">
                <div class="label">Origin</div>
                <div class="value">${escapeHtml(origin)}</div>
              </div>
              <div class="tf-cell">
                <div class="label">Destination</div>
                <div class="value">${escapeHtml(destination)}</div>
              </div>
            </div>

            <div class="tf-buttons">
              <div class="tf-btn">View Service Operational History</div>
              <div class="tf-btn">View Service Change History</div>
            </div>

            <div class="tf-alerts">
              <div class="tf-alert">🔔 Enable Vehicle Alert</div>
              <div class="tf-alert">🔔 Enable Service Alert</div>
            </div>
          </div>
        </div>
      `;
    }

    // ========= TRAIN STYLE =========
    function getTrainStyle(feature) {
      const zoom = map.getView().getZoom() || 4;
      const label = feature.get("label") || "";
      const train = feature.get("trainData") || {};
      const isSelected = feature === selectedTrainFeature;

      let radius = 5;
      let fontSize = 10;
      let offsetY = -14;

      if (zoom >= 10) {
        radius = 8;
        fontSize = 13;
        offsetY = -18;
      } else if (zoom >= 8) {
        radius = 7;
        fontSize = 12;
        offsetY = -17;
      } else if (zoom >= 6) {
        radius = 6;
        fontSize = 11;
        offsetY = -15;
      }

      let fillColor = "#35d35b";
      const status = normalise(getStatus(train));
      const speed = Number(getSpeed(train));

      if (status.includes("late") || status.includes("delay")) fillColor = "#f04646";
      else if (status.includes("stop") || speed === 0) fillColor = "#f0a020";
      else if (status.includes("run") || status.includes("move") || speed > 0) fillColor = "#35d35b";

      if (isSelected) {
        radius += 2;
      }

      return new ol.style.Style({
        image: new ol.style.Circle({
          radius,
          fill: new ol.style.Fill({ color: fillColor }),
          stroke: new ol.style.Stroke({
            color: isSelected ? "#00d7ff" : "#ffffff",
            width: isSelected ? 3 : 2
          })
        }),
        text: new ol.style.Text({
          text: label,
          offsetY,
          font: `800 ${fontSize}px Segoe UI`,
          fill: new ol.style.Fill({ color: "#ffffff" }),
          stroke: new ol.style.Stroke({ color: "rgba(0,0,0,0.95)", width: 4 }),
          overflow: true
        }),
        zIndex: isSelected ? 999 : 10
      });
    }

    function createTrainFeature(train) {
      const lat = getLat(train);
      const lon = getLon(train);
      if (lat === null || lon === null) return null;

      const feature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat])),
        trainData: train,
        label: makeLabel(train)
      });

      return feature;
    }

    function refreshOperatorDropdownFromData(trains) {
      const existing = new Set(
        Array.from(operatorFilter.options).map(opt => normalise(opt.value))
      );

      const ops = [...new Set(
        trains
          .map(t => getCurrentOperator(t))
          .filter(v => v && normalise(v) !== "unknown")
      )].sort((a, b) => a.localeCompare(b));

      for (const op of ops) {
        if (!existing.has(normalise(op))) {
          const option = document.createElement("option");
          option.value = op;
          option.textContent = op;
          operatorFilter.appendChild(option);
        }
      }
    }

    function renderTrains(trains) {
      trainSource.clear();

      const features = [];
      for (const train of trains) {
        const feature = createTrainFeature(train);
        if (feature) features.push(feature);
      }

      trainSource.addFeatures(features);
      trainCountPill.textContent = String(features.length);
      statusPill.textContent = `ok - ${features.length} trains`;

      if (selectedTrainFeature) {
        const selectedTrain = selectedTrainFeature.get("trainData");
        const selectedId = makeLabel(selectedTrain);
        const newSelected = features.find(f => makeLabel(f.get("trainData")) === selectedId);
        if (newSelected) {
          selectedTrainFeature = newSelected;
          popupEl.innerHTML = buildPopupHtml(newSelected.get("trainData"));
          popupOverlay.setPosition(newSelected.getGeometry().getCoordinates());
        } else {
          selectedTrainFeature = null;
          popupOverlay.setPosition(undefined);
        }
      }
    }

    function applyFilters() {
      const selectedOperator = operatorFilter.value;
      const query = normalise(searchInput.value);

      visibleTrains = allTrains.filter(train => {
        const operatorOk =
          selectedOperator === "ALL" ||
          normalise(getCurrentOperator(train)) === normalise(selectedOperator);

        const searchOk =
          !query || getSearchText(train).includes(query);

        return operatorOk && searchOk;
      });

      renderTrains(visibleTrains);
    }

    async function loadGeoJsonToLayer(url, layer) {
      try {
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();

        const features = new ol.format.GeoJSON().readFeatures(data, {
          featureProjection: "EPSG:3857"
        });

        layer.getSource().clear();
        layer.getSource().addFeatures(features);
      } catch (err) {
        console.warn("Could not load", url, err);
      }
    }

    async function loadTrains() {
      try {
        const res = await fetch(`${TRAINS_URL}?_=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        const trains = Array.isArray(data.trains) ? data.trains : [];

        if (trains.length > 0) {
          allTrains = trains;
          lastGoodTrains = trains;
          lastGoodUpdatedISO = data.lastUpdated || data.last_updated || new Date().toISOString();
          statusPill.textContent = `ok - ${trains.length} trains`;
        } else if (lastGoodTrains.length > 0) {
          allTrains = lastGoodTrains;
          statusPill.textContent = "empty payload — keeping last good";
        } else {
          allTrains = [];
          statusPill.textContent = "empty payload";
        }

        refreshOperatorDropdownFromData(allTrains);

        const updated = data.lastUpdated || data.last_updated || lastGoodUpdatedISO;
        lastUpdatedPill.textContent = `Last: ${formatLocalTime(updated)}`;

        applyFilters();
      } catch (err) {
        console.error("Train load failed:", err);

        if (lastGoodTrains.length > 0) {
          allTrains = lastGoodTrains;
          lastUpdatedPill.textContent = `Last: ${formatLocalTime(lastGoodUpdatedISO)}`;
          statusPill.textContent = "error — keeping last good";
          applyFilters();
        } else {
          statusPill.textContent = "error loading trains";
          trainSource.clear();
          trainCountPill.textContent = "0";
        }
      }
    }

    // ========= STATE ZOOMS =========
    const stateExtents = {
      AU: [112.5, -44.8, 154.0, -9.0],
      NSW: [140.8, -37.7, 153.8, -28.0],
      VIC: [140.7, -39.3, 150.2, -33.8],
      QLD: [137.9, -29.5, 153.7, -10.0],
      SA: [129.0, -38.4, 141.2, -25.8],
      WA: [112.0, -35.3, 129.2, -13.6],
      TAS: [143.6, -43.9, 148.6, -39.0],
      NT: [129.0, -26.2, 138.1, -10.8],
      ACT: [148.76, -35.94, 149.40, -35.10]
    };

    function zoomToState(code) {
      const extentLonLat = stateExtents[code];
      if (!extentLonLat) return;

      const extent = ol.proj.transformExtent(extentLonLat, "EPSG:4326", "EPSG:3857");
      map.getView().fit(extent, {
        padding: [90, 40, 40, 40],
        duration: 700
      });
    }

    // ========= EVENTS =========
    stateSelect.addEventListener("change", () => {
      zoomToState(stateSelect.value);
    });

    myLocationBtn.addEventListener("click", () => {
      if (!navigator.geolocation) return alert("Geolocation not supported on this device.");
      navigator.geolocation.getCurrentPosition(
        pos => {
          const lon = pos.coords.longitude;
          const lat = pos.coords.latitude;
          map.getView().animate({
            center: ol.proj.fromLonLat([lon, lat]),
            zoom: 11,
            duration: 700
          });
        },
        () => alert("Could not get your location.")
      );
    });

    layersBtn.addEventListener("click", () => {
      layersPanel.style.display = layersPanel.style.display === "block" ? "none" : "block";
    });

    document.addEventListener("click", e => {
      const withinPanel = layersPanel.contains(e.target);
      const clickedLayersBtn = layersBtn.contains(e.target);
      if (!withinPanel && !clickedLayersBtn) {
        layersPanel.style.display = "none";
      }
    });

    toggleTrains.addEventListener("change", () => trainLayer.setVisible(toggleTrains.checked));
    toggleRailLines.addEventListener("change", () => railLinesLayer.setVisible(toggleRailLines.checked));
    toggleStations.addEventListener("change", () => stationsLayer.setVisible(toggleStations.checked));
    toggleTelstra.addEventListener("change", () => telstraLayer.setVisible(toggleTelstra.checked));
    toggleOptus.addEventListener("change", () => optusLayer.setVisible(toggleOptus.checked));
    toggleVodafone.addEventListener("change", () => vodafoneLayer.setVisible(toggleVodafone.checked));
    toggleAllCoverage.addEventListener("change", () => allCoverageLayer.setVisible(toggleAllCoverage.checked));

    operatorFilter.addEventListener("change", applyFilters);
    searchBtn.addEventListener("click", applyFilters);
    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") applyFilters();
    });

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("railops_logged_in");
      window.location.href = "index.html";
    });

    map.on("singleclick", evt => {
      const feature = map.forEachFeatureAtPixel(evt.pixel, f => f, {
        layerFilter: layer => layer === trainLayer
      });

      if (feature) {
        selectedTrainFeature = feature;
        trainLayer.changed();
        popupEl.innerHTML = buildPopupHtml(feature.get("trainData"));
        popupOverlay.setPosition(feature.getGeometry().getCoordinates());
      } else {
        selectedTrainFeature = null;
        trainLayer.changed();
        popupOverlay.setPosition(undefined);
      }
    });

    searchBtn.addEventListener("click", () => {
      const q = normalise(searchInput.value);
      if (!q) return;

      const firstMatch = visibleTrains.find(train => getSearchText(train).includes(q));
      if (!firstMatch) return;

      const lon = getLon(firstMatch);
      const lat = getLat(firstMatch);
      if (lon === null || lat === null) return;

      map.getView().animate({
        center: ol.proj.fromLonLat([lon, lat]),
        zoom: Math.max(map.getView().getZoom() || 8, 8),
        duration: 700
      });

      setTimeout(() => {
        const matchFeature = trainSource.getFeatures().find(f => {
          return makeLabel(f.get("trainData")) === makeLabel(firstMatch);
        });

        if (matchFeature) {
          selectedTrainFeature = matchFeature;
          trainLayer.changed();
          popupEl.innerHTML = buildPopupHtml(matchFeature.get("trainData"));
          popupOverlay.setPosition(matchFeature.getGeometry().getCoordinates());
        }
      }, 750);
    });

    // ========= STARTUP =========
    loadGeoJsonToLayer(RAIL_LINES_URL, railLinesLayer);
    loadGeoJsonToLayer(STATIONS_URL, stationsLayer);
    loadTrains();

    // refresh every 60s
    setInterval(loadTrains, 60000);
  </script>
</body>
</html>
