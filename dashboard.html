<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RailOps — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- OpenLayers (must load before dashboard.js) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.1.0/ol.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/ol@9.1.0/dist/ol.js"></script>

  <!-- App styles (just enough to size the map and toolbar) -->
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0f1a24; color:#e6eef7; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
      padding:.6rem .75rem; background:#0c1620; border-bottom:1px solid #123;
    }
    .btn, .chk {
      display:inline-flex; align-items:center; gap:.4rem;
      padding:.35rem .6rem; border-radius:.6rem; border:1px solid #234; background:#152233;
      color:#cfe2fb; font-size:.92rem; line-height:1; cursor:pointer; user-select:none;
    }
    .btn:hover, .chk:hover { background:#1a2a3f; }
    .chk input { accent-color:#4da3ff; transform:translateY(1px); }
    #map { height: calc(100dvh - 64px); width: 100%; }
    .badge { position: fixed; right:.75rem; bottom:.75rem; background:#132; border:1px solid #254; padding:.35rem .55rem; border-radius:.6rem; font-size:.85rem; opacity:.9; }
    .badge.ok { background:#12351a; border-color:#1f6b37; }
    .badge.warn { background:#3a1a1a; border-color:#7a3b3b; }
    .pill { font-size:.85rem; opacity:.75; }
  </style>
</head>
<body>

  <!-- toolbar -->
  <div class="topbar">
    <button id="logout" class="btn">Logout</button>

    <label class="chk"><input id="tog-rails" type="checkbox" checked /> Rails (OpenRailwayMap)</label>
    <label class="chk"><input id="tog-telstra" type="checkbox" checked /> Telstra</label>
    <label class="chk"><input id="tog-telstra-mvno" type="checkbox" checked /> Telstra MVNO</label>
    <label class="chk"><input id="tog-optus" type="checkbox" checked /> Optus</label>
    <label class="chk"><input id="tog-voda" type="checkbox" checked /> Vodafone/TPG (Optus roaming)</label>

    <button id="btn-locate" class="btn">📍 My location</button>
    <button id="btn-au" class="btn">Recenter AU</button>

    <span class="pill" id="zoomInfo" style="margin-left:auto;">z=… · DPR=…</span>
  </div>

  <!-- map -->
  <div id="map" role="region" aria-label="Map"></div>

  <!-- status toast -->
  <div id="status" class="badge">Booting…</div>

  <!-- Your dashboard logic -->
  <script defer src="/assets/js/dashboard.js?v=1"></script>
</body>
</html>
