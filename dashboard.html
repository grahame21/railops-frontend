<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RailOps — AU Live Map</title>

  <!-- OpenLayers (same version you’ve been using) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <style>
    html,body{height:100%;margin:0}
    #map{height:100%}

    .toolbar{
      position:absolute;top:10px;left:10px;z-index:10;
      background:#0b57cf;color:#fff;padding:8px 10px;border-radius:8px;
      font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial;
      display:flex;align-items:center;gap:8px;flex-wrap:wrap
    }
    .toolbar select,.toolbar button,.toolbar input{margin-left:6px}
    .toolbar input[type="text"]{
      border-radius:6px;border:0;padding:6px 8px;min-width:180px
    }
    .clock{
      background:#063da0;border-radius:6px;padding:4px 8px;font-weight:700
    }
    .panel{
      position:absolute;left:10px;bottom:10px;z-index:10;
      background:rgba(0,0,0,.78);color:#fff;border-radius:10px;padding:10px 12px;
      font:600 14px system-ui,-apple-system,Segoe UI,Roboto,Arial; max-width:92vw;
    }
    .row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(255,255,255,.15)}
    .row:first-child{border-top:0}
    .hint{font-size:12px;color:#cfd8ff;opacity:.85;margin-top:6px}
  </style>
</head>
<body>
  <div class="toolbar" id="toolbar">
    <span>RailOps — AU Live Map</span>

    <label>Zoom:
      <select id="zoomSelect">
        <option value="australia">Australia</option>
        <option value="current">Current location</option>
      </select>
    </label>

    <input id="searchBox" type="text" placeholder="Search train ID / loco…" />
    <button id="searchBtn">Search</button>

    <span id="clock" class="clock">--:--:--</span>

    <button id="resetBtn">Reset</button>
    <button id="layersBtn">Layers ▾</button>
  </div>

  <div id="map"></div>

  <!-- Layers panel -->
  <div id="layersPanel" class="panel" style="display:none">
    <div class="row"><label><input id="railChk" type="checkbox" checked> Rail lines (OpenRailwayMap)</label></div>
    <div class="row"><label><input id="stationsChk" type="checkbox" checked> Stations (OpenRailwayMap)</label></div>
    <div class="row"><label><input id="covTelstra" type="checkbox"> Telstra — outdoor</label></div>
    <div class="row"><label><input id="covOptus" type="checkbox"> Optus — outdoor</label></div>
    <div class="row"><label><input id="covTPG" type="checkbox"> Vodafone/TPG — outdoor</label></div>
    <div class="row"><label><input id="covAll" type="checkbox"> Combined — all MNOs</label></div>
    <div class="row"><label><input id="nswChk" type="checkbox"> NSW Trains (demo)</label></div>
    <div class="row"><label><input id="vicChk" type="checkbox"> VIC Trains (demo)</label></div>
    <div class="hint">Coverage maps are predictive and may differ from on-ground experience. Sources: ACCC datasets.</div>
  </div>

  <script>
    // --- Base (OSM only)
    const osmBase = new ol.layer.Tile({ source: new ol.source.OSM(), visible:true });

    const map = new ol.Map({
      target: 'map',
      layers: [ osmBase ],
      view: new ol.View({
        center: ol.proj.fromLonLat([133.7751, -25.2744]),
        zoom: 4
      })
    });

    // Keep north-up
    map.getView().on('change:rotation', () => map.getView().setRotation(0));

    // OpenRailwayMap overlays
    const railLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',
        attributions: '© OpenRailwayMap, © OpenStreetMap',
        maxZoom: 19
      }),
      visible: true
    });
    const stationsLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://{a-c}.tiles.openrailwaymap.org/stations/{z}/{x}/{y}.png',
        attributions: '© OpenRailwayMap, © OpenStreetMap',
        maxZoom: 19
      }),
      visible: true
    });
    map.addLayer(railLayer);
    map.addLayer(stationsLayer);

    // ACCC coverage
    const ACCC_URL='https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer';
    function acccLayer(id){return new ol.layer.Tile({
      source:new ol.source.TileArcGISRest({ url:ACCC_URL, params:{layers:`show:${id}`,dpi:96,transparent:true,format:'png32'} }),
      opacity:0.45, visible:false
    });}
    const covTelstra=acccLayer(25), covOptus=acccLayer(15), covTPG=acccLayer(33), covAll=acccLayer(4);
    [covTelstra,covOptus,covTPG,covAll].forEach(l=>map.addLayer(l));

    // Demo train layers (unchanged)
    const nswSrc = new ol.source.Vector(), vicSrc = new ol.source.Vector();
    const nswLayer = new ol.layer.Vector({ source: nswSrc, visible:false });
    const vicLayer = new ol.layer.Vector({ source: vicSrc, visible:false });
    map.addLayer(nswLayer); map.addLayer(vicLayer);

    function arrow(color,bearing){return new ol.style.Style({image:new ol.style.RegularShape({
      points:3,radius:10,rotation:(bearing||0)*Math.PI/180,fill:new ol.style.Fill({color:color||'#ff5000'})
    })});}
    function addDemoTrains(src,list,color){
      src.clear();
      list.forEach(t=>{
        const f=new ol.Feature({geometry:new ol.geom.Point(ol.proj.fromLonLat([t.lon,t.lat]))});
        f.setStyle(arrow(color,t.bearing)); src.addFeature(f);
      });
    }

    // Current-location pin layer
    const meSrc = new ol.source.Vector();
    const meLayer = new ol.layer.Vector({
      source: meSrc,
      style: new ol.style.Style({
        image: new ol.style.Circle({
          radius: 6,
          fill: new ol.style.Fill({color:'#1de9b6'}),
          stroke: new ol.style.Stroke({color:'#004d40', width:2})
        })
      }),
      visible: false
    });
    map.addLayer(meLayer);

    // --- UI wiring
    const zoomSelect=document.getElementById('zoomSelect');
    const resetBtn=document.getElementById('resetBtn');
    const layersBtn=document.getElementById('layersBtn');
    const panel=document.getElementById('layersPanel');
    const toolbar=document.getElementById('toolbar');

    // Close panel when clicking on the map (but not when clicking toolbar/panel)
    map.on('singleclick', () => { panel.style.display = 'none'; });
    panel.addEventListener('click', e => e.stopPropagation());
    toolbar.addEventListener('click', e => e.stopPropagation());

    // Zoom helpers + geolocation
    function zoomAustralia(){ map.getView().animate({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom:4, duration:500 }); }
    function zoomCurrent(){
      if(!navigator.geolocation){ zoomAustralia(); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        const lon=pos.coords.longitude, lat=pos.coords.latitude;
        const c=ol.proj.fromLonLat([lon, lat]);
        meSrc.clear();
        meSrc.addFeature(new ol.Feature({geometry:new ol.geom.Point(c)}));
        meLayer.setVisible(true);
        map.getView().animate({ center:c, zoom:12, duration:600 });
      },()=>zoomAustralia(),{enableHighAccuracy:true,timeout:10000});
    }

    zoomSelect.addEventListener('change',()=>(
      zoomSelect.value==='current'?zoomCurrent():zoomAustralia()
    ));
    resetBtn.addEventListener('click',()=>{
      zoomAustralia();
      [covTelstra,covOptus,covTPG,covAll,nswLayer,vicLayer].forEach(l=>l.setVisible(false));
      document.querySelectorAll('#layersPanel input[type=checkbox]').forEach(c=>c.checked=false);
      railLayer.setVisible(true); stationsLayer.setVisible(true);
      document.getElementById('railChk').checked=true;
      document.getElementById('stationsChk').checked=true;
      meSrc.clear(); meLayer.setVisible(false);
    });
    layersBtn.addEventListener('click',()=>{ panel.style.display = panel.style.display==='none' ? 'block' : 'none'; });

    // Layer toggles
    document.getElementById('railChk').addEventListener('change',e=>railLayer.setVisible(e.target.checked));
    document.getElementById('stationsChk').addEventListener('change',e=>stationsLayer.setVisible(e.target.checked));
    document.getElementById('covTelstra').addEventListener('change',e=>covTelstra.setVisible(e.target.checked));
    document.getElementById('covOptus').addEventListener('change',e=>covOptus.setVisible(e.target.checked));
    document.getElementById('covTPG').addEventListener('change',e=>covTPG.setVisible(e.target.checked));
    document.getElementById('covAll').addEventListener('change',e=>covAll.setVisible(e.target.checked));

    const nswChk=document.getElementById('nswChk');
    const vicChk=document.getElementById('vicChk');
    nswChk.addEventListener('change',()=>{
      nswLayer.setVisible(nswChk.checked);
      if(nswChk.checked)addDemoTrains(nswSrc,[{lon:151.2,lat:-33.87,bearing:90},{lon:150.9,lat:-33.7,bearing:250}],'#00a0ff');
    });
    vicChk.addEventListener('change',()=>{
      vicLayer.setVisible(vicChk.checked);
      if(vicChk.checked)addDemoTrains(vicSrc,[{lon:144.96,lat:-37.81,bearing:175},{lon:145.06,lat:-37.82,bearing:5}],'#ff5000');
    });

    // --- Clock (Australia/Adelaide) with seconds + date + TZ code
    const clockEl = document.getElementById('clock');
    function tzAbbrev(){
      try{
        const s = new Intl.DateTimeFormat('en-AU', {
          timeZone:'Australia/Adelaide', timeZoneName:'short'
        }).formatToParts(new Date()).find(p=>p.type==='timeZoneName')?.value || '';
        // Prefer ACST/ACDT if present; otherwise fallback to short offset like GMT+10:30
        return s.replace('GMT','UTC');
      }catch{ return 'Australia/Adelaide'; }
    }
    function pad(n){return n<10?'0'+n:n;}
    function tickClock(){
      const d = new Date();
      const parts = new Intl.DateTimeFormat('en-GB',{
        timeZone:'Australia/Adelaide',
        year:'numeric',month:'2-digit',day:'2-digit',
        hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
      }).formatToParts(d).reduce((o,p)=> (o[p.type]=p.value,o),{});
      const tzz = tzAbbrev();
      clockEl.textContent = `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second} (${tzz})`;
    }
    tickClock(); setInterval(tickClock,1000);

    // --- Search (by ID / label / loco substring)
    const searchBox = document.getElementById('searchBox');
    const searchBtn = document.getElementById('searchBtn');

    function getTrainVectorLayer(){
      // TrainLayer uses zIndex:20 in the file I gave you; find that vector layer.
      return map.getLayers().getArray().find(l =>
        l instanceof ol.layer.Vector && (l.getZIndex?.()===20)
      );
    }
    function searchTrain(q){
      if(!q) return;
      const layer = getTrainVectorLayer(); if(!layer) return alert('Train layer not ready yet.');
      const src = layer.getSource(); const qq = q.toLowerCase();
      const feats = src.getFeatures();
      const match = feats.find(f=>{
        const p = f.getProperties();
        const id = (p.id||'')+''; const label=(p.label||'')+'';
        return id.toLowerCase().includes(qq) || label.toLowerCase().includes(qq);
      });
      if(!match) return alert('No match');
      const c = match.getGeometry().getCoordinates();
      map.getView().animate({center:c, zoom:13, duration:600});
      // nudge the popup in trains.js if it’s there: simulate a click
      map.dispatchEvent({type:'singleclick', coordinate:c, pixel:map.getPixelFromCoordinate(c)});
    }
    searchBtn.addEventListener('click', ()=> searchTrain(searchBox.value.trim()));
    searchBox.addEventListener('keydown', e=>{ if(e.key==='Enter') searchTrain(searchBox.value.trim()); });

       // Start centered on Australia
    zoomAustralia();
  });

  // --- Load libraries + live trains ---
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>
  <script src="trains.js?v=1"></script>
  <script>
    TrainLayer.init(map);
  </script>
</body>
</html>
