<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RailOps — AU Live Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
#map { height: 100%; width: 100%; background: #0a1a2a; }

/* SOLID (not transparent) top UI */
.toolbar {
  position: absolute; top: 12px; left: 12px; z-index: 1000;
  background: #0a1a2a;
  color: white; padding: 10px 16px; border-radius: 40px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.55);
  display: flex; gap: 12px; align-items: center;
  border: 1px solid #2a4a7a;
  font-size: 14px; font-weight: 500;
}
.toolbar button, .toolbar select {
  background: #1e3a5f; color: white;
  border: 1px solid #3a6a9a; border-radius: 30px;
  padding: 6px 16px; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.toolbar button:hover { background: #2a4a7a; border-color: #5a8aca; }

.search-container { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 380px; }
.search-box {
  background: #0a1a2a;
  border-radius: 40px; border: 1px solid #2a4a7a;
  display: flex; box-shadow: 0 4px 20px rgba(0,0,0,0.55);
}
.search-box input {
  flex: 1; background: #1e3a5f; border: 1px solid #3a6a9a;
  border-radius: 40px 0 0 40px; padding: 10px 20px;
  color: white; font-size: 14px; outline: none;
}
.search-box input::placeholder { color: #9ab0d0; }
.search-box button {
  background: #0b57cf; border: none; border-radius: 0 40px 40px 0;
  padding: 10px 24px; color: white; font-weight: 800;
  cursor: pointer; transition: 0.2s;
}

.autocomplete-items {
  position: absolute; top: 100%; left: 0; right: 0;
  background: #0a1a2a;
  border: 1px solid #2a4a7a; border-top: none;
  border-radius: 0 0 20px 20px; max-height: 300px;
  overflow-y: auto; z-index: 1001; margin-top: 2px;
}
.autocomplete-item {
  padding: 12px 20px; color: white; cursor: pointer;
  border-bottom: 1px solid #1e3a5f; font-size: 13px;
  display: flex; justify-content: space-between;
}
.autocomplete-item:hover { background: #1e3a5f; }
.autocomplete-item .train-id { font-weight: 800; color: #9ab0d0; }
.autocomplete-item .train-loc { color: #ffaa00; }

.status-bar {
  position: absolute; top: 12px; right: 12px; z-index: 1000;
  background: #0a1a2a;
  color: white; padding: 8px 20px; border-radius: 40px;
  font-size: 13px; border: 1px solid #2a4a7a;
  display: flex; gap: 12px; align-items: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.55);
}
.train-count { background: #0b57cf; padding: 2px 12px; border-radius: 30px; font-weight: 900; }

.layers-panel {
  position: absolute; left: 12px; bottom: 12px; z-index: 1000;
  background: #0a1a2a;
  color: white; border-radius: 20px; padding: 16px;
  border: 1px solid #2a4a7a; width: 260px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.55);
}
.layer-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1e3a5f; }
.layer-row:last-child { border-bottom: none; }
.section-title { color: #9ab0d0; font-size: 12px; margin: 12px 0 4px 0; }

/* Hover popup */
.train-popup {
  background: rgba(10, 26, 42, 0.98);
  color: white;
  padding: 14px 16px;
  border-radius: 14px;
  border: 2px solid #2a4a7a;
  box-shadow: 0 8px 30px rgba(0,0,0,0.9);
  min-width: 320px;
  font-family: 'Segoe UI', sans-serif;
  pointer-events: none;
}
.train-popup .popup-header {
  font-size: 16px;
  font-weight: 900;
  color: #ffaa00;
  margin-bottom: 6px;
  border-bottom: 1px solid #2a4a7a;
  padding-bottom: 4px;
}
.train-popup .popup-subheader {
  font-size: 13px;
  color: #9ab0d0;
  margin-bottom: 10px;
  font-style: italic;
}
.train-popup .popup-grid {
  display: grid;
  grid-template-columns: 95px 1fr;
  gap: 7px;
  font-size: 13px;
}
.train-popup .popup-label { color: #9ab0d0; font-weight: 700; }
.train-popup .popup-badges {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 10px;
}
.badge {
  background: #1e3a5f;
  padding: 4px 10px;
  border-radius: 30px;
  font-size: 11px;
  color: #cfe0ff;
  border: 1px solid rgba(255,170,0,0.25);
}
</style>
</head>

<body>
<div class="toolbar">
  <span style="font-weight:900; color:#ffaa00">🚂 RailOps</span>
  <select id="stateSelect">
    <option value="au">🇦🇺 Australia</option>
    <option value="nsw">📍 NSW</option>
    <option value="vic">📍 VIC</option>
    <option value="qld">📍 QLD</option>
    <option value="sa">📍 SA</option>
    <option value="wa">📍 WA</option>
    <option value="tas">📍 TAS</option>
    <option value="nt">📍 NT</option>
  </select>
  <button id="locateBtn">📍 My Location</button>
  <button id="layersToggleBtn">🗺️ Layers</button>
</div>

<div class="search-container">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search train number, loco, or destination...">
    <button id="searchBtn">🔍 Search</button>
  </div>
  <div id="autocompleteList" class="autocomplete-items" style="display:none;"></div>
</div>

<div class="status-bar">
  <span id="lastUpdate">Loading...</span>
  <span class="train-count" id="trainCount">0</span>
</div>

<div class="layers-panel" id="layersPanel" style="display:none;">
  <h3>🗺️ MAP LAYERS</h3>
  <div class="layer-row"><label><input type="checkbox" id="trainLayerChk" checked> 🚆 Live Trains</label></div>
  <div class="layer-row"><label><input type="checkbox" id="railLayerChk" checked> 🛤️ Rail Lines (Blue)</label></div>
  <div class="layer-row"><label><input type="checkbox" id="stationsLayerChk" checked> 🏢 Stations</label></div>
  <div class="section-title">📱 MOBILE COVERAGE</div>
  <div class="layer-row"><label><input type="checkbox" id="covTelstraChk"> 📶 Telstra</label></div>
  <div class="layer-row"><label><input type="checkbox" id="covOptusChk"> 📶 Optus</label></div>
  <div class="layer-row"><label><input type="checkbox" id="covTPGChk"> 📶 Vodafone/TPG</label></div>
  <div class="layer-row"><label><input type="checkbox" id="covAllChk"> 📶 All Networks</label></div>
</div>

<div id="map"></div>

<script>
const DATA_URL = 'https://railops-live-au.fly.dev/trains.json';

const map = new ol.Map({
  target: 'map',
  layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
  view: new ol.View({
    center: ol.proj.fromLonLat([133.7751, -25.2744]),
    zoom: 4,
    maxZoom: 18
  })
});
map.getView().on('change:rotation', () => map.getView().setRotation(0));

const railLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png' }),
  visible: true,
  zIndex: 1
});
railLayer.on('prerender', e => { e.context.filter = 'hue-rotate(200deg) brightness(0.9) saturate(1.5)'; });
railLayer.on('postrender', e => { e.context.filter = 'none'; });

const stationsLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/stations/{z}/{x}/{y}.png' }),
  visible: true,
  zIndex: 2
});

map.addLayer(railLayer);
map.addLayer(stationsLayer);

const ACCC_URL = 'https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer';
function createAcccLayer(id) {
  return new ol.layer.Tile({
    source: new ol.source.TileArcGISRest({
      url: ACCC_URL,
      params: { layers: `show:${id}`, dpi: 96, transparent: true, format: 'png32' }
    }),
    opacity: 0.45,
    visible: false,
    zIndex: 3
  });
}
const covTelstra = createAcccLayer(25);
const covOptus = createAcccLayer(15);
const covTPG = createAcccLayer(33);
const covAll = createAcccLayer(4);
[covTelstra, covOptus, covTPG, covAll].forEach(l => map.addLayer(l));

const trainSource = new ol.source.Vector();
const trainLayer = new ol.layer.Vector({
  source: trainSource,
  visible: true,
  zIndex: 10,
  style: (feature) => {
    const t = feature.get('train_data') || {};
    const loco = t.trKey || t.train_name || '';
    const id = t.train_number || t.id || '';
    const speed = t.speed || 0;

    let dot = '#ffaa00';
    if (speed > 80) dot = '#ff4444';
    else if (speed > 30) dot = '#00cc00';
    else if (speed > 0) dot = '#44ff44';

    const isArrow = String(id).includes('arrow');
    const styles = [
      new ol.style.Style({
        image: new ol.style.Circle({
          radius: 8,
          fill: new ol.style.Fill({ color: dot }),
          stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
        })
      })
    ];
    if (isArrow) return styles;

    const labelStroke = new ol.style.Stroke({ color: '#000', width: 5 });
    const bgFill = new ol.style.Fill({ color: 'rgba(0,0,0,0.98)' });
    const bgStroke = new ol.style.Stroke({ color: 'rgba(255,170,0,0.9)', width: 1 });

    if (loco && id && loco !== id) {
      styles.push(
        new ol.style.Style({
          text: new ol.style.Text({
            text: loco,
            font: 'bold 12px monospace',
            fill: new ol.style.Fill({ color: '#ffaa00' }),
            stroke: labelStroke,
            offsetY: -28,
            backgroundFill: bgFill,
            backgroundStroke: bgStroke,
            padding: [3, 10, 3, 10]
          })
        }),
        new ol.style.Style({
          text: new ol.style.Text({
            text: id,
            font: 'bold 11px monospace',
            fill: new ol.style.Fill({ color: '#fff' }),
            stroke: new ol.style.Stroke({ color: '#000', width: 4 }),
            offsetY: -11,
            backgroundFill: bgFill,
            backgroundStroke: bgStroke,
            padding: [3, 10, 3, 10]
          })
        })
      );
    } else {
      const txt = loco || id;
      if (txt) {
        styles.push(new ol.style.Style({
          text: new ol.style.Text({
            text: txt,
            font: 'bold 12px monospace',
            fill: new ol.style.Fill({ color: '#ffaa00' }),
            stroke: labelStroke,
            offsetY: -18,
            backgroundFill: bgFill,
            backgroundStroke: bgStroke,
            padding: [3, 10, 3, 10]
          })
        }));
      }
    }
    return styles;
  }
});
map.addLayer(trainLayer);

let allTrains = [];

function isJunkTrain(t) {
  const id = String(t?.id || '');
  const hasIdentity = Boolean(t?.train_number || t?.trKey || t?.train_name);
  const hasRoute = Boolean(t?.origin || t?.destination || t?.description);
  return id.startsWith('markerSource_') && !(hasIdentity || hasRoute);
}

async function loadRealTrains() {
  const url = `${DATA_URL}?ts=${Date.now()}`;
  try {
    document.getElementById('lastUpdate').textContent = 'Loading...';
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const trains = (data.trains || []).filter(t => t?.lat && t?.lon).filter(t => !isJunkTrain(t));
    allTrains = trains;

    document.getElementById('trainCount').textContent = trains.length;
    const stamp = data.lastUpdated ? new Date(data.lastUpdated).toLocaleTimeString() : '—';
    const note = data.note ? ` | ${data.note}` : '';
    document.getElementById('lastUpdate').textContent = `Last: ${stamp}${note}`;

    trainSource.clear();
    for (const t of trains) {
      const f = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([t.lon, t.lat])) });
      f.set('train_data', t);
      trainSource.addFeature(f);
    }
  } catch (e) {
    console.error(e);
    document.getElementById('lastUpdate').textContent = '⚠️ Update failed';
  }
}

/* ✅ Hover popup overlay */
const popupDiv = document.createElement('div');
popupDiv.className = 'train-popup';

const popupOverlay = new ol.Overlay({
  element: popupDiv,
  positioning: 'bottom-center',
  offset: [0, -12],
  stopEvent: false
});
map.addOverlay(popupOverlay);
popupOverlay.setPosition(undefined);

map.on('pointermove', (evt) => {
  const feature = map.forEachFeatureAtPixel(evt.pixel, (f, layer) => (layer === trainLayer ? f : null));
  if (!feature) {
    popupOverlay.setPosition(undefined);
    return;
  }

  const t = feature.get('train_data') || {};
  const coords = feature.getGeometry().getCoordinates();

  // Don’t show popup for "arrow" markers (if any exist)
  const id = String(t.train_number || t.id || '');
  if (id.includes('arrow')) {
    popupOverlay.setPosition(undefined);
    return;
  }

  const loco = t.trKey || t.train_name || '';
  const trainId = t.train_number || t.id || 'Unknown';
  const speed = t.speed || 0;

  const header = loco && loco !== trainId
    ? `${loco} [${trainId}] — ${speed} km/h`
    : `${trainId} — ${speed} km/h`;

  popupDiv.innerHTML = `
    <div class="popup-header">${header}</div>
    ${t.description ? `<div class="popup-subheader">${t.description}</div>` : ''}
    <div class="popup-grid">
      <div class="popup-label">Origin:</div><div>${t.origin || 'Unknown'}</div>
      <div class="popup-label">Dest:</div><div>${t.destination || 'Unknown'}</div>
      ${t.time ? `<div class="popup-label">Time:</div><div>${t.time}</div>` : ''}
      ${t.km ? `<div class="popup-label">KM:</div><div>${t.km}</div>` : ''}
    </div>
    <div class="popup-badges">
      ${trainId ? `<span class="badge">Train: ${trainId}</span>` : ''}
      ${loco && loco !== trainId ? `<span class="badge">Loco: ${loco}</span>` : ''}
      ${t.operator ? `<span class="badge">Op: ${t.operator}</span>` : ''}
      <span class="badge">🧭 ${t.heading || 0}°</span>
    </div>
  `;

  popupOverlay.setPosition(coords);
});

/* Search */
const searchInput = document.getElementById('searchInput');
const autocompleteList = document.getElementById('autocompleteList');
let debounceTimer;

function flyToTrain(lat, lon) {
  map.getView().animate({ center: ol.proj.fromLonLat([lon, lat]), zoom: 12, duration: 900 });
}
function updateAutocomplete() {
  const query = searchInput.value.trim().toLowerCase();
  if (query.length < 2) { autocompleteList.style.display = 'none'; return; }

  const matches = [];
  const seen = new Set();

  allTrains.forEach(t => {
    const searchable = [t.train_number, t.trKey, t.train_name, t.description, t.origin, t.destination]
      .filter(Boolean).map(s => String(s).toLowerCase());
    const key = t.id || t.trKey || t.train_number || t.train_name || '';
    if (searchable.some(s => s.includes(query)) && !seen.has(key)) {
      seen.add(key);
      matches.push({ id: key, full: t });
    }
  });

  if (matches.length) {
    autocompleteList.innerHTML = '';
    matches.slice(0, 8).forEach(m => {
      const item = document.createElement('div');
      item.className = 'autocomplete-item';
      item.innerHTML = `<span class="train-id">${m.id}</span><span class="train-loc">${m.full.origin || ''} → ${m.full.destination || ''}</span>`;
      item.addEventListener('click', () => {
        searchInput.value = m.id;
        autocompleteList.style.display = 'none';
        flyToTrain(m.full.lat, m.full.lon);
      });
      autocompleteList.appendChild(item);
    });
    autocompleteList.style.display = 'block';
  } else {
    autocompleteList.style.display = 'none';
  }
}
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updateAutocomplete, 250);
});
function searchTrains() {
  const query = searchInput.value.trim().toLowerCase();
  if (!query) return;
  for (const t of allTrains) {
    const searchable = [t.train_number, t.trKey, t.train_name, t.id].filter(Boolean).map(s => String(s).toLowerCase());
    if (searchable.some(s => s.includes(query))) {
      flyToTrain(t.lat, t.lon);
      autocompleteList.style.display = 'none';
      return;
    }
  }
  alert('No trains found matching: ' + query);
}

/* Zoom */
const stateBounds = {
  au: [112, -44, 154, -10],
  nsw: [141, -38, 154, -28],
  vic: [141, -40, 150, -34],
  qld: [138, -30, 154, -9],
  sa: [129, -40, 141, -25],
  wa: [112, -36, 129, -13],
  tas: [143, -44, 149, -39],
  nt: [129, -27, 138, -10]
};
function zoomTo(region) {
  const bounds = stateBounds[region] || stateBounds.au;
  const extent = ol.proj.transformExtent(bounds, 'EPSG:4326', 'EPSG:3857');
  map.getView().fit(extent, { duration: 900, maxZoom: 10 });
}
function zoomToCurrent() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const center = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]);
    map.getView().animate({ center, zoom: 12, duration: 900 });
  });
}

/* UI events */
document.getElementById('stateSelect').addEventListener('change', e => zoomTo(e.target.value));
document.getElementById('locateBtn').addEventListener('click', zoomToCurrent);
document.getElementById('layersToggleBtn').addEventListener('click', () => {
  const panel = document.getElementById('layersPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('searchBtn').addEventListener('click', searchTrains);
searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchTrains(); });

document.getElementById('trainLayerChk').addEventListener('change', e => trainLayer.setVisible(e.target.checked));
document.getElementById('railLayerChk').addEventListener('change', e => railLayer.setVisible(e.target.checked));
document.getElementById('stationsLayerChk').addEventListener('change', e => stationsLayer.setVisible(e.target.checked));
document.getElementById('covTelstraChk').addEventListener('change', e => covTelstra.setVisible(e.target.checked));
document.getElementById('covOptusChk').addEventListener('change', e => covOptus.setVisible(e.target.checked));
document.getElementById('covTPGChk').addEventListener('change', e => covTPG.setVisible(e.target.checked));
document.getElementById('covAllChk').addEventListener('change', e => covAll.setVisible(e.target.checked));

loadRealTrains();
setInterval(loadRealTrains, 30000);
zoomTo('au');
</script>
</body>
</html>
