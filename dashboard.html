<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <title>RailOps — Dashboard</title>
  <style>
    :root { color-scheme: dark; }
    html,body { height:100%; margin:0; background:#0f172a; font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:#cbd5e1; }
    #bar { padding:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .chip { background:#1e293b; border:1px solid #334155; padding:6px 10px; border-radius:10px; display:inline-flex; gap:8px; align-items:center; }
    #map { height: calc(100% - 58px); }
    .ok   { background:#052e16; color:#86efac; }
    .warn { background:#3f1d1d; color:#fecaca; }
  </style>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script defer src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>
</head>
<body>
  <div id="bar">
    <span id="status" class="chip">Booting…</span>
    <label class="chip"><input id="tog-rails" type="checkbox" checked> Rails (OpenRailwayMap)</label>
    <label class="chip"><input id="tog-telstra" type="checkbox"> Telstra</label>
    <label class="chip"><input id="tog-telstra-mvno" type="checkbox"> Telstra MVNO</label>
    <label class="chip"><input id="tog-optus" type="checkbox"> Optus</label>
    <label class="chip"><input id="tog-voda" type="checkbox"> Vodafone/TPG</label>
    <button id="btn-au" class="chip">Recenter AU</button>
    <button id="btn-locate" class="chip">📍 My location</button>
    <span id="zoomInfo" class="chip">z=… · DPR=…</span>
  </div>
  <div id="map"></div>

  <script>
  (function(){
    const $ = id => document.getElementById(id);
    const status = $('status');
    const say = (m,t) => { status.textContent = m; status.className = 'chip' + (t?(' '+t):''); console.log('[dash]', m); };

    // 0) OL present?
    if (!window.ol || !ol.Map) { say('❌ OpenLayers failed to load (CSP/CDN).', 'warn'); return; }

    // 1) Base OSM (through our proxy)
    const osm = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: '/tiles/osm/{z}/{x}/{y}.png',
        crossOrigin: 'anonymous'
      })
    });
    osm.getSource().on('tileloaderror', () => say('⚠️ OSM tile failed (check /_redirects & CSP).', 'warn'));

    // 2) Rails (ORM, through our proxy)
    const rails = new ol.layer.Tile({
      visible: true,
      opacity: 0.9,
      source: new ol.source.XYZ({
        url: '/tiles/orm/{z}/{x}/{y}.png',
        crossOrigin: 'anonymous',
        attributions: '© OpenRailwayMap'
      })
    });
    rails.getSource().on('tileloaderror', () => say('⚠️ ORM tile failed (check /_redirects & CSP).', 'warn'));

    // 3) Optional overlays — point to your real files if/when you add them
    function carrierLayer(url, rgba) {
      return new ol.layer.Vector({
        visible: false,
        opacity: .35,
        source: new ol.source.Vector({ url, format: new ol.format.GeoJSON() }),
        style: new ol.style.Style({
          fill: new ol.style.Fill({ color: rgba }),
          stroke: new ol.style.Stroke({ color: rgba, width: 1 })
        })
      });
    }
    const telstra      = carrierLayer('/assets/coverage/telstra.geojson',      'rgba( 77,163,255,0.35)');
    const telstraMVNO  = carrierLayer('/assets/coverage/telstra-mvno.geojson', 'rgba( 77,255,219,0.35)');
    const optus        = carrierLayer('/assets/coverage/optus.geojson',        'rgba(255,206, 77,0.35)');
    const voda         = carrierLayer('/assets/coverage/vodafone-tpg.geojson', 'rgba(255,102,102,0.35)');

    // 4) Map + view
    const view = new ol.View({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 4.8 });
    const map = new ol.Map({
      target: 'map',
      view,
      interactions: ol.interaction.defaults({ altShiftDragRotate:false, pinchRotate:false }),
      layers: [osm, telstra, telstraMVNO, optus, voda, rails]
    });

    // 5) UI wires
    $('tog-rails').onchange        = e => rails.setVisible(e.target.checked);
    $('tog-telstra').onchange      = e => telstra.setVisible(e.target.checked);
    $('tog-telstra-mvno').onchange = e => telstraMVNO.setVisible(e.target.checked);
    $('tog-optus').onchange        = e => optus.setVisible(e.target.checked);
    $('tog-voda').onchange         = e => voda.setVisible(e.target.checked);
    $('btn-au').onclick = () => view.animate({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 4.8, duration: 450 });

    // Location pin
    const locLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
    map.addLayer(locLayer);
    function dropPin(lon,lat){
      locLayer.getSource().clear();
      const f = new ol.Feature(new ol.geom.Point(ol.proj.fromLonLat([lon,lat])));
      f.setStyle(new ol.style.Style({
        image: new ol.style.Icon({ anchor:[0.5,1], src:'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 48 48"><path fill="#ff4d4d" d="M24 45s-14-14.2-14-24A14 14 0 1 1 38 21c0 9.8-14 24-14 24z"/><circle cx="24" cy="21" r="5.5" fill="#fff"/></svg>') })
      }));
      locLayer.getSource().addFeature(f);
      view.animate({ center: ol.proj.fromLonLat([lon,lat]), zoom: Math.max(view.getZoom()||4, 10), duration: 450 });
    }
    $('btn-locate').onclick = () => {
      if (!navigator.geolocation) return say('Geolocation not supported', 'warn');
      say('Locating…');
      navigator.geolocation.getCurrentPosition(
        p => { dropPin(p.coords.longitude, p.coords.latitude); say('Location updated', 'ok'); },
        e => say('Location denied/unavailable: ' + (e?.message||e), 'warn'),
        { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
      );
    };

    // Zoom/DPR readout
    const zi = $('zoomInfo');
    const refresh = () => { const z=view.getZoom(); zi.textContent = `z=${(z??'–').toFixed?.(2) ?? z ?? '–'} · DPR=${Math.round(devicePixelRatio||1)}`; };
    view.on('change:resolution', refresh); refresh();

    map.once('rendercomplete', () => say('✅ Canvas rendered', 'ok'));
  })();
  </script>
</body>
</html>
