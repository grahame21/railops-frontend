<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RailOps — AU Live Map</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
#map{height:100%;width:100%;background:#0a1a2a}

/* SOLID (not transparent) bars */
.toolbar,.status-bar,.search-box,.autocomplete-items,.layers-panel{
background:#071421; /* solid */
border:1px solid #2a4a7a;
box-shadow:0 6px 22px rgba(0,0,0,.55);
color:#fff;
}

.toolbar{
position:absolute;top:12px;left:12px;z-index:1000;
padding:10px 16px;border-radius:40px;
display:flex;gap:12px;align-items:center;
font-size:14px;font-weight:500;
}
.toolbar button,.toolbar select{
background:#12304a;color:#fff;
border:1px solid #3a6a9a;border-radius:30px;
padding:6px 16px;font-size:13px;font-weight:600;
cursor:pointer;transition:.2s;
}
.toolbar button:hover{background:#1a476d;border-color:#5a8aca}

.search-container{
position:absolute;top:12px;left:50%;transform:translateX(-50%);
z-index:1000;width:420px;
}
.search-box{
border-radius:40px;
display:flex;overflow:hidden;
}
.search-box input{
flex:1;background:#12304a;border:none;
padding:10px 18px;color:#fff;font-size:14px;outline:none;
}
.search-box input::placeholder{color:#9ab0d0}
.search-box button{
background:#0b57cf;border:none;
padding:10px 18px;color:#fff;font-weight:700;cursor:pointer;
}
.autocomplete-items{
position:absolute;top:100%;left:0;right:0;
border-top:none;border-radius:0 0 18px 18px;
max-height:320px;overflow-y:auto;z-index:1001;margin-top:2px;
}
.autocomplete-item{
padding:10px 14px;cursor:pointer;
border-bottom:1px solid #0e2438;
font-size:13px;display:flex;justify-content:space-between;gap:12px;
}
.autocomplete-item:hover{background:#0e2438}
.autocomplete-item .train-id{font-weight:700;color:#9ab0d0}
.autocomplete-item .train-loc{color:#ffaa00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}

.status-bar{
position:absolute;top:12px;right:12px;z-index:1000;
padding:8px 14px;border-radius:40px;
font-size:13px;display:flex;gap:10px;align-items:center;
}
.train-count{background:#0b57cf;padding:2px 10px;border-radius:30px;font-weight:800}

.layers-panel{
position:absolute;left:12px;bottom:12px;z-index:1000;
border-radius:18px;padding:14px;width:270px;
}
.layer-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #0e2438}
.layer-row:last-child{border-bottom:none}
.section-title{color:#9ab0d0;font-size:12px;margin:12px 0 4px 0}

/* Popup */
.train-popup{
position:absolute;
background:#071421;
color:#fff;
padding:14px;
border-radius:16px;
border:2px solid #2a4a7a;
box-shadow:0 10px 34px rgba(0,0,0,.85);
pointer-events:none;
transform:translate(-50%,-100%);
min-width:340px;
z-index:10000;
}
.train-popup::after{
content:'';
position:absolute;top:100%;left:50%;
transform:translateX(-50%);
border-width:10px;border-style:solid;
border-color:#2a4a7a transparent transparent transparent;
}
.popup-header{font-size:18px;font-weight:800;color:#ffaa00;margin-bottom:8px;border-bottom:1px solid #2a4a7a;padding-bottom:4px}
.popup-subheader{font-size:14px;color:#9ab0d0;margin-bottom:10px;font-style:italic}
.popup-grid{display:grid;grid-template-columns:90px 1fr;gap:8px;font-size:13px;margin:8px 0}
.popup-label{color:#9ab0d0;font-weight:700}
.popup-badge{
background:#12304a;padding:4px 10px;border-radius:30px;
font-size:12px;display:inline-block;margin:4px 6px 0 0;color:#9ab0d0
}
.popup-footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;justify-content:center;font-size:11px;color:#9ab0d0}
</style>
</head>
<body>

<div class="toolbar">
<span style="font-weight:900;color:#ffaa00">🚂 RailOps</span>
<select id="stateSelect">
<option value="au">🇦🇺 Australia</option>
<option value="nsw">📍 NSW</option>
<option value="vic">📍 VIC</option>
<option value="qld">📍 QLD</option>
<option value="sa">📍 SA</option>
<option value="wa">📍 WA</option>
<option value="tas">📍 TAS</option>
<option value="nt">📍 NT</option>
</select>
<button id="locateBtn">📍 My Location</button>
<button id="layersToggleBtn">🗺️ Layers</button>
</div>

<div class="search-container">
<div class="search-box">
<input type="text" id="searchInput" placeholder="Search train number, loco, origin, destination...">
<button id="searchBtn">🔍</button>
</div>
<div id="autocompleteList" class="autocomplete-items" style="display:none;"></div>
</div>

<div class="status-bar">
<span id="lastUpdate">Loading…</span>
<span class="train-count" id="trainCount">0</span>
</div>

<div class="layers-panel" id="layersPanel" style="display:none;">
<h3 style="margin-bottom:8px">🗺️ MAP LAYERS</h3>
<div class="layer-row"><label><input type="checkbox" id="trainLayerChk" checked> 🚆 Live Trains</label></div>
<div class="layer-row"><label><input type="checkbox" id="railLayerChk" checked> 🛤️ Rail Lines (Blue)</label></div>
<div class="layer-row"><label><input type="checkbox" id="stationsLayerChk" checked> 🏢 Stations</label></div>
<div class="section-title">📱 MOBILE COVERAGE</div>
<div class="layer-row"><label><input type="checkbox" id="covTelstraChk"> 📶 Telstra</label></div>
<div class="layer-row"><label><input type="checkbox" id="covOptusChk"> 📶 Optus</label></div>
<div class="layer-row"><label><input type="checkbox" id="covTPGChk"> 📶 Vodafone/TPG</label></div>
<div class="layer-row"><label><input type="checkbox" id="covAllChk"> 📶 All Networks</label></div>
</div>

<div id="map"></div>

<script>
/** ✅ CHANGE THIS ONLY if your Fly URL is different */
const BACKEND_TRAINS_URL = "https://railops-live-au.fly.dev/trains.json";

const map = new ol.Map({
  target: 'map',
  layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
  view: new ol.View({
    center: ol.proj.fromLonLat([133.7751, -25.2744]),
    zoom: 4,
    maxZoom: 18
  })
});
map.getView().on('change:rotation', () => map.getView().setRotation(0));

const railLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png' }),
  visible: true,
  zIndex: 1
});
railLayer.on('prerender', e => e.context.filter = 'hue-rotate(200deg) brightness(0.9) saturate(1.5)');
railLayer.on('postrender', e => e.context.filter = 'none');

const stationsLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/stations/{z}/{x}/{y}.png' }),
  visible: true,
  zIndex: 2
});
map.addLayer(railLayer);
map.addLayer(stationsLayer);

const ACCC_URL = 'https://spatial.infrastructure.gov.au/server/rest/services/ACCC_Mobile_Sites_and_Coverages/MapServer';
function createAcccLayer(id) {
  return new ol.layer.Tile({
    source: new ol.source.TileArcGISRest({
      url: ACCC_URL,
      params: { layers: `show:${id}`, dpi: 96, transparent: true, format: 'png32' }
    }),
    opacity: 0.45,
    visible: false,
    zIndex: 3
  });
}
const covTelstra = createAcccLayer(25);
const covOptus = createAcccLayer(15);
const covTPG = createAcccLayer(33);
const covAll = createAcccLayer(4);
[covTelstra, covOptus, covTPG, covAll].forEach(l => map.addLayer(l));

/** ✅ Train layer */
const trainSource = new ol.source.Vector();
const trainLayer = new ol.layer.Vector({
  source: trainSource,
  visible: true,
  zIndex: 10,
  style: function(feature){
    const t = feature.get('train_data') || {};
    const loco = t.trKey || t.train_name || "";
    const id = t.train_number || t.id || "";
    const speed = Number(t.speed || 0);

    let dotColor = '#ffaa00';
    if (speed > 80) dotColor = '#ff4444';
    else if (speed > 30) dotColor = '#00cc00';
    else if (speed > 0) dotColor = '#44ff44';

    const styles = [
      new ol.style.Style({
        image: new ol.style.Circle({
          radius: 8,
          fill: new ol.style.Fill({ color: dotColor }),
          stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
        })
      })
    ];

    // labels
    if (loco && id && loco !== id) {
      styles.push(
        new ol.style.Style({
          text: new ol.style.Text({
            text: loco,
            font: 'bold 11px monospace',
            fill: new ol.style.Fill({ color: '#ffaa00' }),
            stroke: new ol.style.Stroke({ color: '#000000', width: 3 }),
            offsetY: -26,
            backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.90)' }),
            padding: [2, 8, 2, 8]
          })
        }),
        new ol.style.Style({
          text: new ol.style.Text({
            text: id,
            font: '10px monospace',
            fill: new ol.style.Fill({ color: '#ffffff' }),
            stroke: new ol.style.Stroke({ color: '#000000', width: 2 }),
            offsetY: -10,
            backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.90)' }),
            padding: [2, 8, 2, 8]
          })
        })
      );
    } else if (loco) {
      styles.push(new ol.style.Style({
        text: new ol.style.Text({
          text: loco,
          font: 'bold 11px monospace',
          fill: new ol.style.Fill({ color: '#ffaa00' }),
          stroke: new ol.style.Stroke({ color: '#000000', width: 3 }),
          offsetY: -18,
          backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.90)' }),
          padding: [2, 8, 2, 8]
        })
      }));
    } else if (id) {
      styles.push(new ol.style.Style({
        text: new ol.style.Text({
          text: id,
          font: 'bold 11px monospace',
          fill: new ol.style.Fill({ color: '#ffaa00' }),
          stroke: new ol.style.Stroke({ color: '#000000', width: 3 }),
          offsetY: -18,
          backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.90)' }),
          padding: [2, 8, 2, 8]
        })
      }));
    }

    return styles;
  }
});
map.addLayer(trainLayer);

let allTrains = [];

/** junk filter (frontend too) */
function isJunk(t){
  const id = String(t.id || "").toLowerCase();
  if (id.startsWith("markersource_")) return true;
  if (id.startsWith("arrowmarkersource_")) return true;
  if (!String(t.trKey||"").trim() && !String(t.train_name||"").trim() && !String(t.train_number||"").trim()) return true;
  return false;
}

async function loadRealTrains() {
  const url = `${BACKEND_TRAINS_URL}?ts=${Date.now()}`;
  try{
    document.getElementById('lastUpdate').textContent = 'Loading…';

    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    let trains = (data.trains || []).filter(t => t && !isJunk(t) && t.lat && t.lon);
    allTrains = trains;

    document.getElementById('trainCount').textContent = trains.length;
    if (data.lastUpdated){
      document.getElementById('lastUpdate').textContent = `Last: ${new Date(data.lastUpdated).toLocaleTimeString()}`;
    } else {
      document.getElementById('lastUpdate').textContent = 'Last: unknown';
    }

    trainSource.clear();
    for (const t of trains){
      const f = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([t.lon, t.lat]))
      });
      f.set('train_data', t);
      trainSource.addFeature(f);
    }
  } catch(err){
    console.error(err);
    document.getElementById('lastUpdate').textContent = '⚠️ Update failed';
  }
}

/** Hover popup */
let popupOverlay = null;

map.on('pointermove', function(evt){
  const feature = map.forEachFeatureAtPixel(evt.pixel, (f, layer) => layer === trainLayer ? f : null);
  if (popupOverlay){
    map.removeOverlay(popupOverlay);
    popupOverlay = null;
  }
  if (!feature) return;

  const coords = feature.getGeometry().getCoordinates();
  const t = feature.get('train_data') || {};
  const lonLat = ol.proj.toLonLat(coords);

  const loco = t.trKey || t.train_name || '';
  const trainId = t.train_number || t.id || 'Unknown';
  const speed = Number(t.speed || 0);

  const header = (loco && loco !== trainId) ? `${loco} [${trainId}] - ${speed}km/h` : `${trainId} - ${speed}km/h`;

  const popupDiv = document.createElement('div');
  popupDiv.className = 'train-popup';
  popupDiv.innerHTML = `
    <div class="popup-header">${header}</div>
    ${t.description ? `<div class="popup-subheader">${t.description}</div>` : ``}
    <div class="popup-grid">
      <span class="popup-label">Origin:</span><span>${t.origin || 'Unknown'}</span>
      <span class="popup-label">Destination:</span><span>${t.destination || 'Unknown'}</span>
      ${t.time ? `<span class="popup-label">Time:</span><span>${t.time}</span>` : ``}
      ${t.km ? `<span class="popup-label">Distance:</span><span>${t.km}</span>` : ``}
    </div>
    <div class="popup-footer">
      ${trainId ? `<span class="popup-badge">Train: ${trainId}</span>` : ``}
      ${loco && loco !== trainId ? `<span class="popup-badge">Loco: ${loco}</span>` : ``}
      ${t.cId ? `<span class="popup-badge">ID: ${String(t.cId).slice(0,8)}…</span>` : ``}
      <span class="popup-badge">🧭 ${Number(t.heading||0)}°</span>
      <span class="popup-badge">📍 ${lonLat[1].toFixed(4)}°, ${lonLat[0].toFixed(4)}°</span>
    </div>
  `;

  popupOverlay = new ol.Overlay({
    element: popupDiv,
    position: coords,
    positioning: 'bottom-center',
    offset: [0, -15]
  });
  map.addOverlay(popupOverlay);
});

/** Search + autocomplete */
const searchInput = document.getElementById('searchInput');
const autocompleteList = document.getElementById('autocompleteList');
let debounceTimer;

function updateAutocomplete(){
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2){
    autocompleteList.style.display = 'none';
    return;
  }

  const matches = [];
  const seen = new Set();

  for (const t of allTrains){
    if (isJunk(t)) continue;

    const key = (t.trKey || t.train_name || t.train_number || t.id || '').toString();
    if (!key) continue;

    const hay = [
      t.train_number, t.trKey, t.train_name, t.description, t.origin, t.destination
    ].filter(Boolean).map(s => String(s).toLowerCase());

    if (hay.some(s => s.includes(q)) && !seen.has(key)){
      seen.add(key);
      matches.push({ key, t });
    }
  }

  if (!matches.length){
    autocompleteList.style.display = 'none';
    return;
  }

  autocompleteList.innerHTML = '';
  matches.slice(0, 10).forEach(m => {
    const div = document.createElement('div');
    div.className = 'autocomplete-item';
    div.innerHTML = `
      <span class="train-id">${m.key}</span>
      <span class="train-loc">${(m.t.origin||'') + ' → ' + (m.t.destination||'')}</span>
    `;
    div.onclick = () => {
      searchInput.value = m.key;
      autocompleteList.style.display = 'none';
      flyTo(m.t.lat, m.t.lon);
    };
    autocompleteList.appendChild(div);
  });
  autocompleteList.style.display = 'block';
}

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updateAutocomplete, 250);
});

function flyTo(lat, lon){
  map.getView().animate({ center: ol.proj.fromLonLat([lon, lat]), zoom: 12, duration: 900 });
}

function searchTrains(){
  const q = searchInput.value.trim().toLowerCase();
  if (!q) return;

  for (const t of allTrains){
    if (isJunk(t)) continue;

    const hay = [t.train_number, t.trKey, t.train_name, t.id].filter(Boolean).map(s => String(s).toLowerCase());
    if (hay.some(s => s.includes(q))){
      flyTo(t.lat, t.lon);
      autocompleteList.style.display = 'none';
      return;
    }
  }
  alert('No trains found for: ' + q);
}

/** Zoom */
const stateBounds = {
  au:[112,-44,154,-10],
  nsw:[141,-38,154,-28],
  vic:[141,-40,150,-34],
  qld:[138,-30,154,-9],
  sa:[129,-40,141,-25],
  wa:[112,-36,129,-13],
  tas:[143,-44,149,-39],
  nt:[129,-27,138,-10]
};
function zoomTo(region){
  const b = stateBounds[region] || stateBounds.au;
  const ex = ol.proj.transformExtent(b, 'EPSG:4326', 'EPSG:3857');
  map.getView().fit(ex, { duration: 900, maxZoom: 10 });
}
function zoomToCurrent(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const c = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]);
    map.getView().animate({ center: c, zoom: 12, duration: 900 });
  });
}

/** UI wiring */
document.getElementById('stateSelect').onchange = e => zoomTo(e.target.value);
document.getElementById('locateBtn').onclick = zoomToCurrent;
document.getElementById('layersToggleBtn').onclick = () => {
  const p = document.getElementById('layersPanel');
  p.style.display = (p.style.display === 'none') ? 'block' : 'none';
};
document.getElementById('searchBtn').onclick = searchTrains;
searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchTrains(); });

document.getElementById('trainLayerChk').onchange = e => trainLayer.setVisible(e.target.checked);
document.getElementById('railLayerChk').onchange = e => railLayer.setVisible(e.target.checked);
document.getElementById('stationsLayerChk').onchange = e => stationsLayer.setVisible(e.target.checked);
document.getElementById('covTelstraChk').onchange = e => covTelstra.setVisible(e.target.checked);
document.getElementById('covOptusChk').onchange = e => covOptus.setVisible(e.target.checked);
document.getElementById('covTPGChk').onchange = e => covTPG.setVisible(e.target.checked);
document.getElementById('covAllChk').onchange = e => covAll.setVisible(e.target.checked);

/** Start */
loadRealTrains();
setInterval(loadRealTrains, 30000);
zoomTo('au');
</script>
</body>
</html>
