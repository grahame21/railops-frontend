<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RailOps — AU Live Map</title>

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #map { height: 100%; width: 100%; background: #0a1a2a; }
    
    .toolbar {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: rgba(10, 26, 42, 0.95); backdrop-filter: blur(8px);
      color: white; padding: 10px 16px; border-radius: 40px;
      border: 1px solid #2a4a7a; display: flex; gap: 12px;
    }
    
    .status-bar {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: rgba(10, 26, 42, 0.95); backdrop-filter: blur(8px);
      color: white; padding: 8px 20px; border-radius: 40px;
      border: 1px solid #2a4a7a; display: flex; gap: 12px;
    }
    
    .train-popup {
      position: absolute;
      background: rgba(10, 26, 42, 0.98);
      backdrop-filter: blur(8px);
      color: white;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #2a4a7a;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      pointer-events: none;
      transform: translate(-50%, -100%);
      min-width: 300px;
      z-index: 10000;
    }
    .train-popup::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px;
      border-style: solid;
      border-color: #2a4a7a transparent transparent transparent;
    }
    .popup-header {
      font-size: 16px;
      font-weight: 600;
      color: #ffaa00;
      margin-bottom: 8px;
      border-bottom: 1px solid #2a4a7a;
      padding-bottom: 4px;
    }
    .popup-grid {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 6px;
      font-size: 12px;
      margin: 8px 0;
    }
    .popup-label { color: #9ab0d0; }
    .popup-value { color: white; }
    .popup-badge {
      background: #1e3a5f;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      color: #9ab0d0;
      display: inline-block;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span style="color:#ffaa00">🚂 RailOps</span>
    <select id="stateSelect">
      <option value="au">Australia</option>
      <option value="nsw">NSW</option>
      <option value="vic">VIC</option>
      <option value="qld">QLD</option>
      <option value="sa">SA</option>
      <option value="wa">WA</option>
    </select>
    <button id="locateBtn">📍 My Location</button>
  </div>

  <div class="status-bar">
    <span id="lastUpdate">Loading...</span>
    <span id="trainCount">0</span>
  </div>

  <div id="map"></div>

  <script>
    const map = new ol.Map({
      target: 'map',
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      view: new ol.View({
        center: ol.proj.fromLonLat([133.7751, -25.2744]),
        zoom: 4
      })
    });

    // Rail layers with blue filter
    const railLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({ url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png' }),
      visible: true
    });
    
    railLayer.on('prerender', function(e) {
      e.context.filter = 'hue-rotate(200deg) brightness(0.9)';
    });
    railLayer.on('postrender', function(e) {
      e.context.filter = 'none';
    });
    map.addLayer(railLayer);

    // Train layer - FIXED to show correct IDs
    const trainSource = new ol.source.Vector();
    const trainLayer = new ol.layer.Vector({
      source: trainSource,
      style: function(feature) {
        const train = feature.get('train_data') || {};
        
        // Use train_name or train_number for display, NOT the source ID
        const displayId = train.train_name || train.train_number || train.id || '???';
        const speed = train.speed || 0;
        
        // Color by speed
        let color = '#ffaa00';
        if (speed > 80) color = '#ff4444';
        else if (speed > 30) color = '#00cc00';
        
        return [
          new ol.style.Style({
            image: new ol.style.Circle({
              radius: 8,
              fill: new ol.style.Fill({ color: color }),
              stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
            })
          }),
          new ol.style.Style({
            text: new ol.style.Text({
              text: displayId,
              font: 'bold 11px monospace',
              fill: new ol.style.Fill({ color: '#ffaa00' }),
              stroke: new ol.style.Stroke({ color: '#000', width: 3 }),
              offsetY: -18,
              backgroundFill: new ol.style.Fill({ color: 'rgba(0,0,0,0.8)' })
            })
          })
        ];
      }
    });
    map.addLayer(trainLayer);

    let allTrains = [];
    
    async function loadTrains() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/grahame21/railops-backend/main/trains.json');
        const data = await response.json();
        const trains = data.trains || [];
        
        allTrains = trains;
        document.getElementById('trainCount').textContent = trains.length;
        document.getElementById('lastUpdate').innerHTML = 
          `Last: ${new Date(data.lastUpdated).toLocaleTimeString()}`;
        
        trainSource.clear();
        
        trains.forEach(train => {
          if (train.lat && train.lon) {
            const feature = new ol.Feature({
              geometry: new ol.geom.Point(ol.proj.fromLonLat([train.lon, train.lat]))
            });
            feature.set('train_data', train);
            trainSource.addFeature(feature);
          }
        });
        
      } catch (error) {
        console.error('Failed to load trains:', error);
      }
    }

    // Hover popup
    let popup = null;
    
    map.on('pointermove', function(evt) {
      const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
      
      if (popup) {
        map.removeOverlay(popup);
        popup = null;
      }
      
      if (feature) {
        const train = feature.get('train_data') || {};
        const coords = feature.getGeometry().getCoordinates();
        const lonLat = ol.proj.toLonLat(coords);
        
        const div = document.createElement('div');
        div.className = 'train-popup';
        div.innerHTML = `
          <div class="popup-header">${train.train_name || train.train_number || train.id}</div>
          <div class="popup-grid">
            <span class="popup-label">Origin:</span><span>${train.origin || 'Unknown'}</span>
            <span class="popup-label">Dest:</span><span>${train.destination || 'Unknown'}</span>
            <span class="popup-label">Speed:</span><span>${train.speed || 0} km/h</span>
            ${train.km ? `<span class="popup-label">Dist:</span><span>${train.km}</span>` : ''}
            ${train.time ? `<span class="popup-label">Time:</span><span>${train.time}</span>` : ''}
          </div>
          <div>
            ${train.train_number ? `<span class="popup-badge">Train: ${train.train_number}</span>` : ''}
            ${train.train_name ? `<span class="popup-badge">Loco: ${train.train_name}</span>` : ''}
            <span class="popup-badge">📍 ${lonLat[1].toFixed(2)}°, ${lonLat[0].toFixed(2)}°</span>
          </div>
        `;
        
        popup = new ol.Overlay({
          element: div,
          position: coords,
          positioning: 'bottom-center',
          offset: [0, -15]
        });
        map.addOverlay(popup);
      }
    });

    // Initial load
    loadTrains();
    setInterval(loadTrains, 30000);
    zoomTo('au');
    
    function zoomTo(region) {
      const bounds = { au: [112, -44, 154, -10] }[region] || [112, -44, 154, -10];
      map.getView().fit(ol.proj.transformExtent(bounds, 'EPSG:4326', 'EPSG:3857'), { duration: 1000 });
    }
  </script>
</body>
</html>
