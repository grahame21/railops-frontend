<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RailOps — Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css" />
  <style>
    :root { color-scheme: dark; }
    html,body { height:100%; margin:0; background:#0f172a; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; color:#cbd5e1; }
    #bar { padding:10px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; border-bottom:1px solid #23314d; }
    .chip { background:#1e293b; border:1px solid #334155; padding:6px 10px; border-radius:10px; display:inline-flex; align-items:center; gap:8px; }
    .ok { color:#86efac } .warn { color:#fca5a5 }
    #map { height: calc(100% - 56px); }
    #logout { margin-left:auto }
  </style>
</head>
<body>
  <div id="bar">
    <span id="status" class="chip">Booting…</span>
    <label class="chip"><input id="tog-rails" type="checkbox" checked> Rails (ORM)</label>
    <button id="btn-au" class="chip">Recenter AU</button>
    <button id="btn-locate" class="chip">📍 My location</button>
    <span id="zoomInfo" class="chip">z=… · DPR=…</span>
    <button id="logout" class="chip">Logout</button>
  </div>
  <div id="map"></div>

  <!-- OpenLayers (no bundler) -->
  <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>
  <script>
  (function () {
    const $ = id => document.getElementById(id);
    const say = (m,t) => { const s=$('status'); s.textContent=m; s.className='chip '+(t||''); console.log('[dashboard]',m); };

    if (!window.ol || !ol.Map) { say('❌ OpenLayers failed to load', 'warn'); return; }

    // ---- Tile endpoints (via Netlify Functions)
    const OSM_URL = '/api/tiles/osm/{z}/{x}/{y}.png';
    const ORM_URL = '/api/tiles/orm/{z}/{x}/{y}.png';

    // ---- Base map (OSM)
    const osm = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: OSM_URL,
        crossOrigin: 'anonymous',
        attributions: '© OpenStreetMap'
      })
    });
    osm.getSource().on('tileloaderror', () => say('⚠️ OSM tile error (check /api/tiles/osm)', 'warn'));

    // ---- Rails overlay (OpenRailwayMap)
    const rails = new ol.layer.Tile({
      visible: true, opacity: 0.9,
      source: new ol.source.XYZ({
        url: ORM_URL,
        crossOrigin: 'anonymous',
        attributions: '© OpenRailwayMap'
      })
    });
    rails.getSource().on('tileloaderror', () => say('⚠️ ORM tile error (check /api/tiles/orm)', 'warn'));

    // ---- Map (north-up: disable rotation)
    const view = new ol.View({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 4.8 });
    const map = new ol.Map({
      target: 'map',
      view,
      interactions: ol.interaction.defaults({ altShiftDragRotate:false, pinchRotate:false }),
      layers: [osm, rails]
    });

    // ---- UI wires
    $('tog-rails').onchange = e => rails.setVisible(e.target.checked);
    $('btn-au').onclick = () => view.animate({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 4.8, duration: 450 });

    // Location pin
    const locLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
    map.addLayer(locLayer);
    function dropPin(lon,lat){
      locLayer.getSource().clear();
      const f = new ol.Feature(new ol.geom.Point(ol.proj.fromLonLat([lon,lat])));
      f.setStyle(new ol.style.Style({
        image: new ol.style.Icon({ anchor:[0.5,1],
          src:'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 48 48"><path fill="#ff4d4d" d="M24 45s-14-14.2-14-24A14 14 0 1 1 38 21c0 9.8-14 24-14 24z"/><circle cx="24" cy="21" r="5.5" fill="#fff"/></svg>')
        })
      }));
      locLayer.getSource().addFeature(f);
      view.animate({ center: ol.proj.fromLonLat([lon,lat]), zoom: Math.max(view.getZoom()||4, 10), duration: 450 });
    }
    $('btn-locate').onclick = () => {
      if (!navigator.geolocation) return say('Geolocation not supported','warn');
      say('Locating…');
      navigator.geolocation.getCurrentPosition(
        p => { dropPin(p.coords.longitude, p.coords.latitude); say('Location updated','ok'); },
        e => say('Location denied/unavailable: '+(e?.message||e),'warn'),
        { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
      );
    };

    // Zoom/DPR readout
    const zi = $('zoomInfo');
    const refresh = () => { const z=view.getZoom(); zi.textContent = `z=${(z??'–').toFixed?.(2) ?? z ?? '–'} · DPR=${Math.round(devicePixelRatio||1)}`; };
    view.on('change:resolution', refresh); refresh();

    // Logout (clears cookie if you use one)
    $('logout').onclick = () => { try{ document.cookie='railops_session=; Max-Age=0; path=/; SameSite=Lax'; }catch{} window.location.href='/login.html'; };

    map.once('rendercomplete', () => say('✅ Map rendered','ok'));
  })();
  </script>
</body>
</html>
