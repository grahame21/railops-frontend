<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071326" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RailOps" />
<meta name="mobile-web-app-capable" content="yes" />
<title>RailOps — AU Live Map</title>

<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<link rel="stylesheet" href="./ol/ol.css" />

<script src="./app-auth.js"></script>
<script>
  railopsCheckSession();
</script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root{
  --panel-bg: rgba(8, 20, 38, 0.96);
  --panel-border: #2a4a7a;
  --panel-btn: #1e3a5f;
  --panel-btn-border: #3a6a9a;
  --accent: #ffaa00;
  --blue: #0b57cf;
  --text: #ffffff;
  --shadow: 0 8px 28px rgba(0,0,0,0.55);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: #071326;
}

body { overscroll-behavior: none; }

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  background: #0a1a2a;
}

.top-card, .toolbar, .status-bar, .search-box, .autocomplete-items, .layers-panel, .operator-panel, .route-panel {
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.top-card {
  position: absolute;
  top: calc(var(--safe-top) + 8px);
  left: calc(var(--safe-left) + 10px);
  right: calc(var(--safe-right) + 10px);
  z-index: 1000;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 8px;
  display: none;
  max-height: 58dvh;
  overflow-y: auto;
}

.mobile-brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.mobile-brand {
  color: var(--accent);
  font-size: 16px;
  font-weight: 900;
  line-height: 1.1;
}

.mobile-compact-toggle {
  border: 1px solid var(--panel-btn-border);
  background: var(--panel-btn);
  color: white;
  border-radius: 12px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
}

.mobile-controls-area { display: none; }

.top-card.expanded .mobile-controls-area { display: block; }

.mobile-controls-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.mobile-controls-grid button,
.mobile-controls-grid select {
  width: 100%;
  min-width: 0;
  height: 40px;
  min-height: 40px;
  border-radius: 14px;
  border: 1px solid var(--panel-btn-border);
  background: var(--panel-btn);
  color: white;
  font-size: 13px;
  font-weight: 800;
  padding: 6px 10px;
  outline: none;
}

#mobileLayersBtn,
#mobileOperatorBtn,
#mobileRouteBtn,
#mobileClearFiltersBtn,
#mobileFilterToggleBtn,
#mobileDatabaseBtn { grid-column: 1 / -1; }

.mobile-search-wrap { margin-bottom: 8px; }

.search-box {
  background: var(--panel-bg);
  border-radius: 16px;
  border: 1px solid var(--panel-border);
  display: flex;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.search-box input {
  flex: 1;
  min-width: 0;
  background: #15283f;
  border: 0;
  padding: 8px 11px;
  color: white;
  font-size: 13px;
  outline: none;
  height: 38px;
}

.search-box input::placeholder { color: #9ab0d0; }

.search-box button {
  background: var(--blue);
  border: 0;
  padding: 8px 12px;
  color: white;
  font-weight: 900;
  cursor: pointer;
  min-width: 78px;
  font-size: 13px;
  height: 38px;
}

.mobile-status-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  align-items: center;
}

.mobile-last {
  min-width: 0;
  color: white;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
}

.mobile-status-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.mobile-note,
.mobile-count {
  white-space: nowrap;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 900;
}

.mobile-note {
  background: #15283f;
  border: 1px solid #2b4f80;
  color: #cfe2ff;
}

.mobile-count {
  background: var(--blue);
  color: white;
  min-width: 58px;
  text-align: center;
}

.toolbar {
  position: absolute;
  top: calc(var(--safe-top) + 10px);
  left: calc(var(--safe-left) + 10px);
  z-index: 1000;
  background: var(--panel-bg);
  color: white;
  padding: 8px 12px;
  border-radius: 20px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 8px;
  align-items: center;
  border: 1px solid var(--panel-border);
  font-size: 13px;
  font-weight: 700;
  flex-wrap: wrap;
  max-width: calc(100vw - 20px);
}

.toolbar button,
.toolbar select {
  background: var(--panel-btn);
  color: white;
  border: 1px solid var(--panel-btn-border);
  border-radius: 14px;
  padding: 8px 11px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  outline: none;
}

.toolbar select option {
  background: #0b1522;
  color: #ffffff;
}

.search-container {
  position: absolute;
  top: calc(var(--safe-top) + 10px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  width: min(460px, calc(100vw - 600px));
}

.autocomplete-items {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  max-height: 320px;
  overflow-y: auto;
  z-index: 1001;
  box-shadow: var(--shadow);
}

.autocomplete-item {
  padding: 12px 14px;
  color: white;
  cursor: pointer;
  border-bottom: 1px solid #1e3a5f;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover { background: #13243a; }
.autocomplete-item .train-id { font-weight: 900; color: #cfe2ff; }
.autocomplete-item .train-loc {
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-bar {
  position: absolute;
  top: calc(var(--safe-top) + 10px);
  right: calc(var(--safe-right) + 10px);
  z-index: 1000;
  background: var(--panel-bg);
  color: white;
  padding: 8px 11px;
  border-radius: 20px;
  font-size: 12px;
  border: 1px solid var(--panel-border);
  display: flex;
  gap: 8px;
  align-items: center;
  box-shadow: var(--shadow);
}

.train-count {
  background: var(--blue);
  padding: 5px 10px;
  border-radius: 999px;
  font-weight: 900;
  min-width: 48px;
  text-align: center;
}

.note-pill {
  background: #15283f;
  border: 1px solid #2b4f80;
  padding: 5px 8px;
  border-radius: 999px;
  font-weight: 800;
  color: #cfe2ff;
}

.layers-panel,
.operator-panel,
.route-panel {
  position: absolute;
  left: calc(var(--safe-left) + 12px);
  z-index: 1000;
  background: var(--panel-bg);
  color: white;
  border-radius: 18px;
  padding: 14px;
  border: 1px solid var(--panel-border);
  width: 320px;
  box-shadow: var(--shadow);
  max-height: 60dvh;
  overflow-y: auto;
}

.layers-panel { bottom: calc(var(--safe-bottom) + 12px); display:none; }
.operator-panel { top: calc(var(--safe-top) + 64px); display: none; }
.route-panel { top: calc(var(--safe-top) + 64px); left: calc(var(--safe-left) + 344px); display: none; }

.layer-row,
.operator-row,
.route-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #1e3a5f;
  font-size: 13px;
}

.layer-row:last-child,
.operator-row:last-child,
.route-row:last-child { border-bottom: none; }

.section-title {
  color: #9ab0d0;
  font-size: 12px;
  margin: 12px 0 4px 0;
}

.operator-actions,
.route-actions {
  display: flex;
  gap: 8px;
  margin: 8px 0 10px 0;
  flex-wrap: wrap;
}

.operator-actions button,
.route-actions button {
  background: #163456;
  color: white;
  border: 1px solid #2b4f80;
  border-radius: 12px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.operator-search,
.route-search {
  width: 100%;
  border: 1px solid #2b4f80;
  background: #15283f;
  color: white;
  border-radius: 12px;
  padding: 8px 10px;
  font-size: 13px;
  outline: none;
  margin-bottom: 8px;
}

.filter-chip-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
}

.toolbar-chip-wrap { margin-top: 4px; }

.mobile-chip-section {
  margin-bottom: 8px;
  display: none;
}

.mobile-chip-section.open { display: block; }

.mobile-chip-header {
  color: #9ab0d0;
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 6px;
}

.mobile-chip-wrap {
  max-height: 92px;
  overflow-y: auto;
  padding-right: 4px;
}

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(19, 40, 66, 0.95);
  color: #fff;
  border: 1px solid #2a4a7a;
  border-radius: 999px;
  padding: 7px 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
  font-size: 12px;
  font-weight: 800;
  max-width: min(260px, 90vw);
}

.filter-chip .chip-kind {
  color: #9ab0d0;
  font-weight: 700;
}

.filter-chip .chip-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filter-chip .chip-close {
  border: 1px solid #2b4f80;
  background: #163456;
  color: white;
  border-radius: 999px;
  width: 22px;
  height: 22px;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
  line-height: 1;
  flex: 0 0 auto;
}

.clear-filters-btn {
  background: #163456 !important;
  color: white !important;
  border: 1px solid #2b4f80 !important;
}

.train-popup {
  position: absolute;
  background: #091426;
  color: white;
  isolation: isolate;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--panel-border);
  box-shadow: 0 10px 36px rgba(0,0,0,0.85);
  pointer-events: auto;
  transform: translate(-50%, -100%);
  min-width: 300px;
  max-width: min(390px, calc(100vw - 24px));
  z-index: 10000;
}

.train-popup::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border-width: 9px;
  border-style: solid;
  border-color: var(--panel-border) transparent transparent transparent;
}

.popup-header {
  font-size: 15px;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 6px;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 4px;
}

.popup-subheader {
  font-size: 12px;
  color: #9ab0d0;
  margin-bottom: 8px;
  font-style: italic;
}

.popup-grid {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 6px;
  font-size: 12px;
  margin: 6px 0;
}

.popup-label { color: #9ab0d0; font-weight: 800; }
.popup-value { color: white; word-break: break-word; }

.popup-badge {
  background: #15283f;
  border: 1px solid #2b4f80;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  display: inline-block;
  margin-right: 6px;
  margin-top: 6px;
  color: #cfe2ff;
}

.popup-footer {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px;
}

.popup-close {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #163456;
  border: 1px solid #2b4f80;
  color: white;
  border-radius: 10px;
  width: 28px;
  height: 28px;
  font-weight: 900;
  cursor: pointer;
}

#logoutBtn {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 2000;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid #2a4a7a;
  background: rgba(8,20,38,.92);
  color: #fff;
  font-weight: 700;
  box-shadow: 0 8px 28px rgba(0,0,0,.45);
  cursor: pointer;
}


/* ===== RailOps dashboard v3 layout fixes: no scrolling/overlap on desktop bars ===== */
@media (min-width: 901px) {
  .top-card { display: none !important; }

  .toolbar {
    top: calc(var(--safe-top) + 10px);
    left: calc(var(--safe-left) + 10px);
    right: calc(var(--safe-right) + 10px);
    width: auto;
    max-width: none;
    min-height: 56px;
    flex-wrap: nowrap;
    overflow: visible;
    white-space: nowrap;
    align-items: center;
  }

  .toolbar button,
  .toolbar select {
    flex: 0 0 auto;
  }

  .toolbar-chip-wrap {
    display: none !important;
  }

  .search-container {
    top: calc(var(--safe-top) + 76px);
    left: calc(var(--safe-left) + 12px);
    transform: none;
    width: min(720px, calc(100vw - 470px));
    z-index: 1000;
  }

  .status-bar {
    top: calc(var(--safe-top) + 76px);
    right: calc(var(--safe-right) + 12px);
    max-width: 440px;
    overflow: visible;
    white-space: nowrap;
  }

  .layers-panel { bottom: calc(var(--safe-bottom) + 16px); }
  .operator-panel, .route-panel { top: calc(var(--safe-top) + 140px); }
}

@media (min-width: 901px) and (max-width: 1320px) {
  .toolbar { gap: 6px; padding: 7px 8px; }
  .toolbar button,
  .toolbar select { padding: 7px 8px; font-size: 12px; }
  .search-container { width: min(580px, calc(100vw - 390px)); }
  .status-bar { font-size: 11px; max-width: 365px; }
}

/* Keep mobile top card from becoming a scrolling bar */
.top-card {
  overflow: visible;
}

/* ===== RailOps dashboard v3 extras ===== */
.map-legend {
  position: absolute;
  right: calc(var(--safe-right) + 14px);
  bottom: calc(var(--safe-bottom) + 68px);
  z-index: 1000;
  background: rgba(8, 20, 38, 0.94);
  color: #fff;
  border: 1px solid var(--panel-border);
  box-shadow: var(--shadow);
  border-radius: 16px;
  padding: 10px 12px;
  font-size: 12px;
  min-width: 190px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.map-legend h4 {
  margin: 0 0 8px 0;
  color: var(--accent);
  font-size: 13px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
  white-space: nowrap;
}

.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid #fff;
  display: inline-block;
}

.legend-blue-line {
  width: 28px;
  height: 4px;
  border-radius: 999px;
  background: #00aaff;
  box-shadow: 0 0 8px rgba(0, 170, 255, .7);
  display: inline-block;
}

.legend-actions {
  display: grid;
  gap: 6px;
  margin-top: 8px;
}

.legend-actions button {
  border: 1px solid var(--panel-btn-border);
  background: var(--panel-btn);
  color: white;
  border-radius: 10px;
  padding: 7px 9px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.location-pin-label {
  color: #fff;
  background: rgba(0, 88, 180, .94);
  border: 1px solid #7fc8ff;
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 900;
  text-shadow: 0 1px 2px #000;
}

/* Keep HTML popups above all map/canvas/tile layers. */
.ol-overlaycontainer,
.ol-overlaycontainer-stopevent {
  z-index: 12000 !important;
  pointer-events: none;
}

.ol-overlaycontainer .train-popup,
.ol-overlaycontainer-stopevent .train-popup {
  pointer-events: auto;
}

@media (max-width: 900px) {
  .map-legend { display: none; }
}

/* Keep HTML popups above all map/canvas/tile layers. */
.ol-overlaycontainer,
.ol-overlaycontainer-stopevent {
  z-index: 12000 !important;
  pointer-events: none;
}

.ol-overlaycontainer .train-popup,
.ol-overlaycontainer-stopevent .train-popup {
  pointer-events: auto;
}

@media (max-width: 900px) {
  .top-card { display: block; }
  .toolbar, .search-container, .status-bar { display: none !important; }

  .layers-panel,
  .operator-panel,
  .route-panel {
    left: calc(var(--safe-left) + 10px);
    right: calc(var(--safe-right) + 10px);
    width: auto;
    max-height: 38dvh;
  }

  .layers-panel { bottom: calc(var(--safe-bottom) + 10px); }
  .operator-panel { top: calc(var(--safe-top) + 190px); }
  .route-panel { top: calc(var(--safe-top) + 190px); }

  .popup-grid {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .train-popup {
    min-width: 260px;
    max-width: calc(100vw - 20px);
  }
}
</style>
</head>

<body>

<div class="top-card" id="topCard">
  <div class="mobile-brand-row">
    <div class="mobile-brand">🚂 RailOps</div>
    <button id="mobileCompactToggle" class="mobile-compact-toggle">Show Controls</button>
  </div>

  <div class="mobile-controls-area" id="mobileControlsArea">
    <div class="mobile-controls-grid">
      <select id="mobileStateSelect">
        <option value="au">🇦🇺 Australia</option>
        <option value="nsw">📍 NSW</option>
        <option value="vic">📍 VIC</option>
        <option value="qld">📍 QLD</option>
        <option value="sa">📍 SA</option>
        <option value="wa">📍 WA</option>
        <option value="tas">📍 TAS</option>
        <option value="nt">📍 NT</option>
      </select>

      <button id="mobileLocateBtn">📍 My Location</button>
      <button id="mobileLayersBtn">🗺️ Layers</button>
      <button id="mobileDatabaseBtn">📚 Loco Database</button>
      <button id="mobileOperatorBtn">🚫 Hide Operators (0)</button>
      <button id="mobileRouteBtn">🧭 Hide Routes/Services (0)</button>
      <button id="mobileClearFiltersBtn" class="clear-filters-btn">🧹 Clear All Filters</button>
      <button id="mobileFilterToggleBtn">🧩 Show Active Filters</button>
    </div>

    <div class="mobile-search-wrap">
      <div class="search-box">
        <input type="text" id="mobileSearchInput" placeholder="Search train, loco, operator, town, origin, destination...">
        <button id="mobileSearchBtn">🔍 Search</button>
      </div>
      <div id="mobileAutocompleteList" class="autocomplete-items" style="display:none;"></div>
    </div>

    <div class="mobile-chip-section" id="mobileChipSection">
      <div class="mobile-chip-header">Active filters</div>
      <div id="mobileFilterChipWrap" class="filter-chip-wrap mobile-chip-wrap"></div>
    </div>
  </div>

  <div class="mobile-status-row">
    <div class="mobile-last" id="mobileLastUpdate">Loading...</div>
    <div class="mobile-status-pills">
      <div class="mobile-note" id="mobileStatusNote">…</div>
      <div class="mobile-count" id="mobileTrainCount">0</div>
    </div>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <span style="font-weight:900; color:var(--accent)">🚂 RailOps</span>
  <select id="stateSelect">
    <option value="au">🇦🇺 Australia</option>
    <option value="nsw">📍 NSW</option>
    <option value="vic">📍 VIC</option>
    <option value="qld">📍 QLD</option>
    <option value="sa">📍 SA</option>
    <option value="wa">📍 WA</option>
    <option value="tas">📍 TAS</option>
    <option value="nt">📍 NT</option>
  </select>
  <button id="locateBtn">📍 My Location</button>
  <button id="layersToggleBtn">🗺️ Layers</button>
  <button id="databaseBtn">📚 Database</button>
  <button id="operatorBtn">🚫 Hide Operators (0)</button>
  <button id="routeBtn">🧭 Hide Routes/Services (0)</button>
  <button id="clearFiltersBtn" class="clear-filters-btn">🧹 Clear All Filters</button>
  <div id="toolbarFilterChipWrap" class="filter-chip-wrap toolbar-chip-wrap"></div>
</div>

<div class="search-container" id="searchContainer">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search train number, loco, operator, town, origin, destination...">
    <button id="searchBtn">🔍 Search</button>
  </div>
  <div id="autocompleteList" class="autocomplete-items" style="display:none;"></div>
</div>

<div class="status-bar" id="statusBar">
  <span id="lastUpdate">Loading...</span>
  <span class="note-pill" id="statusNote">…</span>

<script>
const TRAINS_URL = "https://railops-backend-production.up.railway.app/trains.json";
const LOCO_DATABASE_URL = "https://railops-backend-production.up.railway.app/downloads/loco_database.html";

const FALLBACK_OPERATORS = [

  "Byron Bay Railroad","Capital Region Heritage Rail","CBH Group","Chumrail","CMET","Crawfords","CRL",

const reverseGeoCache = new Map();

let desktopDebounceTimer;

function isMobileLayout() {
  return window.matchMedia("(max-width: 900px)").matches;
}

function normalizeSearchText(v) {
  return String(v || "")
    .toLowerCase()
    .replace(/&/g, " and ")
    .replace(/[^a-z0-9]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function isJunkId(s){
  if (!s) return true;
  const v = String(s).toLowerCase();
  return v.startsWith("arrowmarkerssource_")
      || v.startsWith("markersource_")
      || v.startsWith("regtrainssource_")
      || v.startsWith("unregtrainssource_")
      || v.startsWith("trainsource_")
      || v.includes("arrowmarkerssource");
}

function looksLikeServiceId(v) {
  const s = String(v || "").trim().toUpperCase();
  if (!s) return false;
  return (
    /^[A-Z]?\d+[A-Z]?\d*$/.test(s) ||
    /^[A-Z]\d+[A-Z]-[A-Z]\d+$/.test(s) ||
    /^[A-Z]{1,3}\d{1,4}$/.test(s) ||
    /^\d{2,6}[A-Z]?$/.test(s)
  );
}

function looksLikeGarbageOperator(v) {
  const s = String(v || "").trim();
  const upper = s.toUpperCase();
  if (!s) return true;
  if (isJunkId(s)) return true;
  if (/^\d+$/.test(s)) return true;
  if (looksLikeServiceId(s)) return true;
  if (s.length > 24 && /[A-Z]/.test(s) && /\d/.test(s)) return true;
  if (/^[A-Z0-9_]{16,}$/.test(upper)) return true;
  if (upper === "UNKNOWN") return true;
  if (upper === "UNREG") return true;
  return false;
}

function looksLikeGarbageRoute(v) {
  const s = String(v || "").trim();
  const upper = s.toUpperCase();
  if (!s) return true;
  if (isJunkId(s)) return true;
  if (/^\d+$/.test(s)) return true;
  if (looksLikeServiceId(s)) return true;
  if (/^[A-Z0-9_]{16,}$/.test(upper)) return true;
  if (s.length > 34 && /[A-Z]/.test(s) && /\d/.test(s)) return true;
  if (upper === "UNKNOWN") return true;
  return false;
}

function isUsefulRouteText(v) {
  const s = String(v || "").trim();
  if (!s) return false;
  if (looksLikeGarbageRoute(s)) return false;
  if (s.length < 4) return false;
  if (/^[a-z]{3,5}$/i.test(s)) return false;
  if (/^[a-z]{2,6}\d*$/i.test(s) && !/\s/.test(s)) return false;
  return true;
}

function loadStateFromStorage() {
  try {
    const opsRaw = localStorage.getItem(HIDDEN_OPERATORS_STORAGE_KEY);
    if (opsRaw) {
      const arr = JSON.parse(opsRaw);
      if (Array.isArray(arr)) hiddenOperators = new Set(arr.map(v => String(v || "").toLowerCase().trim()).filter(Boolean));
    }
  } catch {}

  try {
    const routesRaw = localStorage.getItem(HIDDEN_ROUTES_STORAGE_KEY);
    if (routesRaw) {
      const arr = JSON.parse(routesRaw);
      if (Array.isArray(arr)) hiddenRoutes = new Set(arr.map(v => String(v || "").toLowerCase().trim()).filter(Boolean));
    }
  } catch {}

  try {
    mobileFilterSectionOpen = localStorage.getItem(MOBILE_FILTER_SECTION_KEY) === "1";
  } catch {
    mobileFilterSectionOpen = false;
  }

  try {
    mobileControlsExpanded = localStorage.getItem(MOBILE_CONTROLS_EXPANDED_KEY) === "1";
  } catch {
    mobileControlsExpanded = false;
  }
}

function saveStateToStorage() {
  try {
    localStorage.setItem(HIDDEN_OPERATORS_STORAGE_KEY, JSON.stringify(Array.from(hiddenOperators)));
    localStorage.setItem(HIDDEN_ROUTES_STORAGE_KEY, JSON.stringify(Array.from(hiddenRoutes)));
    localStorage.setItem(MOBILE_FILTER_SECTION_KEY, mobileFilterSectionOpen ? "1" : "0");
    localStorage.setItem(MOBILE_CONTROLS_EXPANDED_KEY, mobileControlsExpanded ? "1" : "0");
  } catch {}
}

function getLoco(train){
  const candidates = [
    train.trKey, train.loco, train.loco_number, train.locoNumber,
    train.train_name, train.trainName, train.vehicle_number, train.vehicleNumber,
    train.name
  ];
  for (const c of candidates){
    if (!c) continue;
    const s = String(c).trim();
    if (s && !isJunkId(s)) return s;
  }
  return "";
}

function getTrainId(train){
  const candidates = [
    train.train_number, train.trainNumber, train.train_id, train.trainId,
    train.service_number, train.serviceNumber, train.id, train.ID
  ];
  for (const c of candidates){
    if (!c) continue;
    const s = String(c).trim();
    if (s && !isJunkId(s)) return s;
  }
  return "";
}

function buildLabel(train){
  const loco = getLoco(train);
  const tid = getTrainId(train);
  if (!loco && !tid) return "";
  if (loco && tid && loco !== tid) return `${loco} • ${tid}`;
  return loco || tid;
}

function buildMapLabel(train){
  const base = buildLabel(train);
  const speed = getSpeed(train);
  if (!base) return "";
  if (Number.isFinite(speed) && speed > 0) return `${base} • ${Math.round(speed)}km/h`;
  return base;
}

function getTrainFinderHTML(train) {
  return String(
    train.tooltipHTML ||
    train.tooltipHtml ||
    train.tooltip ||
    train.labelHTML ||
    train.labelHtml ||
    ""
  );
}

function normaliseCssColour(raw) {
  const s = String(raw || "").trim().replace(/;$/, "");
  if (!s) return "";

  // Already a normal CSS colour.
  if (/^rgba?\(/i.test(s) || /^#[0-9a-f]{3,8}$/i.test(s) || /^[a-z]+$/i.test(s)) {
    return s;
  }

  // TrainFinder sometimes stores colours as: 33,33,33,0.8
  if (/^\d+\s*,\s*\d+\s*,\s*\d+/.test(s)) {
    return `rgba(${s})`;
  }

  return "";
}

function getTrainFinderLabelColour(train) {
  const html = getTrainFinderHTML(train);

  const bgMatch = html.match(/background-color\s*:\s*(rgba?\([^)]+\)|#[0-9a-fA-F]{3,8}|[a-zA-Z]+|\d+\s*,\s*\d+\s*,\s*\d+(?:\s*,\s*[0-9.]+)?)/i);
  if (bgMatch && bgMatch[1]) {
    const c = normaliseCssColour(bgMatch[1]);
    if (c) return c;
  }

  const backgroundMatch = html.match(/background\s*:\s*(rgba?\([^)]+\)|#[0-9a-fA-F]{3,8}|[a-zA-Z]+|\d+\s*,\s*\d+\s*,\s*\d+(?:\s*,\s*[0-9.]+)?)/i);
  if (backgroundMatch && backgroundMatch[1]) {
    const c = normaliseCssColour(backgroundMatch[1]);
    if (c) return c;
  }

  return "";
}

function getTrainFinderTextColour(train) {
  const html = getTrainFinderHTML(train);

  // Match colour, but avoid accidentally matching the word "background-color".
  const colorMatch = html.match(/(?:^|[;\s"])color\s*:\s*(rgba?\([^)]+\)|#[0-9a-fA-F]{3,8}|[a-zA-Z]+|\d+\s*,\s*\d+\s*,\s*\d+(?:\s*,\s*[0-9.]+)?)/i);
  if (colorMatch && colorMatch[1]) {
    const c = normaliseCssColour(colorMatch[1]);
    if (c) return c;
  }

  return "";
}

function getSpeedNumber(train) {
  const candidates = [
    train.trainSpeed,
    train.speed,
    train.kmh,
    train.kph,
    train.velocity
  ];

  for (const value of candidates) {
    const text = String(value ?? "").trim();
    const match = text.match(/-?\d+(?:\.\d+)?/);
    if (match) return Number(match[0]);
  }

  return null;
}

function getTrainColour(train) {
  // Best option: copy TrainFinder's own marker/tooltip colour from the scraped tooltipHTML.
  const trainFinderColour = getTrainFinderLabelColour(train);
  if (trainFinderColour) return trainFinderColour;

  // Fallback only when TrainFinder did not provide a colour.
  const speed = getSpeedNumber(train);
  if (speed === null) return "rgba(255,170,0,0.92)";
  if (speed <= 0) return "rgba(255,170,0,0.92)";
  if (speed < 10) return "rgba(128,0,0,0.92)";
  if (speed < 40) return "rgba(255,102,0,0.92)";
  if (speed < 80) return "rgba(255,61,0,0.92)";
  return "rgba(255,0,0,0.92)";
}

function getTrainTextColour(train) {
  const trainFinderTextColour = getTrainFinderTextColour(train);
  if (trainFinderTextColour) return trainFinderTextColour;

  const bg = getTrainColour(train).toLowerCase();
  if (bg.includes("242") || bg.includes("255,255,255") || bg.includes("white") || bg === "#fff" || bg === "#ffffff") {
    return "#101820";
  }

  return "#ffffff";
}

function getSpeedDotColor(train){
  return getTrainColour(train);
}

function formatLocal(dt){
  try {
    if (!dt) return "";
    const d = (dt instanceof Date) ? dt : new Date(dt);
    if (!isFinite(d.getTime())) return "";
    return d.toLocaleString("en-AU", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
  } catch {
    return "";
  }
}

function getAgeText(iso) {
  if (!iso) return "";
  const t = new Date(iso).getTime();
  if (!isFinite(t)) return "";
  const diffSec = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (diffSec < 60) return `${diffSec}s old`;
  const mins = Math.floor(diffSec / 60);
  if (mins < 60) return `${mins}m old`;
  const hours = Math.floor(mins / 60);
  const remMins = mins % 60;
  if (hours < 24) return `${hours}h ${remMins}m old`;
  const days = Math.floor(hours / 24);
  const remHours = hours % 24;
  return `${days}d ${remHours}h old`;
}

function freshnessLabel(iso) {
  if (!iso) return "unknown";
  const t = new Date(iso).getTime();
  if (!isFinite(t)) return "unknown";
  const mins = (Date.now() - t) / 60000;
  if (mins <= 3) return "fresh";
  if (mins <= 10) return "recent";
  if (mins <= 20) return "slightly stale";
  if (mins <= 45) return "stale";
  return "very stale";
}

function esc(v){
  return String(v ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function getCurrentPlaceFromTrain(train){
  const candidates = [
    train.current_location, train.currentLocation, train.location, train.place,
    train.town, train.suburb, train.city, train.locality,
    train.closest_town, train.closestTown, train.nearest_town, train.nearestTown,
    train.place_name, train.placeName, train.area, train.region, train.state
  ];
  for (const c of candidates){
    const s = String(c || "").trim();
    if (s) return s;
  }
  return "";
}

function getSpeed(train){
  const n = Number(train.speed || train.kph || train.kmh || 0);
  return Number.isFinite(n) ? n : 0;
}

function parseDatePartForTrainTime(value) {
  const s = String(value || "").trim();
  if (!s) return null;

  // dd/mm/yyyy or dd-mm-yyyy
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let y = Number(m[3]);
    if (y < 100) y += 2000;
    return { year: y, month: Number(m[2]) - 1, day: Number(m[1]) };
  }

  // yyyy-mm-dd or yyyy/mm/dd
  m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if (m) {
    return { year: Number(m[1]), month: Number(m[2]) - 1, day: Number(m[3]) };
  }

  const d = new Date(s);
  if (isFinite(d.getTime())) {
    return { year: d.getFullYear(), month: d.getMonth(), day: d.getDate() };
  }

  return null;
}

function parseTimePart(value) {
  const s = String(value || "").trim();
  if (!s) return null;

  const m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?$/i);
  if (!m) return null;

  let hour = Number(m[1]);
  const minute = Number(m[2]);
  const second = Number(m[3] || 0);
  const ampm = String(m[4] || "").toUpperCase();

  if (ampm === "PM" && hour < 12) hour += 12;
  if (ampm === "AM" && hour === 12) hour = 0;

  return { hour, minute, second };
}

function formatLocalTrainTimeFromDate(dateObj) {
  try {
    if (!dateObj || !isFinite(dateObj.getTime())) return "";
    return dateObj.toLocaleString("en-AU", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
  } catch {
    return "";
  }
}

function getTrainTime(train){
  const candidates = [
    train.trainTime,
    train.train_time,
    train.TrainTime,
    train.time,
    train.Time,
    train.reportTime,
    train.report_time,
    train.lastTrainTime,
    train.last_train_time
  ];

  const dateCandidates = [
    train.trainDate,
    train.train_date,
    train.TrainDate,
    train.date,
    train.Date,
    train.reportDate,
    train.report_date,
    train.lastUpdated,
    lastGoodUpdatedISO
  ];

  for (const c of candidates) {
    const s = String(c || "").trim();
    if (!s) continue;

    // Unix timestamp support.
    if (/^\d{10,13}$/.test(s)) {
      const n = Number(s);
      const d = new Date(s.length === 10 ? n * 1000 : n);
      const out = formatLocalTrainTimeFromDate(d);
      if (out) return out;
    }

    // ISO / full date-time string support. Browser converts to local time if TZ is present.
    const parsed = new Date(s);
    if (isFinite(parsed.getTime()) && /[-T:Z]/.test(s)) {
      const out = formatLocalTrainTimeFromDate(parsed);
      if (out) return out;
    }

    // Time-only support: combine with train.date when available and display as local browser time.
    const timePart = parseTimePart(s);
    if (timePart) {
      for (const dc of dateCandidates) {
        const datePart = parseDatePartForTrainTime(dc);
        if (!datePart) continue;

        const d = new Date(
          datePart.year,
          datePart.month,
          datePart.day,
          timePart.hour,
          timePart.minute,
          timePart.second
        );

        const out = formatLocalTrainTimeFromDate(d);
        if (out) return out;
      }

      // If there is no date field, still show the clock time and label it as local display.
      return `${s} local`;
    }

    return s;
  }

  return "";
}

function getDescription(train){
  return String(
    train.vehicle_description ||
    train.vehicleDescription ||
    train.description ||
    train.serviceDesc ||
    train.service_description ||
    train.serviceDescription ||
    train.line_name ||
    train.lineName ||
    train.route_name ||
    train.routeName ||
    ""
  ).trim();
}

function getOrigin(train){
  return String(
    train.origin ||
    train.serviceFrom ||
    train.from ||
    train.departure ||
    ""
  ).trim();
}

function getDestination(train){
  return String(
    train.destination ||
    train.serviceTo ||
    train.to ||
    train.arrival ||
    ""
  ).trim();
}

function getOperator(train){
  const candidates = [
    train.current_operator, train.currentOperator, train.current_operator_name, train.currentOperatorName,
    train.operator, train.Operator, train.operator_name, train.operatorName,
    train.company, train.Company, train.owner, train.Owner, train.railway, train.Railway,
    train.network, train.Network, train.line_operator, train.lineOperator,
    train.service_operator, train.serviceOperator
  ];

  for (const c of candidates) {
    const s = String(c || "").trim();
    if (s && !looksLikeGarbageOperator(s)) return s;
  }

  const desc = String(getDescription(train) || "").trim();
  const origin = String(getOrigin(train) || "").trim();
  const destination = String(getDestination(train) || "").trim();
  const place = String(getCurrentPlaceFromTrain(train) || "").trim();
  const label = String(buildLabel(train) || "").trim();
  const loco = String(getLoco(train) || "").trim();
  const trainId = String(getTrainId(train) || "").trim();

  const combinedUpper = [
    desc, origin, destination, place, label, loco, trainId
  ].join(" ").toUpperCase();

  const known = [
    ["TNSW", "TNSW"],
    ["TRANSPORT FOR NSW", "Transport for NSW"],
    ["PACIFIC NATIONAL", "Pacific National"],
    ["AURIZON", "Aurizon"],
    ["QUBE", "QUBE Logistics"],
    ["SSR", "Southern Shorthaul Railroad"],
    ["SCT", "SCT Logistics"],
    ["V/LINE", "V/Line"],
    ["VLINE", "V/Line"],
    ["QUEENSLAND RAIL", "Queensland Rail"],
    ["QR", "Queensland Rail"],
    ["TASRAIL", "TasRail"],
    ["TASR", "TasRail"],
    ["SYDNEY TRAINS", "Sydney Trains"],
    ["NSW TRAINLINK", "NSW TrainLink"],
    ["TRANSWA", "Transwa"],
    ["METRO TRAINS MELBOURNE", "Metro Trains Melbourne"],
    ["YARRA TRAMS", "Yarra Trams"],
    ["SYDNEY LIGHT RAIL", "Sydney Light Rail"],
    ["LIGHT RAIL", "Sydney Light Rail"],
    ["PN", "Pacific National"]
  ];

  for (const [needle, name] of known) {
    if (
      combinedUpper === needle ||
      combinedUpper.startsWith(needle + "-") ||
      combinedUpper.startsWith(needle + " ") ||
      combinedUpper.includes(" " + needle + " ") ||
      combinedUpper.includes(needle + "-") ||
      combinedUpper.endsWith(" " + needle)
    ) {
      return name;
    }
  }

  return "";
}

function getRouteService(train) {
  const candidates = [
    train.line_name, train.lineName, train.route_name, train.routeName,
    train.service_name, train.serviceName, train.trip_name, train.tripName,
    train.vehicle_description, train.vehicleDescription, train.description,
    train.serviceDesc, train.service_description, train.serviceDescription
  ];

  for (const c of candidates) {
    const s = String(c || "").trim();
    if (s && isUsefulRouteText(s)) {
      const upper = s.toUpperCase();
      if (upper.includes("DULWICH HILL")) return "Dulwich Hill Line";
      if (upper.includes("RANDWICK")) return "Randwick Line";
      if (upper.includes("KINGSFORD")) return "Kingsford Line";
      if (upper.includes("LIGHT RAIL")) return "Sydney Light Rail";
      if (upper.includes("METRO NORTH WEST")) return "Metro North West";
      return s;
    }
  }

  const origin = String(getOrigin(train) || "").trim();
  const destination = String(getDestination(train) || "").trim();
  const desc = String(getDescription(train) || "").trim();

  if (/DULWICH HILL/i.test(desc)) return "Dulwich Hill Line";
  if (/RANDWICK/i.test(desc)) return "Randwick Line";
  if (/KINGSFORD/i.test(desc)) return "Kingsford Line";
  if (/LIGHT RAIL/i.test(desc)) return "Sydney Light Rail";
  if (/METRO NORTH WEST/i.test(desc)) return "Metro North West";

  if (origin && destination) {
    const combo = `${origin} → ${destination}`;
    if (isUsefulRouteText(combo) && combo.length <= 60) return combo;
  }

  return "";
}

function trainPassesOperatorFilter(train) {
  if (!hiddenOperators.size) return true;

  const haystack = [
    getOperator(train),
    buildLabel(train),
    getLoco(train),
    getTrainId(train),
    getDescription(train),
    getOrigin(train),
    getDestination(train),
    getCurrentPlaceFromTrain(train)
  ]
    .map(v => String(v || "").toLowerCase().trim())
    .filter(Boolean)
    .join(" | ");

  for (const hidden of hiddenOperators) {
    const h = String(hidden || "").toLowerCase().trim();
    if (h && haystack.includes(h)) return false;
  }

  return true;
}

function trainPassesRouteFilter(train) {
  if (!hiddenRoutes.size) return true;

  const haystack = [
    getRouteService(train),
    getDescription(train),
    getOrigin(train),
    getDestination(train),
    getTrainId(train),
    buildLabel(train)
  ]
    .map(v => String(v || "").toLowerCase().trim())
    .filter(Boolean)
    .join(" | ");

  for (const hidden of hiddenRoutes) {
    const h = String(hidden || "").toLowerCase().trim();
    if (h && haystack.includes(h)) return false;
  }

  return true;
}

function getVisibleTrains() {
  return allTrains.filter(train => trainPassesOperatorFilter(train) && trainPassesRouteFilter(train));
}

async function reverseGeocodeTown(lat, lon){
  const key = `${Number(lat).toFixed(4)},${Number(lon).toFixed(4)}`;
  if (reverseGeoCache.has(key)) return reverseGeoCache.get(key);

  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=12&addressdetails=1`;
    const res = await fetch(url, { headers: { "Accept": "application/json" }, cache: "force-cache" });
    if (!res.ok) throw new Error(`Reverse geocode HTTP ${res.status}`);

    const data = await res.json();
    const a = data.address || {};
    const place =
      a.city || a.town || a.village || a.suburb || a.hamlet ||
      a.municipality || a.county || a.state_district || data.name || "";

    reverseGeoCache.set(key, place || "");
    return place || "";
  } catch {
    reverseGeoCache.set(key, "");
    return "";
  }
}

function createOpenRailwayMapSource(kind) {
  /*
    OpenRailwayMap tiles use normal XYZ URLs.
    The previous version manually inverted the Y tile coordinate, which can make
    RailwayMap request the wrong tiles and show no blue rail overlay.
  */
  const template = `https://{a-c}.tiles.openrailwaymap.org/${kind}/{z}/{x}/{y}.png`;

  const source = new ol.source.XYZ({
    url: template,
    maxZoom: 19,
    transition: 0,
    attributions: "© OpenRailwayMap contributors"
  });

  source.on("tileloaderror", function(evt) {
    try {
      console.warn("OpenRailwayMap tile failed", kind, evt && evt.tile && evt.tile.getKey ? evt.tile.getKey() : evt);
    } catch (e) {}
  });

  return source;
}

async function fetchTrainsPayload() {
  const url = `${TRAINS_URL}?ts=${Date.now()}&r=${Math.random().toString(36).slice(2)}`;

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);

  try {
    const response = await fetch(url, {
      cache: "no-store",
      signal: controller.signal,
      headers: {
        "Accept": "application/json"
      }
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status} from Railway source`);
    }

    const data = await response.json();

    if (!data || !Array.isArray(data.trains)) {
      throw new Error("Invalid JSON payload from Railway source");
    }

    return data;
  } finally {
    clearTimeout(timeoutId);
  }
}

async function loadRealTrains() {
  setStatusUI("Loading...", "fetching...", "0");

  try {
    const data = await fetchTrainsPayload();
    const trains = Array.isArray(data.trains) ? data.trains : [];
    const updatedISO = data.lastUpdated || null;

    const localTs = updatedISO ? formatLocal(updatedISO) : formatLocal(new Date());
    const ageText = getAgeText(updatedISO);
    const freshLabel = freshnessLabel(updatedISO);

    let statusText = String(data.note || "ok");
    if (updatedISO) {
      statusText = `${statusText} • ${freshLabel}`;
      if (ageText) statusText += ` • ${ageText}`;
    }

    if (trains.length === 0) {
      consecutiveEmpty += 1;
      if (lastGoodTrains.length > 0 && consecutiveEmpty < 3) {
        const lastVisible = lastGoodTrains.filter(
          train => trainPassesOperatorFilter(train) && trainPassesRouteFilter(train)
        );

        setStatusUI(
          localTs ? `Last: ${localTs}` : "Last: (unknown)",
          `empty payload (${consecutiveEmpty})`,
          String(lastVisible.length)
        );
        return;
      }
    } else {
      consecutiveEmpty = 0;
    }

    allTrains = trains;

    if (trains.length > 0) {
      lastGoodTrains = trains.slice();
      lastGoodUpdatedISO = updatedISO;
    }

    buildOperatorList(allTrains);
    buildRouteList(allTrains);
    renderOperatorChecklist(document.getElementById("operatorSearchInput").value || "");
    renderRouteChecklist(document.getElementById("routeSearchInput").value || "");
    updateFilterButtonLabels();
    renderFilterChips();

    const visibleTrains = getVisibleTrains();

    setStatusUI(
      localTs ? `Last: ${localTs}` : "Last: (unknown)",
      statusText,
      String(visibleTrains.length)
    );

    trainSource.clear();

    visibleTrains.forEach(train => {
      const maybeId = train.id || train.train_number || train.trainNumber || train.trKey || "";
      const maybeName = train.train_name || train.loco || "";
      if (isJunkId(maybeId) && isJunkId(maybeName)) return;

      const lat = Number(train.lat);
      const lon = Number(train.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

      const feature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lon, lat]))
      });

      feature.set("train_data", train);
      trainSource.addFeature(feature);
    });

    trainLayer.changed();

  } catch (err) {
    console.error("Failed to load trains:", err);

    if (lastGoodUpdatedISO) {
      const lastVisible = lastGoodTrains.filter(
        train => trainPassesOperatorFilter(train) && trainPassesRouteFilter(train)
      );

      setStatusUI(
        `Last: ${formatLocal(lastGoodUpdatedISO)} (stale)`,
        `error • ${getAgeText(lastGoodUpdatedISO) || "stale"}`,
        String(lastVisible.length)
      );
    } else {
      setStatusUI("Update failed", "error", "0");
    }
  }
}

async function showTrainPopup(feature) {
  if (!feature) return;

  removePopup();
  selectedFeatureRef = feature;
  trainLayer.changed();

  const train = feature.get("train_data") || {};
  const label = buildLabel(train);
  if (!label || isJunkId(label)) return;

  const coords = feature.getGeometry().getCoordinates();
  const popupUpdated = lastGoodUpdatedISO ? formatLocal(lastGoodUpdatedISO) : formatLocal(new Date());
  const directPlace = getCurrentPlaceFromTrain(train);
  const lat = Number(train.lat);
  const lon = Number(train.lon);

  const popupDiv = document.createElement("div");
  popupDiv.className = "train-popup";
  popupDiv.innerHTML = renderPopupHTML(train, directPlace || "Looking up…", popupUpdated);

  popupOverlay = new ol.Overlay({
    element: popupDiv,
    position: coords,
    positioning: "bottom-center",
    offset: [0, -12]
  });

  map.addOverlay(popupOverlay);

  const closeBtn = popupDiv.querySelector("#popupCloseBtn");
  if (closeBtn) closeBtn.addEventListener("click", removePopup);

  if (!directPlace && Number.isFinite(lat) && Number.isFinite(lon)) {
    const reqId = ++popupRequestId;
    const reversePlace = await reverseGeocodeTown(lat, lon);
    if (!popupOverlay || reqId !== popupRequestId) return;

    const placeEl = popupDiv.querySelector("#popupCurrentPlace");
    if (placeEl) placeEl.textContent = reversePlace || "Unknown";
  }
}

    train.closest_town,
    train.closestTown,
    train.nearest_town,
    train.nearestTown,
    train.area,
    train.region,
    train.state,
    getDescription(train)
  ]
  .filter(Boolean)
  .map(v => normalizeSearchText(v));
}

function hideAutocomplete(){
  document.getElementById("autocompleteList").style.display = "none";
  document.getElementById("mobileAutocompleteList").style.display = "none";
}

function updateAutocompleteFor(inputEl, listEl){
  const query = normalizeSearchText(inputEl.value);
  if (query.length < 2) {
    listEl.style.display = "none";
    return;
  }

  const matches = [];
  const seen = new Set();

  for (const train of getVisibleTrains()){
    const id = displayId(train);
    if (!id || isJunkId(id)) continue;

    const searchable = getSearchFields(train);
    if (searchable.some(s => s.includes(query)) && !seen.has(id)){
      seen.add(id);
      matches.push({
        id,
        full: train,
        lat: Number(train.lat),
        lon: Number(train.lon)
      });
    }
  }

  if (matches.length === 0) {
    listEl.style.display = "none";
    return;
  }

  listEl.innerHTML = "";
  matches.slice(0, 15).forEach(match => {
    const place = getCurrentPlaceFromTrain(match.full);
    const o = getOrigin(match.full);
    const d = getDestination(match.full);
    const operator = getOperator(match.full);
    const route = getRouteService(match.full);
    const rightText = place || route || (o || d ? `${o || "?"} → ${d || "?"}` : "") || operator || "";

    const item = document.createElement("div");
    item.className = "autocomplete-item";
    item.innerHTML = `
      <span class="train-id">${esc(match.id)}</span>
      <span class="train-loc">${esc(rightText)}</span>
    `;

    item.addEventListener("click", () => {
      inputEl.value = match.id;
      listEl.style.display = "none";
      flyToMatches([match.full]);
      mobileControlsExpanded = false;
      updateMobileControlsUI();
      saveStateToStorage();
    });

    listEl.appendChild(item);
  });

  listEl.style.display = "block";
}

function wireSearchBox(inputId, buttonId, listId, isMobile) {
  const input = document.getElementById(inputId);
  const button = document.getElementById(buttonId);
  const list = document.getElementById(listId);

  input.addEventListener("input", () => {
    clearTimeout(isMobile ? mobileDebounceTimer : desktopDebounceTimer);
    const timer = setTimeout(() => updateAutocompleteFor(input, list), 180);
    if (isMobile) mobileDebounceTimer = timer;
    else desktopDebounceTimer = timer;
  });

  input.addEventListener("keypress", e => {
    if (e.key === "Enter") searchTrainsFromInput(input, isMobile);
  });

  button.addEventListener("click", () => searchTrainsFromInput(input, isMobile));
}

function flyToMatches(trains){
  const valid = trains.filter(t => Number.isFinite(Number(t.lat)) && Number.isFinite(Number(t.lon)));
  if (valid.length === 0) return;

  if (valid.length === 1) {
    const train = valid[0];
    const center = ol.proj.fromLonLat([Number(train.lon), Number(train.lat)]);
    map.getView().animate({
      center,
      zoom: 11,
      duration: 850
    });

    setTimeout(() => {
      const target = trainSource.getFeatures().find(f => {
        const td = f.get("train_data") || {};
        return buildLabel(td) === buildLabel(train);
      });
      if (target) showTrainPopup(target);
    }, 900);
    return;
  }

  let extent = ol.extent.createEmpty();
  valid.forEach(train => {
    const coord = ol.proj.fromLonLat([Number(train.lon), Number(train.lat)]);
    ol.extent.extend(extent, [coord[0], coord[1], coord[0], coord[1]]);
  });

  map.getView().fit(extent, {
    duration: 850,
    padding: [90, 90, 90, 90],
    maxZoom: 9
  });
}


async function geocodeAustralianLocation(queryText) {
  const q = String(queryText || "").trim();
  if (!q) return null;

  const candidates = [
    `${q}, Australia`,
    q
  ];

  for (const candidate of candidates) {
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=au&addressdetails=1&q=${encodeURIComponent(candidate)}`;
      const res = await fetch(url, { headers: { "Accept": "application/json" }, cache: "force-cache" });
      if (!res.ok) continue;
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) continue;

      const place = data[0];
      const lat = Number(place.lat);
      const lon = Number(place.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
      if (!(lat >= -45.5 && lat <= -9 && lon >= 110 && lon <= 160)) continue;

      return {
        lat,
        lon,
        label: place.display_name || q,
        bbox: Array.isArray(place.boundingbox) ? place.boundingbox.map(Number) : null
      };
    } catch (e) {
      console.warn("Location search failed", e);
    }
  }

  return null;
}

function flyToLocation(place) {
  if (!place) return;
  const coord = ol.proj.fromLonLat([place.lon, place.lat]);

  locationSource.clear();
  locationSource.addFeature(new ol.Feature({
    geometry: new ol.geom.Point(coord),
    label: String(place.label || "Location").split(",")[0]
  }));

  if (place.bbox && place.bbox.length === 4 && place.bbox.every(Number.isFinite)) {
    const south = place.bbox[0];
    const north = place.bbox[1];
    const west = place.bbox[2];
    const east = place.bbox[3];
    const extent = ol.proj.transformExtent([west, south, east, north], "EPSG:4326", "EPSG:3857");
    map.getView().fit(extent, { duration: 900, padding: [110, 110, 110, 110], maxZoom: 12 });
  } else {
    map.getView().animate({ center: coord, zoom: 10, duration: 900 });
  }
}

async function searchTrainsFromInput(inputEl, isMobile) {
  const query = normalizeSearchText(inputEl.value);
  if (!query) return;

  const matches = [];

  for (const train of getVisibleTrains()){
    const id = displayId(train);
    if (!id || isJunkId(id)) continue;

    const searchable = getSearchFields(train);
    if (searchable.some(s => s.includes(query))) {
      matches.push(train);
    }
  }

  if (matches.length === 0) {
    setStatusUI("Searching location...", "location lookup", String(getVisibleTrains().length));
    const place = await geocodeAustralianLocation(inputEl.value);
    if (!place) {
      alert("No trains or Australian locations found matching: " + inputEl.value);
      return;
    }

    hideAutocomplete();
    flyToLocation(place);
    setStatusUI("Location found: " + String(place.label || inputEl.value).split(",")[0], "location", String(getVisibleTrains().length));

    if (isMobile) {
      mobileControlsExpanded = false;
      updateMobileControlsUI();
      saveStateToStorage();
    }
    return;
  }

  hideAutocomplete();
  locationSource.clear();
  flyToMatches(matches);

  if (isMobile) {
    mobileControlsExpanded = false;
    updateMobileControlsUI();
    saveStateToStorage();
  }
}

function zoomTo(region){
  const bounds = stateBounds[region] || stateBounds.au;
  const extent = ol.proj.transformExtent(bounds, "EPSG:4326", "EPSG:3857");
  map.getView().fit(extent, { duration: 900, maxZoom: 10 });
  if (isMobileLayout()) {
    mobileControlsExpanded = false;
    updateMobileControlsUI();
    saveStateToStorage();
  }
}

function zoomToCurrent(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const center = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]);
    map.getView().animate({ center, zoom: 12, duration: 850 });
    if (isMobileLayout()) {
      mobileControlsExpanded = false;
      updateMobileControlsUI();
      saveStateToStorage();
    }
  });
}
