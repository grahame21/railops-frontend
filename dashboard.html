<!DOCTYPE html>
<html>
<head>
    <title>RailOps - Minimal Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.5.2/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.5.2/dist/ol.js"></script>
    <style>
        #map { height: 100vh; width: 100vw; }
        #status { 
            position: fixed; top: 10px; right: 10px; 
            background: black; color: lime; padding: 10px;
            z-index: 1000; font-family: monospace;
            border-radius: 5px;
        }
        #count {
            position: fixed; top: 10px; left: 10px;
            background: #0b57cf; color: white; padding: 10px;
            z-index: 1000; font-family: monospace;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="count">Loading...</div>
    <div id="status">Waiting for data...</div>
    <div id="map"></div>

    <script>
        // Simple map
        const map = new ol.Map({
            target: 'map',
            layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
            view: new ol.View({ 
                center: ol.proj.fromLonLat([133.7751, -25.2744]), 
                zoom: 4 
            })
        });

        const countEl = document.getElementById('count');
        const statusEl = document.getElementById('status');
        
        // Train layer
        const trainSource = new ol.source.Vector();
        const trainLayer = new ol.layer.Vector({ 
            source: trainSource,
            style: new ol.style.Style({
                image: new ol.style.Circle({
                    radius: 6,
                    fill: new ol.style.Fill({ color: '#ff0000' })
                })
            })
        });
        map.addLayer(trainLayer);

        // Load trains - EXACT same as test map
        fetch('https://raw.githubusercontent.com/grahame21/railops-backend/main/trains.json')
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(data => {
                const trains = data.trains || [];
                countEl.innerHTML = `🚆 ${trains.length} trains`;
                statusEl.innerHTML = `✅ Last updated: ${new Date(data.lastUpdated).toLocaleTimeString()}`;
                
                trains.forEach(t => {
                    if (t.lat && t.lon) {
                        const f = new ol.Feature({
                            geometry: new ol.geom.Point(ol.proj.fromLonLat([t.lon, t.lat]))
                        });
                        trainSource.addFeature(f);
                    }
                });
                
                statusEl.innerHTML += `<br>✅ Added ${trainSource.getFeatures().length} to map`;
            })
            .catch(err => {
                statusEl.innerHTML = `❌ Error: ${err.message}`;
                countEl.innerHTML = '⚠️ Error';
            });
    </script>
</body>
</html>
