<!DOCTYPE html>
<html>
<head>
  <title>RailOps - Live Train Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.5.2/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@v7.5.2/dist/ol.js"></script>
  <style>
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .stats {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: #00ff00;
      padding: 10px 15px;
      border-radius: 5px;
      font-family: monospace;
      z-index: 1000;
      border: 1px solid #00ff00;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="stats" id="stats">Loading trains...</div>

  <script>
    // Create map
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM()
        })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([133.7751, -25.2744]),
        zoom: 4
      })
    });

    // Create vector source for trains
    const trainSource = new ol.source.Vector();
    
    // Style function for trains (triangle pointing in direction of travel)
    const trainStyle = function(feature) {
      const heading = feature.get('heading') || 0;
      return new ol.style.Style({
        image: new ol.style.RegularShape({
          points: 3,
          radius: 8,
          rotation: (heading * Math.PI) / 180,
          fill: new ol.style.Fill({ color: '#FFD700' }),
          stroke: new ol.style.Stroke({ color: '#000000', width: 1.5 })
        })
      });
    };

    const trainLayer = new ol.layer.Vector({
      source: trainSource,
      style: trainStyle
    });
    
    map.addLayer(trainLayer);

    // Function to load trains
    async function loadTrains() {
      try {
        const response = await fetch('trains.json?t=' + Date.now());
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        
        // Clear existing features
        trainSource.clear();
        
        // Add all trains
        let count = 0;
        data.trains.forEach(train => {
          if (train.lat && train.lon) {
            const feature = new ol.Feature({
              geometry: new ol.geom.Point(
                ol.proj.fromLonLat([train.lon, train.lat])
              ),
              heading: train.heading || 0,
              id: train.id,
              train_number: train.train_number || train.service || train.id
            });
            trainSource.addFeature(feature);
            count++;
          }
        });
        
        // Update stats
        const timeStr = new Date().toLocaleTimeString();
        document.getElementById('stats').innerHTML = 
          `🚂 ${count} trains<br>${timeStr}`;
        
        console.log(`Loaded ${count} trains`);
        
      } catch (error) {
        console.error('Failed to load trains:', error);
        document.getElementById('stats').innerHTML = 
          `❌ Error: ${error.message}`;
      }
    }

    // Load trains immediately and every 30 seconds
    loadTrains();
    setInterval(loadTrains, 30000);

  </script>
</body>
</html>
