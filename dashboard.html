<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RailOps — AU Live Map</title>

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <style>
    html,body{height:100%;margin:0;overflow:hidden}
    #map{height:100%;width:100%}
    .toolbar{
      position:absolute;top:10px;left:10px;z-index:1000;
      background:#0b57cf;color:#fff;padding:8px 12px;border-radius:8px;
      font:600 14px system-ui;box-shadow:0 2px 8px rgba(0,0,0,.3);
      display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    }
    .toolbar select,.toolbar button{
      background:white;color:#0b57cf;border:none;padding:4px 8px;
      border-radius:4px;font-weight:600;cursor:pointer
    }
    .status-bar{
      position:absolute;top:10px;right:10px;z-index:1000;
      background:rgba(0,0,0,.7);color:#fff;padding:6px 12px;border-radius:20px;
      font-size:12px;backdrop-filter:blur(4px);
    }
  </style>
</head>
<body>
  <div class="toolbar">
    🚂 RailOps — AU Live Map
    <button onclick="zoomAustralia()">🇦🇺 Australia</button>
    <button onclick="zoomCurrent()">📍 Current</button>
  </div>

  <div class="status-bar" id="statusBar">
    Loading trains...
  </div>

  <div id="map"></div>

  <script>
    // Initialize map
    const map = new ol.Map({
      target: 'map',
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      view: new ol.View({
        center: ol.proj.fromLonLat([133.7751, -25.2744]),
        zoom: 4
      })
    });

    // SIMPLE TRAIN LAYER - using circles like the working test
    const trainSource = new ol.source.Vector();
    const trainLayer = new ol.layer.Vector({
      source: trainSource,
      style: new ol.style.Style({
        image: new ol.style.Circle({
          radius: 6,
          fill: new ol.style.Fill({ color: '#ff0000' })
        })
      })
    });
    map.addLayer(trainLayer);

    // Load trains
    async function loadTrains() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/grahame21/railops-backend/main/trains.json');
        const data = await response.json();
        const trains = data.trains || [];
        
        document.getElementById('statusBar').innerHTML = `🚆 ${trains.length} trains`;
        
        trainSource.clear();
        trains.forEach(t => {
          if (t.lat && t.lon) {
            const f = new ol.Feature({
              geometry: new ol.geom.Point(ol.proj.fromLonLat([t.lon, t.lat]))
            });
            trainSource.addFeature(f);
          }
        });
      } catch (error) {
        document.getElementById('statusBar').innerHTML = '⚠️ Error loading trains';
      }
    }

    // Zoom functions
    window.zoomAustralia = function() {
      map.getView().animate({
        center: ol.proj.fromLonLat([133.7751, -25.2744]),
        zoom: 4,
        duration: 500
      });
    }
    
    window.zoomCurrent = function() {
      if (!navigator.geolocation) { zoomAustralia(); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        const c = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]);
        map.getView().animate({ center: c, zoom: 12, duration: 600 });
      });
    }

    // Load trains
    loadTrains();
    setInterval(loadTrains, 30000);
  </script>
</body>
</html>
