<!doctype html><meta charset="utf-8"><title>Tiles Probe</title>
<body style="font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto">
<h2>OSM</h2>
<img id="osm" width="192" height="192" style="border:1px solid #ccc">
<span id="osms"></span>
<h2>ORM</h2>
<img id="orm" width="192" height="192" style="border:1px solid #ccc">
<span id="orms"></span>
<script>
const set = (id, ok)=>{document.getElementById(id+'s').textContent = ok ? '✓' : '✗';};
const z=5,x=27,y=19;
const a=new Image(); a.onload=()=>set('osm',1); a.onerror=()=>set('osm',0); a.src=`/tiles/osm/${z}/${x}/${y}.png?nocache=${Date.now()}`;
const b=new Image(); b.onload=()=>set('orm',1); b.onerror=()=>set('orm',0); b.src=`/tiles/orm/${z}/${x}/${y}.png?nocache=${Date.now()}`;
</script>
</body>
