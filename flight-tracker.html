<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailOps - Flight Tracker</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.5.2/ol.css" />
  <script src="https://cdn.jsdelivr.net/npm/ol@7.5.2/dist/ol.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #2d5ea8;
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(6px);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      color: #7fc8ff;
    }

    .nav-btn, .toggle-btn {
      text-decoration: none;
      color: white;
      background: #0d47a1;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .nav-btn:hover, .toggle-btn:hover {
      background: #1565c0;
    }

    .status-box {
      font-size: 13px;
      color: #cfe8ff;
      white-space: nowrap;
    }

    .popup {
      background: rgba(0,0,0,0.88);
      color: white;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #4da3ff;
      min-width: 220px;
      font-size: 13px;
    }

    .popup strong {
      color: #7fc8ff;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="title">✈️ RailOps Flight Tracker</div>
      <a href="dashboard.html" class="nav-btn">Train Tracker</a>
      <a href="admin.html" class="nav-btn">Admin</a>
      <button id="militaryToggle" class="toggle-btn">Military: OFF</button>
    </div>
    <div class="status-box" id="statusBox">Loading aircraft...</div>
  </div>

  <div id="map"></div>
  <div id="popup" class="popup" style="display:none; position:absolute; z-index:1001;"></div>

  <script src="static/js/flight-tracker.js"></script>
</body>
</html>
