<!doctype html>
<meta charset="utf-8" />
<title>CSP Test</title>
<pre id="out">Checking…</pre>
<script>
(async () => {
  try {
    const r = await fetch(location.href, { cache: 'no-store' });
    const csp = r.headers.get('content-security-policy') || '(no CSP header delivered)';
    document.getElementById('out').textContent = csp;
  } catch (e) {
    document.getElementById('out').textContent = 'Fetch error: ' + (e.message || e);
  }
})();
</script>
