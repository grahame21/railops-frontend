<!DOCTYPE html>
<html>
<head>
    <title>RailOps - NEW DASHBOARD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.5.2/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.5.2/dist/ol.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        #map { height: 100%; width: 100%; }
        #status { 
            position: fixed; top: 10px; right: 10px; 
            background: rgba(0,0,0,0.8); color: #0f0; 
            padding: 10px 20px; border-radius: 20px;
            z-index: 1000; font-family: monospace;
            font-size: 14px; border: 1px solid #00ff00;
        }
    </style>
</head>
<body>
    <div id="status">🚂 Initializing...</div>
    <div id="map"></div>

    <script>
        (function() {
            const status = document.getElementById('status');
            
            // Step 1: Create map
            status.innerHTML = '📌 Creating map...';
            console.log('Step 1: Creating map');
            
            const map = new ol.Map({
                target: 'map',
                layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
                view: new ol.View({
                    center: ol.proj.fromLonLat([133.7751, -25.2744]),
                    zoom: 4
                })
            });
            
            // Step 2: Add railway lines
            status.innerHTML = '🛤️ Adding rail lines...';
            console.log('Step 2: Adding rail lines');
            
            const railLayer = new ol.layer.Tile({
                source: new ol.source.XYZ({ 
                    url: 'https://{a-c}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png'
                })
            });
            
            railLayer.on('prerender', function(e) {
                e.context.filter = 'hue-rotate(200deg) brightness(0.9)';
            });
            railLayer.on('postrender', function(e) {
                e.context.filter = 'none';
            });
            map.addLayer(railLayer);
            
            // Step 3: Create train layer
            status.innerHTML = '🚆 Creating train layer...';
            console.log('Step 3: Creating train layer');
            
            const trainSource = new ol.source.Vector();
            const trainLayer = new ol.layer.Vector({ 
                source: trainSource,
                style: new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 6,
                        fill: new ol.style.Fill({ color: '#ffaa00' }),
                        stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 })
                    })
                })
            });
            map.addLayer(trainLayer);
            
            // Step 4: Load trains
            status.innerHTML = '📡 Loading train data...';
            console.log('Step 4: Fetching trains');
            
            const url = 'https://raw.githubusercontent.com/grahame21/railops-backend/main/trains.json';
            
            fetch(url, { 
                cache: 'no-cache',
                headers: { 'Cache-Control': 'no-cache' }
            })
            .then(response => {
                console.log('Response status:', response.status);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(data => {
                console.log('Data received:', data);
                const trains = data.trains || [];
                
                status.innerHTML = `✅ Found ${trains.length} trains`;
                console.log(`Adding ${trains.length} trains to map`);
                
                let added = 0;
                trains.forEach((t, i) => {
                    if (t && typeof t.lat === 'number' && typeof t.lon === 'number') {
                        try {
                            const point = ol.proj.fromLonLat([t.lon, t.lat]);
                            const feature = new ol.Feature({
                                geometry: new ol.geom.Point(point)
                            });
                            trainSource.addFeature(feature);
                            added++;
                            
                            // Log first 3 trains
                            if (i < 3) {
                                console.log(`Train ${i}:`, t);
                            }
                        } catch (e) {
                            console.error('Error adding train:', e);
                        }
                    }
                });
                
                status.innerHTML = `✅ ${added} trains on map`;
                console.log(`Successfully added ${added} trains`);
                
                // Force a map update
                trainSource.changed();
                map.render();
            })
            .catch(error => {
                console.error('ERROR:', error);
                status.innerHTML = `❌ Error: ${error.message}`;
            });
        })();
    </script>
</body>
</html>
