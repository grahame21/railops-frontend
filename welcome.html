<!DOCTYPE html>
<html lang="en">
<head>
<script src="/auth.js"></script>
<script>if(!window.RailOpsAuth || !RailOpsAuth.requireRole(['admin','guest'])){document.documentElement.innerHTML='';}</script>
  <meta charset="UTF-8">
  <title>Welcome — RailOps</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font: 16px system-ui, sans-serif; background: #0b1220; color: #e8eefc; margin:0; display:flex; align-items:center; justify-content:center; height:100vh; }
    .box { background:#121a2b; padding:24px 28px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.4); text-align:center; max-width:400px; }
    a { color:#7bd88f; text-decoration:none; font-weight:500; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Welcome to RailOps 🎉</h1>
    <p>Your account has been created or password updated successfully.</p>
    <p><a href="/login.html">Go to Login</a></p>
  </div>
<button id="logoutBtn" style="position:fixed;right:14px;bottom:14px;z-index:2000;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(8,20,38,.92);color:#fff;font-weight:700;cursor:pointer;">Logout</button>
<script>window.RailOpsAuth&&RailOpsAuth.wireLogout('#logoutBtn');</script>
</body>
</html>
