<!DOCTYPE html><meta charset="utf-8">
<title>OL Smoke</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.1.0/ol.css">
<div id="out" style="font:14px system-ui;padding:10px"></div>
<div id="map" style="width:100%;height:60vh;border:1px solid #334; margin:10px;"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@9.1.0/dist/ol.js"></script>
<script>
  const out = document.getElementById('out');
  if (window.ol && ol.Map) {
    out.textContent = '✅ OpenLayers loaded from CDN';
    const map = new ol.Map({
      target: 'map',
      layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
      view: new ol.View({ center: ol.proj.fromLonLat([133.7751,-25.2744]), zoom: 4 })
    });
  } else {
    out.textContent = '❌ OpenLayers NOT loaded';
  }
</script>
