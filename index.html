<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RailOps — Loading…</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Netlify Identity widget -->
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body{margin:0;height:100vh;display:grid;place-items:center;background:#0b1220;color:#e8eefc;font:14px system-ui}
    .box{background:#121a2b;border:1px solid rgba(255,255,255,.1);padding:20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center;min-width:280px}
    .hint{color:#8fa3bf;margin-top:10px;font-size:12px;white-space:pre-line}
    a{color:#7bd88f}
  </style>
</head>
<body>
  <div class="box">
    <div id="title">RailOps — Loading…</div>
    <div id="status" class="hint">If this takes more than a few seconds, <a href="/login.html">open the login page</a>.</div>
  </div>

  <script>
    // Roles helper + destination after login
    function rolesOf(u){ return (u && u.app_metadata && u.app_metadata.roles) || []; }
    function goAfterLogin(user){ location.replace( rolesOf(user).includes('admin') ? '/admin/' : '/dashboard.html'); }

    // Read token presence from hash or query
    function getFromHashOrQuery(key){
      const h = new URLSearchParams(location.hash.replace(/^#/, ''));
      const q = new URLSearchParams(location.search);
      return h.get(key) || q.get(key);
    }

    (function(){
      const status = document.getElementById('status');
      const title  = document.getElementById('title');

      const hasConfirm =
        !!(getFromHashOrQuery('confirmation_token') || getFromHashOrQuery('signup_token') || getFromHashOrQuery('invite_token'));
      const hasRecover =
        !!(getFromHashOrQuery('recovery_token') || getFromHashOrQuery('reset_token'));

      // No tokens? Go straight to dashboard
      if (!hasConfirm && !hasRecover) { location.replace('/dashboard.html'); return; }

      title.textContent = 'RailOps — Completing sign-in…';

      // Wait for the widget (defer) to attach
      let tries = 0;
      const t = setInterval(() => {
        tries++;
        if (window.netlifyIdentity) {
          clearInterval(t);
          status.textContent = 'Identity ready. Finishing your request…';

          netlifyIdentity.on('login', goAfterLogin);
          netlifyIdentity.on('error', e => status.textContent = 'Identity error: ' + (e?.message || e));
          netlifyIdentity.init();

          // IMPORTANT: let the SDK read location.hash itself (no args)
          if (hasConfirm) {
            netlifyIdentity.confirm()
              .then(() => {
                status.textContent = 'Confirmed. Please set your password in the widget.';
                netlifyIdentity.open('login');
              })
              .catch(err => {
                status.textContent = 'Confirm error: ' + (err?.message || err);
                netlifyIdentity.open('login');
              });
          } else if (hasRecover) {
            netlifyIdentity.recover()
              .then(() => {
                status.textContent = 'Token accepted. Set a new password in the widget.';
                netlifyIdentity.open('login');
              })
              .catch(err => {
                status.textContent = 'Recover error: ' + (err?.message || err);
                netlifyIdentity.open('login');
              });
          }

          // Fallback: if nothing completes in 8s, open widget anyway
          setTimeout(() => {
            if (status.textContent.includes('Finishing')) {
              status.textContent = 'Opening widget…';
              netlifyIdentity.open('login');
            }
          }, 8000);

        } else if (tries > 50) { // ~5s
          clearInterval(t);
          status.innerHTML = "Identity failed to load. <a href='/login.html'>Open login</a>.";
        }
      }, 100);
    })();
  </script>
</body>
</html>
