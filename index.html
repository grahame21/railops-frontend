<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RailOps — Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login">
      <h1>Grahame’s RailOps Login</h1>
      <div class="sub">Enter your details or continue as guest.</div>

      <label for="user">Username</label>
      <input id="user" placeholder="admin or guest…" autocomplete="username" />

      <label for="pass">Password</label>
      <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" />

      <div class="row">
        <button class="ghost" id="guestBtn">Continue as Guest</button>
        <button class="primary" id="loginBtn">Log In</button>
      </div>
      <div class="small">Admins go to Admin Console; guests go to the live Dashboard.</div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
