<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RailOps — AU Live Map</title>

  <!-- Self-hosted OpenLayers -->
  <link rel="preload" href="/assets/ol/ol.js" as="script">
  <link rel="stylesheet" href="/assets/ol/ol.css">

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b0f14; color:#fff; }
    header {
      background:#0a56c2; padding:10px 12px; font-weight:600; display:flex; gap:12px; align-items:center;
    }
    header select, header button {
      background:#113b78; color:#fff; border:1px solid #1a4fa7; border-radius:6px; padding:6px 8px;
    }
    #map { height: calc(100vh - 48px); width: 100%; }
  </style>
</head>
<body>
  <header>
    <div>RailOps — AU Live Map</div>
    <label style="margin-left:auto">Zoom to:&nbsp;
      <select id="zoomTo">
        <option value="loc">Current location</option>
        <option value="au" selected>Australia</option>
      </select>
    </label>
    <button id="resetBtn">Reset</button>
  </header>

  <div id="map"></div>

  <script src="/assets/ol/ol.js"></script>
  <script>
    (function () {
      // 1) Create the base map (OSM – no API key needed)
      const map = new ol.Map({
        target: 'map',
        layers: [ new ol.layer.Tile({ source: new ol.source.OSM() }) ],
        view: new ol.View({
          center: ol.proj.fromLonLat([133.7751, -25.2744]), // Australia center
          zoom: 4
        }),
        controls: ol.control.defaults({ attribution: true })
      });

      // 2) Zoom helpers
      const AU = ol.proj.fromLonLat([133.7751, -25.2744]);
      const view = map.getView();

      function goAustralia() {
        view.setZoom(4);
        view.setCenter(AU);
      }

      function goCurrentLocation() {
        if (!navigator.geolocation) { return; }
        navigator.geolocation.getCurrentPosition(
          pos => {
            const c = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]);
            view.animate({ center: c, zoom: 12, duration: 500 });
          },
          () => goAustralia(),
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }

      // 3) UI wiring
      document.getElementById('resetBtn').addEventListener('click', goAustralia);
      document.getElementById('zoomTo').addEventListener('change', (e) => {
        if (e.target.value === 'loc') goCurrentLocation(); else goAustralia();
      });

      // 4) Initial behavior
      goCurrentLocation();
    })();
  </script>
</body>
</html>
