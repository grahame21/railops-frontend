<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Image Probe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: #0b1220;
      color: #eee;
      font: 14px system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    #box {
      padding: 10px;
    }
    #tile {
      display: block;
      margin: 10px auto;
      border: 1px solid #444;
    }
    .ok { color: #6f6; }
    .bad { color: #f99; }
  </style>
</head>
<body>
  <div id="box">Probing OSM tile…</div>
  <img id="tile" width="256" height="256" alt="tile" />

  <script>
    const box = document.getElementById('box');
    const img = document.getElementById('tile');

    // Simple OSM tile URL
    const url = 'https://tile.openstreetmap.org/5/27/19.png?nocache=' + Date.now();

    img.src = url;

    img.onload = () => {
      box.innerHTML = 'Tile loaded ✔︎<br><code>' + url + '</code>';
      box.className = 'ok';
    };

    img.onerror = () => {
      box.textContent = '❌ Tile blocked — CSP img-src or content blocker';
      box.className = 'bad';
    };
  </script>
</body>
</html>
