<!doctype html>
<meta charset="utf-8">
<title>Map Diagnose</title>
<link rel="stylesheet" href="https://unpkg.com/ol@9.1.0/ol.css">
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#e8eefc;font:14px system-ui}
  #map{position:fixed;inset:60px 0 0 0}
  #top{position:fixed;left:0;top:0;right:0;height:60px;background:#122;padding:8px 10px;border-bottom:1px solid #234}
  #stats{font:12px ui-monospace,Menlo,Consolas}
  #badge{position:fixed;right:10px;bottom:10px;background:#121a2b;border:1px solid #3a4a6a;border-radius:10px;padding:6px 8px}
  .ok{color:#7bd88f}.bad{color:#ffb3b3}
</style>
<div id="top">
  <button id="reflow">Force reflow</button>
  <span>Diagnose (built-in functions)</span>
  <div id="stats"></div>
</div>
<div id="map"></div>
<div id="badge">boot…</div>
<script src="https://unpkg.com/ol@9.1.0/dist/ol.js"></script>
<script>
  const badge=document.getElementById('badge');
  const say=(t,c)=>{ badge.textContent=t; badge.className=c||''; };
  const stats=document.getElementById('stats');
  const upd=()=>{ stats.textContent=`window ${innerWidth}x${innerHeight}`; };
  upd(); addEventListener('resize',upd);

  const base=new ol.layer.Tile({ source:new ol.source.XYZ({ url:'/.netlify/functions/osm/{z}/{x}/{y}.png', maxZoom:19 }) });
  const map=new ol.Map({ target:'map', layers:[base], view:new ol.View({ center:ol.proj.fromLonLat([133.7751,-25.2744]), zoom:4.8, constrainRotation:0 }) });
  map.once('rendercomplete',()=> say('render ✔︎','ok'));
  base.getSource().on('tileloadend',()=> say('base tiles ✔︎','ok'));
  base.getSource().on('tileloaderror',()=> say('base tile error — check osm.js logs','bad'));
  document.getElementById('reflow').onclick=()=>map.updateSize();
  setTimeout(()=>map.updateSize(),50);
</script>
