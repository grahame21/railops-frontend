[build]
  publish = "."

[[redirects]]
  from = "/tiles/osm/*"
  to = "https://tile.openstreetmap.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tiles/orm/*"
  to = "https://tile.openrailwaymap.org/standard/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://tile.openrailwaymap.org https://*.tile.openrailwaymap.org; connect-src 'self' https://tile.openstreetmap.org https://tile.openrailwaymap.org;"