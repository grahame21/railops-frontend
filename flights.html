<!DOCTYPE html>
<html lang="en">
<head>
<script src="/auth.js"></script>
<script>if(!window.RailOpsAuth || !RailOpsAuth.requireRole(['admin','guest'])){document.documentElement.innerHTML='';}</script>
    <meta charset="UTF-8">
    <title>Grahame's Live Flight Tracker</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="icon" href="static/assets/logo.png" type="image/png">
    <link rel="stylesheet" href="/assets/ol/ol.css">
</head>
<body>
    <div id="flight-map" class="map"></div>

    <div class="controls">
        <button onclick="toggleMilitary()">Toggle Military Planes</button>
        <button onclick="logout()">Logout</button>
    </div>

    <script src="/assets/ol/ol.js"></script>
    <script src="static/js/flights.js"></script>
    <script>
        function logout() {
            window.location.href = "index.html";
        }
    </script>
<button id="logoutBtn" style="position:fixed;right:14px;bottom:14px;z-index:2000;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(8,20,38,.92);color:#fff;font-weight:700;cursor:pointer;">Logout</button>
<script>window.RailOpsAuth&&RailOpsAuth.wireLogout('#logoutBtn');</script>
</body>
</html>
