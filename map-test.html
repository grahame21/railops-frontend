<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Map Test (Public)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="https://unpkg.com/ol@9.1.0/ol.css" />
  <style>
    html, body { height:100%; margin:0; }
    #map { position:fixed; inset:0; }
    #diag { position:fixed; left:8px; bottom:8px; z-index:9999; background:rgba(0,0,0,.6); color:#fff; padding:6px 8px; border-radius:8px; font:12px system-ui; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="diag">booting…</div>

  <script src="https://unpkg.com/ol@9.1.0/dist/ol.js" defer></script>
  <script>
    (function(){
      const d = document.getElementById('diag');
      const say = (t)=>{ d.textContent = t; };

      let tries = 0;
      const t = setInterval(()=>{
        if (window.ol && ol.Map) { clearInterval(t); boot(); }
        else if (++tries > 200) { clearInterval(t); say('OpenLayers failed to load (CSP/CDN?)'); }
      }, 30);

      function boot(){
        say('OpenLayers OK, creating map…');
        try {
          const map = new ol.Map({
            target: 'map',
            // (Removed interactions: … defaults(...) )
            layers: [
              new ol.layer.Tile({ source: new ol.source.OSM({ crossOrigin: 'anonymous' }) })
            ],
            view: new ol.View({
              center: ol.proj.fromLonLat([133.7751, -25.2744]),
              zoom: 4.8,
              constrainRotation: 0
            })
          });
          map.once('rendercomplete', ()=> say('Map rendered ✔︎'));
        } catch (err) {
          console.error(err);
          say('Failed to construct map: ' + (err && err.message ? err.message : String(err)));
        }
      }
    })();
  </script>
</body>
</html>
