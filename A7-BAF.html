<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A7-BAF Arrow</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b1a2e;font-family:Arial;display:flex;justify-content:center;padding:10px}
.game{max-width:450px;width:100%;background:white;border-radius:30px;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #003366;padding-bottom:10px}
.oneworld{background:#003366;color:white;padding:4px 14px;border-radius:30px;font-weight:bold}
.reg{font-weight:bold;font-size:18px;color:#003366;background:#e6edf5;padding:4px 12px;border-radius:20px}
.info{display:flex;justify-content:space-between;padding:10px 0;font-weight:bold}
.level{background:#ff6600;color:white;padding:4px 18px;border-radius:40px}
.hearts{font-size:22px}
.grid{display:grid;gap:8px;padding:10px 0;aspect-ratio:1/1;max-width:400px;margin:auto}
.cell{background:#eef3f9;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;aspect-ratio:1/1;cursor:pointer;border:2px solid transparent}
.cell.arrow{background:white;border-color:#8aa3b9;box-shadow:0 4px 0 #b0c7db}
.cell.empty{background:#d3dfeb}
.controls{display:flex;gap:8px;padding:10px 0}
button{background:#003366;color:white;border:none;padding:12px;border-radius:40px;font-size:14px;font-weight:bold;flex:1;cursor:pointer}
.hint{background:#ff6600}
.reset{background:#4a5f72}
.msg{text-align:center;font-weight:bold;font-size:16px;padding:8px 0;color:#003366}
.foot{text-align:center;font-size:12px;color:#6a7f92;padding-top:8px}
</style>
</head>
<body>
<div class="game">
<div class="header">
<span><span class="oneworld">oneworld</span></span>
<span class="reg">A7-BAF</span>
</div>
<div class="info">
<span class="level" id="lvl">LEVEL 1</span>
<span class="hearts" id="hrt">❤️❤️❤️</span>
</div>
<div class="grid" id="grid"></div>
<div class="controls">
<button class="reset" id="reset">↺</button>
<button id="prev">◀ PREV</button>
<button id="next">NEXT ▶</button>
<button class="hint" id="hint">💡</button>
</div>
<div class="msg" id="msg">Clear the grid!</div>
<div class="foot">B777 · A7-BAF</div>
</div>
<script>
const arrows = ['⬆️','⬇️','⬅️','➡️'];
const dirs = {'⬆️':[-1,0],'⬇️':[1,0],'⬅️':[0,-1],'➡️':[0,1]};

function generateLevels() {
    let levels = [];
    for (let i = 0; i < 100; i++) {
        let diff = Math.floor(i / 20);
        let size = 4 + Math.min(diff, 3);
        let count = 3 + Math.floor(i / 10) + Math.floor(diff * 1.2);
        let grid = Array(size).fill().map(() => Array(size).fill(null));
        let placed = 0;
        let attempts = 0;
        while (placed < Math.min(count, size*size-2) && attempts < 200) {
            attempts++;
            let r = Math.floor(Math.random() * size);
            let c = Math.floor(Math.random() * size);
            if (grid[r][c] !== null) continue;
            let dir = arrows[Math.floor(Math.random() * arrows.length)];
            let [dr, dc] = dirs[dir];
            let nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= size || nc < 0 || nc >= size) continue;
            if (grid[nr] && grid[nr][nc] !== null) continue;
            grid[r][c] = dir;
            placed++;
        }
        if (placed < 2) {
            for (let r = 0; r < size && placed < 3; r++) {
                for (let c = 0; c < size && placed < 3; c++) {
                    if (grid[r][c] === null) {
                        grid[r][c] = arrows[Math.floor(Math.random() * arrows.length)];
                        placed++;
                    }
                }
            }
        }
        levels.push({grid: grid, size: size, difficulty: diff});
    }
    return levels;
}

const levels = generateLevels();
let current = 0;
let grid = [];
let size = 5;
let hearts = 3;
let gameOver = false;
let moves = 0;
let maxMoves = 15;

function loadLevel(index) {
    let l = levels[index % levels.length];
    size = l.size;
    grid = l.grid.map(row => [...row]);
    hearts = 3;
    gameOver = false;
    moves = 0;
    maxMoves = 10 + Math.floor(l.difficulty * 3);
    render();
    document.getElementById('msg').innerText = 'Level ' + (index + 1) + ' · Moves: 0/' + maxMoves;
}

function render() {
    let container = document.getElementById('grid');
    container.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    container.innerHTML = '';
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            let cell = document.createElement('div');
            cell.className = 'cell';
            let val = grid[r][c];
            if (val && arrows.includes(val)) {
                cell.classList.add('arrow');
                cell.innerText = val;
            } else {
                cell.classList.add('empty');
            }
            cell.addEventListener('click', () => onClick(r, c));
            container.appendChild(cell);
        }
    }
    document.getElementById('hrt').innerHTML = '❤️'.repeat(Math.max(0, hearts)) + '🖤'.repeat(Math.max(0, 3 - hearts));
    document.getElementById('lvl').innerText = 'LEVEL ' + (current + 1);
}

function onClick(r, c) {
    if (gameOver || hearts <= 0) {
        document.getElementById('msg').innerText = 'Game over! Reset or next level.';
        return;
    }
    let val = grid[r][c];
    if (!val || !arrows.includes(val)) return;
    let [dr, dc] = dirs[val];
    let nr = r + dr, nc = c + dc;
    if (nr < 0 || nr >= size || nc < 0 || nc >= size) {
        grid[r][c] = null;
        moves++;
        checkWin();
        render();
        return;
    }
    if (grid[nr][nc] !== null && arrows.includes(grid[nr][nc])) {
        hearts--;
        grid[r][c] = null;
        grid[nr][nc] = null;
        moves++;
        render();
        if (hearts <= 0) {
            gameOver = true;
            document.getElementById('msg').innerText = '💥 CRASH! No hearts left.';
        } else {
            document.getElementById('msg').innerText = '💥 Collision! ' + hearts + ' hearts left.';
        }
        return;
    }
    grid[nr][nc] = val;
    grid[r][c] = null;
    moves++;
    render();
    if (moves > maxMoves) {
        gameOver = true;
        document.getElementById('msg').innerText = '⏰ Too many moves!';
    } else {
        checkWin();
    }
}

function checkWin() {
    let remaining = 0;
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            if (grid[r][c] && arrows.includes(grid[r][c])) remaining++;
        }
    }
    if (remaining === 0 && hearts > 0) {
        gameOver = true;
        document.getElementById('msg').innerText = '✨ CLEARED! ✨ 🛫 A7-BAF';
    } else {
        document.getElementById('msg').innerText = 'Arrows left: ' + remaining + ' · Moves: ' + moves + '/' + maxMoves;
    }
}

document.getElementById('reset').addEventListener('click', () => loadLevel(current));
document.getElementById('prev').addEventListener('click', () => {
    current = (current - 1 + levels.length) % levels.length;
    loadLevel(current);
});
document.getElementById('next').addEventListener('click', () => {
    current = (current + 1) % levels.length;
    loadLevel(current);
});
document.getElementById('hint').addEventListener('click', () => {
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            let v = grid[r][c];
            if (v && arrows.includes(v)) {
                let [dr, dc] = dirs[v];
                let nr = r + dr, nc = c + dc;
                if (nr < 0 || nr >= size || nc < 0 || nc >= size) {
                    document.getElementById('msg').innerText = '💡 Arrow at (' + (r+1) + ',' + (c+1) + ') can escape!';
                    return;
                }
                if (grid[nr] && grid[nr][nc] === null) {
                    document.getElementById('msg').innerText = '💡 Move arrow at (' + (r+1) + ',' + (c+1) + ')';
                    return;
                }
            }
        }
    }
    document.getElementById('msg').innerText = '💡 Try moving any arrow toward the edge.';
});

loadLevel(0);
</script>
</body>
</html>
