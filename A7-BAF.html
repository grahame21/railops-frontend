<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A7-BAF Arrow Escape</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a1628;
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 40px;
            padding: 18px 18px 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 10px 4px;
            border-bottom: 3px solid #003366;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .oneworld {
            background: #003366;
            color: white;
            font-weight: 800;
            font-size: 13px;
            padding: 4px 14px 4px 10px;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }
        .oneworld::after {
            content: " ●";
            color: #ff6600;
            font-size: 16px;
        }
        .reg {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 16px;
            color: #003366;
            background: #e6edf5;
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid #b0c7db;
        }
        /* Level bar */
        .level-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px 6px;
        }
        .level-badge {
            background: #ff6600;
            color: white;
            padding: 5px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 3px 0 #b34700;
        }
        .diff-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            background: #e6edf5;
        }
        .stars {
            font-size: 16px;
        }
        /* Difficulty buttons */
        .diff-row {
            display: flex;
            gap: 4px;
            justify-content: center;
            padding: 4px 0 8px;
            flex-wrap: wrap;
        }
        .diff-btn {
            background: #e6edf5;
            border: 1px solid #b0c7db;
            color: #1a2f44;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 2px 0 #7a8fa3;
            min-height: 26px;
        }
        .diff-btn.active {
            background: #003366;
            color: white;
            border-color: #003366;
            box-shadow: 0 2px 0 #001a33;
        }
        .diff-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 #7a8fa3;
        }
        /* 777 shape grid */
        .grid-wrapper {
            background: #d9e3ed;
            border-radius: 28px;
            padding: 14px 8px;
            margin: 6px 0 8px;
            box-shadow: inset 0 0 0 2px #b0c7db, 0 6px 0 #7a8fa3;
        }
        .plane-shape {
            background: linear-gradient(180deg, #f5f9ff, #dce6f2);
            border-radius: 36px 36px 18px 18px;
            padding: 6px 4px;
            clip-path: polygon(
                0% 30%, 5% 16%, 20% 8%, 48% 2%, 52% 2%,
                80% 8%, 95% 16%, 100% 30%, 100% 70%,
                95% 84%, 80% 92%, 52% 98%, 48% 98%,
                20% 92%, 5% 84%, 0% 70%
            );
            box-shadow: 0 4px 0 #7a8fa3;
        }
        .grid {
            display: grid;
            gap: 6px;
            padding: 10px 6px;
            aspect-ratio: 1/1;
            max-width: 360px;
            margin: 0 auto;
        }
        .cell {
            background: #eef3f9;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            aspect-ratio: 1/1;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: inset 0 -3px 0 #b8c9db, 0 2px 6px rgba(0,0,0,0.06);
            transition: all 0.1s;
            position: relative;
        }
        /* Thin colored arrows */
        .cell.arrow {
            background: white;
            box-shadow: 0 4px 0 #b0c7db, 0 6px 12px rgba(0,0,0,0.08);
            border-color: #8aa3b9;
            font-size: 30px;
        }
        .cell.arrow[data-dir="⬆️"] { color: #003366; }
        .cell.arrow[data-dir="⬇️"] { color: #ff6600; }
        .cell.arrow[data-dir="⬅️"] { color: #cc0000; }
        .cell.arrow[data-dir="➡️"] { color: #003366; }
        .cell.arrow:active {
            transform: scale(0.85);
            box-shadow: 0 1px 0 #b0c7db;
        }
        .cell.empty {
            background: #d3dfeb;
            box-shadow: inset 0 -2px 0 #b0c7db;
        }
        .cell.removing {
            animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes pop {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0) rotate(180deg); opacity: 0; }
        }
        .cell.hint {
            border-color: #ff6600;
            box-shadow: 0 0 0 4px rgba(255,102,0,0.3), 0 4px 0 #b0c7db;
            animation: pulse 0.8s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        /* Controls */
        .controls {
            display: flex;
            gap: 6px;
            padding: 8px 2px 4px;
        }
        button {
            background: #003366;
            border: none;
            color: white;
            font-weight: 700;
            padding: 10px 12px;
            border-radius: 40px;
            font-size: 13px;
            box-shadow: 0 4px 0 #001a33;
            flex: 1;
            cursor: pointer;
            border: 1px solid #1a4a7a;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.05s;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #001a33;
        }
        .hint-btn {
            background: #ff6600;
            box-shadow: 0 4px 0 #b34700;
            border-color: #ff8833;
            flex: 0.5;
        }
        .reset-btn {
            background: #4a5f72;
            box-shadow: 0 4px 0 #2d3d4d;
            border-color: #6a7f92;
            flex: 0.5;
        }
        .nav-btn { flex: 0.7; }
        .message {
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            padding: 6px 0 2px;
            color: #003366;
            min-height: 32px;
        }
        .message.win { color: #28a745; }
        .message.lose { color: #dc3545; }
        .footer {
            display: flex;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            color: #6a7f92;
            padding-top: 6px;
        }
        .footer span {
            background: #e6edf5;
            padding: 2px 14px;
            border-radius: 40px;
        }
        .arrow-count {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #1a2f44;
            padding: 2px 0;
        }
        @media (max-width: 400px) {
            .game-container { padding: 14px; }
            .cell { font-size: 22px; }
            .grid { gap: 4px; padding: 6px 4px; }
            button { font-size: 10px; padding: 6px 6px; min-height: 34px; }
            .reg { font-size: 13px; padding: 2px 8px; }
            .oneworld { font-size: 11px; padding: 3px 10px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- Header -->
    <div class="header">
        <div class="brand">
            <span style="font-size:20px;">✈️</span>
            <span class="oneworld">oneworld</span>
        </div>
        <span class="reg">A7-BAF</span>
    </div>

    <!-- Level Bar -->
    <div class="level-bar">
        <span class="level-badge" id="levelDisplay">LEVEL 1</span>
        <span class="diff-tag" id="diffDisplay">EASY</span>
        <span class="stars" id="starsDisplay">⭐⭐⭐</span>
    </div>

    <!-- Difficulty -->
    <div class="diff-row" id="diffSelector">
        <button class="diff-btn active" data-diff="0">EASY</button>
        <button class="diff-btn" data-diff="1">MEDIUM</button>
        <button class="diff-btn" data-diff="2">HARD</button>
        <button class="diff-btn" data-diff="3">EXPERT</button>
        <button class="diff-btn" data-diff="4">INSANE</button>
    </div>

    <!-- Grid -->
    <div class="grid-wrapper">
        <div class="plane-shape">
            <div class="grid" id="gridContainer"></div>
        </div>
    </div>

    <div class="arrow-count" id="arrowCount">⬆️ 0 arrows left</div>

    <div class="message" id="messageDisplay">🛫 Tap an arrow to remove it</div>

    <div class="controls">
        <button class="reset-btn" id="resetBtn">↺</button>
        <button class="nav-btn" id="prevBtn">◀ PREV</button>
        <button class="nav-btn" id="nextBtn">NEXT ▶</button>
        <button class="hint-btn" id="hintBtn">💡</button>
    </div>

    <div class="footer">
        <span>B777 · A7-BAF</span>
        <span id="progressText">1 / 100</span>
    </div>
</div>

<script>
    // ============ CONFIG ============
    const ARROWS = ['⬆️', '⬇️', '⬅️', '➡️'];
    const DIR = {
        '⬆️': [-1, 0],
        '⬇️': [1, 0],
        '⬅️': [0, -1],
        '➡️': [0, 1]
    };
    const DIFF_NAMES = ['EASY', 'MEDIUM', 'HARD', 'EXPERT', 'INSANE'];
    const DIFF_COLORS = ['#28a745', '#ffc107', '#fd7e14', '#dc3545', '#6f42c1'];

    // ============ LEVEL GENERATOR ============
    function generateLevels(count) {
        const levels = [];
        for (let i = 0; i < count; i++) {
            const diff = Math.floor(i / 20);
            const size = 4 + Math.min(diff, 3);
            let arrowCount = 4 + Math.floor(i / 7) + Math.floor(diff * 1.8);
            arrowCount = Math.min(arrowCount, size * size - 2);

            const grid = Array(size).fill().map(() => Array(size).fill(null));
            let placed = 0;
            let attempts = 0;

            while (placed < arrowCount && attempts < 600) {
                attempts++;
                const r = Math.floor(Math.random() * size);
                const c = Math.floor(Math.random() * size);
                if (grid[r][c] !== null) continue;

                const shuffled = [...ARROWS].sort(() => Math.random() - 0.5);
                for (const dir of shuffled) {
                    const [dr, dc] = DIR[dir];
                    const nr = r + dr, nc = c + dc;
                    if (nr < 0 || nr >= size || nc < 0 || nc >= size) continue;
                    if (grid[nr] && grid[nr][nc] !== null) continue;
                    grid[r][c] = dir;
                    placed++;
                    break;
                }
            }

            if (placed < 2) {
                for (let r = 0; r < size && placed < 3; r++) {
                    for (let c = 0; c < size && placed < 3; c++) {
                        if (grid[r][c] === null) {
                            const dir = ARROWS[Math.floor(Math.random() * ARROWS.length)];
                            const [dr, dc] = DIR[dir];
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
                                grid[r][c] = dir;
                                placed++;
                            }
                        }
                    }
                }
            }

            levels.push({ grid, size, difficulty: diff, arrowCount: placed });
        }
        return levels;
    }

    // ============ GAME STATE ============
    const LEVELS = generateLevels(100);
    let currentLevel = 0;
    let grid = [];
    let size = 5;
    let moves = 0;
    let maxMoves = 20;
    let gameOver = false;
    let won = false;

    // ============ DOM ============
    const gridEl = document.getElementById('gridContainer');
    const levelDisplay = document.getElementById('levelDisplay');
    const diffDisplay = document.getElementById('diffDisplay');
    const starsDisplay = document.getElementById('starsDisplay');
    const messageDisplay = document.getElementById('messageDisplay');
    const progressText = document.getElementById('progressText');
    const arrowCountEl = document.getElementById('arrowCount');
    const resetBtn = document.getElementById('resetBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const hintBtn = document.getElementById('hintBtn');

    // ============ LOAD ============
    function loadLevel(index) {
        const lvl = LEVELS[index % LEVELS.length];
        size = lvl.size;
        grid = lvl.grid.map(row => [...row]);
        moves = 0;
        gameOver = false;
        won = false;
        maxMoves = 10 + Math.floor(lvl.difficulty * 5);

        render();
        updateInfo();
        messageDisplay.textContent = '🛫 Tap an arrow to remove it';
        messageDisplay.className = 'message';
        updateArrowCount();
    }

    function updateInfo() {
        const lvl = LEVELS[currentLevel % LEVELS.length];
        levelDisplay.textContent = `LEVEL ${currentLevel + 1}`;
        diffDisplay.textContent = DIFF_NAMES[lvl.difficulty];
        diffDisplay.style.color = DIFF_COLORS[lvl.difficulty];
        const stars = lvl.difficulty + 1;
        starsDisplay.textContent = '⭐'.repeat(Math.min(stars, 5));
        progressText.textContent = `${currentLevel + 1} / ${LEVELS.length}`;
    }

    function updateArrowCount() {
        const count = countArrows();
        arrowCountEl.textContent = `⬆️ ${count} arrow${count !== 1 ? 's' : ''} left`;
    }

    function countArrows() {
        let count = 0;
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (grid[r][c] && ARROWS.includes(grid[r][c])) count++;
            }
        }
        return count;
    }

    function render() {
        gridEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        gridEl.innerHTML = '';

        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const val = grid[r][c];
                if (val && ARROWS.includes(val)) {
                    cell.classList.add('arrow');
                    cell.textContent = val;
                    cell.dataset.dir = val;
                } else {
                    cell.classList.add('empty');
                }
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.addEventListener('click', () => onCellClick(r, c));
                gridEl.appendChild(cell);
            }
        }
        updateArrowCount();
    }

    // ============ CLICK ============
    function onCellClick(r, c) {
        if (gameOver || won) {
            if (won) messageDisplay.textContent = '🎉 Level complete! Next level.';
            else messageDisplay.textContent = '💔 Game over. Reset or next.';
            return;
        }

        const val = grid[r][c];
        if (!val || !ARROWS.includes(val)) {
            messageDisplay.textContent = 'Tap an arrow';
            return;
        }

        const [dr, dc] = DIR[val];
        const nr = r + dr, nc = c + dc;

        // Check if arrow can be removed (points to edge)
        if (nr < 0 || nr >= size || nc < 0 || nc >= size) {
            grid[r][c] = null;
            moves++;
            animateCell(r, c);
            setTimeout(() => { render(); checkWin(); }, 200);
            return;
        }

        // Check if arrow points to empty space (move there)
        if (grid[nr][nc] === null) {
            grid[nr][nc] = val;
            grid[r][c] = null;
            moves++;
            render();
            messageDisplay.textContent = `⬆️ Arrow moved to (${nr+1},${nc+1})`;
            checkWin();
            return;
        }

        // Blocked by another arrow
        if (ARROWS.includes(grid[nr][nc])) {
            messageDisplay.textContent = '🚫 Blocked!';
            return;
        }

        messageDisplay.textContent = '🚫 Cannot move there!';
    }

    function animateCell(r, c) {
        const cells = gridEl.children;
        const idx = r * size + c;
        if (cells[idx]) {
            cells[idx].classList.add('removing');
        }
    }

    function checkWin() {
        const remaining = countArrows();
        if (remaining === 0) {
            won = true;
            gameOver = true;
            const stars = moves <= maxMoves ? ' ⭐⭐⭐' : ' ⭐⭐';
            messageDisplay.textContent = `✨ CLEARED! ✨ 🛫 A7-BAF${stars}`;
            messageDisplay.className = 'message win';
            arrowCountEl.textContent = '🎉 All cleared!';
            return;
        }

        if (moves >= maxMoves) {
            gameOver = true;
            messageDisplay.textContent = `⏰ Out of moves! (${moves}/${maxMoves})`;
            messageDisplay.className = 'message lose';
        } else {
            messageDisplay.textContent = `⬆️ ${remaining} left · Moves: ${moves}/${maxMoves}`;
        }
    }

    // ============ HINT ============
    function showHint() {
        if (won || gameOver) {
            messageDisplay.textContent = won ? '🎉 You already won!' : '💔 Game over!';
            return;
        }

        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const val = grid[r][c];
                if (!val || !ARROWS.includes(val)) continue;
                const [dr, dc] = DIR[val];
                const nr = r + dr, nc = c + dc;
                if (nr < 0 || nr >= size || nc < 0 || nc >= size || grid[nr][nc] === null) {
                    const cells = gridEl.children;
                    const idx = r * size + c;
                    if (cells[idx]) {
                        cells[idx].classList.add('hint');
                        setTimeout(() => {
                            cells[idx].classList.remove('hint');
                        }, 2000);
                    }
                    messageDisplay.textContent = `💡 Try arrow at (${r+1},${c+1})`;
                    return;
                }
            }
        }
        messageDisplay.textContent = '💡 Move arrows toward edges';
    }

    // ============ CONTROLS ============
    resetBtn.addEventListener('click', () => loadLevel(currentLevel));
    prevBtn.addEventListener('click', () => {
        currentLevel = (currentLevel - 1 + LEVELS.length) % LEVELS.length;
        loadLevel(currentLevel);
    });
    nextBtn.addEventListener('click', () => {
        currentLevel = (currentLevel + 1) % LEVELS.length;
        loadLevel(currentLevel);
    });
    hintBtn.addEventListener('click', showHint);

    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const diff = parseInt(this.dataset.diff);
            for (let i = 0; i < LEVELS.length; i++) {
                if (LEVELS[i].difficulty === diff) {
                    currentLevel = i;
                    loadLevel(currentLevel);
                    break;
                }
            }
        });
    });

    // ============ START ============
    loadLevel(0);
</script>
</body>
</html>
