name: Fetch OpenLayers assets (PR)
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch OL (v9.1.0)
        run: |
          mkdir -p assets
          curl -L -o assets/ol.js  https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js
          curl -L -o assets/ol.css https://cdn.jsdelivr.net/npm/ol@v9.1.0/ol.css

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add OpenLayers v9.1.0 assets"
          title: "Add OpenLayers assets"
          body: "Adds /assets/ol.js and /assets/ol.css for self-hosted OL."
          branch: chore/add-openlayers-assets
          labels: dependencies